d) finished<\/strong> the course.<\/li><li>When she <strong>(had) left<\/strong>, I cleaned the kitchen.<\/li><\/ul><p><strong>BUT !<\/strong><\/p><ul><li>When she left, I <strong>cleaned<\/strong> the kitchen.<\/li><li>When she left, I <strong>had cleaned<\/strong> the kitchen.<\/li><\/ul>","text":"After AFTER/BEFORE/AS SOON AS/ WHEN both Past Perfect and Past Simple can be used: - I left the university after I (had) finished the course. - When she (had) left, I cleaned the kitchen. BUT ! - When she left, I cleaned the kitchen. - When she left, I had cleaned the kitchen."},{"n":17,"html":"<p>Which was the <strong>first<\/strong> of the two actions? (grafika „1st”)<\/p><ul><li>She refused to leave <strong>until<\/strong> she <strong>had seen<\/strong> all the pictures.<\/li><li>Mother didn't let me leave the room <strong>before<\/strong> I <strong>had eaten<\/strong> the soup.<\/li><\/ul>","text":"Which was the first of the two actions? (grafika „1st”) - She refused to leave until she had seen all the pictures. - Mother didn't let me leave the room before I had eaten the soup."},{"n":18,"html":"<p>CAREFUL: sometimes the Past Perfect tense emphasises the completion of the action:<\/p><ul><li>She refused to leave until she <strong>had seen<\/strong> all the pictures.<\/li><li>Mother didn't let me leave the room before I <strong>had eaten<\/strong> the soup.<\/li><\/ul><p>or the fact that the action was not completed when the past simple action happened:<\/p><ul><li>Sadly, the author died before <strong>he'd finished<\/strong> the series.<\/li><\/ul>","text":"CAREFUL: sometimes the Past Perfect tense emphasises the completion of the action: - She refused to leave until she had seen all the pictures. - Mother didn't let me leave the room before I had eaten the soup. or the fact that the action was not completed when the past simple action happened: - Sadly, the author died before he'd finished the series."},{"n":19,"html":"<p>Exercises 1, 2, 3 pages 104, 105<\/p>","text":"Exercises 1, 2, 3 pages 104, 105"},{"n":20,"html":"<p>Revision pages 116, 117<\/p>","text":"Revision pages 116, 117"},{"n":21,"html":"<p>The hungry lion<\/p>","text":"The hungry lion"},{"n":22,"html":"<p>Use:<\/p><ul><li>Past Perfect (at least twice)<\/li><li>Past Perfect Continuous (at least once)<\/li><li>used to (at least once)<\/li><li>would (at least once)<\/li><li>was/were going to (at least once)<\/li><li>Past Continuous (at least once)<\/li><li>quotation (at least once)<\/li><li>Reported Speech (at least once)<\/li><\/ul>","text":"Use: - Past Perfect (at least twice) - Past Perfect Continuous (at least once) - used to (at least once) - would (at least once) - was/were going to (at least once) - Past Continuous (at least once) - quotation (at least once) - Reported Speech (at least once)"},{"n":23,"html":"<p>Homework Revision pages 116–117<\/p>","text":"Homework Revision pages 116–117"}],"II-4":[{"n":1,"html":"<p>II/4 Future forms<\/p>","text":"II/4 Future forms"},{"n":2,"html":"<p>Start with the Diagnostic test on page 119<\/p>","text":"Start with the Diagnostic test on page 119"},{"n":3,"html":"<p>Predictions (unit 26)<\/p>","text":"Predictions (unit 26)"},{"n":4,"html":"<p><strong>1. Future Simple<\/strong> – (based on opinions/intuition/experience)<\/p><ul><li>Examples: I think he will pass. I will be 21 on Sunday.<\/li><li>Often used with: I think / I suppose / I hope / I imagine; DEFINITELY / CERTAINLY / PROBABLY / POSSIBLY<\/li><li>(Position) I will <strong>definitely<\/strong> pass. I <strong>definitely<\/strong> won't pass.<\/li><\/ul>","text":"1. Future Simple – (based on opinions/intuition/experience) - Examples: I think he will pass. I will be 21 on Sunday. - Often used with: I think / I suppose / I hope / I imagine; DEFINITELY / CERTAINLY / PROBABLY / POSSIBLY - (Position) I will definitely pass. I definitely won't pass."},{"n":5,"html":"<p><strong>2. be going to<\/strong> – (predictions based on evidence). Examples: They're going to have a baby. She's going to fail. She doestn't [sic] study at all!<\/p>","text":"2. be going to – (predictions based on evidence). Examples: They're going to have a baby. She's going to fail. She doestn't [sic] study at all!"},{"n":6,"html":"<p><strong>3. Future Continuous<\/strong> usually used to talk about a temporary action in progress at a particular time in the future. Examples: This time next Tuesday I <strong>will be lying<\/strong> on a beach.<\/p>","text":"3. Future Continuous usually used to talk about a temporary action in progress at a particular time in the future. Examples: This time next Tuesday I will be lying on a beach."},{"n":7,"html":"<p>We can also use Future Continuous to talk about present <strong>deductions<\/strong>:<\/p><ul><li>It's Monday today so she <strong>will be teaching<\/strong> now. She always has classes on Mondays.<\/li><li>He is sick so I guess he <strong>won't be going<\/strong> to work tomorrow.<\/li><li>A: Where's John? Have you seen him today? B: Well, you know John. He <strong>will be playing<\/strong> his computer games, as usual.<\/li><\/ul>","text":"We can also use Future Continuous to talk about present deductions: - It's Monday today so she will be teaching now. She always has classes on Mondays. - He is sick so I guess he won't be going to work tomorrow. - A: Where's John? Have you seen him today? B: Well, you know John. He will be playing his computer games, as usual."},{"n":8,"html":"<p><strong>4. Future Perfect<\/strong> usually used for actions which will be completed before a particular time in the future. Example: I <strong>will have finished<\/strong> the report by 5 pm and then we can go to the cinema. We usually use a time phrase with this kind of prediction (soon, <strong>by then<\/strong>, <strong>by 2029<\/strong>, <strong>by the time<\/strong> we finish, within the next week, etc.)<\/p>","text":"4. Future Perfect usually used for actions which will be completed before a particular time in the future. Example: I will have finished the report by 5 pm and then we can go to the cinema. We usually use a time phrase with this kind of prediction (soon, by then, by 2029, by the time we finish, within the next week, etc.)"},{"n":9,"html":"<p>We can also use Future Perfect to talk about present <strong>deductions<\/strong>:<\/p><ul><li>It's five pm already, so he <strong>will have finished<\/strong> work by now.<\/li><li>No way will we find her at home. She <strong>will have left<\/strong> for the airport by now!<\/li><\/ul>","text":"We can also use Future Perfect to talk about present deductions: - It's five pm already, so he will have finished work by now. - No way will we find her at home. She will have left for the airport by now!"},{"n":10,"html":"<p><strong>5. Future Perfect Continuous<\/strong> usually used to talk about an action which will still be in progress at a point in the future. It focuses on the duration of the action. Example: By 2040 people <strong>will have been using<\/strong> mobile phones for over a century.<\/p>","text":"5. Future Perfect Continuous usually used to talk about an action which will still be in progress at a point in the future. It focuses on the duration of the action. Example: By 2040 people will have been using mobile phones for over a century."},{"n":11,"html":"<p>With verbs which naturally contain the idea of continuity (<strong>LIVE/WORK/STAY<\/strong>), we can use both Future Perfect and Future Perfect Continuous:<\/p><ul><li>We<strong>'ll have lived<\/strong> in this house for twenty years in December.<\/li><li>We<strong>'ll have been living<\/strong> in this house for twenty years in December.<\/li><\/ul>","text":"With verbs which naturally contain the idea of continuity (LIVE/WORK/STAY), we can use both Future Perfect and Future Perfect Continuous: - We'll have lived in this house for twenty years in December. - We'll have been living in this house for twenty years in December."},{"n":12,"html":"<p>We can also use Future Perfect Continuous to talk about present <strong>deductions<\/strong>: They <strong>will have been working<\/strong> on the project for over a week now, so it should be almost finished.<\/p>","text":"We can also use Future Perfect Continuous to talk about present deductions: They will have been working on the project for over a week now, so it should be almost finished."},{"n":13,"html":"<p>Preditions [sic] can also be made with certain verbs: With verbs like <strong>THINK/BELIEVE/EXPECT/HOPE/SUPPOSE<\/strong> the negative is usually formed at the beginning of the sentence:<\/p><ul><li>I <strong>don't think<\/strong> he will come. RATHER THAN I think he won't come.<\/li><li>I <strong>don't suppose<\/strong> she knows the truth. RATHER THAN I suppose she doesn't know the truth.<\/li><\/ul>","text":"Preditions [sic] can also be made with certain verbs: With verbs like THINK/BELIEVE/EXPECT/HOPE/SUPPOSE the negative is usually formed at the beginning of the sentence: - I don't think he will come. RATHER THAN I think he won't come. - I don't suppose she knows the truth. RATHER THAN I suppose she doesn't know the truth."},{"n":14,"html":"<p>Exercises 1,2,3 pages 122,123<\/p>","text":"Exercises 1,2,3 pages 122,123"},{"n":15,"html":"<p>Decisions, intentions and arrangements (unit 27)<\/p>","text":"Decisions, intentions and arrangements (unit 27)"},{"n":16,"html":"<p><strong>1. Future Simple – WILL<\/strong> for spontaneous decisions. Examples: You look tired. I<strong>'ll cook<\/strong> dinner tonight. We can also use will/won't to strenthen [sic] the meaning and express determination:<\/p><ul><li>I <strong>will<\/strong> help you whether you want it or not!<\/li><li>If you insist on lying, I <strong>won't<\/strong> help you!<\/li><\/ul>","text":"1. Future Simple – WILL for spontaneous decisions. Examples: You look tired. I'll cook dinner tonight. We can also use will/won't to strenthen [sic] the meaning and express determination: - I will help you whether you want it or not! - If you insist on lying, I won't help you!"},{"n":17,"html":"<p><strong>2. SHALL<\/strong><\/p><ul><li>to ask about decisions – <strong>Shall<\/strong> we go now?<\/li><li>with <strong>WE<\/strong> and <strong>I<\/strong> to express determination (esp. in formal contexts) – I <strong>shall not<\/strong> discuss my private life here.<\/li><\/ul>","text":"2. SHALL - to ask about decisions – Shall we go now? - with WE and I to express determination (esp. in formal contexts) – I shall not discuss my private life here."},{"n":18,"html":"<p><strong>3. TO BE GOING TO<\/strong> for planned decisions/intentions – I<strong>'m going to<\/strong> talk to her tonight. We usually avoid be going to with the verbs <strong>COME<\/strong> and <strong>GO<\/strong>: Instead of saying: I'm going to go home now. Are you going to come? it's better to say: <strong>I'm going home now. Are you coming?<\/strong><\/p>","text":"3. TO BE GOING TO for planned decisions/intentions – I'm going to talk to her tonight. We usually avoid be going to with the verbs COME and GO: Instead of saying: I'm going to go home now. Are you going to come? it's better to say: I'm going home now. Are you coming?"},{"n":19,"html":"<p><strong>4. PRESENT CONTINUOUS<\/strong> (fixed arrangements with a time expression) – We<strong>'re going<\/strong> to the theatre on Friday.<\/p>","text":"4. PRESENT CONTINUOUS (fixed arrangements with a time expression) – We're going to the theatre on Friday."},{"n":20,"html":"<p><strong>5. FUTURE CONTINUOUS<\/strong><\/p><ul><li>events that are the result of a previous arrangement:<ul><li>Trains <strong>won't be running<\/strong> to Białogard next week due to essential track repairs.<\/li><li>I'm sorry I can't come to your party. I<strong>'ll be working<\/strong> then. (rather than I'll work)<\/li><\/ul><\/li><li>to ask about intentions (politely):<ul><li><strong>Will you be staying<\/strong> long? MORE POLITE THAN Are you staying long?<\/li><\/ul><\/li><\/ul>","text":"5. FUTURE CONTINUOUS - events that are the result of a previous arrangement: - Trains won't be running to Białogard next week due to essential track repairs. - I'm sorry I can't come to your party. I'll be working then. (rather than I'll work) - to ask about intentions (politely): - Will you be staying long? MORE POLITE THAN Are you staying long?"},{"n":21,"html":"<p><strong>6. TO BE TO + INFINITIVE<\/strong><\/p><ul><li>The President <strong>is to meet<\/strong> the Prime Minister today.<\/li><li>The President <strong>was to meet<\/strong> the Prime Minister yesterday.<\/li><li>The President <strong>was to have met<\/strong> the Prime Minister yesterday.<\/li><li>It is often used in writing, especially in news articles: Crash investigators <strong>are to release<\/strong> their findings to the press later today.<\/li><\/ul>","text":"6. TO BE TO + INFINITIVE - The President is to meet the Prime Minister today. - The President was to meet the Prime Minister yesterday. - The President was to have met the Prime Minister yesterday. - It is often used in writing, especially in news articles: Crash investigators are to release their findings to the press later today."},{"n":22,"html":"<p>The structure <strong>TO BE TO DO STH<\/strong> is often used in:<\/p><ul><li>IF-clauses – If we <strong>are to succeed<\/strong>, we need to work harder.<\/li><li>formal commands and instructions:<ul><li>You <strong>are not to disturb<\/strong> the head teacher while the inspectors are here next week.<\/li><li>These pills <strong>are not to be taken<\/strong> with any other form of medicine.<\/li><\/ul><\/li><\/ul>","text":"The structure TO BE TO DO STH is often used in: - IF-clauses – If we are to succeed, we need to work harder. - formal commands and instructions: - You are not to disturb the head teacher while the inspectors are here next week. - These pills are not to be taken with any other form of medicine."},{"n":23,"html":"<p>Exercises 1,2,3,4 pages 126, 127<\/p>","text":"Exercises 1,2,3,4 pages 126, 127"}]},"pres":[{"id":"II-1","title":"Present tenses","slides":19,"short":"https://canva.link/aqielqfv8ror4bt","view":"https://www.canva.com/design/DAGSoTUqDhw/Rubzht5n6kBo2LVb8wyW1w/view"},{"id":"II-2","title":"Present tenses and Past Simple","slides":19,"short":"https://canva.link/7pvq8gc2uahnil1","view":"https://www.canva.com/design/DAGS047XsJ8/xKdmoyXcx8Lq3TbbdalgQw/view"},{"id":"II-3","title":"Past tenses","slides":23,"short":"https://canva.link/98qyqzmvk157a5c","view":"https://www.canva.com/design/DAGTkdm3Mv0/kkH8ELeDi7mvoRNglMVtwQ/view"},{"id":"II-4","title":"Future forms","slides":23,"short":"https://canva.link/wz68jgtm63wmkf5","view":"https://www.canva.com/design/DAGUOaWCMB0/nuDOFQ_kBZlRrJxl_STJ4g/view"}],"topics":[{"presentation":"II-1","slides":[1,5],"topic":"Organizacja: MyGrammarLab, skala ocen, syllabus","book_sections":[],"book_pages":[],"exercises_from_slides":null},{"presentation":"II-1","slides":[6,6],"topic":"Diagnostic test Module 5","book_sections":["M5-start"],"book_pages":[89],"exercises_from_slides":"ex. 3 p. 89"},{"presentation":"II-1","slides":[7,10],"topic":"DO/BE/HAVE jako main i auxiliary verbs","book_sections":["19.1","19.3"],"book_pages":[90,91],"exercises_from_slides":"ex. 2 p. 92","verified_note":"dodano s. 91: 19.3 ciągnie się na s. 91 (have jako main verb, np. posiadanie)"},{"presentation":"II-1","slides":[11,12],"topic":"HAVE vs HAVE GOT; brak have got w czasach przeszłych/przyszłych","book_sections":["19.3","19.4"],"book_pages":[91],"exercises_from_slides":"ex. 3, 4 p. 93"},{"presentation":"II-1","slides":[13,15],"topic":"Present Continuous – użycia 1–7","book_sections":["20.1","20.2","20.4","20.5","27.3"],"book_pages":[94,95,124,125],"exercises_from_slides":"ex. 1–4 pp. 96–97"},{"presentation":"II-1","slides":[16,18],"topic":"Present Simple – użycia 1–12","book_sections":["20.1","20.2","20.3","20.4","28.1","25.1","51.1"],"book_pages":[94,95,128,112,226],"exercises_from_slides":"ex. 1–4 pp. 96–97","verified_note":"dodano 51.1 (s. 226 ia 1–4 z książki (s. 130–131)","kind":"book","route":"#unit-28","pages":[130,131],"key":[392,393],"slides":null,"mins":30,"id":"B-1106-2"},{"title":"Quiz na stronie: Unit 28","kind":"quiz","route":"#unit-28","pages":[],"key":[],"slides":null,"mins":15,"id":"B-1106-3"}]},{"date":"2026-11-07","tasks":[{"title":"Unit 29: slajdy i notatka na stronie","kind":"note","route":"#unit-29","pages":[132],"key":[],"slides":"II-3 21–23","mins":15,"id":"B-1107-1"},{"title":"Unit 29: ćwiczenia 1–2 z książki (s. 133)","kind":"book","route":"#unit-29","pages":[133],"key":[393],"slides":null,"mins":20,"id":"B-1107-2"},{"title":"Quiz na stronie: Unit 29","kind":"quiz","route":"#unit-29","pages":[],"key":[],"slides":null,"mins":15,"id":"B-1107-3"},{"title":"Mowa zależna: minimum do The hungry lion, notatka i quiz","kind":"note","route":"#unit-reported","pages":[222,226,230],"key":[],"slides":"II-3 22","mins":15,"id":"B-1107-4"},{"title":"Napisz własne „The hungry lion” (polecenie: slajd II/3 22) albo zrób historię na stronie","kind":"quiz","route":"#historia","pages":[],"key":[],"slides":"II-3 21–23","mins":30,"id":"B-1107-5"}]},{"date":"2026-11-08","tasks":[{"title":"Review Module 5 (s. 116–117), na czas","kind":"review","route":"#review-5","pages":[116,117],"key":[392],"slides":null,"mins":45,"id":"B-1108-1"}]},{"date":"2026-11-09","tasks":[{"title":"Review Module 6 (s. 134–135), całość","kind":"review","route":"#review-6","pages":[134,135],"key":[393],"slides":null,"mins":45,"id":"B-1109-1"}]},{"date":"2026-11-10","tasks":[{"title":"MyEnglishLab: Progress tests i Exit test Module 5 / Module 6, jeśli są dostępne","kind":"mel","route":"#mel","pages":[],"key":[],"slides":null,"mins":45,"id":"B-1110-1"}]},{"date":"2026-11-11","tasks":[{"title":"Święto, lekko: Quick Check 1 (s. 360–361) i ściąga","kind":"review","route":"#sciaga","pages":[360,361],"key":[],"slides":null,"mins":30,"id":"B-1111-1"},{"title":"Osie czasu i kreator „Który czas?”: przejdź kilka sytuacji","kind":"review","route":"#osie","pages":[],"key":[],"slides":null,"mins":15,"id":"B-1111-2"}]},{"date":"2026-11-12","tasks":[{"title":"Zeszyt błędów: przerób wszystkie zdania","kind":"quiz","route":"#bledy","pages":[],"key":[],"slides":null,"mins":30,"id":"B-1112-1"}]},{"date":"2026-11-13","tasks":[{"title":"Oba testy diagnostyczne na czysto (s. 89 i 119)","kind":"test","route":"#diagnoza","pages":[89,119],"key":[384],"slides":null,"mins":30,"id":"B-1113-1"},{"title":"Pary, które się mylą: wszystkie ćwiczenia","kind":"quiz","route":"#pary","pages":[],"key":[],"slides":null,"mins":25,"id":"B-1113-2"}]},{"date":"2026-11-14","tasks":[{"title":"Najsłabsze unity (samoocena): ćwiczenia z książki jeszcze raz","kind":"book","route":"#start","pages":[],"key":[],"slides":null,"mins":40,"id":"B-1114-1"},{"title":"Próbne kolokwium na stronie (45 minut)","kind":"test","route":"#probne","pages":[],"key":[],"slides":null,"mins":45,"id":"B-1114-2"}]},{"date":"2026-11-15","tasks":[{"title":"Lekka powtórka: ściąga i slajdy","kind":"review","route":"#sciaga","pages":[],"key":[],"slides":null,"mins":30,"id":"B-1115-1"}]},{"date":"2026-11-16","tasks":[{"title":"Kolokwium. Rano tylko ściąga i pary, bez nowego materiału","kind":"exam","route":"#sciaga","pages":[],"key":[],"slides":null,"mins":15,"id":"B-1116-1"}]}]}]},"mel":{"platform":"https://myenglishlab.pearson-intl.com","note":"Terminy z powiadomień MyEnglishLab grupy 3 (pon. 8:15). Inne grupy mogą mieć inne terminy. Na stronie tylko nazwy aktywności – rozwiązujesz je na platformie.","assignments":[{"n":1,"given":"2026-10-09","due":"2026-10-25T23:59","pres":"II-1","items":["Module 5 Diagnostic test","Unit 19 Practice 1","Unit 19 Practice 2","Unit 20 Practice 1","Unit 20 Practice 2"]},{"n":2,"given":"2026-10-12","due":"2026-10-25T23:59","pres":"II-2","items":["Unit 23 Practice 1","Unit 23 Practice 2","Unit 24 Practice 1","Unit 24 Practice 2","Unit 25 Practice 1","Unit 25 Practice 2"]},{"n":3,"given":"2026-10-19","due":"2026-10-27T23:59","pres":"II-3","items":["Unit 21 Practice 1","Unit 21 Practice 2","Unit 22 Practice 1","Unit 22 Practice 2","Progress test (units 19–22)","Catch-up exercise 1, 2, 3 (units 19–22)","Progress test (units 23–25)","Catch-up exercise 1, 2, 3 (units 23–25)","Module 5 Exit test"]},{"n":4,"given":"2026-10-26","due":"2026-11-04T23:59","pres":"II-4","items":["Module 6 Diagnostic test","Unit 26 Practice 1","Unit 26 Practice 2","Unit 27 Practice 1","Unit 27 Practice 2"]}],"byUnit":{"M5-start":["Module 5 Diagnostic test"],"19":["Unit 19 Practice 1","Unit 19 Practice 2"],"20":["Unit 20 Practice 1","Unit 20 Practice 2"],"21":["Unit 21 Practice 1","Unit 21 Practice 2"],"22":["Unit 22 Practice 1","Unit 22 Practice 2"],"23":["Unit 23 Practice 1","Unit 23 Practice 2"],"24":["Unit 24 Practice 1","Unit 24 Practice 2"],"25":["Unit 25 Practice 1","Unit 25 Practice 2"],"Review 5":["Progress test (units 19–22)","Catch-up exercise 1, 2, 3 (units 19–22)","Progress test (units 23–25)","Catch-up exercise 1, 2, 3 (units 23–25)","Module 5 Exit test"],"M6-start":["Module 6 Diagnostic test"],"26":["Unit 26 Practice 1","Unit 26 Practice 2"],"27":["Unit 27 Practice 1","Unit 27 Practice 2"]},"mustHave":[{"name":"Progress test (units 19–22) i (units 23–25)","why":"mieszają tematy jak kolokwium z Module 5"},{"name":"Module 5 Exit test","why":"całość Module 5"},{"name":"Catch-up exercises (19–22, 23–25)","why":"dodatkowy trening słabych miejsc"},{"name":"Practice 1–2 z każdego unitu 19–27","why":"trening tematu po temacie"},{"name":"Module 6: Progress test / Exit test, jeśli są na platformie","why":"jeszcze nie zadane – sprawdzimy na platformie"}]},"diag":{"M5":{"1":"19.3","2":"19.4","3":"20.2","4":"20.5","5":"21.2","6":"21.3","7":"21.4","8":"21.5","9":"22.1","10":"22.2","11":"22.3","12":"22.4","13":"23.4","14":"23.6","15":"24.1","16":"24.4","17":"25.1","18":"25.2"},"M6":{"1":"26.1","2":"26.2","3":"26.3","4":"26.4","5":"26.5","6":"27.1","7":"27.2","8":"27.3","9":"27.4","10":"27.5","11":"27.5","12":"28.1","13":"28.1","14":"28.2","15":"28.3","16":"28.4","17":"28.5","18":"29.1","19":"29.2","20":"29.2"}},"pdfExc":{"101":103,"103":101},"extras":{"glossary":[{"term":"auxiliary verb","pl":"czasownik posiłkowy","def":"Czasownik, który pomaga utworzyć formę innego czasownika: be (formy ciągłe, strona bierna), have (czasy perfect), do (pytania i przeczenia w Present Simple i Past Simple), will (przyszłość). Sam nie niesie głównego znaczenia zdania.","example":"**Does** Ola know that we **are** meeting at the station at eight?","ref":"19.1"},{"term":"main verb","pl":"czasownik główny","def":"Czasownik, który niesie znaczenie zdania. Be, have i do mogą być główne (I have a dog) albo posiłkowe (I have finished). Have i do jako główne tworzą zwykle pytania i przeczenia z do (Do you have…?, Did you do…?); w brytyjskim angielskim zamiast have (= mieć) często używamy have got: Have you got…?","example":"Kuba **has** two part-time jobs and still **does** all his coursework on time.","ref":"19.3"},{"term":"contraction (short form)","pl":"forma ściągnięta (skrót)","def":"Skrócona forma czasownika posiłkowego (także be jako głównego: I'm tired) lub not z apostrofem: 'm, 're, 's, 've, 'd, 'll, n't. Typowa w mowie i w nieformalnym piśmie; 's = is albo has, 'd = had albo would.","example":"She**'s** gone home, but she**'d** like you to call her.","ref":"19.2"},{"term":"state (stative) verb","pl":"czasownik stanu","def":"Czasownik opisujący stan, a nie czynność (know, believe, like, want, belong, seem). Zwykle nie występuje w formach ciągłych, nawet gdy mówimy o tej chwili.","example":"Sorry, I **don't remember** your name, but I **recognise** your face.","ref":"25.1"},{"term":"dynamic (action) verb","pl":"czasownik dynamiczny (czynnościowy)","def":"Czasownik opisujący czynność lub proces (write, run, cook, grow), który może występować w formach ciągłych. Niektóre czasowniki stanu w innym znaczeniu działają jak dynamiczne: I'm having lunch, I'm thinking about it.","example":"Right now Kasia **is cooking** dinner and **thinking** about her presentation.","ref":"25.2"},{"term":"performative verb","pl":"czasownik performatywny","def":"Czasownik, którego wypowiedzenie samo jest czynnością (promise, apologise, agree, suggest, insist, thank). Użyty w ten sposób (1. osoba, czas teraźniejszy) stoi zwykle w Present Simple: I promise, nie I'm promising. Forma ciągła jest możliwa, gdy mówimy o przeszłości lub przyszłości.","example":"I **promise** I'll pay you back on Friday.","ref":"25.4"},{"term":"sense verbs","pl":"czasowniki zmysłów","def":"Czasowniki percepcji: see, hear, smell, taste, feel, notice. Mimowolny odbiór wyrażamy Present Simple albo can + czasownik, nie formą ciągłą. Formę ciągłą mają smell i taste w znaczeniu celowej czynności (I'm tasting the soup = próbuję zupy) oraz czasowniki w innym znaczeniu (I'm seeing Ola tonight = spotykam się z Olą); celowo patrzymy i słuchamy przez look at, watch, listen to. O samopoczuciu (feel, hurt) obie formy są poprawne.","example":"I **can smell** smoke – is something burning?","ref":"25.3"},{"term":"continuous / progressive","pl":"forma ciągła","def":"Forma be + -ing. Pokazuje czynność w toku, tymczasową albo niezakończoną (I'm reading, I was waiting, I've been working).","example":"Sorry, I can't talk now – I**'m driving**.","ref":"20.1"},{"term":"perfect aspect","pl":"formy perfect (have + III forma)","def":"Forma have + III forma (past participle). Pokazuje czynność wcześniejszą niż punkt odniesienia (teraz, moment w przeszłości lub w przyszłości) i jej związek z tym punktem.","example":"When we reached the cinema, the film **had** already **started**.","ref":"22.1"},{"term":"simple aspect","pl":"formy proste (simple)","def":"Forma bez be + -ing. Przedstawia czynność jako całość: fakt, stan, nawyk albo czynność zakończoną, jej wynik i liczbę powtórzeń.","example":"I**'ve written** three pages of my essay, so I can take a break.","ref":"24.4"},{"term":"backshift","pl":"przesunięcie czasów (w mowie zależnej)","def":"Cofnięcie czasu o krok w przeszłość w mowie zależnej po czasowniku relacjonującym w przeszłości: am → was, have done → had done, will → would. Nie jest obowiązkowe, gdy informacja wciąż jest prawdziwa.","example":"Ola said she **was** tired and **would go** to bed early.","ref":"51.2"},{"term":"reporting verb","pl":"czasownik relacjonujący","def":"Czasownik wprowadzający cudze słowa lub myśli: say, tell, ask, explain, admit, promise, warn. W czasie teraźniejszym (Ola tells me…) przekazuje świeżą wiadomość i nie wymaga przesunięcia czasów.","example":"My tutor **says** the deadline has been moved to Friday.","ref":"50.2"},{"term":"time clause (future time clause)","pl":"zdanie czasowe (o przyszłości)","def":"Zdanie podrzędne po when, as soon as, until, before, after, by the time. Gdy mówi o przyszłości, stoi w nim czas teraźniejszy (Present Simple lub Present Perfect), a nie will.","example":"I'll send you the photos **when I get** home.","ref":"28.1"},{"term":"time expression / time phrase","pl":"okolicznik czasu","def":"Wyrażenie mówiące, kiedy coś się dzieje lub jak długo trwa (yesterday, two weeks ago, since May, by Friday, on Thursday at ten). Często rozstrzyga o czasie: zakończony czas → Past Simple, by + termin → Future Perfect.","example":"We **moved** into the dorm **two weeks ago**.","ref":"23.6"},{"term":"present result","pl":"skutek w teraźniejszości","def":"Związek zakończonej czynności z teraźniejszością: jej skutek widać lub czuć teraz. Typowy powód, by wybrać Present Perfect zamiast Past Simple.","example":"I**'ve broken** my glasses, so I can't read the board.","ref":"23.4"},{"term":"unfinished time period","pl":"niezakończony okres (który jeszcze trwa)","def":"Okres, który jeszcze trwa (today, this week, this year, in my life). Zdarzenia w takim okresie opisujemy w Present Perfect, bo mogą się jeszcze powtórzyć.","example":"Kuba **has missed** two seminars **this week**, so he'd better turn up on Friday.","ref":"23.2"},{"term":"ordinal number","pl":"liczebnik porządkowy","def":"Liczebnik określający kolejność: first, second, third. Po It's the first/second time… stoi Present Perfect, a po It was the first time… – Past Perfect.","example":"It's **the second time** I**'ve failed** my driving test.","ref":"23.2"},{"term":"superlative","pl":"stopień najwyższy","def":"Stopień najwyższy przymiotnika lub przysłówka (the best, the most interesting). Po stopniu najwyższym z ever zwykle stoi Present Perfect, a w opowieści o przeszłości – Past Perfect (It was the best… I'd ever…).","example":"Wrocław is **the most beautiful** city I**'ve ever visited**.","ref":"23.2"},{"term":"sequence of events","pl":"kolejność zdarzeń","def":"Porządek, w jakim zaszły zdarzenia. Gdy jasno wynika z kontekstu (and then, after, before), wystarczy Past Simple; Past Perfect podkreśla, że coś stało się wcześniej.","example":"I **locked** the door, **switched off** the lights and **went** to bed.","ref":"22.4"},{"term":"interrupted action","pl":"czynność przerwana","def":"Dłuższa czynność w toku (Past Continuous), którą przerywa krótsze zdarzenie (Past Simple). Zdarzenie przerywające wprowadzamy przez when (nie while), a czynność w toku przez when, while albo as.","example":"I **was having** a shower when the fire alarm **went off**.","ref":"21.3"},{"term":"background (setting the scene)","pl":"tło opowieści","def":"Opis tego, co już trwa, gdy zaczynają się główne zdarzenia: w opowieści o przeszłości Past Continuous, w anegdocie lub streszczeniu fabuły Present Continuous. Same zdarzenia idą w Past Simple lub Present Simple.","example":"In the opening scene it**'s raining**, a young woman **is waiting** at a tram stop in Gdańsk, and a stranger **hands** her an envelope.","ref":"20.4"},{"term":"habit","pl":"nawyk","def":"Czynność wykonywana regularnie. Obecne nawyki to Present Simple (usually, every day), dawne – used to albo would, a irytujący zwyczaj z always – Present Continuous.","example":"Bartek **usually cycles** to uni, but when it rains, he **takes** the bus.","ref":"20.2"},{"term":"repeated action","pl":"czynność powtarzana","def":"Czynność, która zdarzyła się kilka razy. Gdy podajemy liczbę razy (three times), wybieramy formę prostą; bez liczby, z naciskiem na trwanie (all day) – ciągłą.","example":"Ola **has changed** the title of her thesis **four times**, and she still isn't happy with it.","ref":"24.4"},{"term":"gradual change","pl":"stopniowa zmiana","def":"Zmiana, która postępuje krok po kroku (get, become, grow, rise, increase). W teraźniejszości opisuje ją Present Continuous, w przeszłości Past Continuous.","example":"Rents in Koszalin **are getting** higher every year.","ref":"20.5"},{"term":"prediction based on opinion","pl":"przewidywanie na podstawie opinii","def":"Przewidywanie oparte na tym, co myślimy lub wiemy z doświadczenia, często z I think, I'm sure, probably. Typowa forma: will.","example":"I think you**'ll like** Ola – she's really easy-going.","ref":"26.1"},{"term":"prediction based on evidence","pl":"przewidywanie na podstawie oznak (dowodów)","def":"Przewidywanie oparte na tym, co widać lub wiadomo teraz – są już oznaki, że coś się stanie. Typowa forma: be going to.","example":"Look at those black clouds – it**'s going to pour**.","ref":"26.2"},{"term":"spontaneous decision","pl":"decyzja spontaniczna","def":"Decyzja podjęta w chwili mówienia, bez wcześniejszego planu; także oferta pomocy. Typowa forma: will.","example":"The kettle's broken? Never mind, I**'ll boil** some water in a pan.","ref":"27.1"},{"term":"intention","pl":"zamiar","def":"Decyzja podjęta wcześniej, nie w chwili mówienia, ale jeszcze z nikim nie ustalona. Typowa forma: be going to.","example":"I**'m going to start** jogging after the exams.","ref":"27.2"},{"term":"arrangement","pl":"ustalenie (plan umówiony z innymi)","def":"Plan już ustalony z innymi: umówione spotkanie, kupione bilety, rezerwacja. Typowa forma: Present Continuous z okolicznikiem czasu, a gdy coś po prostu wydarzy się w ramach planu – Future Continuous.","example":"We**'re having** dinner with Jakub's parents on Sunday.","ref":"27.3"},{"term":"timetabled event","pl":"wydarzenie z rozkładu","def":"Wydarzenie ustalone w oficjalnym rozkładzie lub harmonogramie (pociągi, loty, zajęcia, godziny otwarcia). Typowe formy: Present Simple albo be due to.","example":"The exam session **starts** on 25 January and **ends** on 8 February.","ref":"28.1"},{"term":"deduction","pl":"dedukcja (logiczne przypuszczenie)","def":"Wniosek o tym, co się dzieje albo już się stało, oparty na tym, co wiemy (czyjś plan dnia, zwyczaje). Poza czasownikami modalnymi wyrażają go też Future Continuous i Future Perfect.","example":"Adam isn't answering – he**'ll be having** his Spanish lesson now.","ref":"26.3"},{"term":"determination","pl":"determinacja, stanowczość","def":"Silna wola, że coś na pewno się stanie albo nie stanie; także obietnica lub groźba. Wyraża ją akcentowane will/won't, a w stylu formalnym z I i we także shall/shall not.","example":"I **will get** that internship – I've been preparing for it for months.","ref":"27.1"},{"term":"future in the past","pl":"przyszłość w przeszłości","def":"Mówienie o czymś, co z perspektywy przeszłego momentu było jeszcze przyszłością. Formy: was/were going to, would, was/were about to, was/were to, Past Continuous.","example":"That morning I had no idea that the day **was going to change** my life.","ref":"29.1"},{"term":"unfulfilled intention","pl":"niezrealizowany zamiar","def":"Plan lub nadzieja z przeszłości, które się nie spełniły. Typowe formy: Past Perfect z hope, expect, want, intend (I had hoped to…) albo was/were going to.","example":"We **had intended** to visit Toruń on the way, but the car broke down.","ref":"22.5"},{"term":"quotation / direct speech","pl":"cytat, mowa niezależna","def":"Dokładne przytoczenie czyichś słów w cudzysłowie, bez zmiany czasów, zaimków i okoliczników.","example":"Marta said, **'I've never been so scared in my life.'**","ref":"50.1"},{"term":"reported speech","pl":"mowa zależna","def":"Przekazanie czyichś słów bez cudzysłowu, zwykle po say, tell, ask. Po czasowniku relacjonującym w przeszłości czasy zwykle przesuwamy w przeszłość (backshift), a zaimki i okoliczniki dostosowujemy.","example":"Marta said **she had never been** so scared in her life.","ref":"50.1"}],"wizard":{"start":"q1","nodes":{"q1":{"q":"Kiedy dzieje się to, o czym mówisz?","hint":"Myśl o sytuacji, a nie o polskim czasie: „Znam go od lat” opisuje coś, co trwa od przeszłości do teraz.","options":[{"label":"Teraz albo ogólnie (zwykle, zawsze, w tym okresie, od jakiegoś czasu do teraz)","next":"q-now"},{"label":"W przeszłości (patrzę z dzisiejszej perspektywy)","next":"q-past"},{"label":"W przeszłości, ale patrzę z innego przeszłego momentu: coś było jeszcze wcześniej albo miało dopiero nastąpić","next":"q-pastview"},{"label":"W przyszłości","next":"q-fut"}]},"q-now":{"q":"Co opisujesz?","hint":"Np. „Mieszkam w Koszalinie” (ogólnie), „Właśnie piszę maila” (teraz), „Uczę się od rana” (od jakiegoś czasu do teraz).","options":[{"label":"Coś stałego albo regularnego (fakt, nawyk, instrukcja) albo opowieść „na żywo” (dowcip, fabuła, relacja sportowa)","next":"q-now-general"},{"label":"Coś, co dzieje się teraz albo tylko w tym okresie","next":"q-now-verb"},{"label":"Coś, co trwa od jakiegoś czasu do teraz (od rana, od lat)","next":"q-pp-dur"},{"label":"Zgadujesz, co ktoś pewnie teraz robi albo już zrobił","next":"q-deduce"}]},"q-now-general":{"q":"Jaki to rodzaj wypowiedzi?","options":[{"label":"Fakt, prawda ogólna, stan stały, nawyk albo instrukcja","result":"r-present-simple"},{"label":"Narzekasz, że ktoś ciągle coś robi (wiecznie się spóźnia)","result":"r-present-continuous-always"},{"label":"Opowiadasz na żywo: dowcip, fabułę, relację sportową; piszesz nagłówek","result":"r-present-simple-story"}]},"q-now-verb":{"q":"Jaki to czasownik?","hint":"Sprawdź, czy da się to „robić” przez chwilę. Stanów (know, like, need) nie da się.","options":[{"label":"Czynność w toku, sytuacja tymczasowa albo zmiana (piszę; w tym semestrze mieszkam u cioci; robi się ciemno)","result":"r-present-continuous"},{"label":"Stan: wiedzieć, rozumieć, lubić, potrzebować, należeć","result":"r-present-simple-state"},{"label":"Odbiór zmysłami: widzę, słyszę, czuję zapach albo smak","result":"r-present-simple-senses"},{"label":"Samo powiedzenie jest czynnością (obiecuję, przepraszam, dziękuję)","result":"r-present-simple-performative"}]},"q-pp-dur":{"q":"Co dokładnie trwa do teraz?","hint":"Po polsku często czas teraźniejszy: „Uczę się od rana”, „Znamy się od lat”.","options":[{"label":"Czynność – liczy się, jak długo trwa (od rana, przez dwie godziny)","result":"r-ppc"},{"label":"Stan: znać, być, mieć, wierzyć","result":"r-present-perfect-state"},{"label":"Czynność, ale podajesz, ile już zrobiono (trzy rozdziały, pięć razy)","result":"r-present-perfect-result"}]},"q-deduce":{"q":"Co dokładnie zgadujesz?","hint":"Mówisz o teraźniejszości, ale nie wiesz na pewno – wnioskujesz z tego, co wiesz o czyimś planie albo zwyczajach.","options":[{"label":"Co ktoś pewnie robi w tej chwili (pewnie siedzi na wykładzie)","result":"r-future-cont-deduction"},{"label":"Że coś pewnie już się stało (na pewno już wyszli)","result":"r-future-perfect-deduction"},{"label":"Jak długo ktoś pewnie już coś robi (jedzie już pewnie trzy godziny)","result":"r-fpc-deduction"}]},"q-past":{"q":"Co mówisz o przeszłości?","hint":"Najważniejsze: czy czas jest zakończony i podany („wczoraj”, „w 2020”, „dwa lata temu”), czy liczy się związek z teraz? „Dziś rano” powiedziane po południu to już czas zakończony.","options":[{"label":"Co się stało albo działo w zakończonym czasie (wczoraj, w 2020, dwa lata temu)","next":"q-past-done"},{"label":"Co się stało, ale czas jest nieważny albo okres wciąż trwa (dziś, w tym tygodniu, w życiu)","next":"q-past-now"},{"label":"Jak kiedyś bywało, a już nie jest: dawny nawyk albo stan","next":"q-habit"},{"label":"Co miało się dopiero stać – plan, zamiar albo przewidywanie z tamtego czasu (miałam zadzwonić, ale…)","next":"q-fip"}]},"q-past-done":{"q":"Jak to wyglądało w tamtym czasie?","hint":"Np. „Wczoraj oddałam esej” (zakończone), „Wczoraj o ósmej pisałam esej” (w toku).","options":[{"label":"Zdarzenie zakończone, stan albo kilka zdarzeń po kolei","result":"r-past-simple"},{"label":"Czynność była wtedy w toku: tło opowieści, czynność przerwana, dwie czynności równoległe (while)","result":"r-past-continuous"},{"label":"Coś zdarzyło się jeszcze wcześniej niż inne przeszłe zdarzenie","next":"q-pastperf"}]},"q-past-now":{"q":"Co chcesz podkreślić?","hint":"Po polsku czas przeszły („zgubiłam klucze”), po angielsku często Present Perfect.","options":[{"label":"Skutek widać teraz albo podajesz wynik do tej pory (zgubiłam klucze; napisałam trzy strony)","result":"r-present-perfect-result"},{"label":"Doświadczenie albo coś w okresie, który wciąż trwa (byłaś kiedyś…?; dziś wypiłam trzy kawy)","result":"r-present-perfect-experience"},{"label":"Wyjaśniasz obecny stan czynnością, która trwała do niedawna (jestem cały spocony, bo…)","result":"r-ppc-explain"},{"label":"Jak długo coś trwa do teraz (od rana, od 2020)","next":"q-pp-dur"}]},"q-habit":{"q":"Co dokładnie opisujesz?","hint":"Stan: be, have, live, like, know. Czynność: go, play, visit, get up. Gdy podajesz liczbę razy albo czas trwania, nie używaj used to ani would.","options":[{"label":"Stan, którego już nie ma (kiedyś było tu kino)","result":"r-used-to-state"},{"label":"Powtarzana czynność – podkreślasz, że teraz już tak nie jest","result":"r-used-to"},{"label":"Powtarzana czynność we wspomnieniu, gdy wiadomo już, o jaki okres chodzi","result":"r-would-habit"},{"label":"Podajesz liczbę razy albo czas trwania (pięć razy; przez trzy lata)","result":"r-past-simple"}]},"q-pastview":{"q":"Co dzieje się względem tamtego przeszłego momentu?","hint":"Np. „Kiedy przyszłam, film już się zaczął” (wcześniej) albo „Miałam do ciebie zadzwonić, ale…” (miało dopiero nastąpić).","options":[{"label":"Coś wydarzyło się wcześniej (zanim…, do tego czasu już…)","next":"q-pastperf"},{"label":"Coś miało dopiero nastąpić: plan, zamiar, przewidywanie","next":"q-fip"}]},"q-pastperf":{"q":"Na czym kładziesz nacisk?","hint":"Jeśli kolejność jasno wynika z kontekstu, Past Perfect często nie jest potrzebny.","options":[{"label":"Czynność zakończona przed tamtym momentem, liczba razy albo stan trwający do niego (znali się od lat)","result":"r-past-perfect"},{"label":"Jak długo czynność trwała do tamtego momentu albo sam proces (czekała już od godziny, kiedy…)","result":"r-past-perfect-cont"},{"label":"Nadzieja albo plan się nie spełniły (miałam nadzieję, że…)","result":"r-past-perfect-hope"},{"label":"Wymieniasz zdarzenia po kolei, w kolejności, w jakiej zaszły","result":"r-past-simple-sequence"}]},"q-fip":{"q":"Co wtedy miało nastąpić?","hint":"Patrzysz z punktu w przeszłości na to, co było wtedy jeszcze przed tobą.","options":[{"label":"Plan albo zamiar, często niezrealizowany (miałam zadzwonić, ale…)","result":"r-was-going-to"},{"label":"Coś miało się stać za chwilę (właśnie miałam wyjść, kiedy…)","result":"r-was-about-to"},{"label":"Przewidywanie albo obietnica z tamtego czasu (wiedziałam, że zda; obiecał, że pomoże)","result":"r-would-fip"},{"label":"Coś było już ustalone (następnego dnia miałam egzamin)","next":"q-fip-arr"}]},"q-fip-arr":{"q":"Jakie to było ustalenie?","options":[{"label":"Zwykłe, prywatne (umówiony lot, egzamin następnego dnia)","result":"r-past-continuous-fip"},{"label":"Oficjalny plan albo coś, co „było pisane” (miał otworzyć konferencję; miała tam zostać na zawsze)","result":"r-was-to"}]},"q-fut":{"q":"Co mówisz o przyszłości?","hint":"Najpierw ustal, czy przewidujesz, czy mówisz o decyzji lub planie.","options":[{"label":"Przewidujesz, co się stanie","next":"q-fut-pred"},{"label":"Mówisz o decyzji, zamiarze, obietnicy albo ustaleniu","next":"q-fut-plan"},{"label":"Mówisz o czasie: co będzie za chwilę, w danym momencie albo do danego momentu","next":"q-fut-time"},{"label":"Rozkład, harmonogram albo zdanie po when, as soon as, until, before, if","next":"q-fut-sched"}]},"q-fut-pred":{"q":"Na czym opierasz przewidywanie?","hint":"Np. „Myślę, że zda” (opinia) albo „Spójrz na te chmury, będzie padać” (dowód).","options":[{"label":"Na opinii, przeczuciu albo doświadczeniu (myślę, że…, pewnie)","result":"r-will-prediction"},{"label":"Na tym, co widać teraz – są już oznaki (spójrz na te chmury)","result":"r-going-to-evidence"}]},"q-fut-plan":{"q":"Kiedy i jak zapadła decyzja?","hint":"Kluczowe pytanie: decydujesz teraz, zdecydowałeś wcześniej, czy jest to już ustalone z innymi?","options":[{"label":"Teraz, w chwili mówienia (dobra, to ja zapłacę)","result":"r-will-decision"},{"label":"Obiecujesz, grozisz albo podkreślasz, że na pewno (zrobię to, czy chcesz, czy nie)","result":"r-will-determination"},{"label":"Wcześniej – to twój zamiar, jeszcze z nikim nie ustalony","result":"r-going-to-intention"},{"label":"Jest już ustalone: data, bilety, rezerwacja, umówione spotkanie","next":"q-fut-arr"}]},"q-fut-arr":{"q":"Co chcesz powiedzieć o tym ustaleniu?","options":[{"label":"Po prostu, co i kiedy robisz (w piątek idziemy do teatru)","result":"r-present-continuous-future"},{"label":"Co będzie się działo w ramach planu albo rutyny (wtedy będę w pracy)","result":"r-future-cont-arranged"},{"label":"Grzecznie pytasz kogoś o plany (czy będzie pani korzystać z sali?)","result":"r-future-cont-polite"},{"label":"Oficjalny plan, komunikat albo polecenie (premier ma się spotkać…)","result":"r-be-to"}]},"q-fut-time":{"q":"Jak to się ma do momentu w przyszłości?","hint":"Np. „Jutro o ósmej będę jechać do Gdańska”, „Do piątku skończę”.","options":[{"label":"Stanie się za chwilę, lada moment (zaraz się zacznie)","result":"r-be-about-to"},{"label":"W tym momencie będzie w toku (jutro o dziewiątej będę pisać egzamin)","result":"r-future-continuous"},{"label":"Do tego momentu będzie zakończone (do piątku skończę)","result":"r-future-perfect"},{"label":"Do tego momentu będzie trwało określony czas (w czerwcu minie rok, odkąd…)","result":"r-fpc"}]},"q-fut-sched":{"q":"Co to za zdanie?","hint":"Np. „Pociąg odjeżdża o 6.40” albo „Zadzwonię, jak dojadę” (chodzi o część „jak dojadę”).","options":[{"label":"Oficjalny rozkład albo harmonogram (pociąg odjeżdża o 6.40)","result":"r-present-simple-timetable"},{"label":"Zdanie czasowe po when, as soon as, until, before, after albo warunkowe po if","result":"r-present-simple-timeclause"}]}},"results":{"r-present-simple":{"tense":"Present Simple","why":"Fakty, prawdy ogólne, stany stałe, nawyki i rutyna (usually, every day, twice a week), a także instrukcje krok po kroku. Liczy się to, co stałe albo regularne, a nie to, co dzieje się w tej chwili.","example":"Igor **lives** in Mielno and **gets** the bus to uni every morning.","pl":"Igor mieszka w Mielnie i co rano dojeżdża autobusem na uczelnię.","refs":["20.1","20.2","20.3"],"watch":"Gdy sytuacja jest tymczasowa (this term, at the moment), wybierz Present Continuous: She's living with her aunt this term."},"r-present-simple-story":{"tense":"Present Simple","why":"Dowcipy, anegdoty, streszczenia fabuły i relacje sportowe opowiadamy w Present Simple, bo brzmią wtedy żywo i bezpośrednio. Nagłówki prasowe używają go nawet o zdarzeniach, które już się wydarzyły.","example":"In the second episode, Marta **finds** a letter and **decides** to go back to Gdańsk.","pl":"W drugim odcinku Marta znajduje list i postanawia wrócić do Gdańska.","refs":["20.3","20.4"],"watch":"Tło, czyli to, co już trwa, daje Present Continuous: It's snowing, we're waiting for the last bus, and suddenly a fox appears."},"r-present-continuous-always":{"tense":"Present Continuous","why":"Present Continuous z always, constantly albo forever podkreśla, że ktoś robi coś bardzo często, zwykle z nutą irytacji. Present Simple z always brzmi neutralnie.","example":"Kamil **is constantly checking** his phone in lectures – it drives me mad.","pl":"Kamil bez przerwy sprawdza telefon na wykładach – doprowadza mnie to do szału.","refs":["20.2"],"watch":"O przeszłości to samo wyraża Past Continuous: She was always complaining about the dorm food."},"r-present-simple-state":{"tense":"Present Simple","why":"Czasowniki stanu (know, understand, believe, like, want, need, belong, seem) opisują stan, a nie czynność, więc zwykle nie mają formy ciągłej, nawet gdy mówisz o tej chwili.","example":"I **don't know** where Zuzia is right now, but I think she's at the gym.","pl":"Nie wiem, gdzie teraz jest Zuzia, ale chyba jest na siłowni.","refs":["25.1","25.2"],"watch":"Niektóre w continuous zmieniają znaczenie: I think (= uważam) / I'm thinking (= zastanawiam się), I have (= mam) / I'm having lunch (= jem)."},"r-present-simple-performative":{"tense":"Present Simple","why":"Czasowniki performatywne (promise, apologise, agree, suggest, insist, thank) w 1. osobie same wykonują czynność: powiedzenie I promise jest obietnicą. Dlatego używamy Present Simple, a nie continuous.","example":"I **insist** – this time the coffee's on me.","pl":"Nalegam – tym razem ja stawiam kawę.","refs":["25.4"],"watch":"Nie mów I'm apologising ani I'm promising, gdy właśnie przepraszasz albo obiecujesz. O przeszłości forma ciągła jest możliwa: I was apologising to the dean when you rang."},"r-present-simple-senses":{"tense":"Present Simple","why":"Czasowniki zmysłów (see, hear, smell, taste, notice) opisują mimowolny odbiór, więc nawet o tej chwili mówimy w Present Simple albo z can: I can hear, I can see. Tak samo, gdy smell i taste opisują cechę rzeczy: This coffee tastes burnt.","example":"I **can hear** someone in the corridor – is that Kuba?","pl":"Słyszę kogoś na korytarzu – to Kuba?","refs":["25.3"],"watch":"Celowe patrzenie i słuchanie to look at, watch, listen to (I'm listening to a podcast). W znaczeniu celowej czynności smell i taste mogą być w continuous: I'm tasting the sauce (= próbuję sosu)."},"r-present-continuous":{"tense":"Present Continuous","why":"Czynność w toku w chwili mówienia albo sytuacja tymczasowa (this week, this term, at the moment), także stopniowa zmiana (It's getting dark, prices are rising).","example":"Why **are** you **wearing** a coat indoors? – The heating **isn't working** again.","pl":"Czemu siedzisz w kurtce w domu? – Znowu nie działa ogrzewanie.","refs":["20.1","20.2","20.5"],"watch":"Czasowniki stanu (know, like, need) zostają w Present Simple: I know, nie I'm knowing."},"r-present-perfect-state":{"tense":"Present Perfect Simple","why":"Stan, który zaczął się w przeszłości i trwa do teraz, z for (jak długo) albo since (od kiedy). Czasowniki stanu (know, be, have = mieć, believe) nie mają formy ciągłej, więc zostaje Present Perfect Simple.","example":"I**'ve known** Natalia since our first week in the dorm.","pl":"Znam Natalię od naszego pierwszego tygodnia w akademiku.","refs":["23.1","25.1"],"watch":"Polskie „znam go od lat” to nie Present Simple: I've known him for years, nie I know him for years."},"r-ppc":{"tense":"Present Perfect Continuous","why":"Czynność zaczęła się w przeszłości i trwa do teraz albo przed chwilą się skończyła. Nacisk na czas trwania, często z for, since, all day, how long.","example":"Wiktor **has been learning** Norwegian since September, and he can already order a coffee.","pl":"Wiktor uczy się norweskiego od września i już potrafi zamówić kawę.","refs":["24.1","24.2","24.4"],"watch":"Z liczbą razy albo ilością (three chapters, five times) wybierz Present Perfect Simple; z live, work, study możliwe są oba czasy."},"r-present-perfect-result":{"tense":"Present Perfect Simple","why":"Zakończona czynność, której skutek jest ważny teraz, albo wynik do tej pory (ile razy, ile stron), często z just, already, yet. Czasu zdarzenia nie podajemy.","example":"I**'ve sent** you the slides – check your inbox.","pl":"Wysłałam ci slajdy – sprawdź skrzynkę.","refs":["23.4","24.4"],"watch":"Gdy dodasz zakończony czas (yesterday, at nine, two days ago), przejdź na Past Simple: I sent you the slides yesterday."},"r-present-perfect-experience":{"tense":"Present Perfect Simple","why":"Doświadczenie bez podanego czasu (ever, never, before) albo zdarzenia w okresie, który wciąż trwa (today, this week, so far). Także po stopniu najwyższym i liczebniku porządkowym: the best… I've ever…, the third time I've…","example":"**Have** you ever **been** to the Bieszczady? – No, but I**'ve hiked** in the Tatras a few times.","pl":"Byłeś kiedyś w Bieszczadach? – Nie, ale kilka razy chodziłem po Tatrach.","refs":["23.2","23.3","23.6"],"watch":"Po It's the first time… stoi Present Perfect: It's the first time I've flown, nie It's the first time I fly."},"r-ppc-explain":{"tense":"Present Perfect Continuous","why":"Obecny stan (zmęczenie, bałagan, mokre włosy) wyjaśniasz czynnością, która trwała do niedawna. Liczy się sama czynność, a nie jej rezultat.","example":"Sorry I'm so sweaty – I**'ve been playing** squash with Kuba.","pl":"Przepraszam, że jestem taki spocony – grałem w squasha z Kubą.","refs":["24.3"],"watch":"Gdy liczy się efekt, a nie sama czynność, wybierz Simple: I've cleaned the bathroom – it's all yours."},"r-future-cont-deduction":{"tense":"Future Continuous","why":"Forma will be + -ing wyraża przypuszczenie o tym, co ktoś robi teraz. Mówiący jest prawie pewny, bo zna czyjś plan dnia albo zwyczaje.","example":"It's Tuesday morning, so Julia **will be sitting** in her statistics lecture now.","pl":"Jest wtorek rano, więc Julia pewnie siedzi teraz na wykładzie ze statystyki.","refs":["26.3"],"watch":"To dedukcja o teraźniejszości, nie przewidywanie przyszłości; po polsku zwykle „pewnie”, „na pewno”."},"r-future-perfect-deduction":{"tense":"Future Perfect","why":"Forma will have + III forma wyraża pewne przypuszczenie, że coś już się stało. Typowe sygnały: by now, already.","example":"Don't ring the dean's office – it's after four, so they**'ll have closed** by now.","pl":"Nie dzwoń do dziekanatu – jest po czwartej, więc na pewno już zamknęli.","refs":["26.3","26.4"],"watch":"Po polsku czas przeszły z „na pewno już”, po angielsku will have + III forma: She'll have got home by now."},"r-fpc-deduction":{"tense":"Future Perfect Continuous","why":"Forma will have been + -ing wyraża przypuszczenie, jak długo coś już trwa w tej chwili.","example":"Kasia left at six, so she**'ll have been driving** for about three hours now.","pl":"Kasia wyjechała o szóstej, więc jedzie już pewnie około trzech godzin.","refs":["26.3","26.4"]},"r-past-simple":{"tense":"Past Simple","why":"Zdarzenie, stan albo powtarzana czynność w zakończonym czasie, który jest podany albo jasny z kontekstu (yesterday, in 2019, two years ago, when I was at school) – także gdy skończył się okres, np. życie osoby, która już nie żyje. Należą tu też zdarzenia po kolei, pytania When…? oraz podana liczba razy lub czas trwania (three times, for three years) – wtedy nie używamy used to ani would.","example":"Last Friday we **finished** classes at noon, **took** the train to Kołobrzeg and **spent** the evening on the beach.","pl":"W zeszły piątek skończyliśmy zajęcia w południe, pojechaliśmy pociągiem do Kołobrzegu i spędziliśmy wieczór na plaży.","refs":["21.1","21.5","23.6"],"watch":"Z ago, last…, yesterday nie łączymy Present Perfect: I saw him two days ago, nie I've seen him two days ago."},"r-past-continuous":{"tense":"Past Continuous","why":"Czynność w toku w danym momencie w przeszłości (at eight last night): tło opowieści, czynność przerwana przez krótsze zdarzenie (Past Simple), dwie czynności trwające równolegle (while), a także sytuacja tymczasowa i stopniowa zmiana (It was getting dark).","example":"I **was cycling** home along the river when my chain broke.","pl":"Jechałem rowerem do domu wzdłuż rzeki, kiedy pękł mi łańcuch.","refs":["21.2","21.3","21.4"],"watch":"Krótkie zdarzenia po kolei to Past Simple: When the alarm went off, we left the building. Uprzejmą prośbę też często zaczynamy od Past Continuous: I was wondering if you could help me."},"r-used-to":{"tense":"used to","why":"Dawny nawyk albo powtarzana czynność, której już nie ma. Used to podkreśla kontrast z teraźniejszością; przy powtarzanych czynnościach zwykle pasuje też would.","example":"I **used to spend** every summer at my grandparents' in Darłowo.","pl":"Kiedyś spędzałam każde lato u dziadków w Darłowie.","refs":["21.5"],"watch":"Nie myl z be/get used to + -ing (być przyzwyczajonym): I'm used to getting up early."},"r-used-to-state":{"tense":"used to","why":"Stan, który kiedyś był prawdziwy, a już nie jest (be, have, live, like, know). Przy stanach używamy used to, nie would.","example":"There **used to be** a cinema in the town centre – my parents had their first date there.","pl":"Kiedyś w centrum miasta było kino – moi rodzice byli tam na pierwszej randce.","refs":["21.5"],"watch":"Nie: There would be a cinema – would opisuje tylko powtarzane czynności. Z czasem trwania – Past Simple: We lived in a dorm for two years, nie We used to live in a dorm for two years."},"r-would-habit":{"tense":"would (past habits)","why":"Powtarzana czynność typowa dla jakiegoś okresu w przeszłości, zwykle we wspomnieniach, gdy okres jest już znany z kontekstu (When I was a kid…). Brzmi bardziej literacko niż used to.","example":"When we lived in Ustka, Dad **would take** us to the pier every Sunday morning.","pl":"Kiedy mieszkaliśmy w Ustce, tata w każdą niedzielę rano zabierał nas na molo.","refs":["21.5"],"watch":"Would nie opisuje stanów: I used to have long hair, nie I would have long hair."},"r-past-perfect":{"tense":"Past Perfect Simple","why":"Czynność zakończona przed innym momentem lub zdarzeniem w przeszłości (często z by the time, already, before), także stan, który trwał do tamtego momentu. Również po It was the first time… i po stopniu najwyższym w opowieści o przeszłości: the best… I'd ever…","example":"By the time I got to the canteen, they **had run out** of pierogi.","pl":"Zanim dotarłem do stołówki, skończyły im się pierogi.","refs":["22.1","22.2","22.5"],"watch":"Gdy kolejność jasno wynika z kontekstu (and then, after), wystarczy Past Simple."},"r-past-perfect-cont":{"tense":"Past Perfect Continuous","why":"Czynność trwała do pewnego momentu w przeszłości albo tuż przed nim; nacisk na czas trwania lub sam proces (for, since, all day). Często wyjaśnia przeszły stan.","example":"Maja's eyes were red because she **had been staring** at her screen all night.","pl":"Maja miała czerwone oczy, bo całą noc wpatrywała się w ekran.","refs":["22.1","22.2","22.3"],"watch":"Czasowniki stanu zostają w Simple: had known, had been, nie had been knowing."},"r-past-perfect-hope":{"tense":"Past Perfect Simple","why":"Z hope, expect, want, plan, intend, think about Past Perfect mówi o zamiarze lub nadziei z przeszłości, które się nie spełniły.","example":"Olek **had planned** to spend the weekend revising, but his friends talked him into a trip to Berlin.","pl":"Olek planował spędzić weekend na powtórkach, ale znajomi namówili go na wyjazd do Berlina.","refs":["22.5"],"watch":"Podobnie działa was/were going to: I was going to call you, but my phone died."},"r-past-simple-sequence":{"tense":"Past Simple","why":"Gdy opowiadasz zdarzenia w kolejności, w jakiej zaszły, albo after, before, as soon as jasno pokazują kolejność, Past Perfect nie jest potrzebny (choć po tych spójnikach jest możliwy).","example":"As soon as the exam **ended**, we **went** for a pizza.","pl":"Jak tylko skończył się egzamin, poszliśmy na pizzę.","refs":["22.4","21.1"],"watch":"Uważaj z when: When Tomek arrived, we ordered pizza (najpierw przyszedł) ≠ When Tomek arrived, we had already ordered pizza (zamówiliśmy wcześniej)."},"r-was-going-to":{"tense":"was/were going to","why":"Plan lub zamiar widziany z przeszłości, często taki, który się nie spełnił (…, but). Także przewidywanie oparte na tym, co było wtedy widać.","example":"We **were going to hitchhike** to Poznań, but in the end we took the train.","pl":"Mieliśmy jechać do Poznania autostopem, ale w końcu pojechaliśmy pociągiem.","refs":["29.1"],"watch":"Polskie „miałam to zrobić” to często was going to, a nie had to (= musiałam)."},"r-was-about-to":{"tense":"was/were about to","why":"Coś miało się wydarzyć za chwilę, widziane z przeszłości – często przerwane innym zdarzeniem (when…).","example":"I **was about to leave** the flat when the landlord knocked on the door.","pl":"Właśnie miałam wychodzić z mieszkania, kiedy do drzwi zapukał właściciel.","refs":["29.2","28.3"],"watch":"I was leaving when… znaczy, że już wychodziłam, a I was about to leave when… – że jeszcze nie zaczęłam."},"r-would-fip":{"tense":"would (future in the past)","why":"Przewidywanie, obietnica lub decyzja widziane z przeszłości – przeszła forma will, częsta po said, knew, thought, promised, hoped.","example":"Even in our first year, we knew Weronika **would become** a brilliant interpreter.","pl":"Już na pierwszym roku wiedzieliśmy, że Weronika zostanie świetną tłumaczką.","refs":["29.2","51.2"],"watch":"Polski czas przyszły po „wiedziałam, że…” albo „obiecał, że…” to would, nie will."},"r-past-continuous-fip":{"tense":"Past Continuous (future in the past)","why":"Ustalony plan widziany z przeszłości – przeszła wersja Present Continuous o przyszłości.","example":"I was too nervous to sleep – I **was giving** my first presentation in English the next morning.","pl":"Byłam zbyt zdenerwowana, żeby zasnąć – następnego dnia rano miałam pierwszą prezentację po angielsku.","refs":["29.2","21.4"],"watch":"Okoliczniki przesuwamy w przeszłość: the next day, the following week (nie tomorrow, next week)."},"r-was-to":{"tense":"was/were to + infinitive","why":"Oficjalny plan albo to, co „było pisane”, widziane z przeszłości. To styl formalny lub literacki.","example":"In 2005 Ewa went to Dublin for a summer job, and she **was to stay** there for the next twenty years.","pl":"W 2005 roku Ewa wyjechała do Dublina do pracy na lato i – jak się okazało – została tam na następne dwadzieścia lat.","refs":["29.2","27.5"],"watch":"Was/were to have + III forma oznacza plan, który się nie spełnił: The rector was to have opened the conference, but he fell ill."},"r-will-prediction":{"tense":"Future Simple (will)","why":"Przewidywanie oparte na opinii, przeczuciu lub doświadczeniu, często z I think, I'm sure, I expect, probably, definitely. Także zwykłe fakty o przyszłości (Ola will be 25 next week).","example":"I'm sure you**'ll love** Gdańsk – it's beautiful in autumn.","pl":"Jestem pewna, że Gdańsk ci się spodoba – jesienią jest piękny.","refs":["26.1","26.5"],"watch":"Probably i definitely stoją po will, ale przed won't: She'll probably come / She probably won't come."},"r-going-to-evidence":{"tense":"be going to","why":"Przewidywanie oparte na tym, co widać albo wiadomo teraz: są już oznaki, że coś się stanie.","example":"Look at that queue – we**'re going to miss** the start of the film.","pl":"Spójrz na tę kolejkę – nie zdążymy na początek filmu.","refs":["26.2"],"watch":"Bez dowodu, z I think albo probably, zwykle wybieramy will."},"r-will-decision":{"tense":"Future Simple (will)","why":"Decyzja podjęta w chwili mówienia, bez wcześniejszego planu – także propozycje i oferty pomocy.","example":"The printer's broken again? Don't worry, I**'ll print** it at the copy shop.","pl":"Drukarka znowu nie działa? Spokojnie, wydrukuję to w punkcie ksero.","refs":["27.1"],"watch":"Pytając o decyzję albo proponując coś z I lub we, używamy shall: Shall I open the window?"},"r-will-determination":{"tense":"Future Simple (will)","why":"Akcentowane will/won't wyraża determinację, obietnicę albo groźbę; w stylu formalnym z I i we także shall/shall not.","example":"I **will finish** this thesis on time, even if I have to work every weekend.","pl":"Skończę tę pracę na czas, nawet jeśli będę musiała pracować w każdy weekend.","refs":["27.1"],"watch":"Won't może też wyrażać odmowę: The door won't open (= nie chce się otworzyć)."},"r-going-to-intention":{"tense":"be going to","why":"Zamiar, czyli decyzja podjęta wcześniej (nie w chwili mówienia), ale jeszcze z nikim nie ustalona.","example":"I**'m going to ask** my supervisor for an extension tomorrow.","pl":"Zamierzam jutro poprosić promotora o przedłużenie terminu.","refs":["27.2","27.3"],"watch":"Z go i come zamiast be going to lepiej brzmi Present Continuous: We're going to Gdańsk on Saturday (rzadziej: We're going to go to Gdańsk…)."},"r-present-continuous-future":{"tense":"Present Continuous","why":"Ustalenie na przyszłość: plan umówiony z innymi, zarezerwowany albo wpisany w kalendarz, zwykle z okolicznikiem czasu.","example":"We**'re meeting** our Erasmus coordinator on Thursday at ten.","pl":"W czwartek o dziesiątej spotykamy się z koordynatorką Erasmusa.","refs":["27.3","20.5"],"watch":"Do zwykłych ustalonych planów nie używaj will: I'm seeing the dentist on Monday, nie I'll see the dentist on Monday."},"r-future-cont-arranged":{"tense":"Future Continuous","why":"Coś będzie się działo w przyszłości jako część planu, rozkładu albo rutyny – bez podkreślania niczyjej decyzji czy zamiaru.","example":"Our lecturer **will be marking** the essays over the weekend, so we'll get our grades on Monday.","pl":"Prowadząca będzie sprawdzać wypracowania w weekend, więc oceny dostaniemy w poniedziałek.","refs":["27.4","28.2"],"watch":"Brzmi neutralniej niż will: I'll call Ola tomorrow (decyzja) / I'll be calling Ola tomorrow anyway (i tak będę do niej dzwonić)."},"r-future-cont-polite":{"tense":"Future Continuous","why":"Grzeczne pytanie o czyjeś plany: brzmi uprzejmiej niż Present Continuous albo will, bo nie naciska i nie brzmi jak prośba.","example":"**Will** you **be using** the projector after your class?","pl":"Czy będzie pani korzystać z rzutnika po swoich zajęciach?","refs":["27.4"],"watch":"Will you…? bez -ing często brzmi jak prośba: Will you help me? = Pomożesz mi?"},"r-be-to":{"tense":"be to + infinitive","why":"Oficjalny plan albo ustalenie, typowe dla wiadomości i komunikatów; także formalne polecenia i zakazy oraz zdania z if (If we are to…).","example":"The university **is to open** a new medical faculty next year.","pl":"Uczelnia ma w przyszłym roku otworzyć nowy wydział lekarski.","refs":["27.5"],"watch":"Polecenie lub zakaz: Students are not to use their phones during the test (= nie wolno)."},"r-future-continuous":{"tense":"Future Continuous","why":"Czynność będzie w toku w danym momencie w przyszłości (this time tomorrow, at nine tonight, when you arrive).","example":"At nine tomorrow I**'ll be sitting** my phonetics exam, so text me afterwards.","pl":"Jutro o dziewiątej będę pisać egzamin z fonetyki, więc napisz do mnie później.","refs":["26.3"],"watch":"Czasowniki stanu i be nie mają tej formy: I'll know, I'll be at home, nie I'll be knowing, I'll be being at home."},"r-future-perfect":{"tense":"Future Perfect","why":"Czynność będzie zakończona przed danym momentem w przyszłości; zwykle z by (by Friday, by then, by the time…).","example":"By the time you land in Bristol, I**'ll have cleaned** the whole flat.","pl":"Zanim wylądujesz w Bristolu, posprzątam całe mieszkanie.","refs":["26.4"],"watch":"Po by the time stoi Present Simple: by the time you land, nie by the time you will land."},"r-fpc":{"tense":"Future Perfect Continuous","why":"Liczysz, jak długo czynność będzie trwała do danego momentu w przyszłości; nacisk na czas trwania (for…).","example":"By the end of this term, Zofia **will have been commuting** from Białogard for three years.","pl":"Pod koniec tego semestru miną trzy lata, odkąd Zofia dojeżdża z Białogardu.","refs":["26.4"],"watch":"Z live, work, stay możliwy jest też Future Perfect Simple: By March Leon will have worked at the café for two years."},"r-present-simple-timetable":{"tense":"Present Simple","why":"Oficjalne rozkłady i harmonogramy (pociągi, loty, zajęcia, godziny otwarcia), także o przyszłości. Plan ustala instytucja, a nie ty.","example":"The semester officially **starts** on 1 October, but our first lecture **isn't** until the 3rd.","pl":"Semestr oficjalnie zaczyna się 1 października, ale nasz pierwszy wykład jest dopiero trzeciego.","refs":["28.1","20.5"],"watch":"Bardziej formalnie: be due to: The plane is due to land at 9.30."},"r-present-simple-timeclause":{"tense":"Present Simple","why":"W zdaniach czasowych o przyszłości po when, as soon as, until, before, after (i w warunkowych po if) nie stawiamy will, tylko czas teraźniejszy; will zostaje w zdaniu głównym.","example":"I'll call you as soon as I **get** the results.","pl":"Zadzwonię do ciebie, jak tylko dostanę wyniki.","refs":["28.1","23.5"],"watch":"Gdy liczy się zakończenie, możliwy jest Present Perfect: I'll lend you the book when I've finished it."},"r-be-about-to":{"tense":"be about to","why":"Coś stanie się za chwilę, lada moment; często z just (I'm just about to leave).","example":"I**'m about to put** the pasta on – are you staying for dinner?","pl":"Zaraz wrzucam makaron – zostajesz na kolację?","refs":["28.3"],"watch":"Zwykle nie dodajemy okolicznika czasu: nie The lecture is about to start in ten minutes."}}},"irregular":[["arise","arose","arisen","pojawiać się, powstawać"],["awake","awoke","awoken","budzić (się)"],["be","was/were","been","być"],["bear","bore","borne","znosić, dźwigać"],["beat","beat","beaten","bić, pokonać"],["become","became","become","stawać się, zostać (kimś)"],["begin","began","begun","zaczynać"],["bend","bent","bent","zginać, schylać się"],["bet","bet","bet","zakładać się"],["bite","bit","bitten","gryźć"],["bleed","bled","bled","krwawić"],["blow","blew","blown","wiać, dmuchać"],["break","broke","broken","łamać, psuć"],["bring","brought","brought","przynosić"],["build","built","built","budować"],["burn","burnt/burned","burnt/burned","palić (się), parzyć"],["burst","burst","burst","pękać"],["buy","bought","bought","kupować"],["catch","caught","caught","łapać"],["choose","chose","chosen","wybierać"],["come","came","come","przychodzić"],["cost <script>(() => {
'use strict';
/* core: helpers, storage, dates, icons, dialogs */
const D = window.DATA;
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/* tiny inline markdown for our own content: **bold** and `code` */
const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`(.+?)`/g, '<code>$1</code>');
const fold = (s) => String(s || '').toLowerCase().replace(/ł/g, 'l').normalize('NFD').replace(/[̀-ͯ]/g, '');
const shuffle = (a) => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const plural = (n, one, few, many) => {
  const n10 = n % 10, n100 = n % 100;
  if (n === 1) return one;
  if (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) return few;
  return many;
};

/* ---------- storage: localStorage with an in-memory fallback ---------- */
const Store = (() => {
  const P = 'kolos.v1.';
  const mem = {};
  let ok = true;
  try { localStorage.setItem(P + '_t', '1'); localStorage.removeItem(P + '_t'); } catch (e) { ok = false; }
  const raw = (k) => { try { return ok ? localStorage.getItem(P + k) : (k in mem ? mem[k] : null); } catch (e) { return k in mem ? mem[k] : null; } };
  function get(k, def) {
    const v = raw(k);
    if (v == null) return def;
    try { return JSON.parse(v); } catch (e) { return def; }
  }
  function set(k, v) {
    const s = JSON.stringify(v);
    mem[k] = s;
    if (!ok) return;
    try { localStorage.setItem(P + k, s); } catch (e) { ok = false; }
  }
  function upd(k, def, fn) { const v = get(k, def); const r = fn(v); set(k, r === undefined ? v : r); return r === undefined ? v : r; }
  const KEYS = ['exam', 'examCustom', 'done', 'moved', 'quiz', 'best', 'mist', 'own', 'ex', 'self', 'diag', 'pdfOffset', 'intro', 'trans', 'story'];
  function dump() { const o = {}; KEYS.forEach((k) => { const v = raw(k); if (v != null) o[k] = JSON.parse(v); }); return o; }
  function load(o) { KEYS.forEach((k) => { if (k in o) set(k, o[k]); }); }
  function wipe() { KEYS.forEach((k) => { delete mem[k]; try { if (ok) localStorage.removeItem(P + k); } catch (e) { /* ignore */ } }); }
  return { get, set, upd, dump, load, wipe, persistent: () => ok };
})();

/* ---------- dates (local time, ISO yyyy-mm-dd) ---------- */
const DAYS = ['niedziela', 'poniedziałek', 'wtorek', 'środa', 'czwartek', 'piątek', 'sobota'];
const DAYS_S = ['nd', 'pon', 'wt', 'śr', 'czw', 'pt', 'sob'];
const MONTHS_G = ['stycznia', 'lutego', 'marca', 'kwietnia', 'maja', 'czerwca', 'lipca', 'sierpnia', 'września', 'października', 'listopada', 'grudnia'];
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parseIso = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayIso = () => iso(new Date());
const addDays = (s, n) => { const d = parseIso(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((parseIso(b) - parseIso(a)) / 864e5);
const dShort = (s) => { const d = parseIso(s); return `${DAYS_S[d.getDay()]} ${d.getDate()}.${String(d.getMonth() + 1).padStart(2, '0')}`; };
const dLong = (s) => { const d = parseIso(s); return `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS_G[d.getMonth()]}`; };
const dNum = (s) => { const d = parseIso(s); return `${d.getDate()}.${String(d.getMonth() + 1).padStart(2, '0')}`; };

  slides: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/>',
  ext: '<path d="M14 4h6v6M20 4l-9 9"/><path d="M19 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V6a1 1 0 011-1h5"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>',
  left: '<path d="M15 5l-7 7 7 7"/>',
  right: '<path d="M9 5l7 7-7 7"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  minus: '<path d="M5 12h14"/>',
  full: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/>',
