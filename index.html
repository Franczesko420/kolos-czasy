 – Present Simple także o tej chwili.","ref":"25.1"},{"id":"u25-18","type":"fix","prompt":"I'm hearing a brilliant audiobook on my way to uni these days.","wrong":"I'm hearing","fixes":["I'm listening to","I am listening to","I listen to"],"answers":["I'm listening to a brilliant audiobook on my way to uni these days.","I am listening to a brilliant audiobook on my way to uni these days.","I listen to a brilliant audiobook on my way to uni these days."],"explain":"Celowe słuchanie to listen to (tu najlepiej I'm listening to – tymczasowo, these days; możliwe też I listen to); hear = słyszeć mimowolnie i nie występuje w continuous.","ref":"25.3"}],"translations":[{"id":"u25-t01","pl":"Rozumiem, co masz na myśli, ale się z tobą nie zgadzam.","answers":["I understand what you mean, but I don't agree with you.","I understand what you mean, but I disagree with you."],"keys":["understand what you mean"],"explain":"understand i agree to czasowniki stanu – Present Simple, nie I'm understanding / I'm not agreeing. Możliwe też I see what you mean.","ref":"25.1"},{"id":"u25-t02","pl":"Zastanawiam się nad przeprowadzką do Gdańska.","answers":["I'm thinking of moving to Gdańsk.","I'm thinking about moving to Gdańsk."],"keys":["am thinking","moving"],"explain":"think of/about = rozważać → Present Continuous; I think = uważam (stan).","ref":"25.2"},{"id":"u25-t03","pl":"Ten laptop należy do mojej współlokatorki.","answers":["This laptop belongs to my flatmate."],"keys":["belongs to"],"explain":"belong to to czasownik posiadania – tylko Present Simple, nigdy is belonging.","ref":"25.1"},{"id":"u25-t04","pl":"Zwykle jest bardzo miły, ale dziś zachowuje się okropnie.","answers":["He's usually very nice, but today he's being awful.","He's usually very nice, but he's being horrible today."],"keys":["being"],"explain":"be + being = zachowywać się tak w danym czasie (tymczasowo). Możliwe też he's behaving terribly.","ref":"25.2"},{"id":"u25-t05","pl":"Słyszysz tę muzykę? Ktoś na dole ma imprezę.","answers":["Can you hear that music? Someone downstairs is having a party.","Can you hear that music? Somebody downstairs is having a party."],"keys":["can you hear","having a party"],"explain":"Mimowolny odbiór dźwięku → can + hear; have a party to czynność → Present Continuous.","ref":"25.3"},{"id":"u25-t06","pl":"Obiecuję, że oddam ci notatki jutro.","answers":["I promise I'll give you your notes back tomorrow.","I promise I'll give your notes back tomorrow.","I promise to give you your notes back tomorrow."],"keys":["i promise"],"explain":"promise to czasownik performatywny – samo powiedzenie jest obietnicą, więc Present Simple, nie I'm promising.","ref":"25.4"},{"id":"u25-t07","pl":"Ta zupa pachnie czosnkiem.","answers":["This soup smells of garlic.","This soup smells like garlic."],"keys":["smells"],"explain":"smell bez dopełnienia (= pachnieć) → Present Simple, nigdy is smelling.","ref":"25.3"},{"id":"u25-t08","pl":"Spotykam się z kimś z mojego roku.","answers":["I'm seeing someone from my year.","I'm seeing somebody from my year."],"keys":["am seeing"],"explain":"see = spotykać się z kimś (romantycznie) – znaczenie czynności, więc continuous; I see someone = widzę kogoś. Możliwe też I'm going out with someone.","ref":"25.3"}],"pairs":[{"id":"state-verbs","title":"Czasowniki stanu: Present Simple czy Continuous?","a":{"name":"Present Simple – znaczenie stanu","when":"opinia (think = uważać), posiadanie (have = mieć), rozumienie i mimowolny odbiór zmysłami (see = rozumieć, widzieć), cecha smaku lub zapachu (taste, smell + przymiotnik), stała cecha charakteru (be)","example":"I think the plan is risky. / They have a summer house. / I see your point. / This wine tastes sweet. / Wiktor is very shy."},"b":{"name":"Present Continuous – znaczenie czynności","when":"rozważanie (think of/about), jedzenie, przeżywanie i czynności z have (have lunch, have fun), umówione spotkanie (see = spotykać się), celowe próbowanie lub wąchanie (taste, smell), tymczasowe zachowanie (be + being)","example":"I'm thinking of changing jobs. / We're having breakfast. / I'm seeing the dentist on Monday. / I'm tasting the wine before the guests arrive. / Wiktor is being very rude tonight."},"tip":"Przetłumacz czasownik na polski: uważam, mam, rozumiem, smakuje, jest (z natury) → Present Simple; rozważam, jem, spotykam się, próbuję, zachowuje się → Present Continuous jest możliwy.","refs":["25.1","25.2","25.3"],"quiz":["u25-04","u25-05","u25-06","u25-07","u25-08","u25-09","u25-10","u25-11","u25-12","u25-13"]}],"signals":[{"word":"now / right now / at the moment (z czasownikami stanu)","tenses":["Present Simple"],"example":"Right now I don't need any help, thanks.","note":"przy know, need, want, understand, believe okolicznik „teraz” nie zmienia czasu – zostaje Present Simple.","ref":"25.1"},{"word":"today / tonight / this week (o zachowaniu)","tenses":["Present Continuous"],"example":"Why are you being so quiet today?","note":"be + being tylko o zachowaniu (rude, silly, quiet, careful), nie o stanie: nie I'm being tired.","ref":"25.2"}]},"26":{"unit":"26","title":"Predictions","titlePl":"Przewidywania","module":6,"presentations":[{"id":"II-4","slides":[3,14]}],"summary":["**will** + bezokolicznik: przewidywanie z opinii, intuicji lub doświadczenia (często po I think / I'm sure / I hope) oraz przyszłe fakty.","**be going to**: przewidywanie na podstawie dowodu, który widać lub znamy teraz; często coś zaraz nastąpi.","**will be -ing** = w danym momencie przyszłości będę w trakcie; **will have + III forma** = przed danym momentem będzie zrobione (by then, by the time); **will have been -ing** = jak długo coś będzie trwało do danego momentu.","Te trzy formy wyrażają też **dedukcję o teraźniejszości**: She'll be teaching now. He'll have left by now. They'll have been working for hours.","Pozycja przysłówków: **will definitely** pass, **definitely won't** pass. Przeczenie przy think/believe/expect/suppose na początku: **I don't think he'll come** (ale: I hope he won't…)."],"sections":[{"ref":"26.1","page":120,"title":"Future Simple: przewidywania z opinii i doświadczenia","rule":"**will/won't + bezokolicznik** to przewidywanie oparte na opinii, ocenie lub intuicji, a także na doświadczeniu (podobne rzeczy już się zdarzały). Ta sama forma opisuje **przyszłe fakty**, które na pewno nastąpią (wiek, daty, pory roku). Często po I think / I suppose / I hope / I imagine / I'm sure i z definitely, certainly, probably, possibly.","examples":[{"en":"I think the new cycle lanes will make the city centre much quieter.","pl":"Myślę, że nowe ścieżki rowerowe sprawią, że centrum będzie dużo cichsze.","note":"opinia, wstęp I think"},{"en":"Don't lend Marek your notes – you won't see them again before the exam.","pl":"Nie pożyczaj Markowi notatek – nie zobaczysz ich już przed egzaminem.","note":"przewidywanie z doświadczenia (Marek zawsze tak robi)"},{"en":"Olek will be twenty-six in January, so he'll lose his student rail discount.","pl":"Olek w styczniu skończy dwadzieścia sześć lat, więc straci studencką zniżkę na kolej.","note":"przyszły fakt i jego skutek"}],"pitfalls":[{"wrong":"I'm sure you pass the exam.","right":"I'm sure you'll pass the exam.","why":"po polsku „na pewno zdasz” brzmi jak czas teraźniejszy, ale przewidywanie po angielsku wymaga will"}],"slides":[{"pres":"II-4","slide":3},{"pres":"II-4","slide":4}]},{"ref":"26.2","page":120,"title":"be going to: przewidywanie na podstawie dowodu","rule":"**be going to + bezokolicznik**, gdy przewidywanie opiera się na tym, co widzimy lub wiemy **teraz** (dowód w teraźniejszości). Często dotyczy bliskiej przyszłości i bywa ostrzeżeniem (Careful! / Watch out!). Gdy dowód podajemy jako własną opinię (I think…), możliwe jest też will – różnica bywa wtedy niewielka.","examples":[{"en":"The car's making a horrible noise – it's going to break down before we reach Kołobrzeg.","pl":"Samochód wydaje okropne dźwięki – zepsuje się, zanim dojedziemy do Kołobrzegu.","note":"dowód słyszalny teraz"},{"en":"Careful – that shelf is going to collapse under all those dictionaries.","pl":"Uważaj – ta półka zaraz się zarwie pod tymi wszystkimi słownikami.","note":"ostrzeżenie, bliska przyszłość"},{"en":"Ania has skipped half the seminars, so she's going to fail the module.","pl":"Ania opuściła połowę seminariów, więc obleje ten przedmiot.","note":"dowód = fakty, które znamy teraz"}],"pitfalls":[{"wrong":"Look at the sky – it rains in a minute.","right":"Look at the sky – it's going to rain in a minute.","why":"Present Simple nie wyraża przewidywań; dowód widoczny teraz → be going to"}],"slides":[{"pres":"II-4","slide":5}]},{"ref":"26.3","page":120,"title":"Future Continuous: czynność w toku w przyszłości i dedukcje","rule":"**will/won't be + -ing** – czynność tymczasowa **w toku** w danym momencie lub okresie przyszłości (this time next week, at ten tomorrow): „będę w trakcie”. Taka czynność bywa tłem, które coś umożliwia. Tą formą (a także will + bezokolicznik, np. That'll be the courier) wyrażamy też **dedukcję o teraźniejszości**: She'll be teaching now = pewnie teraz uczy. Zwykle nie w stronie biernej i nie z czasownikiem be (nie: will be being).","examples":[{"en":"This time tomorrow I'll be sitting my phonetics exam, so keep your fingers crossed.","pl":"Jutro o tej porze będę zdawać egzamin z fonetyki, więc trzymaj kciuki.","note":"czynność w toku w konkretnym momencie przyszłości"},{"en":"I'll be driving past the library anyway, so I can return your books.","pl":"I tak będę przejeżdżać obok biblioteki, więc mogę oddać twoje książki.","note":"czynność w toku umożliwia inną"},{"en":"It's half past ten, so Igor will be working at the café now – try him after six.","pl":"Jest wpół do jedenastej, więc Igor pewnie pracuje teraz w kawiarni – zadzwoń do niego po szóstej.","note":"dedukcja o teraźniejszości"},{"en":"Someone's at the door. – That'll be the courier with my new laptop.","pl":"Ktoś puka. – To pewnie kurier z moim nowym laptopem.","note":"dedukcja z will + be"}],"pitfalls":[{"wrong":"At ten tomorrow I'll write my essay, so don't call me.","right":"At ten tomorrow I'll be writing my essay, so don't call me.","why":"czynność w toku o danej godzinie → Future Continuous; I'll write znaczy raczej „o dziesiątej zacznę pisać”"},{"wrong":"This time next week I'll be being in Prague.","right":"This time next week I'll be in Prague.","why":"be nie występuje w Future Continuous – wystarczy will be"},{"wrong":"Our flat will be being painted all next week.","right":"The decorators will be painting our flat all next week.","why":"Future Continuous zwykle nie w stronie biernej – przejdź na stronę czynną"}],"slides":[{"pres":"II-4","slide":6},{"pres":"II-4","slide":7}]},{"ref":"26.4","page":121,"title":"Future Perfect Simple i Continuous","rule":"**will have + III forma** (Future Perfect) – czynność **zakończona przed** danym momentem w przyszłości; prawie zawsze z określeniem czasu: by then, by Friday, by 2030, by the time…, within the next week, soon. **will have been + -ing** (Future Perfect Continuous) – czynność wciąż trwa w danym momencie przyszłości, a liczy się, **jak długo** (for…). Z live, work, stay obie formy są poprawne. Obie służą też do **dedukcji o teraźniejszości** (He'll have left by now). Future Perfect Continuous prawie nigdy nie występuje w stronie biernej.","examples":[{"en":"By the time you land in Dublin, I'll have cleaned the whole flat.","pl":"Zanim wylądujesz w Dublinie, posprzątam całe mieszkanie.","note":"zakończone przed momentem w przyszłości"},{"en":"In June Zuzia will have been teaching at this school for ten years.","pl":"W czerwcu minie dziesięć lat, odkąd Zuzia uczy w tej szkole.","note":"czas trwania do momentu w przyszłości"},{"en":"It's gone ten, so the shops in the old town will have closed by now.","pl":"Jest po dziesiątej, więc sklepy na starówce na pewno są już zamknięte.","note":"dedukcja o teraźniejszości (Future Perfect)"},{"en":"They'll have been rehearsing since eight, so they'll be exhausted.","pl":"Próbują od ósmej, więc na pewno są wykończeni.","note":"dedukcja o teraźniejszości (Future Perfect Continuous)"}],"pitfalls":[{"wrong":"In May we'll be going out together for three years.","right":"In May we'll have been going out together for three years.","why":"czas trwania do momentu w przyszłości (for) → Future Perfect Continuous, nie Future Continuous"},{"wrong":"By the time we will get there, the film will have started.","right":"By the time we get there, the film will have started.","why":"po by the time Present Simple, nie will (zdanie czasowe, por. 28.1)"}],"slides":[{"pres":"II-4","slide":8},{"pres":"II-4","slide":9},{"pres":"II-4","slide":10},{"pres":"II-4","slide":11},{"pres":"II-4","slide":12}]},{"ref":"26.5","page":121,"title":"Przewidywania mocniejsze lub słabsze","rule":"Pewność przewidywania zmieniamy przysłówkami **definitely, certainly, probably, possibly**. Pozycja: w zdaniu twierdzącym **między will a bezokolicznikiem** (will definitely pass), w przeczeniu **przed won't** (definitely won't pass). Podobnie działają czasowniki wprowadzające: think, expect, hope, doubt, suppose, imagine, guarantee. Przy **think, believe, expect, suppose, imagine** przeczenie stawiamy na początku: I don't think he'll come. Wyjątek: **hope** – I hope he won't be late.","examples":[{"en":"Kuba will definitely pass – he's been revising for weeks.","pl":"Kuba na pewno zda – uczy się od tygodni.","note":"definitely między will a bezokolicznikiem"},{"en":"The 7.40 to Szczecin probably won't be on time – it never is.","pl":"Pociąg o 7.40 do Szczecina pewnie nie przyjedzie punktualnie – nigdy nie przyjeżdża.","note":"probably przed won't"},{"en":"I don't think the landlord will agree to lower the rent.","pl":"Myślę, że właściciel nie zgodzi się obniżyć czynszu.","note":"przeczenie przy think na początku zdania"},{"en":"I doubt we'll find a cheap room near campus in October.","pl":"Wątpię, żebyśmy w październiku znaleźli tani pokój blisko kampusu.","note":"doubt = słabe przewidywanie"}],"pitfalls":[{"wrong":"Marta won't probably come to the party.","right":"Marta probably won't come to the party.","why":"w przeczeniu probably/definitely stoi przed won't"},{"wrong":"I think Bartek won't like the film.","right":"I don't think Bartek will like the film.","why":"przy think/believe/expect/suppose przeczenie zwykle na początku; wersja z won't brzmi nienaturalnie"},{"wrong":"I don't hope it will rain at the weekend.","right":"I hope it won't rain at the weekend.","why":"hope to wyjątek: przeczenie zostaje w zdaniu z will (na slajdzie II/4 13 hope jest na liście, ale nie przenosi przeczenia)"}],"slides":[{"pres":"II-4","slide":4},{"pres":"II-4","slide":13}]}],"uses":[{"group":"Predictions (unit 26)","tense":"Future Simple (will)","no":1,"use":"predictions based on opinions/intuition/experience","usePl":"przewidywanie z opinii, intuicji, doświadczenia (I think / I hope / I suppose; definitely, probably)","example":"I think the exam will be easier than last year's.","ref":"26.1","slide":{"pres":"II-4","slide":4}},{"group":"Predictions (unit 26)","tense":"Future Simple (will)","no":1,"use":"future facts (example on the slide: I will be 21 on Sunday)","usePl":"przyszłe fakty, które na pewno nastąpią (wiek, daty)","example":"Natalia will be twenty-one on Saturday.","ref":"26.1","slide":{"pres":"II-4","slide":4}},{"group":"Predictions (unit 26)","tense":"be going to","no":2,"use":"predictions based on evidence","usePl":"przewidywanie na podstawie dowodu widocznego teraz","example":"Kuba hasn't opened a book all term – he's going to fail.","ref":"26.2","slide":{"pres":"II-4","slide":5}},{"group":"Predictions (unit 26)","tense":"Future Continuous","no":3,"use":"temporary action in progress at a particular time in the future","usePl":"czynność w toku w danym momencie przyszłości","example":"At nine tomorrow I'll be sitting in the dentist's chair.","ref":"26.3","slide":{"pres":"II-4","slide":6}},{"group":"Predictions (unit 26)","tense":"Future Continuous","no":3,"use":"present deductions","usePl":"dedukcja o teraźniejszości: pewnie teraz coś robi","example":"Don't call Kasia now – she'll be driving to work.","ref":"26.3","slide":{"pres":"II-4","slide":7}},{"group":"Predictions (unit 26)","tense":"Future Perfect","no":4,"use":"actions which will be completed before a particular time in the future","usePl":"czynność zakończona przed momentem w przyszłości (by then, by 2030, by the time…)","example":"I'll have handed in all my essays by the end of January.","ref":"26.4","slide":{"pres":"II-4","slide":8}},{"group":"Predictions (unit 26)","tense":"Future Perfect","no":4,"use":"present deductions","usePl":"dedukcja o teraźniejszości: pewnie już się stało (by now)","example":"The match started at six, so it'll have finished by now.","ref":"26.4","slide":{"pres":"II-4","slide":9}},{"group":"Predictions (unit 26)","tense":"Future Perfect Continuous","no":5,"use":"action which will still be in progress at a point in the future (focus on duration)","usePl":"czas trwania do momentu w przyszłości (for…); z live/work/stay także Future Perfect (slajd II/4 11)","example":"By the end of the year Ola will have been learning Korean for three years.","ref":"26.4","slide":{"pres":"II-4","slide":10}},{"group":"Predictions (unit 26)","tense":"Future Perfect Continuous","no":5,"use":"present deductions","usePl":"dedukcja o teraźniejszości: pewnie robi to już od jakiegoś czasu","example":"The concert starts at eight, so the fans at the gate will have been queuing for hours by now.","ref":"26.4","slide":{"pres":"II-4","slide":12}},{"group":"Predictions (unit 26)","tense":"Future Simple (will)","no":null,"use":"predictions with verbs like THINK/BELIEVE/EXPECT/HOPE/SUPPOSE – negative at the beginning of the sentence","usePl":"przeczenie na początku: I don't think he will… zamiast I think he won't…; wyjątek: hope (I hope he won't…)","example":"I don't expect the dean will change her mind.","ref":"26.5","slide":{"pres":"II-4","slide":13}}],"quiz":[{"id":"u26-01","type":"choice","prompt":"Look at Bartek – he's gone completely white and he's swaying. He ___ faint!","options":["will","is going to","faints"],"answer":1,"explain":"Dowód widoczny teraz (zbladł, chwieje się) i coś zaraz nastąpi → be going to (slajd II/4 5).","ref":"26.2"},{"id":"u26-02","type":"gap","prompt":"You haven't seen the flat yet? Wait till you do – I'm sure you ___ (love) it.","answers":["will love","'ll love","are going to love","'re going to love"],"explain":"Przewidywanie oparte na opinii (I'm sure) → typowo will, możliwe też be going to; nie Present Simple, jak sugeruje polskie „na pewno ci się spodoba”.","ref":"26.1"},{"id":"u26-03","type":"choice","prompt":"Don't wait for me tonight – I ___ finish before nine.","options":["won't probably","probably won't","will not probably"],"answer":1,"explain":"W przeczeniu probably stoi przed won't (jak na slajdzie II/4 4: I definitely won't pass).","ref":"26.5"},{"id":"u26-04","type":"choice","prompt":"Don't ring me at eight tomorrow – I ___ my driving test then.","options":["will take","will be taking","will have taken"],"answer":1,"explain":"O ósmej czynność będzie w toku (jestem w trakcie egzaminu, więc nie odbiorę) → Future Continuous.","ref":"26.3"},{"id":"u26-05","type":"choice","prompt":"Wybierz bardziej naturalną wersję: ___ to the lecture – she's still in Gdańsk.","options":["I don't think Natalia will make it","I think Natalia won't make it"],"answer":0,"explain":"Przy think przeczenie zwykle stawiamy na początku zdania (slajd II/4 13); I think… won't jest możliwe, ale mniej naturalne.","ref":"26.5"},{"id":"u26-06","type":"choice","prompt":"It's Monday, ten o'clock. Don't bother knocking on Dr Wiśniewska's door – she ___ her translation seminar now.","options":["will teach","will be teaching","will have taught"],"answer":1,"explain":"Dedukcja o teraźniejszości: pewnie właśnie prowadzi zajęcia → will be + -ing (slajd II/4 7).","ref":"26.3"},{"id":"u26-07","type":"choice","prompt":"Kamil's flight left Gdańsk at six and it's almost nine now, so he ___ in Oslo by now.","options":["will land","will be landing","will have landed"],"answer":2,"explain":"Dedukcja: coś zapewne już się wydarzyło (by now) → will have + III forma (slajd II/4 9).","ref":"26.4"},{"id":"u26-08","type":"choice","prompt":"In July we ___ in this flat for exactly five years – time for a party!","options":["will live","will be living","will have lived"],"answer":2,"explain":"Okres trwający do momentu w przyszłości (in July… for five years) → Future Perfect; przy live/work/stay równie dobrze will have been living (slajd II/4 11).","ref":"26.4"},{"id":"u26-09","type":"choice","prompt":"It's 2 a.m. and Maciek's light is still on – he ___ for his statistics exam since dinner.","options":["will revise","will have been revising","will be revised"],"answer":1,"explain":"Dedukcja o teraźniejszości z naciskiem na czas trwania (since dinner) → will have been + -ing (slajd II/4 12).","ref":"26.4"},{"id":"u26-10","type":"gap","prompt":"At midnight the band will still be playing – by then they ___ (play) for five hours non-stop.","answers":["will have been playing","'ll have been playing"],"explain":"Czynność wciąż trwa w momencie przyszłym, liczy się, jak długo (for five hours) → Future Perfect Continuous.","ref":"26.4"},{"id":"u26-11","type":"gap","prompt":"Hurry up! By the time we get to the station, the last train to Słupsk ___ (leave).","answers":["will have left","'ll have left"],"explain":"By the time + moment w przyszłości: pociąg odjedzie wcześniej → Future Perfect (slajd II/4 8).","ref":"26.4"},{"id":"u26-12","type":"gap","prompt":"Look at those dark clouds over the pier – it ___ (pour) any minute.","answers":["is going to pour","'s going to pour"],"explain":"Przewidywanie na podstawie dowodu widocznego teraz, bliska przyszłość → be going to.","ref":"26.2"},{"id":"u26-13","type":"gap","prompt":"Slow down with the shopping – at this rate, we ___ (spend) our whole budget by Friday.","answers":["will have spent","'ll have spent","are going to have spent","'re going to have spent"],"explain":"By Friday = przed tym momentem rzecz będzie zakończona → Future Perfect.","ref":"26.4"},{"id":"u26-14","type":"gap","prompt":"Relax – you ___ (definitely / pass); you've done every past paper twice.","answers":["will definitely pass","'ll definitely pass","are definitely going to pass","'re definitely going to pass"],"explain":"W zdaniu twierdzącym definitely stoi między will a bezokolicznikiem (slajd II/4 4: I will definitely pass).","ref":"26.5"},{"id":"u26-15","type":"fix","prompt":"Don't worry, Igor will be definitely at the airport on time.","wrong":"will be definitely","fixes":["will definitely be"],"answers":["Don't worry, Igor will definitely be at the airport on time."],"explain":"Przysłówek pewności stoi między will a bezokolicznikiem – także gdy bezokolicznikiem jest be.","ref":"26.5"},{"id":"u26-16","type":"fix","prompt":"This time next Friday we'll be being in Prague, so we can't help with the move.","wrong":"we'll be being","fixes":["we'll be","we will be"],"answers":["This time next Friday we'll be in Prague, so we can't help with the move.","This time next Friday we will be in Prague, so we can't help with the move."],"explain":"Czasownik be nie występuje w Future Continuous – o stanie w przyszłości mówimy po prostu will be.","ref":"26.3"},{"id":"u26-17","type":"use","prompt":"Ring me after nine – by then I'll have finished the presentation.","options":["1. Future Simple – prediction based on opinion","3. Future Continuous – action in progress at a particular time in the future","4. Future Perfect – action completed before a particular time in the future","5. Future Perfect Continuous – duration of an action up to a point in the future"],"answer":2,"explain":"By then + will have + III forma: prezentacja będzie skończona przed tym momentem (slajd II/4 8).","ref":"26.4"},{"id":"u26-18","type":"use","prompt":"Where's Oliwia? – She'll be revising in the library, as usual.","options":["3. Future Continuous – action in progress at a particular time in the future","3. Future Continuous – present deduction","2. be going to – prediction based on evidence"],"answer":1,"explain":"Mowa o tym, co Oliwia robi teraz, i to tylko przypuszczenie → dedukcja o teraźniejszości (slajd II/4 7).","ref":"26.3"}],"translations":[{"id":"u26-t01","pl":"Spójrz na tę kolejkę – nie zdążymy na początek filmu.","answers":["Look at that queue – we're not going to make it in time for the start of the film.","Look at that queue – we aren't going to be in time for the start of the film."],"keys":["going to"],"explain":"Przewidywanie na podstawie tego, co widać teraz (kolejka) → be going to.","ref":"26.2"},{"id":"u26-t02","pl":"Jutro o tej porze będę leciał do Londynu.","answers":["This time tomorrow I'll be flying to London."],"keys":["will be flying"],"explain":"„O tej porze” = czynność w toku w konkretnym momencie przyszłości → Future Continuous.","ref":"26.3"},{"id":"u26-t03","pl":"Do czerwca napiszę pracę licencjacką.","answers":["I'll have written my BA thesis by June.","By June I'll have finished my BA thesis."],"keys":["will have"],"explain":"„Do czerwca” = by June: praca będzie skończona przed tym momentem → Future Perfect.","ref":"26.4"},{"id":"u26-t04","pl":"W październiku minie pięć lat, odkąd uczę się hiszpańskiego.","answers":["In October I'll have been learning Spanish for five years.","By October I'll have been learning Spanish for five years."],"keys":["will have been learning"],"explain":"Polskie „minie pięć lat, odkąd…” to czas trwania do momentu w przyszłości → Future Perfect Continuous + for.","ref":"26.4"},{"id":"u26-t05","pl":"Jest już po siódmej, więc Ola na pewno wyszła już z pracy.","answers":["It's past seven, so Ola will have left work by now.","It's gone seven, so Ola will definitely have left work by now."],"keys":["have left"],"explain":"Dedukcja o teraźniejszości: pewnie już się stało → will have + III forma (możliwe też must have left).","ref":"26.4"},{"id":"u26-t06","pl":"Nie sądzę, żeby Marek zdał prawo jazdy za pierwszym razem.","answers":["I don't think Marek will pass his driving test the first time.","I don't think Marek will pass his driving test at the first attempt."],"keys":["do not think"],"explain":"Przeczenie przy think na początku, w drugiej części twierdzące will (slajd II/4 13).","ref":"26.5"},{"id":"u26-t07","pl":"Na pewno nie skończę tego eseju do jutra.","answers":["I definitely won't finish this essay by tomorrow.","I definitely won't have finished this essay by tomorrow."],"keys":["definitely will not"],"explain":"W przeczeniu definitely stoi przed won't (slajd II/4 4).","ref":"26.5"}],"pairs":[{"id":"will-vs-going-to","title":"will czy be going to? (przewidywania)","a":{"name":"Future Simple (will)","when":"przewidywanie z opinii, intuicji lub doświadczenia; przyszłe fakty; często po I think / I'm sure / I hope i z probably, definitely","example":"I think Pogoń will finish in the top three this season."},"b":{"name":"be going to","when":"przewidywanie na podstawie dowodu, który widzimy lub znamy teraz; często coś zaraz nastąpi (ostrzeżenie)","example":"Pogoń are two goals up with five minutes left – they're going to win."},"tip":"Zapytaj: skąd to wiem? Z głowy (opinia, doświadczenie) → will; z tego, co widzę teraz → be going to. Po I think często oba są możliwe.","refs":["26.1","26.2"],"quiz":["u26-01","u26-02","u26-12"]},{"id":"future-continuous-vs-future-perfect","title":"Future Continuous czy Future Perfect?","a":{"name":"Future Continuous","when":"w danym momencie przyszłości czynność będzie w toku (this time next week, at ten tomorrow); dedukcja: she'll be teaching now","example":"At six I'll be cooking dinner, so come round then and help me."},"b":{"name":"Future Perfect","when":"przed danym momentem czynność będzie zakończona (by six, by then, by the time…); dedukcja: he'll have left by now","example":"By six I'll have cooked dinner, so come round then and we'll eat."},"tip":"W trakcie (at, this time) → will be + -ing; już po (by, by the time) → will have + III forma.","refs":["26.3","26.4"],"quiz":["u26-04","u26-06","u26-07","u26-11","u26-16","u26-17","u26-18"]},{"id":"future-perfect-simple-vs-continuous","title":"Future Perfect Simple czy Continuous?","a":{"name":"Future Perfect","when":"wynik: co i ile będzie zrobione przed momentem w przyszłości","example":"By Friday I'll have read four of the six novels on the list."},"b":{"name":"Future Perfect Continuous","when":"czas trwania czynności do momentu w przyszłości (for…), czynność wciąż trwa","example":"By Friday I'll have been reading for the literature exam for a fortnight."},"tip":"Ile sztuk albo czy skończone → simple; od jak dawna (for) → continuous. Z live, work, stay obie formy są poprawne: We'll have lived / We'll have been living here for ten years in May (slajd II/4 11).","refs":["26.4"],"quiz":["u26-08","u26-09","u26-10","u26-13"]}],"signals":[{"word":"by then","tenses":["Future Perfect"],"example":"The essay is due on Monday – by then I'll have rewritten it twice.","note":"by = najpóźniej do; z Future Continuous tylko wtedy, gdy mówimy, co będzie w toku w tym czasie (By then I'll be living in Gdańsk).","ref":"26.4"},{"word":"by the time","tenses":["Future Perfect"],"example":"By the time you wake up, I'll have left for the airport.","note":"w zdaniu z by the time Present Simple (by the time you wake up), nie will; Future Perfect stoi w zdaniu głównym.","ref":"26.4"},{"word":"by 2030","tenses":["Future Perfect","Future Perfect Continuous"],"example":"By 2030 my parents will have paid off their mortgage.","note":"by + rok lub data → zwykle Future Perfect; z for + okres → Future Perfect Continuous (By 2030 we'll have been living here for twenty years).","ref":"26.4"},{"word":"this time next week","tenses":["Future Continuous"],"example":"This time next week we'll be hiking in the Tatras.","note":"czynność w toku w danym momencie przyszłości; z be i czasownikami stanu zostaje samo will be (This time next week I'll be in Zakopane).","ref":"26.3"},{"word":"soon","tenses":["Future Simple (will)","Future Perfect"],"example":"Give me ten minutes – I'll have finished soon.","note":"z will w zwykłych przewidywaniach (The rain will stop soon); z Future Perfect, gdy coś niedługo będzie zakończone.","ref":"26.4"},{"word":"I think / I hope / I suppose","tenses":["Future Simple (will)"],"example":"I suppose the canteen will be closed on Sunday.","note":"przy I think / I suppose przeczenie na początku (I don't think…); po I hope często Present Simple (I hope it doesn't rain) i nigdy I don't hope.","ref":"26.5"},{"word":"definitely / probably","tenses":["Future Simple (will)","be going to"],"example":"She'll probably call you tonight, but she definitely won't apologise.","note":"po will w zdaniu twierdzącym (will probably), przed won't w przeczeniu (probably won't); z be going to: is probably going to / probably isn't going to.","ref":"26.5"}]}},"story":null,"slides":{"II-1":[{"n":1,"html":"<p>II/1 Present tenses<\/p>","text":"II/1 Present tenses"},{"n":2,"html":"<p>Film z YouTube (Pearson): „There's something new coming to grammar…” (zapowiedź MyGrammarLab).<\/p>","text":"Film z YouTube (Pearson): „There's something new coming to grammar…” (zapowiedź MyGrammarLab)."},{"n":3,"html":"<p>MyGrammarLab for classroom use. Okładka: MyGrammarLab Advanced C1/C2, www.mygrammarlab.com, Mark Foley, Diane Hall, Pearson, „suitable for self study”.<\/p>","text":"MyGrammarLab for classroom use. Okładka: MyGrammarLab Advanced C1/C2, www.mygrammarlab.com, Mark Foley, Diane Hall, Pearson, „suitable for self study”."},{"n":4,"html":"<p>Skala ocen:<\/p><div class=\"tw\"><table><thead><tr><th>Wynik<\/th><th>Ocena<\/th><\/tr><\/thead><tbody><tr><td>91–100%<\/td><td>5,0<\/td><\/tr><tr><td>81–90%<\/td><td>4,5<\/td><\/tr><tr><td>71–80%<\/td><td>4,0<\/td><\/tr><tr><td>61–70%<\/td><td>3,5<\/td><\/tr><tr><td>51–60%<\/td><td>3,0<\/td><\/tr><tr><td>0–50%<\/td><td>2,0<\/td><\/tr><\/tbody><\/table><\/div>","text":"Skala ocen: Wynik Ocena 91–100% 5,0 81–90% 4,5 71–80% 4,0 61–70% 3,5 51–60% 3,0 0–50% 2,0"},{"n":5,"html":"<p>Syllabus:<\/p><div class=\"tw\"><table><thead><tr><th>Nr<\/th><th>Temat<\/th><th>Module<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Tenses<\/td><td>5, 6<\/td><\/tr><tr><td>2<\/td><td>Modal verbs<\/td><td>7<\/td><\/tr><tr><td>3<\/td><td>Passive voice<\/td><td>14<\/td><\/tr><tr><td>4<\/td><td>Word order and verb patterns<\/td><td>9<\/td><\/tr><\/tbody><\/table><\/div>","text":"Syllabus: Nr Temat Module 1 Tenses 5, 6 2 Modal verbs 7 3 Passive voice 14 4 Word order and verb patterns 9"},{"n":6,"html":"<p>Start with ex. 3 page 89<\/p>","text":"Start with ex. 3 page 89"},{"n":7,"html":"<p>Unit 19 Auxiliaries and HAVE GOT<\/p>","text":"Unit 19 Auxiliaries and HAVE GOT"},{"n":8,"html":"<p>Verbs such as DO/BE/HAVE can function both as main verbs and auxiliary verbs:<\/p>","text":"Verbs such as DO/BE/HAVE can function both as main verbs and auxiliary verbs:"},{"n":9,"html":"<p>Tabela:<\/p><div class=\"tw\"><table><thead><tr><th>MAIN<\/th><th>AUXILIARY<\/th><\/tr><\/thead><tbody><tr><td>They are gone.<\/td><td>They are still sleeping.<\/td><\/tr><tr><td>They will do it tomorrow.<\/td><td>When do you sleep?<\/td><\/tr><tr><td>I have more than 10 questions.<\/td><td>I have just left.<\/td><\/tr><\/tbody><\/table><\/div>","text":"Tabela: MAIN AUXILIARY They are gone. They are still sleeping. They will do it tomorrow. When do you sleep? I have more than 10 questions. I have just left."},{"n":10,"html":"<p>ex. 2 p.92<\/p>","text":"ex. 2 p.92"},{"n":11,"html":"<p>HAVE. Tabela HAVE / HAVE GOT – both can be used for:<\/p><ul><li>possession – I have (got) a car.<\/li><li>relationships – I have (got) two younger brothers.<\/li><li>illnesses – She has (got) a slight limp. I have (got) flu.<\/li><li>obligation – I have (got) to go.<\/li><\/ul><p>Na czerwono: <strong>We don't use have got in past or future tenses.<\/strong><\/p>","text":"HAVE. Tabela HAVE / HAVE GOT – both can be used for: - possession – I have (got) a car. - relationships – I have (got) two younger brothers. - illnesses – She has (got) a slight limp. I have (got) flu. - obligation – I have (got) to go. Na czerwono: We don't use have got in past or future tenses."},{"n":12,"html":"<p>EX. 3, 4 p.93<\/p>","text":"EX. 3, 4 p.93"},{"n":13,"html":"<p>Unit 20 Present Continous [sic] or Present Simple?<\/p>","text":"Unit 20 Present Continous [sic] or Present Simple?"},{"n":14,"html":"<p>USES of Present Continuous<\/p>","text":"USES of Present Continuous"},{"n":15,"html":"<p>Uses of Present Continuous:<\/p><ol><li>action at the time of speaking – I'm waiting.<\/li><li>temporary situation – I'm reading an interesting book.<\/li><li>regular action around a point of time – At 9.50 on Saturdays we are always discussing grammar.<\/li><li>future arrangements – I'm getting married this summer.<\/li><li>emphasising a very frequent action – She's always coming late!<\/li><li>setting the scene, telling a plot – I'm sitting at home, reading a book when suddenly the door opens and he comes in!<\/li><li>gradual change – It's getting late.<\/li><\/ol>","text":"Uses of Present Continuous: 1. action at the time of speaking – I'm waiting. 2. temporary situation – I'm reading an interesting book. 3. regular action around a point of time – At 9.50 on Saturdays we are always discussing grammar. 4. future arrangements – I'm getting married this summer. 5. emphasising a very frequent action – She's always coming late! 6. setting the scene, telling a plot – I'm sitting at home, reading a book when suddenly the door opens and he comes in! 7. gradual change – It's getting late."},{"n":16,"html":"<p>USES of Present Simple<\/p>","text":"USES of Present Simple"},{"n":17,"html":"<p>Uses of Present Simple (1–7):<\/p><ol><li>habits/routines – I usually get up before 7.<\/li><li>permament [sic] situations – I live in Koszalin.<\/li><li>instructions – You press the eject button and then you put the CD in.<\/li><li>public timetables/schedules – The bus leaves at 10, don't be late.<\/li><li>scientific facts – Water boils at 100 dergees [sic].<\/li><li>sports commentary – rapid actions – Lewandowski passes the ball to Świderski…<\/li><li>newspaper headlines – Two boys die in a crash.<\/li><\/ol>","text":"Uses of Present Simple (1–7): 1. habits/routines – I usually get up before 7. 2. permament [sic] situations – I live in Koszalin. 3. instructions – You press the eject button and then you put the CD in. 4. public timetables/schedules – The bus leaves at 10, don't be late. 5. scientific facts – Water boils at 100 dergees [sic]. 6. sports commentary – rapid actions – Lewandowski passes the ball to Świderski… 7. newspaper headlines – Two boys die in a crash."},{"n":18,"html":"<p>Uses of Present Simple (8–12):<\/p><ol start=\"8\"><li>reporting verbs – Peter tells me you're getting married.<\/li><li>future time clauses – I will help you when I finish my shift.<\/li><li>jokes – A man comes into a bar and says…<\/li><li>fictional plots – When Jane meets a new man in Paris, she…<\/li><li>stative verbs – I love him. / I understand.<\/li><\/ol>","text":"Uses of Present Simple (8–12): 8. reporting verbs – Peter tells me you're getting married. 9. future time clauses – I will help you when I finish my shift. 10. jokes – A man comes into a bar and says… 11. fictional plots – When Jane meets a new man in Paris, she… 12. stative verbs – I love him. / I understand."},{"n":19,"html":"<p>Ex. 1, 2, 3, 4 pp. 96, 97<\/p>","text":"Ex. 1, 2, 3, 4 pp. 96, 97"}],"II-2":[{"n":1,"html":"<p>Present tenses and Past Simple, II/2<\/p>","text":"Present tenses and Past Simple, II/2"},{"n":2,"html":"<p>START with exercise 1 page 108<\/p>","text":"START with exercise 1 page 108"},{"n":3,"html":"<p>Present Perfect and Past Simple part 1<\/p>","text":"Present Perfect and Past Simple part 1"},{"n":4,"html":"<p>Tabela:<\/p><div class=\"tw\"><table><thead><tr><th>Present Perfect<\/th><th>Past Simple<\/th><\/tr><\/thead><tbody><tr><td>no time of the action given – I<strong>'ve been<\/strong> to Greece.<\/td><td>the time of the action given – I <strong>visited<\/strong> Greece in 2015.<\/td><\/tr><tr><td>ongoing actions and situations that started in the past and continue up till now – The building <strong>has stood<\/strong> here for 30 years.<\/td><td>finished actions/states – The building <strong>stood<\/strong> here for 30 years and then they pulled it down.<\/td><\/tr><tr><td>present result/relevance – He <strong>has had<\/strong> an accident.<\/td><td>no present result – He <strong>had<\/strong> an accident.<\/td><\/tr><tr><td>actions which can be repeated – Olga Tokarczuk <strong>has won<\/strong> the Nobel Prize.<\/td><td>actions which can't be repeated – Czesław Miłosz <strong>won<\/strong> the Nobel Prize.<\/td><\/tr><tr><td>this week/month/year/today – I haven't seen him today.<\/td><td>this week/month/year/today – I didn't see him today.<\/td><\/tr><\/tbody><\/table><\/div>","text":"Tabela: Present Perfect Past Simple no time of the action given – I've been to Greece. the time of the action given – I visited Greece in 2015. ongoing actions and situations that started in the past and continue up till now – The building has stood here for 30 years. finished actions/states – The building stood here for 30 years and then they pulled it down. present result/relevance – He has had an accident. no present result – He had an accident. actions which can be repeated – Olga Tokarczuk has won the Nobel Prize. actions which can't be repeated – Czesław Miłosz won the Nobel Prize. this week/month/year/today – I haven't seen him today. this week/month/year/today – I didn't see him today."},{"n":5,"html":"<p>Present Perfect and Past Simple part 2<\/p>","text":"Present Perfect and Past Simple part 2"},{"n":6,"html":"<p>Tabela:<\/p><div class=\"tw\"><table><thead><tr><th>Present Perfect<\/th><th>Past Simple<\/th><\/tr><\/thead><tbody><tr><td>since / for / just / already / yet / still / recently / lately / ever<\/td><td>ago / last week, etc.<\/td><\/tr><tr><td>superlatives/ordinal numbers – This is the <strong>best<\/strong> book <strong>I've ever read<\/strong>. This is <strong>the fifth<\/strong> coffee I <strong>have drunk<\/strong> today.<\/td><td>than I thought/expected<\/td><\/tr><\/tbody><\/table><\/div><p>Pod tabelą: I haven't seen him <strong>SINCE<\/strong> he left our city. / <strong>SINCE<\/strong> he left our city, I haven't seen him.<\/p>","text":"Tabela: Present Perfect Past Simple since / for / just / already / yet / still / recently / lately / ever ago / last week, etc. superlatives/ordinal numbers – This is the best book I've ever read. This is the fifth coffee I have drunk today. than I thought/expected Pod tabelą: I haven't seen him SINCE he left our city. / SINCE he left our city, I haven't seen him."},{"n":7,"html":"<p>How would you translate the following? Od kiedy Cię poznałem, zawsze jesteś dla mnie dobry.<\/p>","text":"How would you translate the following? Od kiedy Cię poznałem, zawsze jesteś dla mnie dobry."},{"n":8,"html":"<p>Since I met you, you've always been good to me.<\/p>","text":"Since I met you, you've always been good to me."},{"n":9,"html":"<p>And what about the following? Od kiedy Cię znam, zawsze byłeś dla mnie dobry.<\/p>","text":"And what about the following? Od kiedy Cię znam, zawsze byłeś dla mnie dobry."},{"n":10,"html":"<p>Since I've known you, you've always been good to me.<\/p>","text":"Since I've known you, you've always been good to me."},{"n":11,"html":"<p>Since I met you, / Since I've known you, / you've been good to me.<\/p>","text":"Since I met you, / Since I've known you, / you've been good to me."},{"n":12,"html":"<p>Since I (become) a teacher, I have taught hundreds of students. / Since I (be) a teacher, I have taught hundreds of students.<\/p>","text":"Since I (become) a teacher, I have taught hundreds of students. / Since I (be) a teacher, I have taught hundreds of students."},{"n":13,"html":"<p>Since I <strong>became<\/strong> a teacher, I have taught hundreds of students. / Since I <strong>have been<\/strong> a teacher, I have taught hundreds of students. (odpowiedzi wyróżnione na czerwono)<\/p>","text":"Since I became a teacher, I have taught hundreds of students. / Since I have been a teacher, I have taught hundreds of students. (odpowiedzi wyróżnione na czerwono)"},{"n":14,"html":"<p>Exercises 2 and 3 page 109<\/p>","text":"Exercises 2 and 3 page 109"},{"n":15,"html":"<p>Exercise 1 page 111<\/p>","text":"Exercise 1 page 111"},{"n":16,"html":"<p>Present Perfect Continuous and Present Perfect Simple<\/p>","text":"Present Perfect Continuous and Present Perfect Simple"},{"n":17,"html":"<p>Tabela:<\/p><div class=\"tw\"><table><thead><tr><th>Present Perfect Continuous<\/th><th>Present Perfect Simple<\/th><\/tr><\/thead><tbody><tr><td>focus on duration – I have been waiting here for ages.<\/td><td>focus on result – I have read this book. (you can have it)<\/td><\/tr><tr><td>repeated actions (no number of times given) – I've been phoning him all morning.<\/td><td>repeated actions (we know how many times) – I've phoned him 3 times this morning.<\/td><\/tr><tr><td>temporary situation – People have been eating less meat recently because of the crisis.<\/td><td>permanent situation – People have eaten less meat over the last 20 years.<\/td><\/tr><tr><td>action not finished – I've been reading this book.<\/td><td>action finished – I've read this book.<\/td><\/tr><\/tbody><\/table><\/div>","text":"Tabela: Present Perfect Continuous Present Perfect Simple focus on duration – I have been waiting here for ages. focus on result – I have read this book. (you can have it) repeated actions (no number of times given) – I've been phoning him all morning. repeated actions (we know how many times) – I've phoned him 3 times this morning. temporary situation – People have been eating less meat recently because of the crisis. permanent situation – People have eaten less meat over the last 20 years. action not finished – I've been reading this book. action finished – I've read this book."},{"n":18,"html":"<p>Exercise 2 page 111<\/p>","text":"Exercise 2 page 111"},{"n":19,"html":"<p>Homework:<\/p><ul><li>Work on stative verbs (unit 25)<\/li><li>Exercises 1, 2, 3 pages 114–115<\/li><\/ul>","text":"Homework: - Work on stative verbs (unit 25) - Exercises 1, 2, 3 pages 114–115"}],"II-3":[{"n":1,"html":"<p>II/3 Past tenses<\/p>","text":"II/3 Past tenses"},{"n":2,"html":"<p>Start with ex. 1 page 100<\/p>","text":"Start with ex. 1 page 100"},{"n":3,"html":"<p>PAST SIMPLE<\/p>","text":"PAST SIMPLE"},{"n":4,"html":"<p>Uses of Past Simple:<\/p><ol><li>completed actions in the past – He went to Britain last year.<\/li><li>two past actions happening at the same time – When I saw her, I smiled.<\/li><li>repeated actions in the past – I talked to him 5 times last week.<\/li><li>a sequence of actions – I woke up at 7, took a shower, had breakfast and left for work.<\/li><li>states in the past – I lived in Poznań for 20 years. Then I moved to Koszalin.<\/li><\/ol>","text":"Uses of Past Simple: 1. completed actions in the past – He went to Britain last year. 2. two past actions happening at the same time – When I saw her, I smiled. 3. repeated actions in the past – I talked to him 5 times last week. 4. a sequence of actions – I woke up at 7, took a shower, had breakfast and left for work. 5. states in the past – I lived in Poznań for 20 years. Then I moved to Koszalin."},{"n":5,"html":"<p><strong>WOULD/USED TO<\/strong> both used for actions in the past – They used to / would get up early at weekends.<br><strong>USED TO<\/strong> also used for states in the past – Lithuania used to be part of the Soviet Union.<\/p>","text":"WOULD/USED TO both used for actions in the past – They used to / would get up early at weekends. USED TO also used for states in the past – Lithuania used to be part of the Soviet Union."},{"n":6,"html":"<p>PAST CONTINUOUS<\/p>","text":"PAST CONTINUOUS"},{"n":7,"html":"<p>Uses of Past Continuous (1–5):<\/p><ol><li>(bez opisu na slajdzie) – While I was cooking dinner, someone knocked on my door.<\/li><li>action in progress at a point of time – Yesterday at 7 we were watching Game of thrones.<\/li><li>temporary situation – At that time I was living in Poznań.<\/li><li>interrupted action – We were discussing past tenses when he came.<\/li><li>gradual change in the past – It was getting dark and I was starting to worry.<\/li><\/ol>","text":"Uses of Past Continuous (1–5): 1. (bez opisu na slajdzie) – While I was cooking dinner, someone knocked on my door. 2. action in progress at a point of time – Yesterday at 7 we were watching Game of thrones. 3. temporary situation – At that time I was living in Poznań. 4. interrupted action – We were discussing past tenses when he came. 5. gradual change in the past – It was getting dark and I was starting to worry."},{"n":8,"html":"<p>Uses of Past Continuous (6–10):<\/p><ol start=\"6\"><li>two simultaneous actions extended in time – While I was cleaning the attic, my husband was cooking dinner.<\/li><li>future arrangement in the past – I couldn't stay at the party as I was taking an important exam the next day.<\/li><li>providing the background to a story<\/li><li>polite, tentative requests – I was wondering if you could…<\/li><li>emphasising a very frequent action – She was always coming late.<\/li><\/ol>","text":"Uses of Past Continuous (6–10): 6. two simultaneous actions extended in time – While I was cleaning the attic, my husband was cooking dinner. 7. future arrangement in the past – I couldn't stay at the party as I was taking an important exam the next day. 8. providing the background to a story 9. polite, tentative requests – I was wondering if you could… 10. emphasising a very frequent action – She was always coming late."},{"n":9,"html":"<p>Exercises 2, 3 pages 100–101<\/p>","text":"Exercises 2, 3 pages 100–101"},{"n":10,"html":"<p>HOMEWORK: Exercise 4 page 101<\/p>","text":"HOMEWORK: Exercise 4 page 101"},{"n":11,"html":"<p>PAST PERFECT CONTINUOUS AND PAST PERFECT SIMPLE<\/p>","text":"PAST PERFECT CONTINUOUS AND PAST PERFECT SIMPLE"},{"n":12,"html":"<p>both used to talk about actions that happened before another action in the past<\/p>","text":"both used to talk about actions that happened before another action in the past"},{"n":13,"html":"<p>Tabela:<\/p><div class=\"tw\"><table><thead><tr><th>Past Perfect Simple<\/th><th>Past Perfect Continuous<\/th><\/tr><\/thead><tbody><tr><td>a single or repeated action before another action in the past – We learned that he <strong>had failed<\/strong> the exam.<\/td><td>an ongoing process/action before another action in the past – He failed because he <strong>hadn't been studying<\/strong>.<\/td><\/tr><tr><td>a situation which existed before a past event – At the time of the trial, James <strong>had been<\/strong> in prison for over 8 months.<\/td><td>repeated actions in the past – She <strong>had been acting<\/strong> for 15 years before she gave up her career in 2013.<\/td><\/tr><tr><td>with HOPE/EXPECT/WANT/PLAN/THINK ABOUT/WISH to talk about past intentions that were unfulfilled – She <strong>had hoped<\/strong> to get a good grade in the test, but she failed to do most tasks correctly.<\/td><td>(puste)<\/td><\/tr><tr><td>with BY THE TIME – By the age of 26 she <strong>had given<\/strong> up her career.<\/td><td>(puste)<\/td><\/tr><\/tbody><\/table><\/div>","text":"Tabela: Past Perfect Simple Past Perfect Continuous a single or repeated action before another action in the past – We learned that he had failed the exam. an ongoing process/action before another action in the past – He failed because he hadn't been studying. a situation which existed before a past event – At the time of the trial, James had been in prison for over 8 months. repeated actions in the past – She had been acting for 15 years before she gave up her career in 2013. with HOPE/EXPECT/WANT/PLAN/THINK ABOUT/WISH to talk about past intentions that were unfulfilled – She had hoped to get a good grade in the test, but she failed to do most tasks correctly. (puste) with BY THE TIME – By the age of 26 she had given up her career. (puste)"},{"n":14,"html":"<p>COMPARE:<\/p><ul><li>Jim called the boys. They <strong>were playing<\/strong> in the garden.<\/li><li>Jim called the boys. They <strong>had been playing<\/strong> in the garden.<\/li><\/ul>","text":"COMPARE: - Jim called the boys. They were playing in the garden. - Jim called the boys. They had been playing in the garden."},{"n":15,"html":"<p>We don't have to use Past Perfect if the sequence of events is clear: I opened the door and let him in.<\/p>","text":"We don't have to use Past Perfect if the sequence of events is clear: I opened the door and let him in."},{"n":16,"html":"<p>After AFTER/BEFORE/AS SOON AS/ WHEN both Past Perfect and Past Simple can be used:<\/p><ul><li>I left the university after I <strong>(had) finished<\/strong> the course.<\/li><li>When she <strong>(had) left<\/strong>, I cleaned the kitchen.<\/li><\/ul><p><strong>BUT !<\/strong><\/p><ul><li>When she left, I <strong>cleaned<\/strong> the kitchen.<\/li><li>When she left, I <strong>had cleaned<\/strong> the kitchen.<\/li><\/ul>","text":"After AFTER/BEFORE/AS SOON AS/ WHEN both Past Perfect and Past Simple can be used: - I left the university after I (had) finished the course. - When she (had) left, I cleaned the kitchen. BUT ! - When she left, I cleaned the kitchen. - When she left, I had cleaned the kitchen."},{"n":17,"html":"<p>Which was the <strong>first<\/strong> of the two actions? (grafika „1st”)<\/p><ul><li>She refused to leave <strong>until<\/strong> she <strong>had seen<\/strong> all the pictures.<\/li><li>Mother didn't let me leave the room <strong>before<\/strong> I <strong>had eaten<\/strong> the soup.<\/li><\/ul>","text":"Which was the first of the two actions? (grafika „1st”) - She refused to leave until she had seen all the pictures. - Mother didn't let me leave the room before I had eaten the soup."},{"n":18,"html":"<p>CAREFUL: sometimes the Past Perfect tense emphasises the completion of the action:<\/p><ul><li>She refused to leave until she <strong>had seen<\/strong> all the pictures.<\/li><li>Mother didn't let me leave the room before I <strong>had eaten<\/strong> the soup.<\/li><\/ul><p>or the fact that the action was not completed when the past simple action happened:<\/p><ul><li>Sadly, the author died before <strong>he'd finished<\/strong> the series.<\/li><\/ul>","text":"CAREFUL: sometimes the Past Perfect tense emphasises the completion of the action: - She refused to leave until she had seen all the pictures. - Mother didn't let me leave the room before I had eaten the soup. or the fact that the action was not completed when the past simple action happened: - Sadly, the author died before he'd finished the series."},{"n":19,"html":"<p>Exercises 1, 2, 3 pages 104, 105<\/p>","text":"Exercises 1, 2, 3 pages 104, 105"},{"n":20,"html":"<p>Revision pages 116, 117<\/p>","text":"Revision pages 116, 117"},{"n":21,"html":"<p>The hungry lion<\/p>","text":"The hungry lion"},{"n":22,"html":"<p>Use:<\/p><ul><li>Past Perfect (at least twice)<\/li><li>Past Perfect Continuous (at least once)<\/li><li>used to (at least once)<\/li><li>would (at least once)<\/li><li>was/were going to (at least once)<\/li><li>Past Continuous (at least once)<\/li><li>quotation (at least once)<\/li><li>Reported Speech (at least once)<\/li><\/ul>","text":"Use: - Past Perfect (at least twice) - Past Perfect Continuous (at least once) - used to (at least once) - would (at least once) - was/were going to (at least once) - Past Continuous (at least once) - quotation (at least once) - Reported Speech (at least once)"},{"n":23,"html":"<p>Homework Revision pages 116–117<\/p>","text":"Homework Revision pages 116–117"}],"II-4":[{"n":1,"html":"<p>II/4 Future forms<\/p>","text":"II/4 Future forms"},{"n":2,"html":"<p>Start with the Diagnostic test on page 119<\/p>","text":"Start with the Diagnostic test on page 119"},{"n":3,"html":"<p>Predictions (unit 26)<\/p>","text":"Predictions (unit 26)"},{"n":4,"html":"<p><strong>1. Future Simple<\/strong> – (based on opinions/intuition/experience)<\/p><ul><li>Examples: I think he will pass. I will be 21 on Sunday.<\/li><li>Often used with: I think / I suppose / I hope / I imagine; DEFINITELY / CERTAINLY / PROBABLY / POSSIBLY<\/li><li>(Position) I will <strong>definitely<\/strong> pass. I <strong>definitely<\/strong> won't pass.<\/li><\/ul>","text":"1. Future Simple – (based on opinions/intuition/experience) - Examples: I think he will pass. I will be 21 on Sunday. - Often used with: I think / I suppose / I hope / I imagine; DEFINITELY / CERTAINLY / PROBABLY / POSSIBLY - (Position) I will definitely pass. I definitely won't pass."},{"n":5,"html":"<p><strong>2. be going to<\/strong> – (predictions based on evidence). Examples: They're going to have a baby. She's going to fail. She doestn't [sic] study at all!<\/p>","text":"2. be going to – (predictions based on evidence). Examples: They're going to have a baby. She's going to fail. She doestn't [sic] study at all!"},{"n":6,"html":"<p><strong>3. Future Continuous<\/strong> usually used to talk about a temporary action in progress at a particular time in the future. Examples: This time next Tuesday I <strong>will be lying<\/strong> on a beach.<\/p>","text":"3. Future Continuous usually used to talk about a temporary action in progress at a particular time in the future. Examples: This time next Tuesday I will be lying on a beach."},{"n":7,"html":"<p>We can also use Future Continuous to talk about present <strong>deductions<\/strong>:<\/p><ul><li>It's Monday today so she <strong>will be teaching<\/strong> now. She always has classes on Mondays.<\/li><li>He is sick so I guess he <strong>won't be going<\/strong> to work tomorrow.<\/li><li>A: Where's John? Have you seen him today? B: Well, you know John. He <strong>will be playing<\/strong> his computer games, as usual.<\/li><\/ul>","text":"We can also use Future Continuous to talk about present deductions: - It's Monday today so she will be teaching now. She always has classes on Mondays. - He is sick so I guess he won't be going to work tomorrow. - A: Where's John? Have you seen him today? B: Well, you know John. He will be playing his computer games, as usual."},{"n":8,"html":"<p><strong>4. Future Perfect<\/strong> usually used for actions which will be completed before a particular time in the future. Example: I <strong>will have finished<\/strong> the report by 5 pm and then we can go to the cinema. We usually use a time phrase with this kind of prediction (soon, <strong>by then<\/strong>, <strong>by 2029<\/strong>, <strong>by the time<\/strong> we finish, within the next week, etc.)<\/p>","text":"4. Future Perfect usually used for actions which will be completed before a particular time in the future. Example: I will have finished the report by 5 pm and then we can go to the cinema. We usually use a time phrase with this kind of prediction (soon, by then, by 2029, by the time we finish, within the next week, etc.)"},{"n":9,"html":"<p>We can also use Future Perfect to talk about present <strong>deductions<\/strong>:<\/p><ul><li>It's five pm already, so he <strong>will have finished<\/strong> work by now.<\/li><li>No way will we find her at home. She <strong>will have left<\/strong> for the airport by now!<\/li><\/ul>","text":"We can also use Future Perfect to talk about present deductions: - It's five pm already, so he will have finished work by now. - No way will we find her at home. She will have left for the airport by now!"},{"n":10,"html":"<p><strong>5. Future Perfect Continuous<\/strong> usually used to talk about an action which will still be in progress at a point in the future. It focuses on the duration of the action. Example: By 2040 people <strong>will have been using<\/strong> mobile phones for over a century.<\/p>","text":"5. Future Perfect Continuous usually used to talk about an action which will still be in progress at a point in the future. It focuses on the duration of the action. Example: By 2040 people will have been using mobile phones for over a century."},{"n":11,"html":"<p>With verbs which naturally contain the idea of continuity (<strong>LIVE/WORK/STAY<\/strong>), we can use both Future Perfect and Future Perfect Continuous:<\/p><ul><li>We<strong>'ll have lived<\/strong> in this house for twenty years in December.<\/li><li>We<strong>'ll have been living<\/strong> in this house for twenty years in December.<\/li><\/ul>","text":"With verbs which naturally contain the idea of continuity (LIVE/WORK/STAY), we can use both Future Perfect and Future Perfect Continuous: - We'll have lived in this house for twenty years in December. - We'll have been living in this house for twenty years in December."},{"n":12,"html":"<p>We can also use Future Perfect Continuous to talk about present <strong>deductions<\/strong>: They <strong>will have been working<\/strong> on the project for over a week now, so it should be almost finished.<\/p>","text":"We can also use Future Perfect Continuous to talk about present deductions: They will have been working on the project for over a week now, so it should be almost finished."},{"n":13,"html":"<p>Preditions [sic] can also be made with certain verbs: With verbs like <strong>THINK/BELIEVE/EXPECT/HOPE/SUPPOSE<\/strong> the negative is usually formed at the beginning of the sentence:<\/p><ul><li>I <strong>don't think<\/strong> he will come. RATHER THAN I think he won't come.<\/li><li>I <strong>don't suppose<\/strong> she knows the truth. RATHER THAN I suppose she doesn't know the truth.<\/li><\/ul>","text":"Preditions [sic] can also be made with certain verbs: With verbs like THINK/BELIEVE/EXPECT/HOPE/SUPPOSE the negative is usually formed at the beginning of the sentence: - I don't think he will come. RATHER THAN I think he won't come. - I don't suppose she knows the truth. RATHER THAN I suppose she doesn't know the truth."},{"n":14,"html":"<p>Exercises 1,2,3 pages 122,123<\/p>","text":"Exercises 1,2,3 pages 122,123"},{"n":15,"html":"<p>Decisions, intentions and arrangements (unit 27)<\/p>","text":"Decisions, intentions and arrangements (unit 27)"},{"n":16,"html":"<p><strong>1. Future Simple – WILL<\/strong> for spontaneous decisions. Examples: You look tired. I<strong>'ll cook<\/strong> dinner tonight. We can also use will/won't to strenthen [sic] the meaning and express determination:<\/p><ul><li>I <strong>will<\/strong> help you whether you want it or not!<\/li><li>If you insist on lying, I <strong>won't<\/strong> help you!<\/li><\/ul>","text":"1. Future Simple – WILL for spontaneous decisions. Examples: You look tired. I'll cook dinner tonight. We can also use will/won't to strenthen [sic] the meaning and express determination: - I will help you whether you want it or not! - If you insist on lying, I won't help you!"},{"n":17,"html":"<p><strong>2. SHALL<\/strong><\/p><ul><li>to ask about decisions – <strong>Shall<\/strong> we go now?<\/li><li>with <strong>WE<\/strong> and <strong>I<\/strong> to express determination (esp. in formal contexts) – I <strong>shall not<\/strong> discuss my private life here.<\/li><\/ul>","text":"2. SHALL - to ask about decisions – Shall we go now? - with WE and I to express determination (esp. in formal contexts) – I shall not discuss my private life here."},{"n":18,"html":"<p><strong>3. TO BE GOING TO<\/strong> for planned decisions/intentions – I<strong>'m going to<\/strong> talk to her tonight. We usually avoid be going to with the verbs <strong>COME<\/strong> and <strong>GO<\/strong>: Instead of saying: I'm going to go home now. Are you going to come? it's better to say: <strong>I'm going home now. Are you coming?<\/strong><\/p>","text":"3. TO BE GOING TO for planned decisions/intentions – I'm going to talk to her tonight. We usually avoid be going to with the verbs COME and GO: Instead of saying: I'm going to go home now. Are you going to come? it's better to say: I'm going home now. Are you coming?"},{"n":19,"html":"<p><strong>4. PRESENT CONTINUOUS<\/strong> (fixed arrangements with a time expression) – We<strong>'re going<\/strong> to the theatre on Friday.<\/p>","text":"4. PRESENT CONTINUOUS (fixed arrangements with a time expression) – We're going to the theatre on Friday."},{"n":20,"html":"<p><strong>5. FUTURE CONTINUOUS<\/strong><\/p><ul><li>events that are the result of a previous arrangement:<ul><li>Trains <strong>won't be running<\/strong> to Białogard next week due to essential track repairs.<\/li><li>I'm sorry I can't come to your party. I<strong>'ll be working<\/strong> then. (rather than I'll work)<\/li><\/ul><\/li><li>to ask about intentions (politely):<ul><li><strong>Will you be staying<\/strong> long? MORE POLITE THAN Are you staying long?<\/li><\/ul><\/li><\/ul>","text":"5. FUTURE CONTINUOUS - events that are the result of a previous arrangement: - Trains won't be running to Białogard next week due to essential track repairs. - I'm sorry I can't come to your party. I'll be working then. (rather than I'll work) - to ask about intentions (politely): - Will you be staying long? MORE POLITE THAN Are you staying long?"},{"n":21,"html":"<p><strong>6. TO BE TO + INFINITIVE<\/strong><\/p><ul><li>The President <strong>is to meet<\/strong> the Prime Minister today.<\/li><li>The President <strong>was to meet<\/strong> the Prime Minister yesterday.<\/li><li>The President <strong>was to have met<\/strong> the Prime Minister yesterday.<\/li><li>It is often used in writing, especially in news articles: Crash investigators <strong>are to release<\/strong> their findings to the press later today.<\/li><\/ul>","text":"6. TO BE TO + INFINITIVE - The President is to meet the Prime Minister today. - The President was to meet the Prime Minister yesterday. - The President was to have met the Prime Minister yesterday. - It is often used in writing, especially in news articles: Crash investigators are to release their findings to the press later today."},{"n":22,"html":"<p>The structure <strong>TO BE TO DO STH<\/strong> is often used in:<\/p><ul><li>IF-clauses – If we <strong>are to succeed<\/strong>, we need to work harder.<\/li><li>formal commands and instructions:<ul><li>You <strong>are not to disturb<\/strong> the head teacher while the inspectors are here next week.<\/li><li>These pills <strong>are not to be taken<\/strong> with any other form of medicine.<\/li><\/ul><\/li><\/ul>","text":"The structure TO BE TO DO STH is often used in: - IF-clauses – If we are to succeed, we need to work harder. - formal commands and instructions: - You are not to disturb the head teacher while the inspectors are here next week. - These pills are not to be taken with any other form of medicine."},{"n":23,"html":"<p>Exercises 1,2,3,4 pages 126, 127<\/p>","text":"Exercises 1,2,3,4 pages 126, 127"}]},"pres":[{"id":"II-1","title":"Present tenses","slides":19,"short":"https://canva.link/aqielqfv8ror4bt","view":"https://www.canva.com/design/DAGSoTUqDhw/Rubzht5n6kBo2LVb8wyW1w/view"},{"id":"II-2","title":"Present tenses and Past Simple","slides":19,"short":"https://canva.link/7pvq8gc2uahnil1","view":"https://www.canva.com/design/DAGS047XsJ8/xKdmoyXcx8Lq3TbbdalgQw/view"},{"id":"II-3","title":"Past tenses","slides":23,"short":"https://canva.link/98qyqzmvk157a5c","view":"https://www.canva.com/design/DAGTkdm3Mv0/kkH8ELeDi7mvoRNglMVtwQ/view"},{"id":"II-4","title":"Future forms","slides":23,"short":"https://canva.link/wz68jgtm63wmkf5","view":"https://www.canva.com/design/DAGUOaWCMB0/nuDOFQ_kBZlRrJxl_STJ4g/view"}],"topics":[{"presentation":"II-1","slides":[1,5],"topic":"Organizacja: MyGrammarLab, skala ocen, syllabus","book_sections":[],"book_pages":[],"exercises_from_slides":null},{"presentation":"II-1 const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`(.+?)`/g, '<code>$1</code>');

const plural = (n, one, few, many) => {
  const n10 = n % 10, n100 = n % 100;
  if (n === 1) return one;
  if (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) return few;

};

/* ---------- storage: localStorage with an in-memory fallback ---------- */
const Store = (() => {
  const P = 'kolos.v1.';
  const mem = {};
  let ok = true;
  try { localStorage.setItem(P + '_t', '1'); localStorage.removeItem(P + '_t'); } catch (e) { ok = false; }
  const raw = (k) => { try { return ok ? localStorage.getItem(P + k) : (k in mem ? mem[k] : null); } catch (e) { return k in mem ? mem[k] : null; } };
  function get(k, def) {
    const v = raw(k);
    if (v == null) return def;
    try { return JSON.parse(v); } catch (e) { return def; }
  }
  function set(k, v) {
    const s = JSON.stringify(v);
    mem[k] = s;
    if (!ok) return;
    try { localStorage.setItem(P + k, s); } catch (e) { ok = false; }
  }
  function upd(k, def, fn) { const v = get(k, def); const r = fn(v); set(k, r === undefined ? v : r); return r === undefined ? v : r; }
  const KEYS = ['exam', 'examCustom', 'done', 'moved', 'quiz', 'best', 'mist', 'own', 'ex', 'self', 'diag', 'pdfOffset', 'intro', 'trans', 'story'];
  function dump() { const o = {}; KEYS.forEach((k) => { const v = raw(k); if (v != null) o[k] = JSON.parse(v); }); return o; }
  function load(o) { KEYS.forEach((k) => { if (k in o) set(k, o[k]); }); }
  function wipe() { KEYS.forEach((k) => { delete mem[k]; try { if (ok) localStorage.removeItem(P + k); } catch (e) { /* ignore */ } }); }
  return { get, set, upd, dump, load, wipe, persistent: () => ok };
})();
