f":"27.2"},{"id":"u27-t04","pl":"Zamierzam w przyszłym roku zdawać CAE.","answers":["I'm going to take the CAE exam next year.","I'm going to sit the CAE next year."],"keys":["going to"],"explain":"„Zamierzam” = zamiar → be going to; zdawać egzamin = take/sit an exam (pass = zdać).","ref":"27.2"},{"id":"u27-t05","pl":"Nie mogę jutro zostać po zajęciach – będę pilnować młodszego brata.","answers":["I can't stay after class tomorrow – I'll be looking after my little brother.","I can't stay behind after class tomorrow – I'm looking after my younger brother."],"keys":["looking after|taking care of|babysitting"],"explain":"Odmowa z powodu wcześniejszych ustaleń → Future Continuous (lub Present Continuous), nie I'll look after – to brzmiałoby jak decyzja podjęta teraz.","ref":"27.4"},{"id":"u27-t06","pl":"Czy będzie pani potrzebowała pokoju dłużej niż do piątku?","answers":["Will you be needing the room after Friday?","Will you be needing the room beyond Friday?"],"keys":["will you be needing"],"explain":"Uprzejme pytanie o plany klienta → Future Continuous.","ref":"27.4"},{"id":"u27-t07","pl":"Premier ma jutro ogłosić nazwisko nowego ministra zdrowia.","answers":["The Prime Minister is to announce the name of the new health minister tomorrow.","The Prime Minister is to name the new Minister of Health tomorrow."],"keys":["is to announce|is to name"],"explain":"„Ma ogłosić” = oficjalne ustalenie → be to + bezokolicznik (nie has to, które znaczy „musi”).","ref":"27.5"},{"id":"u27-t08","pl":"Jeśli mamy wygrać ligę, musimy więcej trenować.","answers":["If we are to win the league, we need to train more.","If we're to win the league, we'll have to train harder."],"keys":["are to win"],"explain":"„Jeśli mamy…” = warunek konieczny do celu → if + be to + bezokolicznik.","ref":"27.5"}],"pairs":[{"id":"will-going-to-present-continuous","title":"will, be going to czy Present Continuous? (decyzje i plany)","a":{"name":"Future Simple (will)","when":"decyzja podjęta w chwili mówienia (oferta, reakcja na nową informację); obietnica, determinacja","example":"– The bin's full. – Oh, I'll take it out."},"b":{"name":"be going to","when":"zamiar: decyzja podjęta wcześniej, ale bez konkretnych ustaleń","example":"I'm going to look for a cheaper flat after the exams."},"c":{"name":"Present Continuous","when":"ustalenie: termin, bilety, umówieni ludzie; zwykle z określeniem czasu","example":"I'm viewing a flat in Rokosowo on Thursday at five."},"tip":"Decyzja teraz → will; zamiar w głowie → be going to; zapisane w kalendarzu (z kimś, na konkretny termin) → Present Continuous.","refs":["27.1","27.2","27.3"],"quiz":["u27-01","u27-02","u27-03","u27-04","u27-06","u27-07","u27-08","u27-17"]}],"signals":[{"word":"tomorrow","tenses":["Present Continuous","be going to","Future Simple (will)"],"example":"I'm meeting the landlord tomorrow to sign the contract.","note":"sam okolicznik nie wybiera czasu: ustalenie → Present Continuous, zamiar → be going to, decyzja w chwili mówienia lub przewidywanie → will; o osobistych planach nie mówimy Present Simple (nie: I meet him tomorrow).","ref":"27.3"},{"word":"in two hours","tenses":["Present Continuous","Future Simple (will)","be going to"],"example":"I'm leaving for the airport in two hours, so let's talk later.","note":"za dwie godziny = in two hours (licząc od teraz); after two hours = po dwóch godzinach, licząc od innego momentu.","ref":"27.3"}]},"28":{"unit":"28","title":"Other ways of expressing the future","titlePl":"Inne sposoby wyrażania przyszłości","module":6,"presentations":[{"id":"II-1","slides":[17,18]}],"summary":["**Present Simple** – wydarzenia z rozkładu lub harmonogramu (The bus leaves at 10); **be due to** – też harmonogram, ale termin może się jeszcze zmienić.","Po **when, as soon as, until, before, after, once, if, unless, by the time** o przyszłości mówimy w czasie teraźniejszym (Present Simple albo Present Perfect), nigdy z will.","**Future Continuous** podkreśla rutynę i normalny bieg rzeczy: I'll be seeing her at work anyway.","Bliska przyszłość: **be (just) about to**, **be on the point of / on the verge of + -ing lub rzeczownik**, przymiotniki **imminent, forthcoming, impending** – bez okoliczników typu in an hour.","Prawdopodobieństwo i pewność: **be likely / unlikely to**, **be sure / certain / bound to**; czasowniki o znaczeniu przyszłym: hope, intend, plan, expect, promise + to; anticipate, envisage + -ing lub rzeczownik."],"sections":[{"ref":"28.1","page":128,"title":"Present Simple i be due to: rozkłady, harmonogramy, zdania czasowe","rule":"**Present Simple** – wydarzenia z rozkładu lub harmonogramu (pociągi, zajęcia, sesja), zwykle z godziną lub datą; termin jest przedstawiony jako całkowicie pewny. **be due to + bezokolicznik** – również termin z harmonogramu, ale z sugestią, że może się zmienić. W **zdaniach czasowych i warunkowych o przyszłości** (after, as, before, by the time, as soon as, if, immediately, once, the moment, unless, until, when) używamy czasu teraźniejszego – Present Simple albo Present Perfect (nacisk na zakończenie) – **nigdy will**.","examples":[{"en":"The last bus to Mielno leaves at 11.15, so don't stay too long.","pl":"Ostatni autobus do Mielna odjeżdża o 23.15, więc nie siedź za długo.","note":"rozkład jazdy"},{"en":"The winter exam session starts on 25 January.","pl":"Zimowa sesja zaczyna się 25 stycznia.","note":"harmonogram uczelni"},{"en":"The new terminal is due to open in March, but the work is already behind schedule.","pl":"Nowy terminal ma zostać otwarty w marcu, ale prace już się opóźniają.","note":"be due to: termin może się przesunąć"},{"en":"I'll text you as soon as I've landed.","pl":"Napiszę do ciebie, jak tylko wyląduję.","note":"zdanie czasowe; Present Perfect podkreśla zakończenie"}],"pitfalls":[{"wrong":"I'll call you when I will get home.","right":"I'll call you when I get home.","why":"po when, as soon as, until… o przyszłości czas teraźniejszy, nie will (slajd II/1 18, użycie 9)"},{"wrong":"We'll wait until the rain will stop.","right":"We'll wait until the rain stops.","why":"until + Present Simple; polskie „aż przestanie” kusi, żeby dodać will"},{"wrong":"If it will rain, we'll stay at home.","right":"If it rains, we'll stay at home.","why":"w warunku o przyszłości po if Present Simple"}],"slides":[{"pres":"II-1","slide":17},{"pres":"II-1","slide":18}]},{"ref":"28.2","page":128,"title":"Future Continuous dla rutynowych zdarzeń","rule":"**will/won't be + -ing** podkreśla, że zdarzenie należy do **rutyny** albo „normalnego biegu rzeczy”: nie planujemy go specjalnie, po prostu i tak nastąpi. Dla porównania: Present Continuous akcentuje ustalenie, a Present Simple – rozkład lub harmonogram. Ta forma może też sugerować, że zdarzenie jest **nieuniknione**.","examples":[{"en":"Don't buy bread – Dad will be stopping at the bakery on his way home, like every Friday.","pl":"Nie kupuj chleba – tata jak w każdy piątek zatrzyma się w piekarni w drodze do domu.","note":"rutyna (like every Friday)"},{"en":"The next train will be calling at Sławno, Słupsk and Gdynia.","pl":"Następny pociąg zatrzyma się w Sławnie, Słupsku i Gdyni.","note":"typowy komunikat: normalny przebieg"},{"en":"Don't post the keys – you'll be seeing Wojtek at work tomorrow anyway.","pl":"Nie wysyłaj kluczy pocztą – i tak jutro zobaczysz Wojtka w pracy.","note":"i tak się wydarzy, bez specjalnego planowania"}],"pitfalls":[],"slides":[]},{"ref":"28.3","page":128,"title":"Bliska przyszłość: be about to, on the point of, imminent","rule":"**be about to + bezokolicznik** – coś ma się wydarzyć za chwilę (zamiar albo oczekiwanie; sytuacja teraz wskazuje, że to nastąpi); **be just about to** – jeszcze bliżej. **be on the point of / be on the verge of + -ing albo rzeczownik** – coś jest bardzo bliskie. Przymiotniki **imminent, forthcoming, impending** – raczej formalnie, w piśmie; **impending tylko przed rzeczownikiem**. Z tymi wyrażeniami **nie używamy okoliczników czasu** typu in an hour, tomorrow.","examples":[{"en":"Grab a seat – Kuba is about to announce the winners.","pl":"Siadaj – Kuba za chwilę ogłosi zwycięzców.","note":"za chwilę"},{"en":"Ewa is on the point of quitting her job – she's had enough of the night shifts.","pl":"Ewa jest bliska rzucenia pracy – ma dość nocnych zmian.","note":"on the point of + -ing"},{"en":"The little bookshop on our street is on the verge of closure.","pl":"Mała księgarnia na naszej ulicy jest na skraju zamknięcia.","note":"on the verge of + rzeczownik"},{"en":"An announcement about the new rector is imminent.","pl":"Ogłoszenie nazwiska nowego rektora to kwestia chwili.","note":"imminent – formalnie, także po be"}],"pitfalls":[{"wrong":"Hurry up – the train is about to leave in ten minutes.","right":"Hurry up – the train is about to leave.","why":"be about to już znaczy „za chwilę” – bez okolicznika czasu; z in ten minutes użyj leaves / is leaving / is due to leave"},{"wrong":"The strike is impending, so classes may be cancelled.","right":"Because of the impending strike, classes may be cancelled.","why":"impending tylko przed rzeczownikiem (the impending strike); po be użyj imminent (The strike is imminent)"},{"wrong":"She's on the point to resign.","right":"She's on the point of resigning.","why":"on the point of / on the verge of + -ing lub rzeczownik, nie bezokolicznik"}],"slides":[]},{"ref":"28.4","page":129,"title":"Prawdopodobieństwo i pewność: be likely to, be bound to","rule":"**be likely / unlikely to + bezokolicznik** – coś w przyszłości jest prawdopodobne / mało prawdopodobne. **be sure / certain / bound to + bezokolicznik** – coś na pewno się stanie (albo można się było tego spodziewać). Przeczenie z not po przymiotniku (is certain not to…) brzmi formalnie; w mowie wolimy I'm sure he won't… **Be sure to… / Be certain to…** mogą być trybem rozkazującym (= koniecznie, nie zapomnij), **be bound to – nie**.","examples":[{"en":"Rents in Koszalin are likely to go up again next year.","pl":"Czynsze w Koszalinie prawdopodobnie znów wzrosną w przyszłym roku.","note":"prawdopodobne"},{"en":"Bartek is unlikely to finish his thesis before September.","pl":"Mało prawdopodobne, żeby Bartek skończył pracę przed wrześniem.","note":"mało prawdopodobne; podmiotem jest osoba"},{"en":"Don't lend Igor your car – he's bound to scratch it.","pl":"Nie pożyczaj Igorowi samochodu – na pewno go porysuje.","note":"bound to = na pewno (często coś złego)"},{"en":"Be sure to bring your student ID to the exam.","pl":"Koniecznie weź na egzamin legitymację studencką.","note":"be sure to jako tryb rozkazujący"}],"pitfalls":[{"wrong":"Be bound to water my plants while I'm away.","right":"Be sure to water my plants while I'm away.","why":"be bound to nie występuje w trybie rozkazującym – tylko be sure / be certain to"},{"wrong":"He is likely that he will come.","right":"He is likely to come.","why":"osoba + be likely to + bezokolicznik; konstrukcja z that tylko z it: It's likely that he'll come"}],"slides":[]},{"ref":"28.5","page":129,"title":"Czasowniki o znaczeniu przyszłym","rule":"Niektóre czasowniki same odnoszą się do przyszłości, choć nie użyto formy przyszłej. Po **decide, hope, promise, swear, intend** – to + bezokolicznik (intend także z -ing, ale bezokolicznik częściej). Po **anticipate, envisage** – rzeczownik lub -ing; po **predict** – rzeczownik albo zdanie z that. **arrange, expect, guarantee, plan, undertake** – to + bezokolicznik, niektóre z rzeczownikiem przed nim (expect someone to…). Przyszłą możliwość wyrażają też modale **may, might, should** (Units 31–32).","examples":[{"en":"I intend to spend the whole summer in Norway, picking strawberries.","pl":"Zamierzam spędzić całe lato w Norwegii przy zbiorze truskawek.","note":"intend + to"},{"en":"The council doesn't envisage closing the swimming pool.","pl":"Rada miasta nie przewiduje zamknięcia basenu.","note":"envisage + -ing"},{"en":"The dean's office anticipates a record number of applications this year.","pl":"Dziekanat przewiduje w tym roku rekordową liczbę podań.","note":"anticipate + rzeczownik"},{"en":"My parents expect me to come home every weekend.","pl":"Rodzice oczekują, że będę przyjeżdżać do domu co weekend.","note":"expect + osoba + to"}],"pitfalls":[{"wrong":"We anticipate to finish the project in May.","right":"We anticipate finishing the project in May.","why":"anticipate i envisage + -ing lub rzeczownik, nie to + bezokolicznik"},{"wrong":"They promised coming back before dark.","right":"They promised to come back before dark.","why":"promise, decide, hope, swear + to + bezokolicznik"}],"slides":[]}],"uses":[{"group":"Other ways (unit 28)","tense":"Present Simple","no":4,"use":"public timetables/schedules","usePl":"rozkłady i harmonogramy – przyszłość jako pewny termin (ten sam wpis co w unit 20)","example":"Our train to Szczecin leaves at 6.12 tomorrow.","ref":"28.1","slide":{"pres":"II-1","slide":17}},{"group":"Other ways (unit 28)","tense":"Present Simple","no":9,"use":"future time clauses","usePl":"po when, as soon as, until, before, after, once, if… o przyszłości – bez will (ten sam wpis co w unit 20)","example":"We'll start as soon as everyone arrives.","ref":"28.1","slide":{"pres":"II-1","slide":18}},{"group":"Other ways (unit 28)","tense":"be due to","no":null,"use":"timetabled events that may change","usePl":"termin z harmonogramu, który może się przesunąć","example":"The renovated cinema is due to reopen in April.","ref":"28.1","slide":null},{"group":"Other ways (unit 28)","tense":"Future Continuous","no":null,"use":"routine events (the normal course of events)","usePl":"rutyna, normalny bieg rzeczy – i tak się wydarzy","example":"I'll be seeing Ola at choir practice tonight, as always, so I'll give her the keys.","ref":"28.2","slide":null},{"group":"Other ways (unit 28)","tense":"be about to","no":null,"use":"events in the very near future","usePl":"coś wydarzy się za chwilę (bez okoliczników typu in an hour)","example":"Quick, take a photo – the fireworks are about to start.","ref":"28.3","slide":null},{"group":"Other ways (unit 28)","tense":"be on the point of / be on the verge of","no":null,"use":"something very close to happening (+ -ing or noun)","usePl":"coś jest bardzo bliskie (+ -ing lub rzeczownik)","example":"Our football club is on the point of signing a new striker.","ref":"28.3","slide":null},{"group":"Other ways (unit 28)","tense":"be likely / unlikely to","no":null,"use":"probability","usePl":"prawdopodobieństwo w przyszłości","example":"The lecture is unlikely to finish on time – it never does.","ref":"28.4","slide":null},{"group":"Other ways (unit 28)","tense":"be sure / certain / bound to","no":null,"use":"certainty","usePl":"pewność; be sure / certain to także jako tryb rozkazujący, be bound to – nie","example":"Take an umbrella – it's bound to rain during the open-air concert.","ref":"28.4","slide":null},{"group":"Other ways (unit 28)","tense":"verbs with future meaning","no":null,"use":"hope, intend, plan, expect, promise + to-infinitive; anticipate, envisage + -ing/noun","usePl":"czasowniki, które same odnoszą się do przyszłości","example":"We're planning to rent a cottage in the Bieszczady for New Year.","ref":"28.5","slide":null}],"quiz":[{"id":"u28-01","type":"choice","prompt":"Wybierz formę typową dla rozkładu jazdy: The ferry to Bornholm ___ at 8.30 tomorrow morning.","options":["departs","is departing","is going to depart"],"answer":0,"explain":"Rozkład jazdy, termin od nas niezależny → Present Simple (slajd II/1 17, użycie 4). Is departing nie jest błędem, ale brzmi jak czyjeś ustalenie, a nie rozkład.","ref":"28.1"},{"id":"u28-02","type":"gap","prompt":"As soon as the exam session ___ (finish), I'm going skiing in the Alps.","answers":["finishes","has finished","'s finished"],"explain":"Po as soon as o przyszłości czas teraźniejszy: Present Simple albo Present Perfect (nacisk na zakończenie), nigdy will (slajd II/1 18, użycie 9).","ref":"28.1"},{"id":"u28-03","type":"gap","prompt":"Don't hand in the essay until you ___ (check) all the references.","answers":["have checked","'ve checked","check"],"explain":"Po until o przyszłości czas teraźniejszy; Present Perfect podkreśla, że sprawdzanie ma być zakończone, Present Simple też jest poprawny.","ref":"28.1"},{"id":"u28-04","type":"fix","prompt":"I'll send you the photos when I will get back from Iceland.","wrong":"will get","fixes":["get","have got","'ve got"],"answers":["I'll send you the photos when I get back from Iceland.","I'll send you the photos when I have got back from Iceland.","I'll send you the photos when I've got back from Iceland."],"explain":"W zdaniu czasowym po when o przyszłości Present Simple (albo Present Perfect: when I've got back), nie will.","ref":"28.1"},{"id":"u28-05","type":"choice","prompt":"Wybierz formę, która sugeruje, że termin może się jeszcze zmienić: The new footbridge ___ in June, but the contractor has already asked for more time.","options":["opens","is due to open","is opening"],"answer":1,"explain":"be due to – termin z harmonogramu, który może się przesunąć; Present Simple przedstawia go jako całkowicie pewny.","ref":"28.1"},{"id":"u28-06","type":"use","prompt":"We'll start the meeting as soon as everyone gets here.","options":["Present Simple, 4. public timetables/schedules","Present Simple, 9. future time clauses","Present Simple, 12. stative verbs"],"answer":1,"explain":"gets odnosi się do przyszłości, ale stoi po as soon as, więc jest w Present Simple (slajd II/1 18, użycie 9).","ref":"28.1"},{"id":"u28-07","type":"choice","prompt":"Wybierz formę, która podkreśla rutynę (nic specjalnie nie planuję): I ___ past the post office on my way to work, as always, so I can post your letter.","options":["'ll be going","'m going to go","'m going"],"answer":0,"explain":"Future Continuous przedstawia zdarzenie jako część normalnego biegu rzeczy; Present Continuous akcentowałby ustalenie, be going to – zamiar.","ref":"28.2"},{"id":"u28-08","type":"choice","prompt":"Turn your phones off, please – the choir ___.","options":["is about to sing","is about singing","is on the point to sing"],"answer":0,"explain":"be about to + bezokolicznik = za chwilę; on the point of łączy się z -ing, nie z bezokolicznikiem.","ref":"28.3"},{"id":"u28-09","type":"gap","prompt":"Our local bookshop is on the point of ___ (close) down – let's buy something there this week.","answers":["closing"],"explain":"be on the point of + -ing (lub rzeczownik) = coś jest bardzo bliskie.","ref":"28.3"},{"id":"u28-10","type":"fix","prompt":"Quick, get your coat – the taxi is about to arrive in five minutes.","wrong":"about to arrive in five minutes","fixes":["about to arrive","arriving in five minutes","coming in five minutes","due to arrive in five minutes","going to arrive in five minutes"],"answers":["Quick, get your coat – the taxi is about to arrive.","Quick, get your coat – the taxi is arriving in five minutes.","Quick, get your coat – the taxi is coming in five minutes.","Quick, get your coat – the taxi is due to arrive in five minutes.","Quick, get your coat – the taxi is going to arrive in five minutes."],"explain":"be about to samo znaczy „za chwilę”, więc nie dodajemy okolicznika czasu; z in five minutes użyj innej formy (is arriving, is due to arrive).","ref":"28.3"},{"id":"u28-11","type":"choice","prompt":"Take a power bank – your phone ___ die halfway through the trip; it always does.","options":["is bound to","is about to","is unlikely to"],"answer":0,"explain":"Pewność oparta na doświadczeniu (it always does) → be bound to + bezokolicznik.","ref":"28.4"},{"id":"u28-12","type":"gap","prompt":"The number of international students in Koszalin ___ (be likely / grow) next year.","answers":["is likely to grow","'s likely to grow"],"explain":"be likely to + bezokolicznik = prawdopodobnie; podmiot the number wymaga is.","ref":"28.4"},{"id":"u28-13","type":"choice","prompt":"The organisers anticipate ___ over 5,000 visitors this year.","options":["to welcome","welcoming","welcome"],"answer":1,"explain":"anticipate (podobnie envisage) łączy się z -ing albo rzeczownikiem, nie z to + bezokolicznik.","ref":"28.5"},{"id":"u28-14","type":"gap","prompt":"Mikołaj ___ (promise / pay) me back by the end of the month, so I'm not worried.","answers":["has promised to pay","'s promised to pay","promised to pay"],"explain":"promise + to + bezokolicznik – czasownik sam odnosi się do przyszłości.","ref":"28.5"}],"translations":[{"id":"u28-t01","pl":"Zadzwonię do ciebie, jak tylko dojadę do Koszalina.","answers":["I'll call you as soon as I get to Koszalin.","I'll ring you as soon as I arrive in Koszalin."],"keys":["as soon as i get|as soon as i arrive|as soon as i reach|as soon as i have|as soon as i am"],"explain":"Po as soon as o przyszłości Present Simple (albo Present Perfect), nie will – choć po polsku jest „dojadę”.","ref":"28.1"},{"id":"u28-t02","pl":"Pociąg do Gdańska odjeżdża jutro o 6.12.","answers":["The train to Gdańsk leaves at 6.12 tomorrow.","The Gdańsk train leaves tomorrow at 6.12."],"keys":["leaves|departs"],"explain":"Rozkład jazdy → Present Simple także o przyszłości.","ref":"28.1"},{"id":"u28-t03","pl":"Nie wyjdę, dopóki nie skończę tego rozdziału.","answers":["I won't leave until I finish this chapter.","I won't leave until I've finished this chapter."],"keys":["will not leave until","until i finish|until i have finished"],"explain":"Polskie „dopóki nie” → until bez drugiego przeczenia i bez will: until I finish / until I've finished.","ref":"28.1"},{"id":"u28-t04","pl":"Nowa linia kolejowa ma zostać otwarta w 2028 roku, ale może się to opóźnić.","answers":["The new railway line is due to open in 2028, but it may be delayed.","The new railway line is due to open in 2028, but there may be delays."],"keys":["is due to"],"explain":"Termin z harmonogramu, który może się zmienić → be due to.","ref":"28.1"},{"id":"u28-t05","pl":"Film zaraz się zacznie – wyłącz telefon.","answers":["The film is about to start – switch off your phone.","The film's about to begin – turn your phone off."],"keys":["about to"],"explain":"„Zaraz” = za chwilę → be about to + bezokolicznik, bez dodatkowego okolicznika czasu.","ref":"28.3"},{"id":"u28-t06","pl":"Ta drużyna na pewno wygra – ma najlepszego trenera w lidze.","answers":["This team is bound to win – they've got the best coach in the league.","This team is sure to win – it has the best coach in the league."],"keys":["bound to|sure to|certain to|definitely|certainly"],"explain":"Pewność co do przyszłości → be bound to / be sure to + bezokolicznik (możliwe też will definitely win); has to win znaczy „musi wygrać”, a is likely to win – „prawdopodobnie wygra”.","ref":"28.4"},{"id":"u28-t07","pl":"Planujemy za dwa lata otworzyć własną kawiarnię.","answers":["We're planning to open our own café in two years.","We plan to open our own café in two years' time."],"keys":["to open","in two years"],"explain":"plan + to + bezokolicznik; „za dwa lata” = in two years (nie after two years).","ref":"28.5"}],"pairs":[{"id":"present-simple-vs-continuous-future","title":"Present Simple czy Present Continuous o przyszłości?","a":{"name":"Present Simple","when":"rozkład jazdy, harmonogram, kalendarz akademicki (termin od nas niezależny); także po when / as soon as / until / before / after / if o przyszłości","example":"The coach to Berlin leaves at 7.30 on Saturday."},"b":{"name":"Present Continuous","when":"osobiste ustalenia: umówione spotkania, kupione bilety, plany z udziałem innych ludzi","example":"We're taking the coach to Berlin on Saturday – Marta has booked the seats."},"tip":"Rozkład lub kalendarz, o którym nie my decydujemy → Present Simple; nasz plan ustalony z innymi → Present Continuous. W zdaniu po when / as soon as o przyszłości zawsze czas teraźniejszy, nigdy will.","refs":["28.1","28.2"],"quiz":["u28-01","u28-02","u28-03","u28-04","u28-06"]}],"signals":[{"word":"when / as soon as / until / before / after","tenses":["Present Simple","Present Perfect"],"example":"We'll order the food as soon as Kasia gets here.","note":"o przyszłości bez will: when I finish, until it stops; Present Perfect podkreśla zakończenie (after I've graduated). Wyjątek: when w pytaniu albo jako „kiedy” w zdaniu dopełnieniowym – wtedy will (I don't know when he'll be back).","ref":"28.1"},{"word":"about to","tenses":["be about to"],"example":"Shh – the dean is about to announce the results.","note":"bez okolicznika czasu (nie: about to leave in five minutes); just about to = za moment; was about to = właśnie miałem (Unit 29).","ref":"28.3"},{"word":"on the point of","tenses":["be on the point of / be on the verge of"],"example":"Marta is on the point of accepting a job offer in Oslo.","note":"+ -ing lub rzeczownik (of leaving, of collapse), nigdy bezokolicznik; podobnie on the verge of; bez okoliczników czasu.","ref":"28.3"}]},"29":{"unit":"29","title":"Future in the past","titlePl":"Przyszłość w przeszłości (future in the past)","module":6,"presentations":[{"id":"II-3","slides":[21,22]},{"id":"II-4","slides":[21,21]}],"summary":["Future in the past = przyszłość widziana z punktu w przeszłości: to, co wtedy było jeszcze przed nami.","was/were going to + bezokolicznik = zamiar z przeszłości; zwykle się nie spełnił (but…), dlatego służy też do wymówek; wasn't going to = zrobiłem, choć nie zamierzałem.","Inne formy przesuwamy o krok w przeszłość: will → would, will be + -ing → would be + -ing, will have + III → would have + III, is about to → was about to, is due to → was due to, is to → was to; ustalenia → Past Continuous.","was to / was due to + have + III (bezokolicznik perfect) = wiadomo, że plan się nie spełnił (slajd II/4 21)."],"sections":[{"ref":"29.1","page":132,"title":"was/were going to – zamiar z perspektywy przeszłości","rule":"**was/were going to** + bezokolicznik opisuje przyszłość widzianą z przeszłości: zamiar lub plan, który mieliśmy wtedy. Zwykle plan się **nie spełnił** (but…), dlatego ta forma służy też do wymówek. Przeczenie (wasn't going to) mówi o czymś, co zrobiliśmy, choć nie zamierzaliśmy; to, że plan się spełnił, musi wynikać z kontekstu.","examples":[{"en":"I was going to revise all weekend, but my friends talked me into a trip to Kołobrzeg.","pl":"Miałem się uczyć cały weekend, ale znajomi namówili mnie na wypad do Kołobrzegu.","note":"plan, który się nie spełnił"},{"en":"Sorry, I was going to text you, but my battery died.","pl":"Przepraszam, miałam do ciebie napisać, ale padła mi bateria.","note":"wymówka"},{"en":"I wasn't going to apply for the job, but my sister persuaded me, and now I love it.","pl":"Nie zamierzałem starać się o tę pracę, ale siostra mnie przekonała i teraz ją uwielbiam.","note":"przeczenie: coś zrobiliśmy, choć nie planowaliśmy"},{"en":"Kuba was going to propose in Paris, and that's exactly what he did.","pl":"Kuba planował oświadczyć się w Paryżu i dokładnie tak zrobił.","note":"plan się spełnił – wynika to z kontekstu"}],"pitfalls":[{"wrong":"We would visit Grandma on Sunday, but there were no trains.","right":"We were going to visit Grandma on Sunday, but there were no trains.","why":"„mieliśmy odwiedzić” (zamiar z przeszłości) → was/were going to, nie would"}],"slides":[{"pres":"II-3","slide":22}]},{"ref":"29.2","page":132,"title":"Inne sposoby wyrażania przyszłości w przeszłości","rule":"Każdą formę przyszłą można przenieść w przeszłość z tym samym znaczeniem: Present Continuous → **Past Continuous** (ustalenia), will → **would**, will be + -ing → **would be + -ing**, will have + III → **would have + III**, is about to / is due to → **was about to / was due to**, is to → **was to**. Po was/were (due) to + zwykły bezokolicznik nie wiemy, czy do zdarzenia doszło. Z bezokolicznikiem perfect (was to have met, was due to have arrived) wiemy, że **nie doszło** (slajd II/4 21).","examples":[{"en":"At sixteen I was sure I would become a vet, but I ended up teaching English.","pl":"Jako szesnastolatka byłam pewna, że zostanę weterynarzem, a skończyło się na uczeniu angielskiego.","note":"will → would"},{"en":"We were just about to start the meeting when the projector broke.","pl":"Właśnie mieliśmy zaczynać spotkanie, kiedy zepsuł się rzutnik.","note":"was/were about to + when"},{"en":"The ferry was due to leave at noon, but a storm kept it in the harbour.","pl":"Prom miał wypłynąć w południe, ale sztorm zatrzymał go w porcie.","note":"was due to – według rozkładu"},{"en":"The rector was to have opened the new library, but she fell ill.","pl":"Nową bibliotekę miała otworzyć pani rektor, ale zachorowała.","note":"was to + bezokolicznik perfect → wydarzenie nie doszło do skutku"}],"pitfalls":[{"wrong":"I thought the exam will be easier.","right":"I thought the exam would be easier.","why":"przyszłość widziana z przeszłości (thought) → would; po polsku „myślałem, że będzie”"},{"wrong":"The guests were about to arrive at 7 p.m.","right":"The guests were due to arrive at 7 p.m.","why":"about to = za chwilę, bez konkretnej godziny; zaplanowana godzina → due to"}],"slides":[{"pres":"II-4","slide":21},{"pres":"II-3","slide":22}]}],"uses":[{"tense":"future in the past","no":null,"use":"was/were going to – a past intention or plan (often unfulfilled)","usePl":"zamiar lub plan z przeszłości, zwykle niespełniony","example":"I was going to cook dinner, but we ordered a pizza in the end.","ref":"29.1","slide":{"pres":"II-3","slide":22}},{"tense":"future in the past","no":null,"use":"was/were going to – excuses for things not done","usePl":"wymówka: coś miałem zrobić, ale…","example":"Sorry, I was going to reply to your email, but I got snowed under with work.","ref":"29.1","slide":null},{"tense":"future in the past","no":null,"use":"Past Continuous – an arrangement seen from the past","usePl":"ustalenie z perspektywy przeszłości (Past Continuous, użycie 7)","example":"Ewa was meeting her tutor at ten, so she couldn't join us for breakfast.","ref":"29.2","slide":{"pres":"II-3","slide":8}},{"tense":"future in the past","no":null,"use":"would – the future seen from the past","usePl":"przyszłość widziana z przeszłości (will → would)","example":"Back in 2015, nobody guessed that Igor would become a professional chef.","ref":"29.2","slide":null},{"tense":"future in the past","no":null,"use":"would be + -ing / would have + past participle","usePl":"czynność w toku / zakończona w przyszłości widzianej z przeszłości","example":"We hoped that by June we would have saved enough for a car.","ref":"29.2","slide":null},{"tense":"future in the past","no":null,"use":"was/were about to – something was going to happen very soon","usePl":"coś miało się wydarzyć za chwilę","example":"I was about to hang up when someone finally answered.","ref":"29.2","slide":null},{"tense":"future in the past","no":null,"use":"was/were (due) to – a scheduled or official plan in the past","usePl":"plan według rozkładu lub oficjalnych ustaleń; z bezokolicznikiem perfect = nie doszło do skutku","example":"The new bridge was to have opened in May, but the work is still going on.","ref":"29.2","slide":{"pres":"II-4","slide":21}}],"quiz":[{"id":"u29-01","type":"gap","prompt":"I ___ (pay) you back yesterday, but I left my wallet at home.","answers":["was going to pay"],"explain":"Zamiar z przeszłości, który się nie spełnił → was going to + bezokolicznik; zdanie działa jak wymówka.","ref":"29.1"},{"id":"u29-02","type":"gap","prompt":"We ___ (go) to a music festival in Gdynia last summer, but the tickets sold out in an hour.","answers":["were going to go","were going"],"explain":"Plan z przeszłości, który się nie spełnił → were going to go; możliwe też Past Continuous (were going) jako ustalenie z przeszłości.","ref":"29.1"},{"id":"u29-03","type":"choice","prompt":"I ___ anything about your haircut, but since you asked – it's a bit too short.","options":["wasn't going to say","didn't say","won't say"],"answer":0,"explain":"wasn't going to = nie zamierzałem, a jednak to robię. Didn't say przeczyłoby temu, że właśnie to mówię.","ref":"29.1"},{"id":"u29-04","type":"gap","prompt":"When I started my degree, I had no idea how much I ___ (enjoy) phonetics.","answers":["would enjoy","'d enjoy","was going to enjoy"],"explain":"Przyszłość widziana z przeszłości (had no idea…) → would albo was going to; will tu nie pasuje.","ref":"29.2"},{"id":"u29-05","type":"choice","prompt":"Iza ___ switch off her laptop when an email from her supervisor popped up.","options":["was about to","was due to","would"],"answer":0,"explain":"was/were about to = coś miało się stać za chwilę, często z when + zdarzenie, które to przerwało. Due to dotyczy rozkładów i planów.","ref":"29.2"},{"id":"u29-06","type":"gap","prompt":"At eight o'clock that evening we had no idea that by midnight we ___ (sit) in a police station giving statements.","answers":["would be sitting","'d be sitting"],"explain":"Czynność w toku w przyszłym momencie widzianym z przeszłości: will be + -ing → would be + -ing.","ref":"29.2"},{"id":"u29-07","type":"choice","prompt":"The builders promised that they ___ the renovation by the end of August, but in October the kitchen still had no floor.","options":["would have completed","will have completed","had completed"],"answer":0,"explain":"Obietnica z przeszłości o zakończeniu przed terminem: will have + III → would have + III. Had completed znaczyłoby, że skończyli już wcześniej.","ref":"29.2"},{"id":"u29-08","type":"choice","prompt":"Które zdanie mówi, że otwarcie na pewno się nie odbyło?","options":["The mayor was to open the new swimming pool on Saturday.","The mayor was to have opened the new swimming pool on Saturday."],"answer":1,"explain":"was/were to + bezokolicznik perfect (to have opened) = plan się nie spełnił; was to open nie mówi, czy do otwarcia doszło (slajd II/4 21).","ref":"29.2"},{"id":"u29-09","type":"choice","prompt":"Our train ___ leave Koszalin at 6.15, but it didn't actually leave until almost seven.","options":["was due to","was about to","would"],"answer":0,"explain":"was/were due to = według rozkładu lub planu. About to nie łączy się z konkretną godziną, a would nie wyraża rozkładu.","ref":"29.2"},{"id":"u29-10","type":"fix","prompt":"Yesterday I thought it will rain, so I took an umbrella.","wrong":"will rain","fixes":["would rain","was going to rain"],"answers":["Yesterday I thought it would rain, so I took an umbrella.","Yesterday I thought it was going to rain, so I took an umbrella."],"explain":"Przyszłość widziana z przeszłości (thought) → would albo was going to, nie will; po polsku „myślałem, że będzie padać”.","ref":"29.2"},{"id":"u29-11","type":"use","prompt":"I was going to buy you flowers, but the florist's had already closed.","options":["was/were going to – zamiar z przeszłości, który się nie spełnił (wymówka)","was/were about to – coś miało się stać za chwilę","would – przewidywanie z perspektywy przeszłości"],"answer":0,"explain":"was going to + but… = plan, który się nie spełnił; zdanie służy jako wymówka.","ref":"29.1"}],"translations":[{"id":"u29-t01","pl":"Miałam dziś posprzątać pokój, ale znajomi wyciągnęli mnie do kina.","answers":["I was going to tidy my room today, but my friends dragged me to the cinema.","I was going to clean my room today, but my friends took me to the cinema."],"keys":["was going to"],"explain":"„Miałam coś zrobić” (zamiar, który się nie spełnił) → was going to + bezokolicznik; had to znaczyłoby „musiałam”.","ref":"29.1"},{"id":"u29-t02","pl":"Nie sądziłam, że ten egzamin będzie taki trudny.","answers":["I didn't think this exam would be so difficult.","I didn't think the exam would be so hard."],"keys":["would be|was going to be"],"explain":"Po czasowniku w przeszłości przyszłość wyrażamy przez would, choć po polsku zostaje „będzie”.","ref":"29.2"},{"id":"u29-t03","pl":"Właśnie miałam wychodzić, kiedy zadzwonił telefon.","answers":["I was about to leave when the phone rang.","I was just about to go out when the phone rang."],"keys":["about to"],"explain":"Coś miało się stać za chwilę, ale przerwało to zdarzenie → was about to + when + Past Simple.","ref":"29.2"},{"id":"u29-t04","pl":"Pociąg miał przyjechać o 8.30, ale miał godzinę opóźnienia.","answers":["The train was due to arrive at 8.30, but it was an hour late.","The train was due in at 8.30, but it was an hour late."],"keys":["was due|was supposed to|was to arrive"],"explain":"Plan według rozkładu widziany z przeszłości → was due to (albo was due in); poprawne też was supposed to. Nie had to – to znaczy „musiał”.","ref":"29.2"}],"pairs":[{"id":"was-going-to","title":"was/were going to – plan, który się nie spełnił","a":{"name":"was/were going to","when":"zamiar lub plan z przeszłości; zwykle się nie spełnił (but…), często jako wymówka; wasn't going to = zrobiłem, choć nie zamierzałem","example":"I was going to cook dinner, but I fell asleep on the sofa."},"b":{"name":"would","when":"przyszłość widziana z przeszłości w zdaniu podrzędnym (I knew/thought/hoped that … would …), przewidywania; nie wyraża własnego planu (nie: We would visit Grandma on Sunday, but…)","example":"I knew the exam would be tough, so I started revising early."},"tip":"„Miałem coś zrobić, ale…” → was going to; „myślałem/wiedziałem, że coś się stanie” → would. Z bezokolicznikiem perfect (was to have done) albo z had hoped/planned to wiadomo, że plan się nie spełnił.","refs":["29.1","29.2"],"quiz":["u29-01","u29-02","u29-03","u29-04","u29-10","u29-11"]}],"signals":[{"word":"the next day / the following week","tenses":["Past Continuous","was/were going to","would"],"example":"She was flying to Dublin the next day, so she left the party early.","note":"Z perspektywy przeszłości mówimy the next day, nie tomorrow; tak samo w mowie zależnej: tomorrow → the next day (51.4).","ref":"29.2"},{"word":"little did I know (that)","tenses":["would"],"example":"Little did I know that this course would change my life.","note":"Typowy wstęp do przyszłości w przeszłości (would, would be + -ing); po little did szyk pytający.","ref":"29.2"}]},"reported":{"unit":"reported","title":"Reported speech – basics","titlePl":"Mowa zależna – minimum","module":null,"presentations":[{"id":"II-3","slides":[21,22]}],"summary":["Cytat (quotation): dokładne słowa w cudzysłowie, przecinek przed zamknięciem: 'I'm starving,' said the lion. Mowa zależna: relacja bez cudzysłowu, ze zmianą zaimków, czasów i okoliczników.","say (to somebody) that…, ale tell somebody that… – po tell zawsze stoi osoba, bez to.","Po said/told/asked cofamy czasy o krok (is → was, did/has done → had done, will → would, can → could); obowiązkowo, gdy treść jest już nieaktualna, opcjonalnie, gdy wciąż jest prawdziwa (fakty, aktualne sytuacje).","Okoliczniki przy relacji po czasie: tomorrow → the next day, yesterday → the day before, ago → before, here → there, now → then.","Pytania zależne: if/whether albo słowo pytające + szyk oznajmujący, bez do/did i bez znaku zapytania."],"sections":[{"ref":"50.1","page":222,"title":"Cytat (mowa niezależna) i mowa zależna","rule":"Cytat (direct speech) oddaje dokładne słowa i ożywia opowiadanie; w brytyjskim angielskim zwykle stoi w pojedynczym cudzysłowie, a przecinek lub kropka są przed jego zamknięciem. W rozmowie częściej relacjonujemy słowa w mowie zależnej (reported speech): bez cudzysłowu, ze zmianą zaimków, czasów i określeń czasu.","examples":[{"en":"'I can't find my keys anywhere,' Wojtek muttered.","pl":"– Nigdzie nie mogę znaleźć kluczy – mruknął Wojtek.","note":"cytat: przecinek przed zamknięciem cudzysłowu"},{"en":"Wojtek said he couldn't find his keys anywhere.","pl":"Wojtek powiedział, że nigdzie nie może znaleźć kluczy.","note":"mowa zależna: zmiana zaimka i cofnięcie czasu (can't → couldn't)"}],"pitfalls":[{"wrong":"„I'm tired”, said Ola.","right":"'I'm tired,' said Ola.","why":"w angielskim cudzysłów ' ' lub \" \" (nie polskie „ ”), a przecinek stoi przed zamknięciem cudzysłowu"}],"slides":[{"pres":"II-3","slide":22}]},{"ref":"50.2","page":222,"title":"say i tell; that; przeczenia","rule":"Najczęstsze czasowniki relacjonujące to **say** i **tell**: say (to somebody) that…, ale **tell somebody** that… – po tell zawsze stoi osoba, bez to. **that** po say i tell zwykle można pominąć (raczej nie po reply, answer, respond; po shout prawie nigdy). Przeczenie zostaje w relacjonowanym zdaniu (She said she hadn't seen it), ale przy think, expect, plan, intend przeczymy czasownik relacjonujący: I didn't think he would come.","examples":[{"en":"Kinga told me she was moving to Wrocław.","pl":"Kinga powiedziała mi, że przeprowadza się do Wrocławia.","note":"tell + osoba; that pominięte"},{"en":"Kinga said (to me) that she was moving to Wrocław.","pl":"Kinga powiedziała (mi), że przeprowadza się do Wrocławia.","note":"say + (to + osoba)"},{"en":"I didn't expect that the lecture would be cancelled.","pl":"Nie spodziewałem się, że wykład zostanie odwołany.","note":"przy expect przeczenie stoi przy czasowniku relacjonującym"}],"pitfalls":[{"wrong":"Kinga told that she was moving.","right":"Kinga said that she was moving.","why":"po tell musi stać osoba (told me/us); bez osoby → said"},{"wrong":"He said me that he was busy.","right":"He told me that he was busy.","why":"say nie łączy się bezpośrednio z osobą: said to me albo told me"}],"slides":[{"pres":"II-3","slide":22}]},{"ref":"50.3","page":222,"title":"Inne czasowniki relacjonujące","rule":"Zamiast ciągłego said często używamy czasowników, które oddają cel wypowiedzi: **advise, warn, threaten, promise, offer, admit, deny, complain**. W opowiadaniach i stylu formalnym brzmią naturalniej; łączą się z różnymi konstrukcjami (promise to…, warn somebody not to…, deny doing…; 50.4–50.6).","examples":[{"en":"'Don't swim beyond the buoys!' → The lifeguard warned us not to swim beyond the buoys.","pl":"Ratownik ostrzegł nas, żebyśmy nie wypływali za boje.","note":"warn somebody not to + bezokolicznik"},{"en":"'I'll pay you back on Friday.' → Ksawery promised to pay me back on Friday.","pl":"Ksawery obiecał, że odda mi pieniądze w piątek.","note":"promise to + bezokolicznik"}],"pitfalls":[],"slides":[{"pres":"II-3","slide":22}]},{"ref":"51.1","page":226,"title":"Kiedy nie cofamy czasu","rule":"Czasu nie cofamy, gdy czasownik relacjonujący jest w czasie teraźniejszym (Ola says she's tired), gdy w oryginale jest już Past Perfect (zostaje Past Perfect) oraz gdy wypowiedź zawiera nierzeczywistą przeszłość, np. po wish (I wish I were… → she said she wished she were…).","examples":[{"en":"Jacek says he's going to be late again.","pl":"Jacek mówi, że znowu się spóźni.","note":"says (czas teraźniejszy) → bez cofania czasu"},{"en":"'We had already eaten.' → They said they had already eaten.","pl":"Powiedzieli, że już jedli.","note":"Past Perfect zostaje bez zmian"}],"pitfalls":[],"slides":[{"pres":"II-3","slide":22}]},{"ref":"51.2","page":226,"title":"Cofanie czasów (backshift) – kiedy obowiązkowe","rule":"Po czasowniku relacjonującym w przeszłości (said, told, asked) zwykle cofamy czasy o krok: Present Simple → Past Simple, Present Continuous → Past Continuous, Present Perfect i Past Simple → Past Perfect, will → would, can → could. Cofnięcie jest **obowiązkowe**, gdy treść wypowiedzi jest już nieaktualna albo uważamy ją za nieprawdziwą.","examples":[{"en":"'I'm training for a marathon.' → My cousin said she was training for a marathon.","pl":"Kuzynka powiedziała, że trenuje do maratonu.","note":"Present Continuous → Past Continuous"},{"en":"Szymon told me he was free on Saturday, but in the end he had to work.","pl":"Szymon powiedział mi, że w sobotę ma wolne, ale ostatecznie musiał pracować.","note":"informacja okazała się nieaktualna → cofnięcie obowiązkowe"},{"en":"'I've never been abroad.' → Ela admitted that she had never been abroad.","pl":"Ela przyznała, że nigdy nie była za granicą.","note":"Present Perfect → Past Perfect"}],"pitfalls":[{"wrong":"Last month Kuba told me he lives in Słupsk, but he's just moved to Koszalin.","right":"Last month Kuba told me he lived in Słupsk, but he's just moved to Koszalin.","why":"informacja jest już nieaktualna → cofnięcie czasu obowiązkowe"}],"slides":[{"pres":"II-3","slide":22}]},{"ref":"51.3","page":226,"title":"Cofanie czasów – kiedy nie jest konieczne","rule":"Czasu nie musimy cofać, gdy relacjonowana sytuacja wciąż trwa lub ma dopiero nastąpić, gdy mówimy o fakcie, który się nie zmienia, oraz w zdaniu po spójniku czasu (when, after). We wszystkich tych przypadkach cofnięcie czasu też jest poprawne; wybór często zależy od tego, ile czasu minęło od wypowiedzi.","examples":[{"en":"Marta said she's still looking for a flatmate.","pl":"Marta mówiła, że wciąż szuka współlokatora.","note":"sytuacja nadal aktualna → bez cofania (was still looking też poprawne)"},{"en":"Our teacher explained that light travels faster than sound.","pl":"Nauczyciel wyjaśnił, że światło porusza się szybciej niż dźwięk.","note":"fakt → bez cofania (travelled też poprawne)"}],"pitfalls":[],"slides":[{"pres":"II-3","slide":22}]},{"ref":"51.4","page":227,"title":"Zmiany okoliczników czasu i miejsca","rule":"Gdy relacjonujemy w innym miejscu lub czasie, zmieniamy okoliczniki: now → then, here → there, today → that day, tomorrow → **the next day**, yesterday → **the day before**, ago → **before**, last Monday → the previous Monday. Jeśli relacjonujemy tego samego dnia i w tym samym miejscu, okoliczniki mogą zostać bez zmian.","examples":[{"en":"'I'll leave the keys here tomorrow.' → Our landlord said he would leave the keys there the next day.","pl":"Właściciel mieszkania powiedział, że zostawi tam klucze następnego dnia.","note":"here → there, tomorrow → the next day"},{"en":"'I sent it a week ago.' → He insisted that he had sent it a week before.","pl":"Upierał się, że wysłał to tydzień wcześniej.","note":"ago → before; Past Simple → Past Perfect"}],"pitfalls":[{"wrong":"Last Monday Ewa said she would call me tomorrow.","right":"Last Monday Ewa said she would call me the next day.","why":"relacjonujemy po czasie → tomorrow zmienia się na the next day"}],"slides":[{"pres":"II-3","slide":22}]},{"ref":"51.5","page":227,"title":"Czasowniki modalne w mowie zależnej","rule":"**will → would, can → could, may → might**, shall → would (przyszłość) albo should (propozycja); **must** zostaje albo zmienia się w **had to**. Bez zmian zostają: would, could, might, should, ought to, used to, need.","examples":[{"en":"'You can borrow my bike.' → Maciek said I could borrow his bike.","pl":"Maciek powiedział, że mogę pożyczyć jego rower.","note":"can → could"},{"en":"'We must leave before ten.' → Gosia said we had to leave before ten.","pl":"Gosia powiedziała, że musimy wyjść przed dziesiątą.","note":"must → had to (albo must)"}],"pitfalls":[],"slides":[{"pres":"II-3","slide":22}]},{"ref":"52.1","page":230,"title":"Pytania w mowie zależnej","rule":"W pytaniu zależnym szyk jest jak w zdaniu oznajmującym (podmiot przed czasownikiem), bez do/does/did, a na końcu stoi kropka. Pytania tak/nie wprowadzamy przez **if** lub **whether**, pytania szczegółowe – słowem pytającym (what, where, when…). Czasy cofamy tak samo jak w zdaniach oznajmujących.","examples":[{"en":"'Where do you live?' → The officer asked me where I lived.","pl":"Policjant zapytał mnie, gdzie mieszkam.","note":"szyk oznajmujący, bez do"},{"en":"'Are you coming tonight?' → Lena asked whether I was coming that night.","pl":"Lena zapytała, czy przyjdę tego wieczoru.","note":"pytanie tak/nie → whether/if; tonight → that night"}],"pitfalls":[{"wrong":"She asked me where did I buy my jacket.","right":"She asked me where I had bought my jacket.","why":"w pytaniu zależnym nie ma did, a szyk jest oznajmujący; Past Simple → Past Perfect (albo bez zmiany: where I bought)"},{"wrong":"He asked me if I am ready?","right":"He asked me if I was ready.","why":"pytanie zależne kończy się kropką; po asked zwykle cofamy czas"}],"slides":[{"pres":"II-3","slide":22}]}],"uses":[{"tense":"Past Simple","no":null,"use":"reported speech – backshift of Present Simple","usePl":"mowa zależna: Present Simple → Past Simple","example":"'I work nights.' → Ola said she worked nights.","ref":"51.2","slide":{"pres":"II-3","slide":22}},{"tense":"Past Continuous","no":null,"use":"reported speech – backshift of Present Continuous","usePl":"mowa zależna: Present Continuous → Past Continuous","example":"'I'm looking for a flat.' → Tomek said he was looking for a flat.","ref":"51.2","slide":{"pres":"II-3","slide":22}},{"tense":"Past Perfect","no":null,"use":"reported speech – backshift of Past Simple and Present Perfect","usePl":"mowa zależna: Past Simple / Present Perfect → Past Perfect","example":"'I've lost my keys.' → Ania told me she had lost her keys.","ref":"51.2","slide":{"pres":"II-3","slide":22}},{"tense":"would","no":null,"use":"reported speech – will becomes would","usePl":"mowa zależna: will → would","example":"'I'll be late.' → Kuba said he would be late.","ref":"51.5","slide":{"pres":"II-3","slide":22}}],"quiz":[{"id":"ureported-01","type":"gap","prompt":"Last year Kalina told me she ___ (not / eat) meat, but now she's crazy about burgers.","answers":["didn't eat","did not eat"],"explain":"Informacja jest już nieaktualna (now she's crazy about burgers) → cofnięcie czasu obowiązkowe: Present Simple → Past Simple.","ref":"51.2"},{"id":"ureported-02","type":"choice","prompt":"On Monday Bartek said, 'I'll give the book back tomorrow.' On Friday I complained to Ola: 'Bartek said he would give the book back ___, and I still haven't got it.'","options":["tomorrow","the next day","yesterday"],"answer":1,"explain":"Relacjonujemy kilka dni później → tomorrow zmienia się na the next day.","ref":"51.4"},{"id":"ureported-03","type":"choice","prompt":"Our lecturer ___ us that the test had been moved to Thursday.","options":["said","told","explained"],"answer":1,"explain":"Po luce stoi osoba (us) bez to → tell. Said i explained wymagałyby to us.","ref":"50.2"},{"id":"ureported-04","type":"fix","prompt":"Kasia told that she was moving to Gdańsk.","wrong":"told","fixes":["said","told me","told us"],"answers":["Kasia said that she was moving to Gdańsk.","Kasia told me that she was moving to Gdańsk.","Kasia told us that she was moving to Gdańsk."],"explain":"Po tell musi stać osoba (told me/us); bez osoby używamy said.","ref":"50.2"},{"id":"ureported-05","type":"choice","prompt":"The receptionist asked me ___.","options":["where I was staying","where was I staying","where did I stay"],"answer":0,"explain":"Pytanie zależne: słowo pytające + szyk oznajmujący (I was staying), bez did i bez inwersji.","ref":"52.1"},{"id":"ureported-06","type":"gap","prompt":"'Have you finished your essay?' → Last Friday my tutor asked me if I ___ (finish) my essay.","answers":["had finished","'d finished"],"explain":"Pytanie tak/nie → if + szyk oznajmujący; Present Perfect z pytania (Have you finished…?) cofamy do Past Perfect.","ref":"52.1"},{"id":"ureported-07","type":"choice","prompt":"Our geography teacher told us that the Vistula ___ into the Baltic Sea. Która forma jest poprawna?","options":["tylko flows","tylko flowed","obie: flows i flowed"],"answer":2,"explain":"Fakt, który się nie zmienia → cofnięcie czasu nie jest konieczne (flows), ale cofnięcie (flowed) też jest poprawne.","ref":"51.3"},{"id":"ureported-08","type":"choice","prompt":"Kuba said he ___ coming to the party, but in the end he stayed at home.","options":["was","is"],"answer":0,"explain":"Zapowiedź się nie sprawdziła, więc cofnięcie czasu jest obowiązkowe.","ref":"51.2"},{"id":"ureported-09","type":"gap","prompt":"'I'll send you the slides tonight,' said Dr Nowak. → Dr Nowak promised that she ___ (send) us the slides that night.","answers":["would send","'d send"],"explain":"will → would; tonight → that night.","ref":"51.5"},{"id":"ureported-10","type":"fix","prompt":"She asked me what did I think of the new timetable.","wrong":"what did I think","fixes":["what I thought","what I think"],"answers":["She asked me what I thought of the new timetable.","She asked me what I think of the new timetable."],"explain":"W pytaniu zależnym nie ma did, a szyk jest oznajmujący: what I thought (albo what I think, jeśli opinia jest wciąż aktualna – 51.3).","ref":"52.1"}],"translations":[{"id":"ureported-t01","pl":"Powiedziała mi, że nigdy wcześniej nie była w Gdańsku.","answers":["She told me she had never been to Gdańsk before.","She told me that she had never been to Gdańsk before."],"keys":["told me|said to me","had never been"],"explain":"tell + osoba; Present Perfect z oryginału (I've never been) → Past Perfect.","ref":"51.2"},{"id":"ureported-t02","pl":"Zapytał mnie, gdzie mieszkam.","answers":["He asked me where I lived.","He asked me where I was living.","He asked me where I live."],"keys":["asked me where i"],"explain":"Pytanie zależne: szyk oznajmujący, bez did; „mieszkam” → lived (cofnięcie). Jeśli nadal tam mieszkasz, możliwe też where I live (51.3).","ref":"52.1"},{"id":"ureported-t03","pl":"Obiecali, że zadzwonią następnego dnia.","answers":["They promised they would call the next day.","They promised that they would ring the following day."],"keys":["promised","would|to call|to ring|to phone"],"explain":"will → would (albo promised to call, 50.3); „następnego dnia” → the next day albo the following day.","ref":"51.4"},{"id":"ureported-t04","pl":"Zapytałam go, czy lubi jazz.","answers":["I asked him if he liked jazz.","I asked him whether he liked jazz."],"keys":["asked him","liked|likes"],"explain":"Pytanie tak/nie → if/whether + szyk oznajmujący; „lubi” → liked (cofnięcie czasu), a jeśli to wciąż prawda, możliwe też likes (51.3).","ref":"52.1"}],"pairs":[{"id":"say-vs-tell","title":"say czy tell?","a":{"name":"say","when":"say (something) (to somebody) (that)…; osoba tylko z to","example":"Ola said (to me) that she was exhausted."},"b":{"name":"tell","when":"tell somebody (that)… – osoba zawsze, bez to; też tell a story / the truth / a lie / a joke","example":"Ola told me (that) she was exhausted."},"tip":"Jeśli po czasowniku od razu stoi osoba (me, us, Kasia) → tell; jeśli nie ma osoby albo jest to + osoba → say.","refs":["50.2"],"quiz":["ureported-03","ureported-04"]},{"id":"backshift-obligatory-vs-optional","title":"Cofać czas czy nie?","a":{"name":"cofamy (backshift)","when":"po said/told/asked w przeszłości – zawsze, gdy treść jest już nieaktualna lub nieprawdziwa; zwykle też wtedy, gdy relacjonujemy po dłuższym czasie","example":"Kuba said he was coming, but he stayed at home."},"b":{"name":"nie musimy cofać","when":"czasownik relacjonujący w teraźniejszym (says), oryginał w Past Perfect, fakty i sytuacje wciąż aktualne, zdanie po when/after","example":"Ania says she's coming. / Our guide said the castle dates from the 14th century."},"tip":"Po said/told/asked cofnięcie czasu prawie nigdy nie jest błędem (wyjątek: nierzeczywista przeszłość po wish zostaje bez zmian); błędem jest brak cofnięcia, gdy treść jest już nieaktualna.","refs":["51.1","51.2","51.3"],"quiz":["ureported-01","ureported-07","ureported-08"]}],"signals":[{"word":"the next day / the following day","tenses":["would","Past Continuous"],"example":"Ania said she would call me the next day.","note":"W relacji po czasie: tomorrow → the next day, yesterday → the day before, last week → the previous week. Gdy relacjonujemy tego samego dnia, tomorrow zostaje.","ref":"51.4"},{"word":"the day before / … before","tenses":["Past Perfect"],"example":"He told me he had sent the parcel two days before.","note":"yesterday → the day before, ago → before; czas zwykle cofamy do Past Perfect.","ref":"51.4"},{"word":"asked if / whether","tenses":["Past Simple","Past Perfect"],"example":"The landlord asked whether we had paid the bills.","note":"Pytanie tak/nie w mowie zależnej: if/whether + szyk zdania oznajmującego, bez do/did i bez znaku zapytania.","ref":"52.1"}]}},"story":{"id":"story-past","title":"The seagull of Kołobrzeg pier","intro":"Uzupełnij luki właściwą formą czasownika z nawiasu. Tekst ćwiczy to, czego wymaga zadanie „The hungry lion” (slajd II/3 22): Past Simple, Past Continuous, Past Perfect, Past Perfect Continuous, used to, would i was/were going to, a także cytat i mowę zależną. Jeśli poprawnych jest kilka form, każda jest zaliczana.","text":"Not so long ago, a fat grey seagull called Gustaw [[1|rule]] the pier in Kołobrzeg. He [[2|not / use to / share]] anything with anyone, and every morning he [[3|perch]] on the same lamp post, eyeing the tourists' chips.\n\nOne August afternoon, Gustaw [[4|circle]] above the crowd when he noticed a girl with an enormous portion of fish and chips. He was starving: he [[5|not / eat]] anything since dawn, because a gang of younger gulls [[6|chase]] him away from the bins all morning. He [[7|snatch]] the whole tray, but just then the girl looked up and smiled. 'You look even hungrier than I am,' she said. Gustaw froze. Nobody [[8|ever / speak]] to him so kindly before.\n\nThe girl [[9|tear]] off a piece of fish and held it out on her palm. That evening she told her mother that a seagull [[10|eat]] out of her hand, but her mother said she [[11|not / believe]] a word of it.\n\nFrom then on, Gustaw [[12|wait]] for the girl by the lighthouse every afternoon, and by the end of the holidays they [[13|become]] inseparable. The girl [[14|leave]] for Warsaw on the last day of August and never came back. At sunset Gustaw [[15|still / sit]] on his lamp post, staring at the road. The younger gulls say he still looks for her every summer.","gaps":[{"n":1,"answers":["used to rule","ruled"],"explain":"Sytuacja z przeszłości, której już nie ma → used to rule; poprawny też Past Simple (ruled).","ref":"21.5"},{"n":2,"answers":["didn't use to share","did not use to share","used not to share"],"explain":"Przeczenie used to: didn't use to + bezokolicznik (po did bez -d); bardziej formalnie used not to share.","ref":"21.5"},{"n":3,"answers":["would perch","'d perch","used to perch","perched"],"explain":"Powtarzana czynność w przeszłości z podanym kontekstem (every morning) → would; poprawne też used to i Past Simple.","ref":"21.5"},{"n":4,"answers":["was circling","had been circling"],"explain":"Czynność w toku przerwana zdarzeniem (when he noticed) → Past Continuous; had been circling też możliwe (krążył już od jakiegoś czasu).","ref":"21.3"},{"n":5,"answers":["hadn't eaten","had not eaten"],"explain":"Brak czynności aż do momentu w przeszłości (since dawn) → Past Perfect Simple.","ref":"22.1"},{"n":6,"answers":["had been chasing"],"explain":"Czynność powtarzana przez cały ranek, która jest przyczyną głodu → Past Perfect Continuous.","ref":"22.3"},{"n":7,"answers":["was going to snatch","was about to snatch"],"explain":"Zamiar, który się nie spełnił (but just then…) → was going to; was about to też pasuje.","ref":"29.1"},{"n":8,"answers":["had ever spoken"],"explain":"Doświadczenie do momentu w przeszłości (before) → Past Perfect z ever.","ref":"22.1"},{"n":9,"answers":["tore"],"explain":"Sekwencja czynności (tore… held…) → Past Simple.","ref":"21.1"},{"n":10,"answers":["had eaten","ate"],"explain":"Mowa zależna: Past Simple z wypowiedzi (A seagull ate…) cofamy do Past Perfect; Past Simple też jest możliwy, bo kolejność jest jasna.","ref":"51.2"},{"n":11,"answers":["didn't believe","did not believe"],"explain":"Mowa zależna: Present Simple (I don't believe…) → Past Simple.","ref":"51.2"},{"n":12,"answers":["would wait","used to wait","waited","was waiting"],"explain":"Powtarzana czynność (every afternoon) → would; poprawne też used to i Past Simple, a was waiting podkreśla, że trwało to tylko przez wakacje (21.2).","ref":"21.5"},{"n":13,"answers":["had become","'d become"],"explain":"by the end of the holidays → stan osiągnięty przed tym momentem → Past Perfect.","ref":"22.1"},{"n":14,"answers":["left"],"explain":"Zakończone zdarzenia po kolei (left… and never came back) z podanym czasem → Past Simple.","ref":"21.1"},{"n":15,"answers":["was still sitting"],"explain":"Czynność w toku w danym momencie (at sunset) → Past Continuous.","ref":"21.2"}]},"slides":{"II-1":[{"n":1,"html":"<p>II/1 Present tenses<\/p>","text":"II/1 Present tenses"},{"n":2,"html":"<p>Film z YouTube (Pearson): „There's something new coming to grammar…” (zapowiedź MyGrammarLab).<\/p>","text":"Film z YouTube (Pearson): „There's something new coming to grammar…” (zapowiedź MyGrammarLab)."},{"n":3,"html":"<p>MyGrammarLab for classroom use. Okładka: MyGrammarLab Advanced C1/C2, www.mygrammarlab.com, Mark Foley, Diane Hall, Pearson, „suitable for self study”.<\/p>","text":"MyGrammarLab for classroom use. Okładka: MyGrammarLab Advanced C1/C2, www.mygrammarlab.com, Mark Foley, Diane Hall, Pearson, „suitable for self study”."},{"n":4,"html":"<p>Skala ocen:<\/p><div class=\"tw\"><table><thead><tr><th>Wynik<\/th><th>Ocena<\/th><\/tr><\/thead><tbody><tr><td>91–100%<\/td><td>5,0<\/td><\/tr><tr><td>81–90%<\/td><td>4,5<\/td><\/tr><tr><td>71–80%<\/td><td>4,0<\/td><\/tr><tr><td>61–70%<\/td><td>3,5<\/td><\/tr><tr><td>51–60%<\/td><td>3,0<\/td><\/tr><tr><td>0–50%<\/td><td>2,0<\/td><\/tr><\/tbody><\/table><\/div>","text":"Skala ocen: Wynik Ocena 91–100% 5,0 81–90% 4,5 71–80% 4,0 61–70% 3,5 51–60% 3,0 0–50% 2,0"},{"n":5,"html":"<p>Syllabus:<\/p><div class=\"tw\"><table><thead><tr><th>Nr<\/th><th>Temat<\/th><th>Module<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Tenses<\/td><td>5, 6<\/td><\/tr><tr><td>2<\/td><td>Modal verbs<\/td><td>7<\/td><\/tr><tr><td>3<\/td><td>Passive voice<\/td><td>14<\/td><\/tr><tr><td>4<\/td><td>Word order and verb patterns<\/td><td>9<\/td><\/tr><\/tbody><\/table><\/div>","text":"Syllabus: Nr Temat Module 1 Tenses 5, 6 2 Modal verbs 7 3 Passive voice 14 4 Word order and verb patterns 9"},{"n":6,"html":"<p>Start with ex. 3 page 89<\/p>","text":"Start with ex. 3 page 89"},{"n":7,"html":"<p>Unit 19 Auxiliaries and HAVE GOT<\/p>","text":"Unit 19 Auxiliaries and HAVE GOT"},{"n":8,"html":"<p>Verbs such as DO/BE/HAVE can function both as main verbs and auxiliary verbs:<\/p>","text":"Verbs such as DO/BE/HAVE can function both as main verbs and auxiliary verbs:"},{"n":9,"html":"<p>Tabela:<\/p><div class=\"tw\"><table><thead><tr><th>MAIN<\/th><th>AUXILIARY<\/th><\/tr><\/thead><tbody><tr><td>They are gone.<\/td><td>They are still sleeping.<\/td><\/tr><tr><td>They will do it tomorrow.<\/td><td>When do you sleep?<\/td><\/tr><tr><td>I have more than 10 questions.<\/td><td>I have just left.<\/td><\/tr><\/tbody><\/table><\/div>","text":"Tabela: MAIN AUXILIARY They are gone. They are still sleeping. They will do it tomorrow. When do you sleep? I have more than 10 questions. I have just left."},{"n":10,"html":"<p>ex. 2 p.92<\/p>","text":"ex. 2 p.92"},{"n":11,"html":"<p>HAVE. Tabela HAVE / HAVE GOT – both can be used for:<\/p><ul><li>possession – I have (got) a car.<\/li><li>relationships – I have (got) two younger brothers.<\/li><li>illnesses – She has (got) a slight limp. I have (got) flu.<\/li><li>obligation – I have (got) to go.<\/li><\/ul><p>Na czerwono: <strong>We don't use have got in past or future tenses.<\/strong><\/p>","text":"HAVE. Tabela HAVE / HAVE GOT – both can be used for: - possession – I have (got) a car. - relationships – I have (got) two younger brothers. - illnesses – She has (got) a slight limp. I have (got) flu. - obligation – I have (got) to go. Na czerwono: We don't use have got in past or future tenses."},{"n":12,"html":"<p>EX. 3, 4 p.93<\/p>","text":"EX. 3, 4 p.93"},{"n":13,"html":"<p>Unit 20 Present Continous [sic] or Present Simple?<\/p>","text":"Unit 20 Present Continous [sic] or Present Simple?"},{"n":14,"html":"<p>USES of Present Continuous<\/p>","text":"USES of Present Continuous"},{"n":15,"html":"<p>Uses of Present Continuous:<\/p><ol><li>action at the time of speaking – I'm waiting.<\/li><li>temporary situation – I'm reading an interesting book.<\/li><li>regular action around a point of time – At 9.50 on Saturdays we are always discussing grammar.<\/li><li>future arrangements – I'm getting married this summer.<\/li><li>emphasising a very frequent action – She's always coming late!<\/li><li>setting the scene, telling a plot – I'm sitting at home, reading a book when suddenly the door opens and he comes in!<\/li><li>gradual change – It's getting late.<\/li><\/ol>","text":"Uses of Present Continuous: 1. action at the time of speaking – I'm waiting. 2. temporary situation – I'm reading an interesting book. 3. regular action around a point of time – At 9.50 on Saturdays we are always discussing grammar. 4. future arrangements – I'm getting married this summer. 5. emphasising a very frequent action – She's always coming late! 6. setting the scene, telling a plot – I'm sitting at home, reading a book when suddenly the door opens and he comes in! 7. gradual change – It's getting late."},{"n":16,"html":"<p>USES of Present Simple<\/p>","text":"USES of Present Simple"},{"n":17,"html":"<p>Uses of Present Simple (1–7):<\/p><ol><li>habits/routines – I usually get up before 7.<\/li><li>permament [sic] situations – I live in Koszalin.<\/li><li>instructions – You press the eject button and then you put the CD in.<\/li><li>public timetables/schedules – The bus leaves at 10, don't be late.<\/li><li>scientific facts – Water boils at 100 dergees [sic].<\/li><li>sports commentary – rapid actions – Lewandowski passes the ball to Świderski…<\/li><li>newspaper headlines – Two boys die in a crash.<\/li><\/ol>","text":"Uses of Present Simple (1–7): 1. habits/routines – I usually get up before 7. 2. permament [sic] situations – I live in Koszalin. 3. instructions – You press the eject button and then you put the CD in. 4. public timetables/schedules – The bus leaves at 10, don't be late. 5. scientific facts – Water boils at 100 dergees [sic]. 6. sports commentary – rapid actions – Lewandowski passes the ball to Świderski… 7. newspaper headlines – Two boys die in a crash."},{"n":18,"html":"<p>Uses of Present Simple (8–12):<\/p><ol start=\"8\"><li>reporting verbs – Peter tells me you're getting married.<\/li><li>future time clauses – I will help you when I finish my shift.<\/li><li>jokes – A man comes into a bar and says…<\/li><li>fictional plots – When Jane meets a new man in Paris, she…<\/li><li>stative verbs – I love him. / I understand.<\/li><\/ol>","text":"Uses of Present Simple (8–12): 8. reporting verbs – Peter tells me you're getting married. 9. future time clauses – I will help you when I finish my shift. 10. jokes – A man comes into a bar and says… 11. fictional plots – When Jane meets a new man in Paris, she… 12. stative verbs – I love him. / I understand."},{"n":19,"html":"<p>Ex. 1, 2, 3, 4 pp. 96, 97<\/p>","text":"Ex. 1, 2, 3, 4 pp. 96, 97"}],"II-2":[{"n":1,"html":"<p>Present tenses and Past Simple, II/2<\/p>","text":"Present tenses and Past Simple, II/2"},{"n":2,"html":"<p>START with exercise 1 page 108<\/p>","text":"START with exercise 1 page 108"},{"n":3,"html":"<p>Present Perfect and Past Simple part 1<\/p>","text":"Present Perfect and Past Simple part 1"},{"n":4,"html":"<p>Tabela:<\/p><div class=\"tw\"><table><thead><tr><th>Present Perfect<\/th><th>Past Simple<\/th><\/tr><\/thead><tbody><tr><td>no time of the action given – I<strong>'ve been<\/strong> to Greece.<\/td><td>the time of the action given – I <strong>visited<\/strong> Greece in 2015.<\/td><\/tr><tr><td>ongoing actions and situations that started in the past and continue up till now – The building <strong>has stood<\/strong> here for 30 years.<\/td><td>finished actions/states – The building <strong>stood<\/strong> here for 30 years and then they pulled it down.<\/td><\/tr><tr><td>present result/relevance – He <strong>has had<\/strong> an accident.<\/td><td>no present result – He <strong>had<\/strong> an accident.<\/td><\/tr><tr><td>actions which can be repeated – Olga Tokarczuk <strong>has won<\/strong> the Nobel Prize.<\/td><td>actions which can't be repeated – Czesław Miłosz <strong>won<\/strong> the Nobel Prize.<\/td><\/tr><tr><td>this week/month/year/today – I haven't seen him today.<\/td><td>this week/month/year/today – I didn't see him today.<\/td><\/tr><\/tbody><\/table><\/div>","text":"Tabela: Present Perfect Past Simple no time of the action given – I've been to Greece. the time of the action given – I visited Greece in 2015. ongoing actions and situations that started in the past and continue up till now – The building has stood here for 30 years. finished actions/states – The building stood here for 30 years and then they pulled it down. present result/relevance – He has had an accident. no present result – He had an accident. actions which can be repeated – Olga Tokarczuk has won the Nobel Prize. actions which can't be repeated – Czesław Miłosz won the Nobel Prize. this week/month/year/today – I haven't seen him today. this week/month/year/today – I didn't see him today."},{"n":5,"html":"<p>Present Perfect and Past Simple part 2<\/p>","text":"Present Perfect and Past Simple part 2"},{"n":6,"html":"<p>Tabela:<\/p><div class=\"tw\"><table><thead><tr><th>Present Perfect<\/th><th>Past Simple<\/th><\/tr><\/thead><tbody><tr><td>since / for / just / already / yet / still / recently / lately / ever<\/td><td>ago / last week, etc.<\/td><\/tr><tr><td>superlatives/ordinal numbers – This is the <strong>best<\/strong> book <strong>I've ever read<\/strong>. This is <strong>the fifth<\/strong> coffee I <strong>have drunk<\/strong> today.<\/td><td>than I thought/expected<\/td><\/tr><\/tbody><\/table><\/div><p>Pod tabelą: I haven't seen him <strong>SINCE<\/strong> he left our city. / <strong>SINCE<\/strong> he left our city, I haven't seen him.<\/p>","text":"Tabela: Present Perfect Past Simple since / for / just / already / yet / still / recently / lately / ever ago / last week, etc. superlatives/ordinal numbers – This is the best book I've ever read. This is the fifth coffee I have drunk today. than I thought/expected Pod tabelą: I haven't seen him SINCE he left our city. / SINCE he left our city, I haven't seen him."},{"n":7,"html":"<p>How would you translate the following? Od kiedy Cię poznałem, zawsze jesteś dla mnie dobry.<\/p>","text":"How would you translate the following? Od kiedy Cię poznałem, zawsze jesteś dla mnie dobry."},{"n":8,"html":"<p>Since I met you, you've always been good to me.<\/p>","text":"Since I met you, you've always been good to me."},{"n":9,"html":"<p>And what about the following? Od kiedy Cię znam, zawsze byłeś dla mnie dobry.<\/p>","text":"And what about the following? Od kiedy Cię znam, zawsze byłeś dla mnie dobry."},{"n":10,"html":"<p>Since I've known you, you've always been good to me.<\/p>","text":"Since I've known you, you've always been good to me."},{"n":11,"html":"<p>Since I met you, / Since I've known you, / you've been good to me.<\/p>","text":"Since I met you, / Since I've known you, / you've been good to me."},{"n":12,"html":"<p>Since I (become) a teacher, I have taught hundreds of students. / Since I (be) a teacher, I have taught hundreds of students.<\/p>","text":"Since I (become) a teacher, I have taught hundreds of students. / Since I (be) a teacher, I have taught hundreds of students."},{"n":13,"html":"<p>Since I <strong>became<\/strong> a teacher, I have taught hundreds of students. / Since I <strong>have been<\/strong> a teacher, I have taught hundreds of students. (odpowiedzi wyróżnione na czerwono)<\/p>","text":"Since I became a teacher, I have taught hundreds of students. / Since I have been a teacher, I have taught hundreds of students. (odpowiedzi wyróżnione na czerwono)"},{"n":14,"html":"<p>Exercises 2 and 3 page 109<\/p>","text":"Exercises 2 and 3 page 109"},{"n":15,"html":"<p>Exercise 1 page 111<\/p>","text":"Exercise 1 page 111"},{"n":16,"html":"<p>Present Perfect Continuous and Present Perfect Simple<\/p>","text":"Present Perfect Continuous and Present Perfect Simple"},{"n":17,"html":"<p>Tabela:<\/p><div class=\"tw\"><table><thead><tr><th>Present Perfect Continuous<\/th><th>Present Perfect Simple<\/th><\/tr><\/thead><tbody><tr><td>focus on duration – I have been waiting here for ages.<\/td><td>focus on result – I have read this book. (you can have it)<\/td><\/tr><tr><td>repeated actions (no number of times given) – I've been phoning him all morning.<\/td><td>repeated actions (we know how many times) – I've phoned him 3 times this morning.<\/td><\/tr><tr><td>temporary situation – People have been eating less meat recently because of the crisis.<\/td><td>permanent situation – People have eaten less meat over the last 20 years.<\/td><\/tr><tr><td>action not finished – I've been reading this book.<\/td><td>action finished – I've read this book.<\/td><\/tr><\/tbody><\/table><\/div>","text":"Tabela: Present Perfect Continuous Present Perfect Simple focus on duration – I have been waiting here for ages. focus on result – I have read this book. (you can have it) repeated actions (no number of times given) – I've been phoning him all morning. repeated actions (we know how many times) – I've phoned him 3 times this morning. temporary situation – People have been eating less meat recently because of the crisis. permanent situation – People have eaten less meat over the last 20 years. action not finished – I've been reading this book. action finished – I've read this book."},{"n":18,"html":"<p>Exercise 2 page 111<\/p>","text":"Exercise 2 page 111"},{"n":19,"html":"<p>Homework:<\/p><ul><li>Work on stative verbs (unit 25)<\/li><li>Exercises 1, 2, 3 pages 114–115<\/li><\/ul>","text":"Homework: - Work on stative verbs (unit 25) - Exercises 1, 2, 3 pages 114–115"}],"II-3":[{"n":1,"html":"<p>II/3 Past tenses<\/p>","text":"II/3 Past tenses"},{"n":2,"html":"<p>Start with ex. 1 page 100<\/p>","text":"Start with ex. 1 page 100"},{"n":3,"html":"<p>PAST SIMPLE<\/p>","text":"PAST SIMPLE"},{"n":4,"html":"<p>Uses of Past Simple:<\/p><ol><li>completed actions in the past – He went to Britain last year.<\/li><li>two past actions happening at the same time – When I saw her, I smiled.<\/li><li>repeated actions in the past – I talked to him 5 times last week.<\/li><li>a sequence of actions – I woke up at 7, took a shower, had breakfast and left for work.<\/li><li>states in the past – I lived in Poznań for 20 years. Then I moved to Koszalin.<\/li><\/ol>","text":"Uses of Past Simple: 1. completed actions in the past – He went to Britain last year. 2. two past actions happening at the same time – When I saw her, I smiled. 3. repeated actions in the past – I talked to him 5 times last week. 4. a sequence of actions – I woke up at 7, took a shower, had breakfast and left for work. 5. states in the past – I lived in Poznań for 20 years. Then I moved to Koszalin."},{"n":5,"html":"<p><strong>WOULD/USED TO<\/strong> both used for actions in the past – They used to / would get up early at weekends.<br><strong>USED TO<\/strong> also used for states in the past – Lithuania used to be part of the Soviet Union.<\/p>","text":"WOULD/USED TO both used for actions in the past – They used to / would get up early at weekends. USED TO also used for states in the past – Lithuania used to be part of the Soviet Union."},{"n":6,"html":"<p>PAST CONTINUOUS<\/p>","text":"PAST CONTINUOUS"},{"n":7,"html":"<p>Uses of Past Continuous (1–5):<\/p><ol><li>(bez opisu na slajdzie) – While I was cooking dinner, someone knocked on my door.<\/li><li>action in progress at a point of time – Yesterday at 7 we were watching Game of thrones.<\/li><li>temporary situation – At that time I was living in Poznań.<\/li><li>interrupted action – We were discussing past tenses when he came.<\/li><li>gradual change in the past – It was getting dark and I was starting to worry.<\/li><\/ol>","text":"Uses of Past Continuous (1–5): 1. (bez opisu na slajdzie) – While I was cooking dinner, someone knocked on my door. 2. action in progress at a point of time – Yesterday at 7 we were watching Game of thrones. 3. temporary situation – At that time I was living in Poznań. 4. interrupted action – We were discussing past tenses when he came. 5. gradual change in the past – It was getting dark and I was starting to worry."},{"n":8,"html":"<p>Uses of Past Continuous (6–10):<\/p><ol start=\"6\"><li>two simultaneous actions extended in time – While I was cleaning the attic, my husband was cooking dinner.<\/li><li>future arrangement in the past – I couldn't stay at the party as I was taking an important exam the next day.<\/li><li>providing the background to a story<\/li><li>polite, tentative requests – I was wondering if you could…<\/li><li>emphasising a very frequent action – She was always coming late.<\/li><\/ol>","text":"Uses of Past Continuous (6–10): 6. two simultaneous actions extended in time – While I was cleaning the attic, my husband was cooking dinner. 7. future arrangement in the past – I couldn't stay at the party as I was taking an important exam the next day. 8. providing the background to a story 9. polite, tentative requests – I was wondering if you could… 10. emphasising a very frequent action – She was always coming late."},{"n":9,"html":"<p>Exercises 2, 3 pages 100–101<\/p>","text":"Exercises 2, 3 pages 100–101"},{"n":10,"html":"<p>HOMEWORK: Exercise 4 page 101<\/p>","text":"HOMEWORK: Exercise 4 page 101"},{"n":11,"html":"<p>PAST PERFECT CONTINUOUS AND PAST PERFECT SIMPLE<\/p>","text":"PAST PERFECT CONTINUOUS AND PAST PERFECT SIMPLE"},{"n":12,"html":"<p>both used to talk about actions that happened before another action in the past<\/p>","text":"both used to talk about actions that happened before another action in the past"},{"n":13,"html":"<p>Tabela:<\/p><div class=\"tw\"><table><thead><tr><th>Past Perfect Simple<\/th><th>Past Perfect Continuous<\/th><\/tr><\/thead><tbody><tr><td>a single or repeated action before another action in the past – We learned that he <strong>had failed<\/strong> the exam.<\/td><td>an ongoing process/action before another action in the past – He failed because he <strong>hadn't been studying<\/strong>.<\/td><\/tr><tr><td>a situation which existed before a past event – At the time of the trial, James <strong>had been<\/strong> in prison for over 8 months.<\/td><td>repeated actions in the past – She <strong>had been acting<\/strong> for 15 years before she gave up her career in 2013.<\/td><\/tr><tr><td>with HOPE/EXPECT/WANT/PLAN/THINK ABOUT/WISH to talk about past intentions that were unfulfilled – She <strong>had hoped<\/strong> to get a good grade in the test, but she failed to do most tasks correctly.<\/td><td>(puste)<\/td><\/tr><tr><td>with BY THE TIME – By the age of 26 she <strong>had given<\/strong> up her career.<\/td><td>(puste)<\/td><\/tr><\/tbody><\/table><\/div>","text":"Tabela: Past Perfect Simple Past Perfect Continuous a single or repeated action before another action in the past – We learned that he had failed the exam. an ongoing process/action before another action in the past – He failed because he hadn't been studying. a situation which existed before a past event – At the time of the trial, James had been in prison for over 8 months. repeated actions in the past – She had been acting for 15 years before she gave up her career in 2013. with HOPE/EXPECT/WANT/PLAN/THINK ABOUT/WISH to talk about past intentions that were unfulfilled – She had hoped to get a good grade in the test, but she failed to do most tasks correctly. (puste) with BY THE TIME – By the age of 26 she had given up her career. (puste)"},{"n":14,"html":"<p>COMPARE:<\/p><ul><li>Jim called the boys. They <strong>were playing<\/strong> in the garden.<\/li><li>Jim called the boys. They <strong>had been playing<\/strong> in the garden.<\/li><\/ul>","text":"COMPARE: - Jim called the boys. They were playing in the garden. - Jim called the boys. They had been playing in the garden."},{"n":15,"html":"<p>We don't have to use Past Perfect if the sequence of events is clear: I opened the door and let him in.<\/p>","text":"We don't have to use Past Perfect if the sequence of events is clear: I opened the door and let him in."},{"n":16,"html":"<p>After AFTER/BEFORE/AS SOON AS/ WHEN both Past Perfect and Past Simple can be used:<\/p><ul><li>I left the university after I <strong>(ha
