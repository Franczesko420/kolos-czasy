to have a small shop in Kołobrzeg.","why":"posiadanie to stan → used to (albo had), nie would"},{"wrong":"I used to work in a call centre for two years.","right":"I worked in a call centre for two years.","why":"podana długość okresu (for two years) → Past Simple, nie used to"},{"wrong":"I'm not used to get up so early.","right":"I'm not used to getting up so early.","why":"be/get used to (być/przyzwyczajać się) + -ing; used to + bezokolicznik znaczy „kiedyś”"}],"slides":[{"pres":"II-3","slide":5}]}],"uses":[{"tense":"Past Simple","no":1,"use":"completed actions in the past","usePl":"czynności zakończone w przeszłości","example":"We handed in our group project last Friday.","ref":"21.1","slide":{"pres":"II-3","slide":4}},{"tense":"Past Simple","no":2,"use":"two past actions happening at the same time","usePl":"dwie czynności w przeszłości w tym samym momencie","example":"Just as the train pulled in, Maja spotted us on the platform.","ref":"21.1","slide":{"pres":"II-3","slide":4}},{"tense":"Past Simple","no":3,"use":"repeated actions in the past","usePl":"czynności powtarzane w przeszłości (także z liczbą razy)","example":"I changed my thesis topic three times last year.","ref":"21.1","slide":{"pres":"II-3","slide":4}},{"tense":"Past Simple","no":4,"use":"a sequence of actions","usePl":"sekwencja czynności, jedna po drugiej","example":"She grabbed her keys, said goodbye and jumped on her bike.","ref":"21.1","slide":{"pres":"II-3","slide":4}},{"tense":"Past Simple","no":5,"use":"states in the past","usePl":"stany w przeszłości","example":"As a child, Oskar was terrified of dogs.","ref":"21.1","slide":{"pres":"II-3","slide":4}},{"tense":"Past Simple","no":null,"use":"one action resulting in another","usePl":"jedna czynność wywołuje drugą (skutek)","example":"When the bus broke down, we missed the first lecture.","ref":"21.1","slide":null},{"tense":"used to","no":null,"use":"actions in the past (repeated, no longer happening)","usePl":"powtarzane czynności z przeszłości, których już nie ma","example":"We used to cycle to the beach in Mielno every Sunday.","ref":"21.5","slide":{"pres":"II-3","slide":5}},{"tense":"used to","no":null,"use":"states in the past","usePl":"stany z przeszłości, które się zmieniły (tylko used to, nie would)","example":"This café used to be a bookshop.","ref":"21.5","slide":{"pres":"II-3","slide":5}},{"tense":"would","no":null,"use":"actions in the past (repeated, no longer happening)","usePl":"powtarzane czynności z przeszłości (nie stany), zwykle z podanym kontekstem","example":"On winter evenings Grandma would tell us stories about her childhood.","ref":"21.5","slide":{"pres":"II-3","slide":5}},{"tense":"Past Continuous","no":1,"use":"longer action in progress (while …) with a shorter action happening during it (no description on the slide)","usePl":"dłuższa czynność w toku (zwykle z while), w trakcie której zdarzyło się coś krótkiego w Past Simple; na slajdzie bez nazwy","example":"While I was queuing for coffee, someone walked off with my umbrella.","ref":"21.3","slide":{"pres":"II-3","slide":7}},{"tense":"Past Continuous","no":2,"use":"action in progress at a point of time","usePl":"czynność w toku w danym momencie przeszłości","example":"At ten last night we were still rehearsing for the show.","ref":"21.2","slide":{"pres":"II-3","slide":7}},{"tense":"Past Continuous","no":3,"use":"temporary situation","usePl":"sytuacja tymczasowa","example":"In my first year I was sharing a tiny room with two other students.","ref":"21.2","slide":{"pres":"II-3","slide":7}},{"tense":"Past Continuous","no":4,"use":"interrupted action","usePl":"czynność przerwana krótkim zdarzeniem","example":"Nina was taking notes when her laptop suddenly died.","ref":"21.3","slide":{"pres":"II-3","slide":7}},{"tense":"Past Continuous","no":5,"use":"gradual change in the past","usePl":"stopniowa zmiana w przeszłości","example":"The days were getting shorter and the town was slowly emptying of tourists.","ref":"21.2","slide":{"pres":"II-3","slide":7}},{"tense":"Past Continuous","no":6,"use":"two simultaneous actions extended in time","usePl":"dwie dłuższe czynności trwające równolegle","example":"All evening I was studying while my brother was practising the trumpet next door.","ref":"21.2","slide":{"pres":"II-3","slide":8}},{"tense":"Past Continuous","no":7,"use":"future arrangement in the past","usePl":"ustalenie na przyszłość z perspektywy przeszłości","example":"Kamil turned down the extra shift because he was moving flats that weekend.","ref":"21.4","slide":{"pres":"II-3","slide":8}},{"tense":"Past Continuous","no":8,"use":"providing the background to a story","usePl":"tło opowiadania","example":"The wind was howling and rain was lashing against the windows when the doorbell rang.","ref":"21.2","slide":{"pres":"II-3","slide":8}},{"tense":"Past Continuous","no":9,"use":"polite, tentative requests","usePl":"uprzejme, ostrożne prośby (I was wondering if…)","example":"I was wondering if you could swap shifts with me on Saturday.","ref":"21.4","slide":{"pres":"II-3","slide":8}},{"tense":"Past Continuous","no":10,"use":"emphasising a very frequent action","usePl":"podkreślenie bardzo częstej, zwykle irytującej czynności (always)","example":"Our old neighbour was always complaining about the noise.","ref":"21.2","slide":{"pres":"II-3","slide":8}},{"tense":"Past Continuous","no":null,"use":"repeated actions over a temporary period","usePl":"czynność powtarzana w ograniczonym okresie (bez liczby razy)","example":"That month I was getting up at five every day to revise.","ref":"21.2","slide":null},{"tense":"Past Continuous","no":null,"use":"unfulfilled plans and expectations (plan, expect, hope)","usePl":"plany i oczekiwania, które się nie spełniły","example":"We were hoping to see the northern lights, but it was cloudy all week.","ref":"21.4","slide":null}],"quiz":[{"id":"u21-01","type":"choice","prompt":"I ___ my student ID on the bus yesterday, so I can't get into the library today.","options":["left","have left","was leaving"],"answer":0,"explain":"Podany zakończony czas (yesterday) → Past Simple, nawet jeśli skutek widać dziś. Present Perfect nie łączy się z yesterday.","ref":"21.1"},{"id":"u21-02","type":"gap","prompt":"Dominika ___ (call) the landlord six times last week, but he never picked up.","answers":["called"],"explain":"Czynność powtarzana z podaną liczbą razy w zamkniętym okresie → Past Simple (użycie 3). Past Continuous nie łączy się z liczbą razy.","ref":"21.1"},{"id":"u21-03","type":"gap","prompt":"When the alarm went off, Wiktor ___ (jump) out of bed, grabbed a towel and ran to the shower.","answers":["jumped"],"explain":"Sekwencja czynności jedna po drugiej → Past Simple (użycie 4). Had jumped znaczyłoby, że wyskoczył z łóżka, zanim zadzwonił budzik.","ref":"21.1"},{"id":"u21-04","type":"choice","prompt":"During the summer holidays Kinga ___ at a hotel reception in Kołobrzeg, so she only came home at weekends.","options":["was working","has worked","had been working"],"answer":0,"explain":"Tymczasowa sytuacja w zamkniętym okresie przeszłym → Past Continuous (użycie 3). Present Perfect nie pasuje do zakończonego okresu, a Past Perfect Continuous wymagałby późniejszego punktu odniesienia.","ref":"21.2"},{"id":"u21-05","type":"gap","prompt":"When the exam results appeared on the screen, Natalia ___ (laugh) with relief.","answers":["laughed"],"explain":"Dwie krótkie czynności w tym samym momencie, druga jest reakcją na pierwszą → Past Simple w obu częściach (użycie 2). Was laughing znaczyłoby, że śmiała się już wcześniej.","ref":"21.1"},{"id":"u21-06","type":"gap","prompt":"At half past eleven last night I ___ (revise) for my phonetics test, so I didn't hear your call.","answers":["was revising"],"explain":"Czynność w toku w konkretnym momencie przeszłości (at half past eleven) → Past Continuous (użycie 2).","ref":"21.2"},{"id":"u21-07","type":"gap","prompt":"When I reached the dean's office at nine, the queue ___ (still / get) longer by the minute.","answers":["was still getting"],"explain":"Stopniowa zmiana, która trwała już w chwili mojego przyjścia (still, by the minute) → Past Continuous (użycie 5). Bez still pasowałoby też got: kolejka rosła dopiero po moim przyjściu.","ref":"21.2"},{"id":"u21-08","type":"choice","prompt":"I was jogging along the seafront in Mielno ___ I twisted my ankle.","options":["while","when"],"answer":1,"explain":"Krótkie zdarzenie, które przerwało czynność w toku, wprowadzamy przez when, nie while; while stoi przy czynności w toku.","ref":"21.3"},{"id":"u21-09","type":"choice","prompt":"While we ___ for the tram in Szczecin, a tourist asked us the way to the castle.","options":["were waiting","had waited","have been waiting"],"answer":0,"explain":"while + dłuższa czynność w toku, w trakcie której zdarzyło się coś krótkiego (asked) → Past Continuous (użycie 1). Had waited znaczyłoby, że czekanie już się skończyło.","ref":"21.3"},{"id":"u21-10","type":"fix","prompt":"It was a freezing January night and it snowed heavily when we finally reached the mountain hut.","wrong":"it snowed heavily","fixes":["it was snowing heavily"],"answers":["It was a freezing January night and it was snowing heavily when we finally reached the mountain hut."],"explain":"Tło opowiadania – pogoda trwająca w chwili, gdy coś się wydarzyło → Past Continuous (użycie 8); samo zdarzenie (reached) zostaje w Past Simple.","ref":"21.2"},{"id":"u21-11","type":"choice","prompt":"While Szymon ___ the dishes, his sister was hoovering the living room.","options":["was washing","had been washing","has been washing"],"answer":0,"explain":"Dwie dłuższe czynności trwające równolegle → Past Continuous w obu częściach (użycie 6). Past Perfect Continuous oznaczałby czynność wcześniejszą.","ref":"21.2"},{"id":"u21-12","type":"use","prompt":"Back in the dorm, my roommate was always leaving wet towels on the bathroom floor.","options":["temporary situation – sytuacja tymczasowa (Past Continuous, użycie 3)","emphasising a very frequent action – bardzo częsta, irytująca czynność (Past Continuous, użycie 10)","gradual change in the past – stopniowa zmiana (Past Continuous, użycie 5)"],"answer":1,"explain":"always + Past Continuous podkreśla bardzo częstą, irytującą czynność (użycie 10). W Past Simple (always left) byłby to neutralny nawyk.","ref":"21.2"},{"id":"u21-13","type":"choice","prompt":"I couldn't come to the karaoke night because I ___ my new job at seven the next morning.","options":["was starting","have started","had started"],"answer":0,"explain":"Ustalenie na przyszłość z perspektywy przeszłości (the next morning) → Past Continuous (użycie 7). Had started znaczyłoby, że praca już się wcześniej zaczęła.","ref":"21.4"},{"id":"u21-14","type":"use","prompt":"I was wondering if you could proofread my cover letter before Friday.","options":["action in progress at a point of time – czynność w toku w danym momencie (Past Continuous, użycie 2)","future arrangement in the past – ustalenie z perspektywy przeszłości (Past Continuous, użycie 7)","polite, tentative requests – uprzejma, ostrożna prośba (Past Continuous, użycie 9)"],"answer":2,"explain":"I was wondering if you could… to prośba dotycząca teraźniejszości; forma przeszła tylko zmiękcza ton (użycie 9).","ref":"21.4"},{"id":"u21-15","type":"choice","prompt":"Kasia ___ really shy at school, but now she hosts her own radio show.","options":["used to be","would be","was being"],"answer":0,"explain":"Stan w przeszłości, który się zmienił → used to. Would opisuje tylko powtarzane czynności, nie stany.","ref":"21.5"},{"id":"u21-16","type":"fix","prompt":"My grandparents would have a small farm near Bobolice, but they sold it when I was ten.","wrong":"would have","fixes":["used to have","had"],"answers":["My grandparents used to have a small farm near Bobolice, but they sold it when I was ten.","My grandparents had a small farm near Bobolice, but they sold it when I was ten."],"explain":"Posiadanie to stan, a would opisuje tylko powtarzane czynności → used to have albo had.","ref":"21.5"},{"id":"u21-17","type":"choice","prompt":"Before moving to Koszalin, Filip ___ at a surf school in Sopot for three summers.","options":["worked","used to work","would work"],"answer":0,"explain":"Podany okres i liczba (for three summers) → Past Simple. Used to i would nie łączą się z długością trwania ani z liczbą razy.","ref":"21.5"},{"id":"u21-18","type":"gap","prompt":"After two months in the dorm, Agata is finally getting used to ___ (share) a bathroom with eight people.","answers":["sharing"],"explain":"get used to = przyzwyczajać się; to jest tu przyimkiem, więc po nim forma -ing, nie bezokolicznik.","ref":"21.5"}],"translations":[{"id":"u21-t01","pl":"W zeszłym roku czytałam tę książkę trzy razy.","answers":["I read this book three times last year.","Last year I read this book three times."],"keys":["i read","three times"],"explain":"Polski czas niedokonany (czytałam) nie oznacza Past Continuous: podana liczba razy → Past Simple.","ref":"21.1"},{"id":"u21-t02","pl":"Kiedy zadzwoniłeś, oglądałem mecz.","answers":["When you called, I was watching the match.","I was watching the match when you called.","When you rang, I was watching the game."],"keys":["was watching"],"explain":"Czynność w toku przerwana telefonem → Past Continuous; samo zdarzenie (zadzwoniłeś) w Past Simple.","ref":"21.3"},{"id":"u21-t03","pl":"Zastanawiałam się, czy mogłabym oddać esej w poniedziałek.","answers":["I was wondering if I could hand in my essay on Monday.","I was wondering whether I could hand in the essay on Monday."],"keys":["was wondering","could"],"explain":"Uprzejma, ostrożna prośba o zgodę → I was wondering if/whether I could…; forma przeszła tylko zmiękcza ton.","ref":"21.4"},{"id":"u21-t04","pl":"Mieszkałem w Gdańsku przez pięć lat, a potem przeprowadziłem się do Koszalina.","answers":["I lived in Gdańsk for five years and then moved to Koszalin.","I lived in Gdańsk for five years, and then I moved to Koszalin."],"keys":["i lived","for five years","moved"],"explain":"Stan w przeszłości z podaną długością → Past Simple; used to ani Past Continuous nie łączą się z for five years.","ref":"21.5"},{"id":"u21-t05","pl":"Kiedyś grałem w zespole, ale rzuciłem to na studiach.","answers":["I used to play in a band, but I gave it up at university.","I used to play in a band, but I gave it up when I was at university."],"keys":["used to play","gave"],"explain":"„Kiedyś” + czynność, której już nie ma → used to; jednorazowe zdarzenie (rzuciłem) w Past Simple.","ref":"21.5"},{"id":"u21-t06","pl":"Wyszłam z wesela przed północą, bo następnego dnia rano leciałam do Londynu.","answers":["I left the wedding before midnight because I was flying to London the next morning.","I left the wedding reception before midnight as I was flying to London the following morning."],"keys":["was flying"],"explain":"Ustalenie na przyszłość z perspektywy przeszłości → Past Continuous (future arrangement in the past), mimo że znaczenie jest przyszłe.","ref":"21.4"},{"id":"u21-t07","pl":"Przyzwyczaiłem się już do wstawania o szóstej.","answers":["I've already got used to getting up at six.","I've got used to getting up at six.","I'm used to getting up at six now."],"keys":["used to getting up"],"explain":"be/get used to + -ing = być/przyzwyczaić się; „przyzwyczaiłem się” → I've got used to albo I'm used to (stan teraz).","ref":"21.5"}],"pairs":[{"id":"past-simple-vs-past-continuous","title":"Past Simple czy Past Continuous?","a":{"name":"Past Simple","when":"zakończone zdarzenie, sekwencja czynności, liczba razy lub długość okresu (three times, for two years), stan w przeszłości, krótkie zdarzenie przerywające (when)","example":"The fire alarm went off, so we all left the building."},"b":{"name":"Past Continuous","when":"czynność w toku w danym momencie lub w chwili innego zdarzenia (while/when/as), tło opowiadania, sytuacja tymczasowa, stopniowa zmiana, plan z perspektywy przeszłości, uprzejma prośba, always + irytacja","example":"We were having a seminar when the fire alarm went off."},"tip":"Zapytaj: czy czynność trwała wokół innego momentu lub zdarzenia (Past Continuous), czy była zamkniętym zdarzeniem w opowieści (Past Simple)?","refs":["21.1","21.2","21.3"],"quiz":["u21-02","u21-05","u21-06","u21-08","u21-09","u21-10"]},{"id":"used-to-vs-would","title":"used to czy would (i be/get used to)?","a":{"name":"used to + bezokolicznik","when":"powtarzane czynności i stany z przeszłości, których już nie ma (be, have, live, like, know); przeczenie didn't use to","example":"Ewa used to have long hair, and she used to dye it pink."},"b":{"name":"would + bezokolicznik","when":"tylko powtarzane czynności w przeszłości (nie stany), zwykle po podaniu kontekstu (when we were kids, on Sundays) lub w opowieści zaczętej od used to","example":"When we were kids, Dad would take us sledging every Sunday."},"tip":"Stan → tylko used to; liczba razy lub długość okresu → Past Simple; be/get used to + -ing (I'm used to working nights) to inna struktura: „być/przyzwyczajać się”, może stać w każdym czasie.","refs":["21.5"],"quiz":["u21-15","u21-16","u21-17","u21-18"]}],"signals":[{"word":"while","tenses":["Past Continuous"],"example":"While I was making coffee, the power went off.","note":"while + dłuższa czynność w toku; zdarzenia przerywającego nie wprowadzamy przez while, tylko when. Nie mylić z during + rzeczownik.","ref":"21.3"},{"word":"when","tenses":["Past Simple","Past Continuous","Past Perfect"],"example":"When the lecture ended, we went for pizza.","note":"when + Past Simple to zwykle krótkie zdarzenie (przerywające albo wywołujące następne). Kolejność zależy od czasu w drugiej części: When I arrived, they left / had left (22.4).","ref":"21.3"},{"word":"as","tenses":["Past Continuous","Past Simple"],"example":"As I was leaving the library, it started to rain.","note":"as = w trakcie (jak while) z Past Continuous; (just) as = dokładnie w chwili, gdy – wtedy zwykle Past Simple: just as the bus pulled away.","ref":"21.3"},{"word":"ago","tenses":["Past Simple"],"example":"Wiktoria graduated two years ago.","note":"ago → Past Simple, nie Present Perfect. W mowie zależnej ago zmienia się na before (51.4).","ref":"21.1"},{"word":"at that time","tenses":["Past Continuous","Past Simple"],"example":"At that time I was working nights at a petrol station.","note":"Tymczasowa sytuacja w przeszłości → często Past Continuous; z czasownikami stanu Past Simple: At that time I didn't know anyone in Koszalin.","ref":"21.2"},{"word":"used to","tenses":["used to"],"example":"We used to go camping in Masuria every August.","note":"Powtarzane czynności i stany, których już nie ma. Nie z liczbą razy ani długością okresu (for five years → Past Simple); nie mylić z be/get used to + -ing.","ref":"21.5"},{"word":"would","tenses":["would"],"example":"On Sundays Dad would make pancakes for everyone.","note":"Tylko powtarzane czynności w przeszłości, nie stany; zwykle po podaniu kontekstu czasu (on Sundays, when we were kids).","ref":"21.5"},{"word":"always (+ Past Continuous)","tenses":["Past Continuous"],"example":"He was always turning up late to rehearsals.","note":"always/constantly/forever + Past Continuous = bardzo częsta, zwykle irytująca czynność; z Past Simple always to neutralny nawyk.","ref":"21.2"}]},"22":{"unit":"22","title":"Past perfect simple and continuous","titlePl":"Past Perfect Simple i Past Perfect Continuous","module":5,"presentations":[{"id":"II-3","slides":[11,20]}],"summary":["Past Perfect Simple (had + III forma): czynność lub stan wcześniejsze niż inny moment w przeszłości; często z by the time, already, just, the first time.","Past Perfect Continuous (had been + -ing): proces trwający aż do momentu w przeszłości (często z for/since) lub zakończony tuż przed nim – liczy się długość albo widoczne ślady.","Czynność nadal trwała w chwili zdarzenia → Past Continuous (they were playing); skończyła się tuż przed nim → Past Perfect Continuous (they had been playing).","Gdy kolejność jest jasna, wystarczy Past Simple; po after/before/as soon as/when oba czasy są możliwe. Ale: When she left, I cleaned (potem) ≠ When she left, I had cleaned (wcześniej).","hope/expect/want/plan/wish + Past Perfect = zamiary z przeszłości, które się nie spełniły: We had hoped to…, but…"],"sections":[{"ref":"22.1","page":102,"title":"Czynności i sytuacje sprzed danego momentu w przeszłości","rule":"**Past Perfect Simple** (had + III forma) opisuje czynność jednorazową lub powtarzaną, zakończoną przed jakimś momentem w przeszłości, a także sytuację istniejącą przed zdarzeniem z przeszłości; często z **when** lub **by the time**. **Past Perfect Continuous** (had been + -ing) opisuje czynność trwającą aż do momentu w przeszłości albo przerwaną tuż przed nim, często z **for/since** (nacisk na długość) oraz **before** lub **by the time**. Jeśli czynność nadal trwała w chwili zdarzenia w Past Simple, wybieramy Past Continuous, nie Past Perfect Continuous (slajd II/3 14).","examples":[{"en":"When I logged in, I saw that the deadline had already passed.","pl":"Kiedy się zalogowałem, zobaczyłem, że termin już minął.","note":"czynność zakończona przed innym zdarzeniem w przeszłości"},{"en":"By the time Ola graduated, she had worked in three different countries.","pl":"Zanim Ola skończyła studia, zdążyła popracować w trzech różnych krajach.","note":"by the time + Past Perfect Simple"},{"en":"When I met Paweł, he had been a vegetarian for ten years.","pl":"Kiedy poznałem Pawła, był wegetarianinem od dziesięciu lat.","note":"sytuacja istniejąca przed zdarzeniem; polskie „był od…”"},{"en":"We had been queuing for two hours when the box office finally opened.","pl":"Staliśmy w kolejce od dwóch godzin, kiedy kasa wreszcie się otworzyła.","note":"Past Perfect Continuous + for: czynność trwała aż do momentu w przeszłości"}],"pitfalls":[{"wrong":"When I met him, he was married for ten years.","right":"When I met him, he had been married for ten years.","why":"„był żonaty od dziesięciu lat” = stan trwający do momentu w przeszłości → Past Perfect, nie Past Simple"},{"wrong":"My parents had been running a café in Sopot when I started school.","right":"My parents were running a café in Sopot when I started school.","why":"sytuacja wciąż trwała w chwili zdarzenia → Past Continuous; Past Perfect Continuous bez for/since sugeruje, że skończyła się wcześniej"}],"slides":[{"pres":"II-3","slide":12},{"pres":"II-3","slide":13},{"pres":"II-3","slide":14}]},{"ref":"22.2","page":102,"title":"Czynności zakończone i trwające","rule":"**Past Perfect Simple** zwykle mówi o czynności zakończonej (liczy się efekt), a **Past Perfect Continuous** o czynności, która mogła jeszcze trwać w momencie, o którym mówimy (liczy się proces). Gdy podajemy, ile razy coś zrobiliśmy lub ile czegoś było, używamy Past Perfect Simple, nie Continuous.","examples":[{"en":"By Friday, Kuba had painted the whole kitchen, and it looked fantastic.","pl":"Do piątku Kuba pomalował całą kuchnię i wyglądała fantastycznie.","note":"Past Perfect Simple: czynność zakończona, liczy się efekt"},{"en":"Kuba had been painting the kitchen all morning, so there was paint all over his jeans.","pl":"Kuba przez cały ranek malował kuchnię, więc miał farbę na całych dżinsach.","note":"Past Perfect Continuous: proces (może niedokończony) i jego ślady"},{"en":"I had only read two chapters of the novel when the seminar started.","pl":"Kiedy zaczęło się seminarium, miałem przeczytane tylko dwa rozdziały powieści.","note":"podana liczba (two chapters) → Past Perfect Simple"}],"pitfalls":[{"wrong":"She had been calling me five times before I noticed.","right":"She had called me five times before I noticed.","why":"podana liczba razy → Past Perfect Simple; Past Perfect Continuous nie łączy się z liczeniem"},{"wrong":"I had been knowing her for years before we became friends.","right":"I had known her for years before we became friends.","why":"know to czasownik stanu – bez formy continuous, także w Past Perfect"}],"slides":[{"pres":"II-3","slide":13}]},{"ref":"22.3","page":103,"title":"Przyczyny w przeszłości","rule":"Past Perfect (Simple lub Continuous) często podaje **przyczynę** sytuacji lub czynności z przeszłości: coś było tak, bo wcześniej coś się stało albo długo trwało. Forma continuous podkreśla długi proces jako powód (zmęczenie, widoczne ślady).","examples":[{"en":"Julia was exhausted because she had been working double shifts all week.","pl":"Julia była wykończona, bo przez cały tydzień pracowała na dwie zmiany.","note":"przyczyna = długi proces → Past Perfect Continuous"},{"en":"The flat was freezing because someone had left the balcony door open.","pl":"W mieszkaniu było lodowato, bo ktoś zostawił otwarte drzwi balkonowe.","note":"przyczyna = wcześniejsza, zakończona czynność → Past Perfect Simple"}],"pitfalls":[{"wrong":"Her eyes were red because she has been crying.","right":"Her eyes were red because she had been crying.","why":"przyczyna sytuacji z przeszłości (were red) → Past Perfect Continuous, nie Present Perfect Continuous"}],"slides":[{"pres":"II-3","slide":13}]},{"ref":"22.4","page":103,"title":"Kolejność zdarzeń w przeszłości","rule":"Past Perfect pokazuje, które z dwóch zdarzeń było **wcześniejsze**; późniejsze stoi w Past Simple, a gdy kolejność jest oczywista (zwykła sekwencja), wystarczy sam Past Simple. Po **after, before, as soon as, when** możliwy jest i Past Perfect, i Past Simple, ale czas w zdaniu głównym zmienia sens: When she left, I cleaned (najpierw wyszła) ≠ When she left, I had cleaned (sprzątałem wcześniej). Z **until/before** Past Perfect podkreśla, że czynność się zakończyła albo że nie zdążyła się zakończyć (slajdy II/3 17–18). **just** + Past Perfect = tuż wcześniej, **already** = wcześniej, niż się spodziewano.","examples":[{"en":"When Dad got home, we had decorated the tree.","pl":"Kiedy tata wrócił do domu, choinka była już ubrana.","note":"najpierw ubraliśmy choinkę, potem tata wrócił"},{"en":"When Dad got home, we decorated the tree.","pl":"Kiedy tata wrócił do domu, ubraliśmy choinkę.","note":"najpierw tata wrócił, potem ubraliśmy choinkę"},{"en":"The professor wouldn't start the lecture until everyone had switched off their phones.","pl":"Profesor nie zaczynał wykładu, dopóki wszyscy nie wyłączyli telefonów.","note":"until + Past Perfect podkreśla, że czynność musiała się zakończyć"},{"en":"The battery died before I'd saved my work.","pl":"Bateria padła, zanim zdążyłem zapisać pracę.","note":"before + Past Perfect: czynność nie zdążyła się zakończyć"}],"pitfalls":[{"wrong":"When I finally logged in, the tickets already sold out.","right":"When I finally logged in, the tickets had already sold out.","why":"already + zdarzenie wcześniejsze niż inne w przeszłości → Past Perfect"},{"wrong":"Marta had picked up the phone and answered it.","right":"Marta picked up the phone and answered it.","why":"zwykła sekwencja, kolejność oczywista → Past Simple; Past Perfect jest zbędny (slajd II/3 15)"}],"slides":[{"pres":"II-3","slide":15},{"pres":"II-3","slide":16},{"pres":"II-3","slide":17},{"pres":"II-3","slide":18}]},{"ref":"22.5","page":103,"title":"Inne użycia: the first time, niespełnione zamiary","rule":"W opowieści o przeszłości Past Perfect łączy się ze stopniem najwyższym, liczebnikami porządkowymi (the first, the second, the last) i the only + **ever**: it was the first time I had ever… Z **hope, expect, want, plan, think about, wish** Past Perfect wyraża zamiary z przeszłości, które się nie spełniły (we had hoped to…, but…). Możliwa jest też forma continuous (we had been planning…), ale nie z czasownikami stanu (had wanted, nie had been wanting).","examples":[{"en":"It was the first time I had ever eaten sushi.","pl":"To był pierwszy raz, kiedy jadłem sushi.","note":"the first time + Past Perfect w narracji przeszłej"},{"en":"Hania had hoped to win a scholarship, but she missed the application deadline.","pl":"Hania liczyła na stypendium, ale przegapiła termin składania wniosków.","note":"niespełniony zamiar (hope)"},{"en":"We had been planning a road trip to Croatia for months, but then the car broke down.","pl":"Od miesięcy planowaliśmy wyjazd samochodem do Chorwacji, ale wtedy zepsuło się auto.","note":"niespełniony plan, forma continuous"}],"pitfalls":[{"wrong":"She had been wanting to study medicine, but she failed her biology exam.","right":"She had wanted to study medicine, but she failed her biology exam.","why":"want to czasownik stanu → had wanted, nie had been wanting"},{"wrong":"It was the first time I saw the sea.","right":"It was the first time I had seen the sea.","why":"it was the first time + Past Perfect (doświadczenie do tamtego momentu)"}],"slides":[{"pres":"II-3","slide":13}]}],"uses":[{"tense":"Past Perfect Simple","no":null,"use":"a single or repeated action before another action in the past","usePl":"czynność jednorazowa lub powtarzana przed inną czynnością w przeszłości","example":"Ola realised she had left her phone in the lecture hall.","ref":"22.1","slide":{"pres":"II-3","slide":13}},{"tense":"Past Perfect Simple","no":null,"use":"a situation which existed before a past event","usePl":"sytuacja istniejąca przed zdarzeniem w przeszłości","example":"When they finally met in person, they had known each other online for two years.","ref":"22.1","slide":{"pres":"II-3","slide":13}},{"tense":"Past Perfect Simple","no":null,"use":"with hope/expect/want/plan/think about/wish – past intentions that were unfulfilled","usePl":"zamiary z przeszłości, które się nie spełniły","example":"We had planned to camp on the beach, but a storm forced us into a hostel.","ref":"22.5","slide":{"pres":"II-3","slide":13}},{"tense":"Past Perfect Simple","no":null,"use":"with by the time","usePl":"z by the time: coś zakończyło się przed danym momentem","example":"By the time the police arrived, the thieves had disappeared.","ref":"22.1","slide":{"pres":"II-3","slide":13}},{"tense":"Past Perfect Continuous","no":null,"use":"an ongoing process/action before another action in the past","usePl":"proces trwający przed inną czynnością w przeszłości (do niej lub tuż przed nią)","example":"Her voice was hoarse because she had been cheering at the match all afternoon.","ref":"22.1","slide":{"pres":"II-3","slide":13}},{"tense":"Past Perfect Continuous","no":null,"use":"repeated actions in the past","usePl":"czynności powtarzane przez dłuższy czas przed momentem w przeszłości","example":"Szymon had been sending out his CV for weeks before anyone replied.","ref":"22.1","slide":{"pres":"II-3","slide":13}},{"tense":"Past Perfect","no":null,"use":"earlier of two past actions (sequence of events)","usePl":"wcześniejsza z dwóch czynności; when/after/before/as soon as/until","example":"When we got to the platform, the train had left.","ref":"22.4","slide":{"pres":"II-3","slide":16}},{"tense":"Past Perfect","no":null,"use":"emphasising completion (until/before) or that an action was not completed","usePl":"podkreślenie, że czynność się zakończyła albo nie zdążyła się zakończyć","example":"The library closed before I had found the book I needed.","ref":"22.4","slide":{"pres":"II-3","slide":18}},{"tense":"Past Perfect","no":null,"use":"past reasons","usePl":"przyczyna sytuacji lub czynności z przeszłości","example":"The streets were flooded because it had been raining for three days.","ref":"22.3","slide":null},{"tense":"Past Perfect","no":null,"use":"with superlatives, ordinals and the only + ever","usePl":"po stopniu najwyższym, the first/second/last time, the only … ever","example":"It was the worst coffee I had ever tasted.","ref":"22.5","slide":null}],"quiz":[{"id":"u22-01","type":"choice","prompt":"I couldn't get into my room in the dorm last night because I ___ my key card at my parents' house.","options":["had left","have left","was leaving"],"answer":0,"explain":"Przyczyna sytuacji z przeszłości, czynność wcześniejsza → Past Perfect Simple. Present Perfect nie pasuje do narracji przeszłej, a Past Continuous opisywałby czynność w toku.","ref":"22.3"},{"id":"u22-02","type":"gap","prompt":"By the time the ambulance arrived, a passer-by ___ (already / give) the man first aid.","answers":["had already given","'d already given"],"explain":"By the time + Past Simple, a w zdaniu głównym czynność zakończona wcześniej → Past Perfect Simple (slajd II/3 13).","ref":"22.1"},{"id":"u22-03","type":"gap","prompt":"When I first met Tymon, he ___ (be) in a band for six years.","answers":["had been","'d been"],"explain":"Stan trwający aż do momentu w przeszłości (for six years) → Past Perfect. Po polsku „grał w zespole od sześciu lat”, stąd częsty błąd was.","ref":"22.1"},{"id":"u22-04","type":"choice","prompt":"Our neighbour looked over the fence. The kids ___ football in the garden, and the ball was flying in all directions.","options":["were playing","had been playing"],"answer":0,"explain":"Gra nadal trwa w chwili, gdy sąsiad patrzy (piłka wciąż lata) → Past Continuous. Had been playing znaczyłoby, że gra skończyła się tuż wcześniej (slajd II/3 14).","ref":"22.1"},{"id":"u22-05","type":"choice","prompt":"When my little brother got home, he was out of breath and his jeans were covered in mud. He ___ football in the park with his friends.","options":["was playing","had been playing"],"answer":1,"explain":"Gra skończyła się przed jego powrotem, a widać jej ślady → Past Perfect Continuous (slajd II/3 14).","ref":"22.1"},{"id":"u22-06","type":"choice","prompt":"Marek ___ for jobs for months before he finally got an interview at a software company in Gdańsk.","options":["had been applying","was applying","has been applying"],"answer":0,"explain":"Czynności powtarzane przez dłuższy czas przed późniejszym zdarzeniem → Past Perfect Continuous (slajd II/3 13). Past Continuous nie łączy się z for months przed innym zdarzeniem.","ref":"22.1"},{"id":"u22-07","type":"choice","prompt":"We ___ at the gate for over three hours when the airline finally announced that the flight was cancelled.","options":["had been waiting","were waiting","have been waiting"],"answer":0,"explain":"Czynność trwała aż do momentu w przeszłości, podana długość (for over three hours) → Past Perfect Continuous.","ref":"22.1"},{"id":"u22-08","type":"gap","prompt":"Leon's eyes were red and puffy; it was obvious he ___ (cry) for quite a while.","answers":["had been crying","'d been crying"],"explain":"Widoczne ślady długiego procesu, który skończył się przed momentem w przeszłości → Past Perfect Continuous. Had cried brzmiałoby tu nienaturalnie: przy śladach procesu i for quite a while wybieramy formę continuous (22.2).","ref":"22.3"},{"id":"u22-09","type":"choice","prompt":"When my parents arrived, I ___ dinner, so we sat down to eat straight away.","options":["cooked","had cooked"],"answer":1,"explain":"Obiad był gotowy w chwili przyjazdu, więc gotowanie było wcześniej → Past Perfect. When my parents arrived, I cooked dinner znaczyłoby, że gotowałem dopiero po ich przyjeździe (slajd II/3 16).","ref":"22.4"},{"id":"u22-10","type":"choice","prompt":"When the last guests left, we ___ the dishwasher and went straight to bed.","options":["loaded","had loaded"],"answer":0,"explain":"Najpierw goście wyszli, potem załadowaliśmy zmywarkę → Past Simple dla czynności późniejszej. Had loaded znaczyłoby, że zmywarka była załadowana, zanim wyszli (slajd II/3 16).","ref":"22.4"},{"id":"u22-11","type":"gap","prompt":"As soon as I ___ (submit) my thesis, I booked a week in Crete.","answers":["had submitted","'d submitted","submitted"],"explain":"Po as soon as możliwy jest i Past Perfect, i Past Simple, bo spójnik sam pokazuje kolejność (slajd II/3 16).","ref":"22.4"},{"id":"u22-12","type":"gap","prompt":"Our landlord didn't return the deposit until we ___ (pay) the last electricity bill.","answers":["had paid","'d paid","paid"],"explain":"until + Past Perfect podkreśla, że czynność musiała się zakończyć (slajdy II/3 17–18); Past Simple też jest poprawny. Polskie „dopóki nie zapłaciliśmy” = until + zdanie twierdzące.","ref":"22.4"},{"id":"u22-13","type":"fix","prompt":"The concert was cancelled before the band has finished the soundcheck.","wrong":"has finished","fixes":["had finished","finished"],"answers":["The concert was cancelled before the band had finished the soundcheck.","The concert was cancelled before the band finished the soundcheck."],"explain":"W narracji przeszłej nie ma miejsca na Present Perfect. before + Past Perfect podkreśla, że próba dźwięku nie została dokończona (slajd II/3 18).","ref":"22.4"},{"id":"u22-14","type":"choice","prompt":"I ___ to finish my essay before the weekend, but my laptop crashed and I lost two chapters.","options":["had wanted","have wanted","had been wanting"],"answer":0,"explain":"Niespełniony zamiar z przeszłości → want + Past Perfect Simple (slajd II/3 13). Want to czasownik stanu, więc nie had been wanting.","ref":"22.5"},{"id":"u22-15","type":"use","prompt":"By the time she turned twenty, Marcelina had visited over thirty countries.","options":["with by the time – czynność zakończona przed danym momentem (Past Perfect Simple, tabela II/3 13)","past intentions that were unfulfilled – niespełniony zamiar (Past Perfect Simple, tabela II/3 13)","an ongoing process/action before another action – proces trwający przed inną czynnością (Past Perfect Continuous, tabela II/3 13)"],"answer":0,"explain":"By the time + Past Simple wyznacza moment, przed którym coś się zakończyło → Past Perfect Simple; liczba krajów wyklucza Continuous.","ref":"22.1"},{"id":"u22-16","type":"use","prompt":"Ola had planned to spend a semester in Lisbon, but her scholarship fell through.","options":["a single or repeated action before another action – czynność przed inną czynnością (Past Perfect Simple, tabela II/3 13)","a situation which existed before a past event – sytuacja istniejąca przed zdarzeniem (Past Perfect Simple, tabela II/3 13)","past intentions that were unfulfilled – niespełniony zamiar z hope/expect/want/plan (Past Perfect Simple, tabela II/3 13)"],"answer":2,"explain":"plan + Past Perfect, a potem but… → zamiar z przeszłości, który się nie spełnił.","ref":"22.5"},{"id":"u22-17","type":"fix","prompt":"Bartek had switched off the alarm and went back to sleep.","wrong":"had switched off","fixes":["switched off"],"answers":["Bartek switched off the alarm and went back to sleep."],"explain":"Prosta sekwencja, kolejność oczywista → Past Simple w obu czynnościach; Past Perfect jest tu zbędny (slajd II/3 15).","ref":"22.4"},{"id":"u22-18","type":"gap","prompt":"We wanted to say goodbye to Natalia, but she ___ (just / leave) for the airport.","answers":["had just left","'d just left"],"explain":"just + Past Perfect = tuż przed innym momentem w przeszłości (wyszła chwilę przed naszym przyjściem).","ref":"22.4"}],"translations":[{"id":"u22-t01","pl":"Kiedy poznałam Michała, był żonaty od dwóch lat.","answers":["When I met Michał, he had been married for two years.","When I met Michał, he'd been married for two years."],"keys":["had been married","for two years"],"explain":"„Był od dwóch lat” = stan trwający aż do momentu w przeszłości → Past Perfect, nie Past Simple.","ref":"22.1"},{"id":"u22-t02","pl":"Kiedy dotarliśmy na dworzec, pociąg już odjechał.","answers":["When we got to the station, the train had already left.","By the time we got to the station, the train had already left."],"keys":["had already left|had already gone|had left already"],"explain":"Odjazd był wcześniejszy niż nasze przyjście → Past Perfect z already. The train left znaczyłoby, że odjechał dopiero, gdy przyszliśmy.","ref":"22.4"},{"id":"u22-t03","pl":"Byłem zmęczony, bo cały dzień uczyłem się do egzaminu.","answers":["I was tired because I had been studying for the exam all day.","I was tired because I'd been revising for the exam all day."],"keys":["had been"],"explain":"Przyczyna stanu z przeszłości = długi proces przed tym momentem → Past Perfect Continuous.","ref":"22.3"},{"id":"u22-t04","pl":"Mieliśmy nadzieję zdążyć na ostatni autobus, ale spóźniliśmy się o minutę.","answers":["We had hoped to catch the last bus, but we were a minute late.","We'd hoped to catch the last bus, but we missed it by a minute."],"keys":["had hoped|were hoping|had been hoping"],"explain":"Niespełniony zamiar z przeszłości → hope + Past Perfect (slajd II/3 13). Poprawne są też were hoping (Past Continuous, 21.4) i had been hoping.","ref":"22.5"},{"id":"u22-t05","pl":"To był pierwszy raz, kiedy leciałam sama samolotem.","answers":["It was the first time I had flown on my own.","It was the first time I'd flown alone."],"keys":["first time","flown"],"explain":"it was the first time + Past Perfect (had flown), nie Past Simple, choć po polsku jest „leciałam”.","ref":"22.5"},{"id":"u22-t06","pl":"Nie zasnęłam, dopóki nie skończyłam czytać książki.","answers":["I didn't fall asleep until I had finished reading the book.","I didn't go to sleep until I'd finished the book.","I didn't fall asleep until I finished reading the book."],"keys":["until i had finished|until i finished|until i had read|until i read"],"explain":"Polskie „dopóki nie” = until + zdanie twierdzące (bez not). Past Perfect podkreśla, że czytanie się zakończyło (slajd II/3 17); Past Simple też jest poprawny.","ref":"22.4"}],"pairs":[{"id":"past-perfect-vs-past-simple","title":"Past Perfect czy Past Simple? (kolejność zdarzeń)","a":{"name":"Past Perfect","when":"czynność wcześniejsza z dwóch, gdy trzeba to pokazać (already, just, by the time); po when w zdaniu głównym = to stało się wcześniej; z until/before podkreśla zakończenie albo niedokończenie czynności","example":"When I got back from the gym, my flatmates had eaten all the pizza."},"b":{"name":"Past Simple","when":"zdarzenia opowiadane po kolei albo gdy kolejność jest oczywista; po after/before/as soon as/when spójnik sam pokazuje kolejność; po when w zdaniu głównym = czynność późniejsza","example":"When I got back from the gym, my flatmates ordered a pizza."},"tip":"When she left, I cleaned = najpierw wyszła, potem sprzątałem; When she left, I had cleaned = sprzątałem wcześniej (slajd II/3 16). Po after i as soon as Past Perfect jest opcjonalny.","refs":["22.4"],"quiz":["u22-09","u22-10","u22-11","u22-12","u22-13","u22-17","u22-18"]},{"id":"past-perfect-simple-vs-continuous","title":"Past Perfect Simple czy Past Perfect Continuous?","a":{"name":"Past Perfect Simple","when":"czynność zakończona przed momentem w przeszłości (liczy się efekt), podana liczba lub ilość, sytuacja istniejąca przed zdarzeniem (czasowniki stanu), by the time, niespełnione zamiary","example":"By noon, Kinga had written three pages of her report."},"b":{"name":"Past Perfect Continuous","when":"proces trwający aż do momentu w przeszłości lub zakończony tuż przed nim (for/since, widoczne ślady), czynności powtarzane przez dłuższy czas","example":"Kinga had been writing since eight, so her wrist hurt."},"tip":"Jim called the boys: they were playing = nadal grali, gdy zawołał; they had been playing = właśnie skończyli grać (slajd II/3 14). Liczba (three pages, five times) → Simple; długość i proces → Continuous.","refs":["22.1","22.2","22.3"],"quiz":["u22-04","u22-05","u22-06","u22-07","u22-08","u22-14","u22-15"]}],"signals":[{"word":"as soon as","tenses":["Past Perfect","Past Simple"],"example":"As soon as the guests had left, we collapsed on the sofa.","note":"Po as soon as możliwy Past Perfect lub Past Simple – spójnik sam pokazuje kolejność; Past Perfect podkreśla zakończenie pierwszej czynności.","ref":"22.4"},{"word":"after","tenses":["Past Perfect","Past Simple"],"example":"After she had finished her shift, Zosia went for a swim.","note":"after (had) finished – oba czasy poprawne (slajd II/3 16); możliwe też after + -ing: after finishing her shift.","ref":"22.4"},{"word":"before","tenses":["Past Simple","Past Perfect"],"example":"I left the party before the speeches started.","note":"before + Past Perfect: czynność w Past Simple była pierwsza, a ta z before nie nastąpiła lub nie została dokończona: The film ended before I'd worked out who the killer was.","ref":"22.4"},{"word":"until / till","tenses":["Past Perfect","Past Simple"],"example":"Igor didn't relax until he had sent off his application.","note":"until + Past Perfect podkreśla zakończenie (slajdy II/3 17–18). Polskie „dopóki nie” = until + zdanie twierdzące.","ref":"22.4"},{"word":"by the time","tenses":["Past Perfect","Past Perfect Continuous"],"example":"By the time we found a parking space, the concert had started.","note":"by the time + Past Simple, a w zdaniu głównym Past Perfect: to stało się wcześniej. W odniesieniu do przyszłości analogicznie Future Perfect (II/4 8).","ref":"22.1"},{"word":"already","tenses":["Past Perfect","Present Perfect"],"example":"When I arrived, everyone had already left.","note":"already z Past Perfect = wcześniej, niż się spodziewano, przed momentem w przeszłości; w odniesieniu do teraz – Present Perfect.","ref":"22.4"},{"word":"just","tenses":["Past Perfect","Present Perfect"],"example":"The lecture had just begun when the fire alarm went off.","note":"just + Past Perfect = tuż przed innym momentem w przeszłości; just + Present Perfect = przed chwilą (teraz).","ref":"22.4"}]},"23":{"unit":"23","title":"Present perfect simple","titlePl":"Present Perfect Simple (i porównanie z Past Simple)","module":5,"presentations":[{"id":"II-2","slides":[2,14]}],"summary":["Present Perfect łączy przeszłość z teraźniejszością: sytuacja trwa do teraz (for, since), okres się nie skończył (today, this week, życie osoby, która żyje) albo skutek widać teraz.","Past Simple, gdy czas jest podany lub zamknięty (yesterday, ago, last…, in 2019), w pytaniach When…? i gdy sytuacja się skończyła (stan minął, osoba nie żyje).","Po since w zdaniu podrzędnym zwykle Past Simple (since I moved, since I met you), ale gdy stan trwa – Present Perfect (since I've known you, since I've been a teacher).","Po stopniu najwyższym, the first/second time i the only → Present Perfect, często z ever; po than I thought/expected → Past Simple.","already w zdaniach twierdzących, yet w pytaniach i przeczeniach, still przed haven't; „Znam ją od lat” = I've known her for years."],"sections":[{"ref":"23.1","page":106,"title":"Sytuacje i czynności trwające do teraz","rule":"Present Perfect Simple opisuje sytuację, która zaczęła się w przeszłości i **trwa do teraz** (często czasowniki stanu: be, have, know). Okres podajemy przez **for** + okres albo **since** + punkt w czasie. Gdy **since** wprowadza zdanie, zwykle stoi w nim Past Simple (since I moved), ale jeśli stan wciąż trwa – Present Perfect (since I've known you, since I've been a teacher; slajdy II/2 7–13). Po **It's ages/weeks since…** możliwy jest i Present Perfect, i Past Simple.","examples":[{"en":"Ola has had the same laptop for six years.","pl":"Ola ma ten sam laptop od sześciu lat.","note":"stan trwa do teraz; for + okres, po polsku czas teraźniejszy"},{"en":"Since Iza moved to Szczecin, we've only met twice.","pl":"Odkąd Iza przeprowadziła się do Szczecina, spotkałyśmy się tylko dwa razy.","note":"since + Past Simple (jednorazowe zdarzenie); zdanie z since może stać na początku albo na końcu (slajd II/2 6)"},{"en":"Since I've known Wiktor, he's never once been on time.","pl":"Odkąd znam Wiktora, ani razu nie przyszedł na czas.","note":"since + Present Perfect: stan (znajomość) trwa do teraz"},{"en":"It's months since I spoke to my cousin in Dublin. / It's months since I've spoken to my cousin in Dublin.","pl":"Od miesięcy nie rozmawiałem z kuzynem, który mieszka w Dublinie.","note":"It's months/ages since… – oba czasy poprawne"}],"pitfalls":[{"wrong":"I know Kasia since primary school.","right":"I've known Kasia since primary school.","why":"„znam od…” – stan trwa do teraz → Present Perfect, nie Present Simple"},{"wrong":"Since I have started university, I've made lots of new friends.","right":"Since I started university, I've made lots of new friends.","why":"rozpoczęcie studiów to jednorazowe zdarzenie – po since → Past Simple"},{"wrong":"I'm living in Koszalin for three years.","right":"I've lived in Koszalin for three years.","why":"okres od przeszłości do teraz → Present Perfect (Simple lub Continuous); Present Continuous + for mówi o teraźniejszości i przyszłości (I'm working in Kołobrzeg for the summer)"}],"slides":[{"pres":"II-2","slide":4},{"pres":"II-2","slide":6},{"pres":"II-2","slide":8},{"pres":"II-2","slide":10},{"pres":"II-2","slide":13}]},{"ref":"23.2","page":106,"title":"Niezakończony okres czasu","rule":"Present Perfect stosujemy też do czynności zakończonych, jeśli **okres**, w którym się wydarzyły, **jeszcze trwa** (today, this week, życie osoby, która żyje), więc mogą się powtórzyć. Stąd o żyjącej osobie **has won**, o zmarłej **won** (slajd II/2 4: Tokarczuk i Miłosz). W brytyjskim angielskim Present Perfect stoi też po **stopniu najwyższym**, **liczebnikach porządkowych** (the first, the second) i **the only**, często z **ever**.","examples":[{"en":"My cousin has run the Poznań Marathon three times.","pl":"Mój kuzyn trzy razy przebiegł maraton poznański.","note":"żyje i biega – może to powtórzyć"},{"en":"Chopin wrote over fifty mazurkas.","pl":"Chopin napisał ponad pięćdziesiąt mazurków.","note":"nie żyje – nic więcej nie napisze → Past Simple"},{"en":"I've had four cups of coffee this morning, and it isn't even eleven yet.","pl":"Wypiłem dziś rano cztery kawy, a nie ma jeszcze nawet jedenastej.","note":"this morning – poranek jeszcze trwa"},{"en":"This is the first time I've seen snow in October.","pl":"Pierwszy raz widzę śnieg w październiku.","note":"the first time + Present Perfect, choć po polsku czas teraźniejszy"}],"pitfalls":[{"wrong":"This is the first time I see the sea.","right":"This is the first time I've seen the sea.","why":"po This is the first/second time → Present Perfect, mimo polskiego „pierwszy raz widzę”"},{"wrong":"It's the best pizza I ate in my life.","right":"It's the best pizza I've ever eaten.","why":"po stopniu najwyższym w brytyjskim angielskim → Present Perfect (często + ever)"},{"wrong":"The Romans have built many roads in Britain.","right":"The Romans built many roads in Britain.","why":"starożytni Rzymianie już nic nie zbudują – okres zamknięty → Past Simple"}],"slides":[{"pres":"II-2","slide":4},{"pres":"II-2","slide":6}]},{"ref":"23.3","page":107,"title":"Przysłówki typowe dla Present Perfect","rule":"Z Present Perfect (zwłaszcza w znaczeniu z 23.2) często występują: **already, always, ever, never, often, recently, seldom, so far, still, up to now, yet**. **Already** stoi w zdaniach twierdzących, **yet** w przeczeniach i pytaniach (zwykle na końcu zdania), a **still** w przeczeniu przed haven't/hasn't. W amerykańskim angielskim z tymi przysłówkami często używa się Past Simple, ale podręcznik i slajdy trzymają się normy brytyjskiej.","examples":[{"en":"I've already sent the presentation to the whole group.","pl":"Już wysłałem prezentację całej grupie.","note":"already – zdanie twierdzące"},{"en":"Has Igor replied to your email yet?","pl":"Czy Igor już odpisał na twojego maila?","note":"yet w pytaniu = już"},{"en":"We still haven't got our results from the phonetics test.","pl":"Wciąż nie dostaliśmy wyników z testu z fonetyki.","note":"still przed haven't"},{"en":"So far we've done four units of the grammar book.","pl":"Na razie przerobiliśmy cztery unity z podręcznika do gramatyki.","note":"so far = do tej pory"}],"pitfalls":[{"wrong":"I've finished my essay yet.","right":"I've already finished my essay.","why":"yet tylko w pytaniach i przeczeniach; w zdaniu twierdzącym → already"},{"wrong":"I haven't still found a room for next year.","right":"I still haven't found a room for next year.","why":"w przeczeniu still stoi przed haven't/hasn't"}],"slides":[{"pres":"II-2","slide":6}]},{"ref":"23.4","page":107,"title":"Skutek w teraźniejszości","rule":"Present Perfect Simple opisuje zakończoną czynność, której **skutek** widać lub czuć teraz albo która jest teraz ważna. Często towarzyszą mu **just, recently, lately**. Gdy skutku już nie ma, a czynność jest po prostu faktem z przeszłości, używamy Past Simple (slajd II/2 4: He has had an accident / He had an accident).","examples":[{"en":"Oh no, I've left my student ID at home – I can't get into the library.","pl":"O nie, zostawiłem legitymację w domu – nie wejdę do biblioteki.","note":"skutek teraz: nie mam legitymacji"},{"en":"The lift has broken down again, so we'll have to take the stairs.","pl":"Winda znowu się zepsuła, więc musimy iść schodami.","note":"skutek teraz: winda nie działa"},{"en":"Ania has just got back from her Erasmus exchange in Valencia.","pl":"Ania właśnie wróciła z Erasmusa w Walencji.","note":"just = przed chwilą, bardzo niedawno"},{"en":"I lost my wallet once at a festival, but someone handed it in.","pl":"Raz zgubiłem portfel na festiwalu, ale ktoś go oddał.","note":"brak skutku teraz → Past Simple"}],"pitfalls":[{"wrong":"He has just left five minutes ago.","right":"He left five minutes ago.","why":"just (Present Perfect) i ago (Past Simple) się wykluczają: He has just left albo He left five minutes ago"}],"slides":[{"pres":"II-2","slide":4}]},{"ref":"23.5","page":107,"title":"Inne użycia: wiadomości, nowy temat, zdania czasowe","rule":"Present Perfect często **otwiera wiadomość** (w mediach) lub **nowy temat** rozmowy, a szczegóły – kiedy, gdzie, jak – podajemy potem w Past Simple. W zdaniach czasowych o przyszłości (po **when, after, as soon as, until**) możemy użyć Present Perfect zamiast will, żeby podkreślić zakończenie czynności (zob. 28.1).","examples":[{"en":"Heavy snow has closed the road between Koszalin and Słupsk. Several lorries got stuck there early this morning.","pl":"Intensywne opady śniegu zablokowały drogę Koszalin–Słupsk. Kilka ciężarówek utknęło tam wcześnie rano.","note":"wiadomość: Present Perfect, szczegóły: Past Simple"},{"en":"Have you heard? Bartek has got engaged! He proposed to Zuzia in Paris last weekend.","pl":"Słyszałeś? Bartek się zaręczył. Oświadczył się Zuzi w Paryżu w zeszły weekend.","note":"nowy temat: Present Perfect, potem Past Simple"},{"en":"I'll send you the notes as soon as I've typed them up.","pl":"Wyślę ci notatki, jak tylko przepiszę je na komputerze.","note":"zdanie czasowe o przyszłości: as soon as + Present Perfect"}],"pitfalls":[{"wrong":"I'll call you when I'll have finished.","right":"I'll call you when I've finished.","why":"w zdaniu czasowym o przyszłości nie ma will – Present Perfect (lub Present Simple)"}],"slides":[{"pres":"II-1","slide":18}]},{"ref":"23.6","page":107,"title":"Present Perfect a Past Simple – różnice","rule":"Present Perfect: sytuacja lub okres **niezakończone**, **skutek** teraz, czas **nieokreślony**. Past Simple: sytuacja lub okres **zakończone**, brak związku z teraźniejszością, **podany konkretny czas** (yesterday, ago, in 2019, last…) i pytania **When…?** (tabele na slajdach II/2 4 i 6). Gdy porównujemy z wcześniejszym przekonaniem lub oczekiwaniem (**than I thought/expected**, as I imagined), używamy Past Simple (albo Past Perfect), nie Present Perfect.","examples":[{"en":"Kuba has visited Prague several times. He first went there on a school trip in 2018.","pl":"Kuba był w Pradze kilka razy. Pierwszy raz pojechał tam na wycieczkę szkolną w 2018 roku.","note":"czas nieokreślony → Present Perfect; podany czas → Past Simple"},{"en":"When did you start learning English?","pl":"Kiedy zacząłeś uczyć się angielskiego?","note":"pytanie When…? → Past Simple"},{"en":"The flat turned out to be much smaller than I expected.","pl":"Mieszkanie okazało się dużo mniejsze, niż się spodziewałem.","note":"than I expected → Past Simple"}],"pitfalls":[{"wrong":"I've visited Kraków last summer.","right":"I visited Kraków last summer.","why":"podany zakończony czas (last summer) → Past Simple"},{"wrong":"The test was harder than I've expected.","right":"The test was harder than I expected.","why":"than I thought/expected → Past Simple (ewentualnie than I had expected)"},{"wrong":"When have you got back from Spain?","right":"When did you get back from Spain?","why":"pytanie o moment w przeszłości (When…?) → Past Simple"}],"slides":[{"pres":"II-2","slide":4},{"pres":"II-2","slide":6}]}],"uses":[{"tense":"Present Perfect","no":null,"use":"no time of the action given","usePl":"czas czynności nie jest podany (doświadczenie)","example":"I've been to Lisbon, so I can recommend a few places.","ref":"23.6","slide":{"pres":"II-2","slide":4}},{"tense":"Past Simple","no":null,"use":"the time of the action given","usePl":"czas czynności jest podany","example":"We went to Lisbon in the summer of 2023.","ref":"23.6","slide":{"pres":"II-2","slide":4}},{"tense":"Present Perfect","no":null,"use":"ongoing actions and situations that started in the past and continue up till now","usePl":"sytuacja trwa od przeszłości do teraz","example":"My parents have run a small shop in Sianów for twenty years.","ref":"23.1","slide":{"pres":"II-2","slide":4}},{"tense":"Past Simple","no":null,"use":"finished actions/states","usePl":"czynność lub stan zakończone (także z for)","example":"My grandad worked in the shipyard in Gdańsk for thirty years and then retired.","ref":"23.6","slide":{"pres":"II-2","slide":4}},{"tense":"Present Perfect","no":null,"use":"present result/relevance","usePl":"skutek lub znaczenie dla teraźniejszości","example":"Someone has eaten my yoghurt, so I've got nothing for breakfast.","ref":"23.4","slide":{"pres":"II-2","slide":4}},{"tense":"Past Simple","no":null,"use":"no present result","usePl":"brak skutku w teraźniejszości","example":"Kacper broke his arm skiing, but it healed quickly.","ref":"23.6","slide":{"pres":"II-2","slide":4}},{"tense":"Present Perfect","no":null,"use":"actions which can be repeated","usePl":"czynność może się powtórzyć (osoba żyje, okres trwa)","example":"Our university choir has won the national competition three times.","ref":"23.2","slide":{"pres":"II-2","slide":4}},{"tense":"Past Simple","no":null,"use":"actions which can't be repeated","usePl":"czynności nie da się powtórzyć (osoba nie żyje, okres się skończył)","example":"Maria Skłodowska-Curie won two Nobel Prizes.","ref":"23.2","slide":{"pres":"II-2","slide":4}},{"tense":"Present Perfect","no":null,"use":"this week/month/year/today","usePl":"today / this week itp., gdy okres jeszcze trwa","example":"I've had three lectures today, and there's one more at six.","ref":"23.2","slide":{"pres":"II-2","slide":4}},{"tense":"Past Simple","no":null,"use":"this week/month/year/today","usePl":"today / this week itp., gdy okres się skończył (albo zakończona część dnia, np. this morning po południu)","example":"(At 11 p.m.) I didn't get much done today – I'll start earlier tomorrow.","ref":"23.6","slide":{"pres":"II-2","slide":4}},{"tense":"Present Perfect","no":null,"use":"since / for / just / already / yet / still / recently / lately / ever","usePl":"okoliczniki typowe dla Present Perfect","example":"Have you finished your presentation yet? – No, I've only just started.","ref":"23.3","slide":{"pres":"II-2","slide":6}},{"tense":"Past Simple","no":null,"use":"ago / last week, etc.","usePl":"okoliczniki zakończonego czasu","example":"I handed in my essay two days ago.","ref":"23.6","slide":{"pres":"II-2","slide":6}},{"tense":"Present Perfect","no":null,"use":"superlatives/ordinal numbers","usePl":"po stopniu najwyższym i liczebnikach porządkowych (często + ever)","example":"This is the third time I've lost my umbrella this month.","ref":"23.2","slide":{"pres":"II-2","slide":6}},{"tense":"Past Simple","no":null,"use":"than I thought/expected","usePl":"porównanie z wcześniejszym przekonaniem lub oczekiwaniem","example":"The train journey to Kraków took longer than I thought.","ref":"23.6","slide":{"pres":"II-2","slide":6}},{"tense":"Present Perfect","no":null,"use":"news reports and introducing a new topic","usePl":"otwarcie wiadomości lub nowego tematu (szczegóły potem w Past Simple)","example":"Guess what? Zosia has got an internship in Dublin! She found out on Monday.","ref":"23.5","slide":null},{"tense":"Present Perfect","no":null,"use":"time clauses with future reference (when, after, as soon as)","usePl":"zdania czasowe o przyszłości – zamiast will, gdy liczy się zakończenie","example":"I'll text you when I've landed in Dublin.","ref":"23.5","slide":null}],"quiz":[{"id":"u23-01","type":"choice","prompt":"Have you ever been to Gdańsk? – Yes, I ___ there on a school trip in 2019.","options":["have been","went","have gone"],"answer":1,"explain":"Odpowiedź podaje konkretny czas (in 2019) → Past Simple. Pytanie z ever jest w Present Perfect, bo nie dotyczy konkretnego momentu.","ref":"23.6"},{"id":"u23-02","type":"gap","prompt":"The bakery on our street ___ (be) in the same building for over fifty years, and it's still the best place in town for doughnuts.","answers":["has been","'s been"],"explain":"Stan zaczął się w przeszłości i trwa do teraz (for + okres) → Present Perfect; po polsku czas teraźniejszy („jest od pięćdziesięciu lat”).","ref":"23.1"},{"id":"u23-03","type":"choice","prompt":"My grandparents ___ in Słupsk for forty years, but in 2015 they moved to Koszalin.","options":["have lived","lived","have been living"],"answer":1,"explain":"Mimo for + okres stan jest zakończony (już tam nie mieszkają) → Past Simple. Present Perfect znaczyłby, że wciąż tam mieszkają.","ref":"23.6"},{"id":"u23-04","type":"use","prompt":"Tomek had a bike accident, but he's completely fine now.","options":["skutek lub znaczenie dla teraźniejszości (present result/relevance) – Present Perfect","brak skutku w teraźniejszości (no present result) – Past Simple","podany czas czynności (the time of the action given) – Past Simple","czynność, której nie da się powtórzyć (actions which can't be repeated) – Past Simple"],"answer":1,"explain":"Wypadek był, ale nie ma skutku teraz (Tomek jest zdrowy) → Past Simple. Tomek has had an accident sugerowałoby, że skutki są ważne teraz.","ref":"23.6"},{"id":"u23-05","type":"gap","prompt":"Come and sit down – the match ___ (just / start), so you've only missed the first two minutes.","answers":["has just started","'s just started"],"explain":"Czynność sprzed chwili, ważna teraz (just; mecz trwa już dwie minuty) → Present Perfect; w brytyjskim angielskim just łączy się z Present Perfect. Is just starting znaczyłoby, że mecz dopiero się zaczyna i nic nie przegapiliśmy.","ref":"23.4"},{"id":"u23-06","type":"choice","prompt":"Wisława Szymborska ___ the Nobel Prize in Literature.","options":["has won","won"],"answer":1,"explain":"Szymborska nie żyje (zm. 2012), więc tej czynności nie da się powtórzyć → Past Simple, jak Miłosz na slajdzie II/2 4.","ref":"23.2"},{"id":"u23-07","type":"use","prompt":"Kamila has won the university chess tournament twice and hopes to win it again next year.","options":["sytuacja trwająca do teraz (ongoing actions and situations…) – Present Perfect","czynność, którą można powtórzyć (actions which can be repeated) – Present Perfect","stopień najwyższy lub liczebnik porządkowy (superlatives/ordinal numbers) – Present Perfect","okres jeszcze trwa (this week/month/year/today) – Present Perfect"],"answer":1,"explain":"Kamila wciąż gra i może wygrać znowu → czynność, którą można powtórzyć (Present Perfect). Gdyby skończyła karierę: Kamila won the tournament twice.","ref":"23.2"},{"id":"u23-08","type":"choice","prompt":"(At 3 p.m.) Sorry, I ___ your message this morning – my phone was off during the exam.","options":["haven't seen","didn't see","hadn't seen"],"answer":1,"explain":"Ranek już się skończył (jest 15:00), więc okres jest zamknięty → Past Simple. Gdyby wciąż był ranek, użylibyśmy Present Perfect.","ref":"23.6"},{"id":"u23-09","type":"gap","prompt":"Is Wojtek ill? I ___ (not see) him at uni this week, and it's already Thursday.","answers":["haven't seen","have not seen"],"explain":"Tydzień jeszcze trwa (jest czwartek), więc okres jest niezakończony → Present Perfect.","ref":"23.2"},{"id":"u23-10","type":"choice","prompt":"I took my driving test two weeks ago, but I ___ the results yet.","options":["didn't receive","haven't received","don't receive","hadn't received"],"answer":1,"explain":"ago → Past Simple (took), ale yet i czekanie trwające do teraz → Present Perfect (norma brytyjska).","ref":"23.3"},{"id":"u23-11","type":"choice","prompt":"This is the most stressful week I ___ – three exams and a presentation!","options":["ever had","have ever had","had ever","ever have"],"answer":1,"explain":"Po stopniu najwyższym (the most stressful…) w brytyjskim angielskim → Present Perfect, często z ever.","ref":"23.2"},{"id":"u23-12","type":"choice","prompt":"The grammar test was much easier than I ___.","options":["have expected","expected","have been expecting"],"answer":1,"explain":"Porównanie z wcześniejszym oczekiwaniem (than I expected/thought) → Past Simple (ewentualnie Past Perfect), nie Present Perfect.","ref":"23.6"},{"id":"u23-13","type":"gap","prompt":"This is the first time I ___ (eat) sushi – it's better than I thought!","answers":["have eaten","'ve eaten"],"explain":"Po This is the first time → Present Perfect, choć po polsku mówimy w czasie teraźniejszym („pierwszy raz jem”). Za to than I thought – Past Simple.","ref":"23.2"},{"id":"u23-14","type":"gap","prompt":"Since Natalia ___ (become) a paramedic, she has saved dozens of lives.","answers":["became"],"explain":"Zostanie ratowniczką to jednorazowe zdarzenie, więc w zdaniu z since → Past Simple (jak since I became a teacher, slajd II/2 13).","ref":"23.1"},{"id":"u23-15","type":"gap","prompt":"Since I ___ (know) Marcel, he has always been there for me.","answers":["have known","'ve known"],"explain":"Znajomość to stan, który trwa do teraz → since + Present Perfect (since I've known you, slajd II/2 10). O zdarzeniu powiedzielibyśmy: since I met him.","ref":"23.1"},{"id":"u23-16","type":"choice","prompt":"I'm in my second year now. Since I ___ a student, I've read more books than ever before.","options":["am","have been","had been"],"answer":1,"explain":"Bycie studentem to stan, który trwa → since + Present Perfect (since I've been a teacher, slajd II/2 13); o samym początku: since I became a student.","ref":"23.1"},{"id":"u23-17","type":"fix","prompt":"When have you started working at the café?","wrong":"have you started","fixes":["did you start"],"answers":["When did you start working at the café?"],"explain":"Pytanie When…? dotyczy konkretnego momentu w przeszłości → zawsze Past Simple.","ref":"23.6"},{"id":"u23-18","type":"fix","prompt":"I know Bartek since we were at secondary school.","wrong":"I know","fixes":["I have known","I've known"],"answers":["I have known Bartek since we were at secondary school.","I've known Bartek since we were at secondary school."],"explain":"„Znam od…” – stan trwa od przeszłości do teraz → Present Perfect (know to czasownik stanu, więc Simple, nie Continuous).","ref":"23.1"}],"translations":[{"id":"u23-t01","pl":"Znam ją od dzieciństwa.","answers":["I've known her since childhood.","I've known her since we were children.","I've known her since I was a child."],"keys":["have known","since"],"explain":"„Znam od…” – stan trwa do teraz → Present Perfect; know to czasownik stanu, więc nie Continuous.","ref":"23.1"},{"id":"u23-t02","pl":"Od kiedy się przeprowadziłem, nie widziałem go.","answers":["I haven't seen him since I moved.","Since I moved, I haven't seen him.","I haven't seen him since I moved house."],"keys":["since","moved","have not seen"],"explain":"Przeprowadzka to jednorazowe zdarzenie → since + Past Simple; w zdaniu głównym okres do teraz → Present Perfect (kolejność zdań dowolna, slajd II/2 6).","ref":"23.1"},{"id":"u23-t03","pl":"To pierwszy raz, kiedy jem pierogi z jagodami.","answers":["This is the first time I've eaten blueberry pierogi.","It's the first time I've eaten pierogi with blueberries.","This is the first time I've eaten pierogi with bilberries."],"keys":["first time","have eaten"],"explain":"Po This is the first time → Present Perfect, mimo polskiego czasu teraźniejszego („jem”).","ref":"23.2"},{"id":"u23-t04","pl":"To najlepszy wykład, na jakim kiedykolwiek byłem.","answers":["It's the best lecture I've ever been to.","That was the best lecture I've ever been to.","It's the best lecture I have ever attended."],"keys":["best","have ever"],"explain":"Po stopniu najwyższym + ever → Present Perfect; polski czas przeszły („byłem”) nie decyduje.","ref":"23.2"},{"id":"u23-t05","pl":"Od kiedy poznałam twoich rodziców, zawsze mi pomagają.","answers":["Since I met your parents, they've always helped me.","Your parents have always helped me since I met them."],"keys":["since i met","have always helped"],"explain":"Poznanie to zdarzenie → since + Past Simple (since I met, slajd II/2 8); pomaganie trwa do teraz → Present Perfect, choć po polsku jest czas teraźniejszy.","ref":"23.1"},{"id":"u23-t06","pl":"Odkąd znam Julię i Adama, zawsze byli punktualni.","answers":["Since I've known Julia and Adam, they've always been punctual.","Julia and Adam have always been punctual since I've known them."],"keys":["since i have known","have always been"],"explain":"Znajomość to stan, który trwa → since + Present Perfect (since I've known you, slajd II/2 10); w zdaniu głównym też Present Perfect, mimo polskiego „byli”.","ref":"23.1"},{"id":"u23-t07","pl":"Odkąd jestem na studiach, przeczytałem ponad sto książek.","answers":["Since I've been at university, I've read over a hundred books.","I've read more than a hundred books since I've been a student.","Since I started university, I've read over a hundred books."],"keys":["since","have read"],"explain":"Bycie studentem trwa → since I've been (jak since I've been a teacher, slajd II/2 13) albo zdarzenie: since I started/became. W zdaniu głównym Present Perfect.","ref":"23.1"},{"id":"u23-t08","pl":"Byłeś kiedyś w Gdańsku?","answers":["Have you ever been to Gdańsk?"],"keys":["have you ever been to"],"explain":"Pytanie o doświadczenie bez podanego czasu → Present Perfect + ever (been to = być gdzieś i wrócić). Polski czas przeszły („byłeś”) myli.","ref":"23.2"}],"pairs":[{"id":"pp-vs-ps","title":"Present Perfect czy Past Simple?","a":{"name":"Present Perfect","when":"okres trwa do teraz (for/since, today, this week, życie osoby, która żyje), skutek widać teraz, czas nie jest podany, po stopniu najwyższym i the first time; sygnały: just, already, yet, ever, never, so far","example":"I've lost my keys, so I can't get in."},"b":{"name":"Past Simple","when":"czas jest podany lub okres zamknięty (yesterday, ago, in 2019, last week), sytuacja się skończyła, brak skutku teraz, osoba nie żyje; pytania When…?; than I thought/expected","example":"I lost my keys at a festival in 2022, but I got them back."},"tip":"Zapytaj: czy okres, w którym to się stało, jeszcze trwa albo czy jest skutek teraz? Tak → Present Perfect; nie albo pada konkretny czas → Past Simple.","refs":["23.1","23.2","23.4","23.6"],"quiz":["u23-01","u23-03","u23-04","u23-05","u23-06","u23-07","u23-08","u23-09","u23-10","u23-11","u23-12","u23-17"]},{"id":"since-for-ago","title":"since, for czy ago?","a":{"name":"since / for (Present Perfect)","when":"jak długo coś trwa do teraz: since + punkt w czasie (since Monday, since 2023, since I moved), for + okres (for two weeks)","example":"I've known Igor since our first week at uni. / I've known Igor for two years."},"b":{"name":"ago (Past Simple)","when":"kiedy coś się stało: odliczamy wstecz od teraz, czynność jest zakończona","example":"I met Igor two years ago."},"tip":"since i for odpowiadają na pytanie „jak długo?”, ago na „kiedy?”. For z Past Simple tylko o zamkniętym okresie (I lived there for two years).","refs":["23.1","23.6"],"quiz":["u23-02","u23-03","u23-10","u23-14","u23-15","u23-16","u23-18"]}],"signals":[{"word":"since","tenses":["Present Perfect","Present Perfect Continuous"],"example":"I've lived in Koszalin since 2023.","note":"since + punkt w czasie. W zdaniu wprowadzonym przez since zwykle Past Simple (since I moved), ale gdy stan trwa – Present Perfect (since I've known you, since I've been a student).","ref":"23.1"},{"word":"for","tenses":["Present Perfect","Present Perfect Continuous"],"example":"We've been flatmates for two years.","note":"for + okres. Gdy okres się skończył – Past Simple (I lived in Gdynia for two years, then I moved). Present Continuous + for mówi o teraźniejszości i przyszłości (I'm working in Kołobrzeg for the summer).","ref":"23.1"},{"word":"just","tenses":["Present Perfect"],"example":"Sorry, Marta has just left.","note":"just = przed chwilą. Ale just now (= przed momentem) łączy się z Past Simple: I saw her just now. W amerykańskim angielskim just także z Past Simple.","ref":"23.4"},{"word":"already","tenses":["Present Perfect"],"example":"I've already paid for the tickets.","note":"Zwykle w zdaniach twierdzących, przed czasownikiem głównym (have already paid). W pytaniu wyraża zdziwienie: Have you finished already?","ref":"23.3"},{"word":"yet","tenses":["Present Perfect"],"example":"Has the lecturer published our grades yet?","note":"Tylko w pytaniach i przeczeniach, zwykle na końcu zdania. W zdaniu twierdzącym – already (nie: I've finished yet).","ref":"23.3"},{"word":"still","tenses":["Present Perfect"],"example":"I still haven't heard from the dean's office.","note":"Z Present Perfect w przeczeniu, przed haven't/hasn't (nie: I haven't still…). W twierdzeniach still zwykle z Present Simple/Continuous: I'm still waiting.","ref":"23.3"},{"word":"recently","tenses":["Present Perfect","Present Perfect Continuous"],"example":"Have you read any good books recently?","note":"Może też iść z Past Simple, gdy chodzi o jedno konkretne zdarzenie (= niedawno): I recently moved to Koszalin.","ref":"23.4"},{"word":"lately","tenses":["Present Perfect","Present Perfect Continuous"],"example":"I've been feeling really tired lately.","note":"Prawie zawsze z Present Perfect (Continuous); z Past Simple go nie łączymy.","ref":"23.4"},{"word":"ever","tenses":["Present Perfect"],"example":"Have you ever eaten żurek?","note":"Także po stopniu najwyższym i the first/the only: the best… I've ever… Gdy okres się skończył (osoba nie żyje) – Past Simple: Did your great-grandma ever travel abroad?","ref":"23.2"},{"word":"never","tenses":["Present Perfect"],"example":"I've never been to Scotland.","note":"Gdy okres życia lub sytuacji się skończył – Past Simple: My grandad never learnt to drive.","ref":"23.3"},{"word":"so far","tenses":["Present Perfect"],"example":"So far this semester I've only missed one class.","note":"Zawsze okres do teraz – nie łączymy z Past Simple.","ref":"23.3"},{"word":"how long","tenses":["Present Perfect","Present Perfect Continuous"],"example":"How long have you known Szymon?","note":"„Jak długo / od kiedy?” o czymś, co trwa – nie Present Simple (nie: How long do you know…?). O zamkniętym okresie – Past Simple: How long did you live in Gdynia?","ref":"23.1"},{"word":"ago","tenses":["Past Simple"],"example":"We moved into this flat three months ago.","note":"Nigdy z Present Perfect (nie: I've moved here three months ago). Ago liczymy wstecz od teraz.","ref":"23.6"},{"word":"last… (last week, last year, last Monday)","tenses":["Past Simple"],"example":"We had our first grammar test last Monday.","note":"Ale since last… i for the last… → Present Perfect: I haven't seen her since last week; I've lived here for the last two years.","ref":"23.6"},{"word":"yesterday","tenses":["Past Simple"],"example":"I bought a new phone yesterday.","note":"Nie łączymy z Present Perfect. Ale since yesterday → Present Perfect: I've had a headache since yesterday.","ref":"23.6"},{"word":"in 2019 (konkretna data)","tenses":["Past Simple"],"example":"Hanna started learning German in 2019.","note":"Podany moment w przeszłości → Past Simple; since 2019 → Present Perfect: She's lived in Berlin since 2019.","ref":"23.6"},{"word":"when (pytanie o czas)","tenses":["Past Simple"],"example":"When did you get back from Berlin?","note":"Pytanie When…? o moment w przeszłości – zawsze Past Simple (nie: When have you got back?). W zdaniu czasowym o przyszłości when + Present Perfect jest możliwe: Call me when you've finished.","ref":"23.6"},{"word":"today / this week","tenses":["Present Perfect","Past Simple"],"example":"We've had two tests this week, and there's one more on Friday. / (On Friday evening) We had three tests this week.","note":"Present Perfect, gdy okres jeszcze trwa; Past Simple, gdy uważamy go za zakończony albo mówimy o zakończonej części (this morning powiedziane po południu).","ref":"23.2"}]},"24":{"unit":"24","title":"Present perfect continuous","titlePl":"Present Perfect Continuous (i porównanie z Present Perfect Simple)","module":5,"presentations":[{"id":"II-2","slides":[15,18]}],"summary":["Present Perfect Continuous (have/has been + -ing): czynność zaczęła się w przeszłości i trwa do teraz albo właśnie się skończyła; nacisk na czas trwania (for, since, how long, all day).","Powtarzana czynność bez liczby → Continuous (all morning); z liczbą razy → Simple (three times).","Continuous – sytuacja tymczasowa lub nowa (lately, recently); Simple – stała. Z live, work, study, teach możliwe są oba czasy.","Continuous – czynność niezakończona albo wyjaśnienie obecnego stanu (Why are your hands dirty? – I've been…); Simple – czynność zakończona, liczy się rezultat.","Czasowniki stanu (know, be, have = mieć) i strona bierna – zwykle tylko Simple. „Czekam od godziny” = I've been waiting for an hour (nie I'm waiting)."],"sections":[{"ref":"24.1","page":110,"title":"Czynności trwające do teraz lub dopiero zakończone","rule":"Present Perfect Continuous (**have/has been + -ing**), często z **for/since**, opisuje czynność, która zaczęła się w przeszłości i **trwa nadal** albo **właśnie się skończyła**. Akcent pada na **czas trwania**, więc nie podajemy liczby powtórzeń – z liczbą (three times) używamy Present Perfect Simple. Simple zwykle znaczy, że czynność jest zakończona, Continuous – że trwa. Continuous zwykle nie występuje w stronie biernej.","examples":[{"en":"Marek has been revising for his grammar test since eight o'clock.","pl":"Marek uczy się do kolokwium od ósmej.","note":"trwa do teraz; po polsku czas teraźniejszy"},{"en":"Bartek has been sending me memes all day.","pl":"Bartek cały dzień wysyła mi memy.","note":"powtarzane, bez liczby → Continuous"},{"en":"Bartek has sent me twelve memes today.","pl":"Bartek wysłał mi dziś dwanaście memów.","note":"podana liczba → Simple"},{"en":"I've been watching the series you recommended – I'm on episode five now.","pl":"Oglądam serial, który mi poleciłeś – jestem teraz na piątym odcinku.","note":"czynność niezakończona"}],"pitfalls":[{"wrong":"I've been drinking three coffees since breakfast.","right":"I've drunk three coffees since breakfast.","why":"podana liczba (three) → Present Perfect Simple, nie Continuous"},{"wrong":"I've been knowing Kuba for ten years.","right":"I've known Kuba for ten years.","why":"know to czasownik stanu – nie ma formy Continuous (zob. Unit 25)"},{"wrong":"The essays have been being marked all week.","right":"The lecturers have been marking the essays all week.","why":"Present Perfect Continuous zwykle nie występuje w stronie biernej – użyj strony czynnej"}],"slides":[{"pres":"II-2","slide":17}]},{"ref":"24.2","page":110,"title":"Sytuacje tymczasowe","rule":"Present Perfect Continuous sugeruje sytuację **tymczasową**, a z **lately/recently** – nową, która może się zmienić; Simple brzmi bardziej **trwale** (slajd II/2 17). Z czasownikami **live, work, study, teach** możliwe są oba czasy, prawie bez różnicy znaczenia (Simple – bardziej na stałe). Żeby powiedzieć, jak długo coś trwa od przeszłości, używamy Present Perfect (Continuous) + for, nie Present Continuous.","examples":[{"en":"I've been sleeping on my friend's sofa since I came back from Ireland.","pl":"Śpię na kanapie u kolegi, odkąd wróciłem z Irlandii.","note":"sytuacja tymczasowa"},{"
