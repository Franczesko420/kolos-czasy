/* ---------- toast + dialog (alert/confirm are blocked in some hosts) ---------- */
let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}
function dialog({ title, body = '', ok = 'OK', cancel = 'Anuluj', extra = '' }) {
  return new Promise((resolve) => {
    const m = $('#modal');
    m.innerHTML = `<div class="box glass" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
      <h2 id="dlg-t">${esc(title)}</h2>${body ? `<p class="muted">${body}</p>` : ''}${extra}
      <div class="row" style="justify-content:flex-end">${cancel ? `<button class="btn ghost" data-r="0">${esc(cancel)}</button>` : ''}<button class="btn primary" data-r="1">${esc(ok)}</button></div></div>`;
    m.hidden = false;
    const done = (v) => { m.hidden = true; m.innerHTML = ''; document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = (e) => { if (e.key === 'Escape') done(false); };
    document.addEventListener('keydown', onKey);
    m.onclick = (e) => { const b = e.target.closest('[data-r]'); if (b) done(b.dataset.r === '1'); else if (e.target === m) done(false); };
    const first = $('[data-r="1"]', m); if (first) first.focus();
  });
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { return false; }
}

/* ---------- data lookups ---------- */
const UNIT_ORDER = ['M5-start', '19', '20', '21', '22', '23', '24', '25', 'Review 5', 'M6-start', '26', '27', '28', '29', 'Review 6', 'reported'];
const unitRoute = (u) => {
  if (u === 'M5-start') return '#m5-start';
  if (u === 'M6-start') return '#m6-start';
  if (u === 'Review 5') return '#review-5';
  if (u === 'Review 6') return '#review-6';
  return '#unit-' + u;
};
const unitName = (u) => {
  if (u === 'M5-start') return 'Module 5: start';
  if (u === 'M6-start') return 'Module 6: start';
  if (u === 'reported') return 'Mowa zależna';
  if (String(u).startsWith('Review')) return u.replace('Review', 'Review Module');
  return 'Unit ' + u;
};
const unitOfRef = (ref) => {
  const m = String(ref || '').match(/^(\d+)/);
  if (!m) return null;
  const n = m[1];
  if (D.units[n]) return n;
  if (n === '50' || n === '51') return D.units.reported ? 'reported' : null;
  return null;
};
/* page of a book section, e.g. "23.6" -> 107 */
const pageOfRef = (ref) => {
  const u = unitOfRef(ref);
  if (!u) return null;
  const c = D.content[u];
  const s = c && c.sections && c.sections.find((x) => x.ref === ref);
  if (s && s.page) return s.page;
  const unit = D.units[u];
  const sp = unit && unit.section_pages && unit.section_pages[ref];
  if (sp && sp.length) return sp[0];
  return unit && unit.explain && unit.explain[0] || null;
};
/* chip to a book section: links to the unit page and scrolls to the section */
function refChip(ref) {
  if (!ref) return '';
  const u = unitOfRef(ref);
  if (!u) return `<span class="chip static"><span class="k">§</span>${esc(ref)}</span>`;
  return `<a class="chip" href="${unitRoute(u)}" data-act="go-sec" data-sec="${esc(ref)}" title="Notatka do sekcji ${esc(ref)}"><span class="k">§</span>${esc(ref)}</a>`;
}
/* chip that opens a book page in the viewer */
function pageChip(p, isKey = false) {
  if (p == null) return '';
  return `<button class="chip${isKey ? ' key' : ''}" data-act="${isKey ? 'key' : 'page'}" data-p="${p}" title="${isKey ? 'Klucz odpowiedzi' : 'Strona w książce'}"><span class="k">${isKey ? 'klucz' : 's.'}</span>${p}</button>`;
}
function pagesChips(pages, isKey = false) { return (pages || []).map((p) => pageChip(p, isKey)).join(''); }
function slideChip(pres, from, to) {
  const lbl = to && to !== from ? `${from}–${to}` : `${from}`;
  return `<a class="chip" href="#${pres.toLowerCase()}" data-act="go-slide" data-pres="${esc(pres)}" data-slide="${from}" title="Slajdy"><span class="k">${esc(pres.replace('-', '/'))}</span>${lbl}</a>`;
}

/* Plan: which exam date I'm preparing for, the day-by-day tasks, what's done, and moving unfinished tasks forward.
   Plans A (6.11) and B (16.11) come from the data; C is an own exam date built on A or B. Tasks keep their order;
   "moved" stores a new date per task when the plan is spread again from a given day (late start, missed days). */
const Plan = (() => {
  const base = {};
  D.plans.plans.forEach((p) => { base[p.id] = p; });
  const KIND = { test: 'test', note: 'notatka', book: 'książka', quiz: 'quiz', mel: 'MyEnglishLab', review: 'powtórka', exam: 'kolokwium' };

  const doneMap = () => Store.get('done', {});
  const isDone = (id) => !!doneMap()[id];
  function toggle(id) {
    let now = false;
    Store.upd('done', {}, (m) => { if (m[id]) delete m[id]; else { m[id] = Date.now(); now = true; } });
    return now;
  }

  /* the source plan and exam date of a plan id */
  function spec(id) {
    if (id === 'C') {
      const date = Store.get('examCustom', '');
      if (!/^\d{4}-\d\d-\d\d$/.test(date)) return null;
      const src = date <= base.A.exam ? base.A : base.B;
      return { id: 'C', src, exam: date, label: `Kolokwium ${dShort(date)}`, who: 'własny termin', scope: src.id };
    }
    const p = base[id];
    return p ? { id, src: p, exam: p.exam, label: p.label, who: p.who, scope: id } : null;
  }
  function tasksOf(s) {
    const out = [];
    s.src.days.forEach((d) => d.tasks.forEach((t) => out.push(Object.assign({ date: d.date, examDay: d.date === s.src.exam }, t))));
    return out;
  }
  const movedOf = (id) => (Store.get('moved', {})[id] || {});
  function dateOf(s, t, moved) {
    if (t.examDay) return s.exam;
    return moved[t.id] || t.date;
  }
  /* plan as shown: days with tasks at their current dates */
  function build(s) {
    const moved = movedOf(s.id);
    const by = {};
    tasksOf(s).forEach((t) => {
      const d = dateOf(s, t, moved);
      (by[d] = by[d] || []).push(Object.assign({}, t, { date: d }));
    });
    if (!by[s.exam]) by[s.exam] = [];
    const days = Object.keys(by).sort().map((date) => ({ date, tasks: by[date] }));
    return { id: s.id, scope: s.scope, exam: s.exam, label: s.label, who: s.who, custom: s.id === 'C', days, moved: Object.keys(moved).length > 0 };
  }

  const chosenId = () => Store.get('exam', '');
  const chosen = () => !!spec(chosenId());
  const current = () => build(spec(chosenId()) || spec('A'));

  /* spread unfinished tasks from `from` up to the day before the exam, keeping their order and roughly equal minutes per day.
     MyEnglishLab tasks keep their own date (they have deadlines) unless it has already passed. */
  function reflow(id, from) {
    const s = spec(id);
    if (!s) return 0;
    const n = diffDays(from, s.exam);
    if (n < 1) return 0;
    const done = doneMap();
    const list = tasksOf(s).filter((t) => !t.examDay && !done[t.id]);
    const moved = Object.assign({}, movedOf(id));
    const flow = [];
    list.forEach((t) => {
      if (t.kind === 'mel' && t.date >= from && t.date < s.exam) moved[t.id] = t.date;
      else flow.push(t);
    });
    const total = flow.reduce((a, t) => a + (t.mins || 15), 0) || 1;
    let acc = 0;
    flow.forEach((t) => {
      const i = Math.min(n - 1, Math.floor((acc / total) * n + 1e-9));
      moved[t.id] = addDays(from, i);
      acc += t.mins || 15;
    });
    Store.upd('moved', {}, (m) => { m[id] = moved; });
    return flow.length;
  }
  function choose(id, date) {
    if (id === 'C') {
      if (!date || date <= todayIso()) return false;
      Store.set('examCustom', date);
      Store.set('exam', 'C');
      reflow('C', todayIso());
      return true;
    }
    if (!base[id]) return false;
    Store.set('exam', id);
    const s = spec(id);
    const t = todayIso();
    const started = t > s.src.days[0].date;
    const anyDone = tasksOf(s).some((x) => isDone(x.id));
    if (started && !anyDone && !Object.keys(movedOf(id)).length && t < s.exam) reflow(id, t);
    return true;
  }
  function reset(id) { Store.upd('moved', {}, (m) => { delete m[id]; }); }

  function stats(plan = current()) {
    const m = doneMap();
    let total = 0, done = 0, mins = 0, minsDone = 0;
    plan.days.forEach((d) => d.tasks.forEach((t) => { total++; mins += t.mins || 0; if (m[t.id]) { done++; minsDone += t.mins || 0; } }));
    return { total, done, pct: total ? Math.round((done / total) * 100) : 0, mins, minsDone };
  }
  /* where are we in the plan today */
  function today(plan = current()) {
    const t = todayIso();
    const m = doneMap();
    const daysLeft = diffDays(t, plan.exam);
    const first = plan.days[0].date;
    if (t < first) return { mode: 'before', day: plan.days[0], overdue: [], daysLeft, t };
    if (t > plan.exam) return { mode: 'after', day: null, overdue: [], daysLeft, t };
    const day = plan.days.find((d) => d.date === t) || null;
    const overdue = [];
    plan.days.forEach((d) => { if (d.date < t) d.tasks.forEach((x) => { if (!m[x.id]) overdue.push(x); }); });
    return { mode: t === plan.exam ? 'exam' : 'during', day, overdue, daysLeft, t };
  }

  /* "II-1 7–12" -> slide chip */
  function slidesChip(s) {
    const m = String(s || '').match(/^(II-\d)\s+(\d+)(?:\s*[–-]\s*(\d+))?$/);
    return m ? slideChip(m[1], Number(m[2]), m[3] ? Number(m[3]) : null) : '';
  }
  function taskHtml(t, opts = {}) {
    const done = isDone(t.id);
    const late = opts.late ? `<span class="tag warn">z ${esc(dShort(t.date))}</span>` : '';
    const open = t.route ? `<a class="chip" href="${esc(t.route)}">Otwórz${icon('right')}</a>` : '';
    return `<div class="task${done ? ' done' : ''}">
      ${checkBtn(done, 'task', `data-id="${esc(t.id)}"`, 'Zrobione: ' + t.title)}
      <div class="body"><div class="ttl">${esc(t.title)}</div>
        <div class="meta">${late}<span class="tag plain">${esc(KIND[t.kind] || t.kind)}</span>${t.mins ? `<span class="muted small">ok. ${t.mins} min</span>` : ''}
          ${open}${slidesChip(t.slides)}${pagesChips(t.pages)}${pagesChips(t.key, true)}</div></div></div>`;
  }
  const minsLeft = (tasks) => tasks.filter((x) => !isDone(x.id)).reduce((a, x) => a + (x.mins || 0), 0);
  function dayHtml(d, plan = current()) {
    const t = todayIso();
    const m = doneMap();
    const n = d.tasks.length, k = d.tasks.filter((x) => m[x.id]).length;
    const cls = d.date === t ? ' today' : d.date < t ? ' past' : '';
    const examDay = d.date === plan.exam;
    const left = minsLeft(d.tasks);
    return `<section class="glass day${cls}" id="d-${d.date}">
      <div class="day-h"><h3>${esc(dLong(d.date))}${d.date === t ? ' <span class="tag">dziś</span>' : ''}${examDay ? ' <span class="tag warn">kolokwium</span>' : ''}</h3>
        <span class="muted small num">${k}/${n}${left ? ` · ok. ${left} min` : ''}</span></div>
      <div class="tasks">${d.tasks.length ? d.tasks.map((x) => taskHtml(x)).join('') : '<p class="muted small">Wolne.</p>'}</div></section>`;
  }

  /* calendar file (.ics) with one all-day event per day of the plan */
  function ics(plan = current()) {
    const esc2 = (s) => String(s).replace(/[\\;,]/g, (c) => '\\' + c).replace(/\n/g, '\\n');
    const fold75 = (line) => { const out = []; let s = line; while (s.length > 74) { out.push(s.slice(0, 74)); s = ' ' + s.slice(74); } out.push(s); return out.join('\r\n'); };
    const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Kolos z czasow//PL', 'CALSCALE:GREGORIAN'];
    plan.days.forEach((d) => {
      if (!d.tasks.length) return;
      const dt = d.date.replace(/-/g, '');
      const next = addDays(d.date, 1).replace(/-/g, '');
      const examDay = d.date === plan.exam;
      lines.push('BEGIN:VEVENT', `UID:kolos-${plan.id}-${dt}@kolos-z-czasow`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${dt}`, `DTEND;VALUE=DATE:${next}`,
        fold75('SUMMARY:' + esc2(examDay ? 'Kolokwium z czasów' : `Czasy: ${d.tasks.length} ${plural(d.tasks.length, 'zadanie', 'zadania', 'zadań')} (ok. ${d.tasks.reduce((a, x) => a + (x.mins || 0), 0)} min)`)),
        fold75('DESCRIPTION:' + esc2(d.tasks.map((x) => '- ' + x.title).join('\n'))), 'END:VEVENT');
    });
    lines.push('END:VCALENDAR');
    return lines.join('\r\n') + '\r\n';
  }
  return { base, chosen, current, choose, reflow, reset, isDone, toggle, stats, today, taskHtml, dayHtml, slidesChip, minsLeft, ics, spec };
})();

/* PDF: the user's own copy of the book, kept only in this browser (IndexedDB), rendered with pdf.js */
const PDF = (() => {
  const LIB = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  const WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const BOOK_PAGES = 412;
  let lib = null, doc = null, pages = 0, name = '', where = 'none'; // none | device | session
  let memFile = null;
  let cur = 90, zoom = 1, renderTask = null, opening = null;

  /* IndexedDB */
  function db() {
    return new Promise((res, rej) => {
      let r;
      try { r = indexedDB.open('kolos-ksiazka', 1); } catch (e) { rej(e); return; }
      r.onupgradeneeded = () => r.result.createObjectStore('files');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function idb(mode, fn) {
    const d = await db();
    return new Promise((res, rej) => {
      const tx = d.transaction('files', mode);
      const req = fn(tx.objectStore('files'));
      tx.oncomplete = () => res(req && req.result);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error);
    });
  }
  const idbGet = (k) => idb('readonly', (s) => s.get(k));
  const idbPut = (k, v) => idb('readwrite', (s) => s.put(v, k));
  const idbDel = (k) => idb('readwrite', (s) => s.delete(k));

  function loadLib() {
    if (lib) return Promise.resolve(lib);
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = LIB;
      s.onload = () => { lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = WORKER; res(lib); };
      s.onerror = () => rej(new Error('Nie udało się wczytać przeglądarki PDF. Sprawdź internet i spróbuj ponownie.'));
      document.head.appendChild(s);
    });
  }
  async function openBlob(blob, nm) {
    await loadLib();
    const buf = new Uint8Array(await blob.arrayBuffer());
    if (doc) { try { doc.destroy(); } catch (e) { /* ignore */ } }
    doc = await lib.getDocument({ data: buf }).promise;
    pages = doc.numPages;
    name = nm;
  }
  /* on start: do we have a stored copy? (does not open it yet) */
  async function probe() {
    try {
      const rec = await idbGet('book');
      if (rec && rec.blob) { name = rec.name; pages = rec.pages || 0; where = 'device'; }
    } catch (e) { /* storage unavailable */ }
    return where;
  }
  async function ensure() {
    if (doc) return true;
    if (opening) return opening;
    opening = (async () => {
      if (memFile) { await openBlob(memFile, memFile.name); return true; }
      let rec = null;
      try { rec = await idbGet('book'); } catch (e) { rec = null; }
      if (!rec || !rec.blob) return false;
      await openBlob(rec.blob, rec.name);
      return true;
    })();
    try { return await opening; } finally { opening = null; }
  }
  async function fromFile(file) {
    await openBlob(file, file.name);
    memFile = file;
    where = 'session';
    try {
      await idbPut('book', { blob: file, name: file.name, size: file.size, pages, at: Date.now() });
      where = 'device';
    } catch (e) { where = 'session'; }
    return { pages, where };
  }
  async function forget() {
    try { await idbDel('book'); } catch (e) { /* ignore */ }
    if (doc) { try { doc.destroy(); } catch (e) { /* ignore */ } }
    doc = null; memFile = null; pages = 0; name = ''; where = 'none';
  }
  const offset = () => Number(Store.get('pdfOffset', 0)) || 0;
  const has = () => where !== 'none';

  /* the shared scan has two pages swapped (book 101 <-> 103); only for that 412-page file with no manual offset */
  const pdfPage = (bookPage) => {
    const exc = (D.pdfExc || {})[bookPage];
    return exc && pages === BOOK_PAGES && !offset() ? exc : bookPage + offset();
  };
  async function renderTo(canvas, bookPage, width) {
    const n = pdfPage(bookPage);
    if (n < 1 || n > pages) throw new Error(`Ten PDF nie ma strony ${n}.`);
    const page = await doc.getPage(n);
    const v1 = page.getViewport({ scale: 1 });
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const vp = page.getViewport({ scale: (width / v1.width) * dpr });
    canvas.width = Math.floor(vp.width);
    canvas.height = Math.floor(vp.height);
    canvas.style.width = Math.floor(vp.width / dpr) + 'px';
    canvas.style.height = Math.floor(vp.height / dpr) + 'px';
    if (renderTask) { try { renderTask.cancel(); } catch (e) { /* ignore */ } }
    renderTask = page.render({ canvasContext: canvas.getContext('2d'), viewport: vp });
    try { await renderTask.promise; } finally { renderTask = null; }
  }

  /* ---------- viewer panel ---------- */
  const V = () => $('#pdfv');
  function msg(html) { const m = $('.vmsg', V()); m.innerHTML = html; m.hidden = !html; }
  async function show(bookPage) {
    cur = bookPage;
    const v = V();
    v.hidden = false;
    document.documentElement.classList.add('pv-open');
    $('#pv-page').value = cur;
    $('#pv-title').textContent = `s. ${cur}`;
    const c = $('#pv-canvas');
    msg('Wczytuję stronę…');
    c.hidden = true;
    try {
      const ok = await ensure();
      if (!ok) { msg('Najpierw wczytaj swój PDF podręcznika.'); return; }
      const body = $('.vbody', v);
      const w = Math.max(280, (body.clientWidth - 24) * zoom);
      await renderTo(c, cur, w);
      c.hidden = false;
      msg('');
    } catch (e) {
      if (e && e.name === 'RenderingCancelledException') return;
      msg(esc(e.message || 'Nie udało się pokazać strony.'));
    }
  }
  function close() {
    V().hidden = true;
    document.documentElement.classList.remove('pv-open');
  }
  function step(d) { const n = cur + d; if (n >= 1) show(n); }
  function setZoom(d) { zoom = Math.min(3, Math.max(1, Math.round((zoom + d * 0.25) * 100) / 100)); show(cur); }

  /* entry point for every page chip */
  async function open(bookPage, isKey) {
    if (isKey) {
      const go = await dialog({
        title: `Klucz odpowiedzi, s. ${bookPage}`,
        body: 'Otwieraj klucz dopiero po zrobieniu ćwiczenia. Błędy wpisz do zeszytu błędów.',
        ok: 'Otwórz klucz', cancel: 'Jeszcze nie',
      });
      if (!go) return;
    }
    if (!has()) {
      const go = await dialog({
        title: `Strona ${bookPage} w podręczniku`,
        body: 'Wczytaj swój PDF podręcznika, a strony będą się otwierać tutaj. Plik zostaje tylko na tym urządzeniu. Bez PDF-a otwórz papierową książkę na tej stronie.',
        ok: 'Wczytaj PDF', cancel: 'Zamknij',
      });
      if (go) pick(() => show(bookPage));
      return;
    }
    show(bookPage);
  }
  let afterPick = null;
  function pick(cb) { afterPick = cb || null; const i = $('#pdf-file'); i.value = ''; i.click(); }
  async function onPicked(file) {
    if (!file) return;
    if (!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)) { toast('To nie jest plik PDF.'); return; }
    toast('Wczytuję PDF… duży plik może potrwać kilkanaście sekund.');
    try {
      const r = await fromFile(file);
      toast(r.where === 'device' ? `PDF zapisany na tym urządzeniu (${r.pages} stron).` : `PDF wczytany tylko na tę wizytę (${r.pages} stron).`);
      App.refresh();
      if (afterPick) { const cb = afterPick; afterPick = null; cb(); }
    } catch (e) {
      toast('Nie udało się otworzyć tego PDF-a.');
    }
  }
  return { probe, open, show, close, step, setZoom, pick, onPicked, forget, renderTo, ensure, has,
    info: () => ({ where, name, pages, offset: offset(), expected: BOOK_PAGES }),
    cur: () => cur };
})();

/* quiz engine: checking, mistakes notebook, runner (practice + timed mock test) */
const Q = (() => {
  const all = new Map();
  Object.keys(D.content).forEach((u) => {
    const c = D.content[u];
    (c.quiz || []).forEach((q) => all.set(q.id, Object.assign({ unit: u, kind: 'q' }, q)));
    (c.translations || []).forEach((t) => all.set(t.id, Object.assign({ unit: u, kind: 'tr', type: 'tr' }, t)));
  });

  function norm(s) {
    return String(s || '').toLowerCase()
      .replace(/[’‘`´]/g, "'").replace(/[“”„]/g, '"')
      .replace(/\bcan't\b/g, 'can not').replace(/\bcannot\b/g, 'can not')
      .replace(/\bwon't\b/g, 'will not').replace(/\bshan't\b/g, 'shall not')
      .replace(/n't\b/g, ' not')
      .replace(/'ve\b/g, ' have').replace(/'re\b/g, ' are').replace(/'m\b/g, ' am').replace(/'ll\b/g, ' will')
      .replace(/[.,!?;:"()–—-]/g, ' ')
      .replace(/\s+/g, ' ').trim();
  }
  const same = (a, b) => norm(a) === norm(b);
  function check(q, given) {
    if (q.type === 'choice' || q.type === 'use') return Number(given) === q.answer;

/* ---------- unit page ---------- */
function exNumbers(items) {
  const out = [];
  String(items || '').replace(/(\d+)\s*[–-]\s*(\d+)|(\d+)/g, (m, a, b, c) => {
    if (a) for (let i = Number(a); i <= Number(b); i++) out.push(String(i)); else out.push(c);
    return m;
  });
  return out;
}
function bookExercises(u) {
  const m = D.units[u];
  if (!m || !m.exercises) return '';
  const ex = Store.get('ex', {});
  const types = m.exercise_types || {};
  const items = m.exercises.items;
  const rows = (m.exercises.pages || []).map((p) => {
    const desc = types[p] || types[String(p)] || {};
    const txt = items && typeof items === 'object' ? items[p] || items[String(p)] || '' : '';
    let nums = Object.keys(desc);
    if (!nums.length && txt) nums = exNumbers(txt.replace(/\(.*?\)/g, ''));
    const list = nums.map((n) => {
      const id = `${u}-${p}-${n}`;
      return `<div class="task${ex[id] ? ' done' : ''}">${checkBtn(!!ex[id], 'ex', `data-id="${esc(id)}"`, `Zrobione: ćwiczenie ${n}, s. ${p}`)}
        <div class="body"><div class="ttl">Ćwiczenie ${esc(n)}${desc[n] ? ` <span class="muted">· ${esc(desc[n])}</span>` : ''}</div></div></div>`;
    }).join('');
    return `<div class="stack"><div class="row">${pageChip(p)}${txt && !Object.keys(desc).length ? `<span class="muted small">${esc(txt)}</span>` : ''}</div>${list ? `<div class="tasks">${list}</div>` : ''}</div>`;
  }).join('');
  const all = typeof items === 'string' ? `<p class="muted small">${esc(items)}</p>` : '';
  return `<section class="glass panel"><h2>Ćwiczenia w książce</h2>${all}${rows}
    <div class="row"><span class="muted small">Klucz:</span>${pagesChips(m.key, true)}</div>
    ${m.in_class && m.in_class !== '–' ? `<p class="muted small">Na zajęciach: ${esc(m.in_class)}</p>` : ''}</section>`;
}
function topicsFor(u) {
  return (D.topics || []).filter((t) => (t.book_sections || []).some((s) => s === u || unitOfRef(s) === u || String(s).split('.')[0] === u));
}

  const sl = (s.slides || []).map((x) => slideChip(x.pres, x.slide)).join('');

const DIAG = [

  { id: 'M6', unit: 'M6-start', title: 'Module 6: test diagnostyczny', page: 119, n: 20, slide: ['II-4', 2] },

function secTitle(ref) {
  const u = unitOfRef(ref);
  if (!u) return '';
  const c = D.content[u];
  const s = c && c.sections && c.sections.find((x) => x.ref === ref);
  if (s) return s.title;

function vDiag(root, focus) {
  const saved = Store.get('diag', {});
  root.innerHTML = `${head({ crumbs: [['Materiał', '#material'], ['Testy diagnostyczne', null]], label: 'Na start każdego modułu', title: 'Testy diagnostyczne',
    lead: 'Zrób test w książce, sprawdź z kluczem i zaznacz tutaj numery pytań z błędem. Strona pokaże, które sekcje powtórzyć, i ułoży z nich quiz.' })}
    ${DIAG.map((t) => {
      const map = D.diag[t.id] || {};
      const wrong = (saved[t.id] || []).map(String);
      const refs = [];
      wrong.forEach((n) => { const r = map[n]; if (r && !refs.includes(r)) refs.push(r); });
      refs.sort((a, b) => parseFloat(a) - parseFloat(b) || a.localeCompare(b));
      const grid = Array.from({ length: t.n }, (_, i) => String(i + 1)).map((n) => `<button data-act="diag" data-t="${t.id}" data-n="${n}" aria-pressed="${wrong.includes(n)}" aria-label="Pytanie ${n}${map[n] ? ', sekcja ' + map[n] : ''}">${n}</button>`).join('');
      const res = refs.length ? `<div class="stack"><span class="label">Do powtórki</span>${refs.map((r) => `<div class="row">${refChip(r)}<span>${esc(secTitle(r))}</span>${pageOfRef(r) ? pageChip(pageOfRef(r)) : ''}</div>`).join('')}

const LION = ['Past Perfect (co najmniej 2×)', 'Past Perfect Continuous (co najmniej 1×)', 'used to (co najmniej 1×)', 'would (co najmniej 1×)', 'was/were going to (co najmniej 1×)', 'Past Continuous (co najmniej 1×)', 'cytat (co najmniej 1×)', 'mowa zależna (co najmniej 1×)'];
function storyCheck(st) {
  const g = {};
  (D.story.gaps || []).forEach((x) => { g[x.n] = x; });

function searchResults(q) {

  const hits = searchIdx.filter((x) => words.every((w) => x.f.includes(w))).slice(0, 80);
  if (!hits.length) return '<p class="muted">Nic nie znaleziono.</p>';

/* router, navigation, event delegation */
const App = (() => {
  const NAV = [['start', 'Start'], ['plan', 'Plan'], ['material', 'Materiał'], ['cwiczenia', 'Ćwiczenia'], ['bledy', 'Błędy'], ['ksiazka', 'Książka'], ['szukaj', 'Szukaj']];
  const SECTION = { unit: 'material', m5: 'material', m6: 'material', review: 'material', ii: 'material', sciaga: 'material', pary: 'material', sygnaly: 'material', pulapki: 'material', historia: 'material', diagnoza: 'material',
    quiz: 'cwiczenia', probne: 'cwiczenia', tlumaczenia: 'cwiczenia', mel: 'plan', jak: 'start' };
  let pend = null;
  const route = () => decodeURIComponent((location.hash || '').slice(1)) || 'start';

  function dispatch(root, r) {
    let m;
    if (r === 'start') return vStart(root);
    if (r === 'plan') return vPlan(root);
    if (r === 'material') return vMaterial(root);
    if ((m = r.match(/^unit-(\d\d|reported)$/))) return vUnit(root, m[1]);
    if (r === 'm5-start') return vDiag(root, 'M5-start');
    if (r === 'm6-start') return vDiag(root, 'M6-start');
    if (r === 'diagnoza') return vDiag(root);
    if ((m = r.match(/^review-([56])$/))) return vReview(root, 'Review ' + m[1]);
    if ((m = r.match(/^ii-([1-4])$/))) return vPres(root, 'II-' + m[1]);
    const simple = { sciaga: vSciaga, pary: vPary, sygnaly: vSygnaly, pulapki: vPulapki, tlumaczenia: vTlumaczenia, cwiczenia: vCwiczenia,
      probne: vProbne, bledy: vBledy, historia: vHistoria, mel: vMel, ksiazka: vKsiazka, szukaj: vSzukaj, jak: vJak, quiz: (el) => Q.view(el) };
    if (simple[r]) return simple[r](root);
    return vNotFound(root);
  }
  function navHtml(r) {
    const key = r.split('-')[0];
    const cur = NAV.some((n) => n[0] === r) ? r : SECTION[key] || '';
    return NAV.map(([id, name]) => `<a href="#${id}"${id === cur ? ' aria-current="page"' : ''}>${name}</a>`).join('');
  }
  function brand() {
    const plan = Plan.current();
    const d = diffDays(todayIso(), plan.exam);
    $('#brand-count').textContent = d < 0 ? '' : d === 0 ? 'kolokwium dziś' : `${d} ${plural(d, 'dzień', 'dni', 'dni')}`;
  }
  function render(keep) {
    const root = $('#app');
    const r = route();
    const y = window.scrollY;
    const a = document.activeElement;
    const focusSel = keep && a && a !== document.body && a.dataset && a.dataset.act
      ? `[data-act="${a.dataset.act}"]` + ['id', 'u', 'v', 'n', 'i', 't', 'p'].filter((k) => a.dataset[k] != null).map((k) => `[data-${k}="${CSS.escape(a.dataset[k])}"]`).join('') : null;
    try { dispatch(root, r); } catch (e) {
      root.innerHTML = `<div class="glass panel"><h2>Coś poszło nie tak</h2><p class="muted">${esc(e.message)}</p><div><a class="btn" href="#start">Start</a></div></div>`;
      if (window.console) console.error(e);
    }
    $('#nav').innerHTML = navHtml(r);
    brand();
    const h1 = $('h1', root);
    document.title = (h1 && r !== 'start' ? h1.textContent + ' · ' : '') + 'Kolos z czasów';
    if (keep) {
      window.scrollTo(0, y);
      if (focusSel && r !== 'quiz') { const f = $(focusSel, root); if (f) f.focus({ preventScroll: true }); }
    } else {
      window.scrollTo(0, 0);
      root.focus({ preventScroll: true });
      applyPending();
    }
  }
  const refresh = () => render(true);

  function flash(el) { if (!el) return; el.classList.add('hl'); setTimeout(() => el.classList.remove('hl'), 1600); }
  function applyPending() {
    const p = pend; pend = null;
    if (!p) return;
    if (p.sec) { const el = $('#sec-' + p.sec.replace('.', '-')); if (el) { el.scrollIntoView({ block: 'start' }); flash(el); } }
    if (p.slide) {
      if (CAN_EMBED) showSlide(p.slide[0], p.slide[1], false);
      else { const el = $(`#sl-${p.slide[0].toLowerCase()}-${p.slide[1]}`); if (el) { el.scrollIntoView({ block: 'start' }); flash(el); } }
    }
    if (p.pair) { const el = $('#pair-' + p.pair); if (el) { el.scrollIntoView({ block: 'start' }); flash(el); } }
  }
  /* links that also scroll to a place on the target page */
  function goWithin(e, el, p) {
    pend = p;
    const href = el.getAttribute('href');
    if (!href || href === location.hash || (href === '#start' && !location.hash)) { e.preventDefault(); applyPending(); }
  }

  /* quiz starters */
  const back = () => location.hash || '#start';
  function capPick(ids, n, per) {
    const out = [], cnt = {};
    shuffle(ids).forEach((id) => { const u = Q.all.get(id).unit; if (out.length < n && (cnt[u] || 0) < per) { cnt[u] = (cnt[u] || 0) + 1; out.push(id); } });
    return out;
  }
  function startQuiz(a, el) {
    const d = el.dataset;
    if (a === 'quick') return Q.start({ mode: 'quick', title: 'Szybki quiz', items: Q.quickIds(10), back: back() });
    if (a === 'quiz-unit') return Q.start({ mode: 'unit', unit: d.u, title: 'Quiz: ' + unitName(d.u), items: shuffle(Q.unitItems(d.u)), back: back() });
    if (a === 'tr-unit') return Q.start({ mode: 'tr', unit: d.u, title: 'Tłumaczenia: ' + unitName(d.u), items: shuffle(Q.unitTr(d.u)), back: back() });
    if (a === 'quiz-ids') return Q.start({ mode: d.mode || 'pair', title: d.title || 'Ćwiczenie', items: shuffle(d.ids.split(',')).slice(0, 25), back: back() });
    if (a === 'quiz-mist') return Q.start({ mode: 'mist', title: 'Powtórka błędów', items: Q.mistakes(), back: back() });
    if (a === 'quiz-mock') return Q.start({ mode: 'mock', title: 'Próbne kolokwium', items: Q.mockIds(), minutes: 45, back: '#probne' });
    if (a === 'quiz-module') {
      const units = MODULES[Number(d.m) - 5].units.filter((u) => D.content[u]);
      const ids = [];
      units.forEach((u) => ids.push(...Q.unitItems(u)));
      return Q.start({ mode: 'module', title: `Mieszany: Module ${d.m}`, items: capPick(ids, 20, 3), back: back() });
    }
    if (a === 'quiz-refs') {
      const refs = d.refs.split(',');
      let ids = [...Q.all.values()].filter((q) => q.kind === 'q' && refs.includes(q.ref)).map((q) => q.id);
      if (ids.length < 8) {
        const units = [...new Set(refs.map(unitOfRef).filter(Boolean))];
        units.forEach((u) => Q.unitItems(u).forEach((id) => { if (!ids.includes(id)) ids.push(id); }));
      }
      return Q.start({ mode: 'refs', title: 'Quiz z sekcji do powtórki', items: shuffle(ids).slice(0, 20), back: back() });
    }
    return null;
  }

  function toggleIn(key, id) { Store.upd(key, {}, (m) => { if (m[id]) delete m[id]; else m[id] = Date.now(); }); }
  async function onClick(e) {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const a = el.dataset.act;
    const d = el.dataset;
    if (a.startsWith('q-')) { Q.act(a, el); return; }
    if (a.startsWith('quiz-') || a === 'quick' || a === 'tr-unit') { e.preventDefault(); startQuiz(a, el); return; }
    switch (a) {
      case 'page': case 'key': PDF.open(Number(d.p), a === 'key'); break;
      case 'go-sec': goWithin(e, el, { sec: d.sec }); break;
      case 'go-slide': embedSlide[d.pres] = Number(d.slide); goWithin(e, el, { slide: [d.pres, Number(d.slide)] }); break;
      case 'go-pair': goWithin(e, el, { pair: d.id }); break;
      case 'show-slide': showSlide(d.pres, Number(d.slide), false); break;
      case 'pv-close': PDF.close(); break;
      case 'pv-prev': PDF.step(-1); break;
      case 'pv-next': PDF.step(1); break;
      case 'pv-zoom-in': PDF.setZoom(1); break;
      case 'pv-zoom-out': PDF.setZoom(-1); break;
      case 'pdf-load': PDF.pick(); break;
      case 'pdf-forget':
        if (await dialog({ title: 'Usunąć PDF z tego urządzenia?', body: 'Notatki i postęp zostaną. PDF możesz wczytać ponownie w każdej chwili.', ok: 'Usuń', cancel: 'Zostaw' })) { await PDF.forget(); PDF.close(); refresh(); }
        break;
      case 'task': Plan.toggle(d.id); refresh(); break;
      case 'ex': toggleIn('ex', d.id); refresh(); break;
      case 'exam': Plan.choose(d.id); refresh(); break;
      case 'exam-own': ownOpen = true; refresh(); { const i = $('[data-change="exam-date"]'); if (i) i.focus(); } break;
      case 'reflow': {
        const n = Plan.reflow(Plan.current().id, todayIso());
        toast(n ? 'Zadania rozłożone na dni do kolokwium.' : 'Nie ma czego rozkładać.');
        refresh();
        break;
      }
      case 'plan-reset': Plan.reset(Plan.current().id); toast('Przywrócone pierwotne daty.'); refresh(); break;
      case 'ics': {
        const plan = Plan.current();
        const url = URL.createObjectURL(new Blob([Plan.ics(plan)], { type: 'text/calendar' }));
        const link = document.createElement('a');
        link.href = url; link.download = `plan-kolokwium-${plan.exam}.ics`;
        document.body.appendChild(link); link.click(); link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        toast('Plik kalendarza pobrany. Otwórz go, żeby dodać plan do kalendarza.');
        break;
      }
      case 'print': window.print(); break;
      case 'self': Store.upd('self', {}, (m) => { const v = Number(d.v); if (m[d.u] === v) delete m[d.u]; else m[d.u] = v; }); refresh(); break;
      case 'intro-close': Store.set('intro', 1); refresh(); break;
      case 'plan-all': planAll = !planAll; refresh(); break;
      case 'diag': Store.upd('diag', {}, (m) => { const l = (m[d.t] || []).map(String); const i = l.indexOf(d.n); if (i >= 0) l.splice(i, 1); else l.push(d.n); m[d.t] = l; }); refresh(); break;
      case 'diag-clear': Store.upd('diag', {}, (m) => { delete m[d.t]; }); refresh(); break;
      case 'mist-del': Q.clearMistake(d.id); refresh(); break;
      case 'own-del': Store.upd('own', [], (l) => l.filter((o) => o.id !== d.id)); refresh(); break;
      case 'story-check': {
        const ans = {};
        $$('[data-gap]').forEach((i) => { ans[i.dataset.gap] = i.value.trim(); });
        Store.upd('story', {}, (s) => { s.a = ans; s.checked = true; });
        refresh();
        break;
      }
      case 'story-reset': Store.upd('story', {}, (s) => { s.a = {}; s.checked = false; }); refresh(); break;
      case 'lion': Store.upd('story', {}, (s) => { s.ticks = s.ticks || {}; s.ticks[d.i] = !s.ticks[d.i]; }); refresh(); break;
      case 'export': {
        const code = btoa(unescape(encodeURIComponent(JSON.stringify(Store.dump()))));
        if (await copyText(code)) toast('Skopiowano kod postępu. Wklej go na innym urządzeniu w „Jak korzystać”.');
        else dialog({ title: 'Kod postępu', body: 'Skopiuj ten kod i wklej go na innym urządzeniu.', extra: `<textarea readonly rows="5">${esc(code)}</textarea>`, ok: 'Zamknij', cancel: '' });
        break;
      }
      case 'wipe':
        if (await dialog({ title: 'Wyczyścić cały postęp?', body: 'Znikną odhaczone zadania, wyniki quizów i zeszyt błędów na tym urządzeniu. Tego nie da się cofnąć.', ok: 'Wyczyść', cancel: 'Anuluj' })) { Store.wipe(); toast('Postęp wyczyszczony.'); refresh(); }
        break;
      default: break;
    }
  }
  function onSubmit(e) {
    const f = e.target.closest('[data-form]');
    if (!f) return;
    e.preventDefault();
    const v = (n) => (f.elements[n] ? f.elements[n].value.trim() : '');
    const kind = f.dataset.form;
    if (kind === 'own') {
      if (!v('wrong') || !v('right')) return;
      Store.upd('own', [], (l) => { l.push({ id: 'o' + Date.now().toString(36), wrong: v('wrong'), right: v('right'), ref: v('ref'), at: Date.now() }); });
      toast('Dodane do zeszytu błędów.');
      refresh();
    } else if (kind === 'goto') {
      const p = Number(v('p'));
      if (p >= 1) PDF.open(p, false);
    } else if (kind === 'offset') {
      const p = Number(v('p'));
      if (p >= 1) { Store.set('pdfOffset', p - 89); toast(`Zapisane: przesunięcie ${p - 89}.`); refresh(); }
    } else if (kind === 'import') {
      try {
        const o = JSON.parse(decodeURIComponent(escape(atob(v('code')))));
        if (!o || typeof o !== 'object') throw new Error('bad');
        Store.load(o);
        toast('Postęp wczytany.');
        refresh();
      } catch (err) { toast('Ten kod nie wygląda na kod postępu z tej strony.'); }
    }
  }
  let saveT = null;
  function onInput(e) {
    const t = e.target;
    if (t.dataset.filter) {
      const q = fold(t.value).trim();
      const box = $(t.dataset.filter);
      if (!box) return;
      $$('[data-f]', box).forEach((x) => { x.hidden = !!q && !q.split(/\s+/).every((w) => x.dataset.f.includes(w)); });
      $$('[data-block]', box).forEach((b) => { b.hidden = !$$('[data-f]', b).some((x) => !x.hidden); });
    } else if (t.id === 'q-search') {
      lastQuery = t.value;
      $('#q-res').innerHTML = searchResults(t.value);
    } else if (t.dataset.gap) {
      t.classList.remove('right', 'wrong');
      Store.upd('story', {}, (s) => { s.a = s.a || {}; s.a[t.dataset.gap] = t.value; });
    } else if (t.id === 'lion-text') {
      clearTimeout(saveT);
      saveT = setTimeout(() => Store.upd('story', {}, (s) => { s.own = t.value; }), 400);
      const n = t.value.trim() ? t.value.trim().split(/\s+/).length : 0;
      $('#lion-count').textContent = `${n} ${plural(n, 'słowo', 'słowa', 'słów')}`;
    }
  }
  function onChange(e) {
    const t = e.target;
    if (t.dataset.change === 'exam-date') {
      if (Plan.choose('C', t.value)) { ownOpen = false; toast(`Plan ułożony do ${dShort(t.value)}.`); refresh(); }
      else toast('Wybierz datę od jutra wzwyż.');
      return;
    }
    if (t.id === 'pdf-file') PDF.onPicked(t.files && t.files[0]);
    else if (t.id === 'pv-page') { const n = Number(t.value); if (n >= 1) PDF.show(n); }
  }
  function onKey(e) {
    const v = $('#pdfv');
    if (!v || v.hidden || !$('#modal').hidden) return;
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
    if (e.key === 'Escape') PDF.close();
    else if (!typing && e.key === 'ArrowRight') PDF.step(1);
    else if (!typing && e.key === 'ArrowLeft') PDF.step(-1);
  }

  /* a shared link can preset the exam: ?plan=A (6.11), ?plan=B (16.11) or ?termin=2026-11-20 */
  function presetFromUrl() {
    let q;
    try { q = new URLSearchParams(location.search); } catch (e) { return; }
    if (Plan.chosen()) return;
    const p = (q.get('plan') || '').toUpperCase();
    const d = q.get('termin') || '';
    if (p === 'A' || p === 'B') Plan.choose(p);
    else if (/^\d{4}-\d\d-\d\d$/.test(d)) Plan.choose('C', d);
  }
  function init() {
    document.documentElement.lang = 'pl';
    presetFromUrl();
    document.addEventListener('click', onClick);
    document.addEventListener('submit', onSubmit);
    document.addEventListener('input', onInput);
    document.addEventListener('change', onChange);
    document.addEventListener('keydown', onKey);
    window.addEventListener('hashchange', () => render(false));
    render(false);
    PDF.probe().then((w) => { if (w !== 'none') refresh(); });
  }
  return { init, refresh, render };
})();
App.init();

})();</script>
