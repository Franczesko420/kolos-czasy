en":"Lately Dominika has been taking the train to uni instead of driving.","pl":"Ostatnio Dominika jeździ na uczelnię pociągiem zamiast samochodem.","note":"lately – nowy, może tymczasowy zwyczaj"},{"en":"My parents have lived in the same block of flats in Koszalin for thirty years.","pl":"Moi rodzice od trzydziestu lat mieszkają w tym samym bloku w Koszalinie.","note":"sytuacja stała → Simple (przy live Continuous też jest możliwy)"}],"pitfalls":[{"wrong":"I'm going out with Kamil for two years.","right":"I've been going out with Kamil for two years.","why":"„chodzę z Kamilem od dwóch lat” – sytuacja trwa od przeszłości do teraz → Present Perfect Continuous, nie Present Continuous"},{"wrong":"Since when are you living in Koszalin?","right":"How long have you been living in Koszalin?","why":"pytanie „od kiedy / jak długo” o trwającą sytuację → How long + Present Perfect (Continuous)"}],"slides":[{"pres":"II-2","slide":17}]},{"ref":"24.3","page":110,"title":"Wyjaśnianie obecnego stanu (skutek)","rule":"Present Perfect Continuous **wyjaśnia obecny stan** (brudne ręce, zmęczenie, bałagan) czynnością, która trwała do niedawna. Liczy się sama czynność, nie jej rezultat, i zwykle nie dodajemy okolicznika czasu.","examples":[{"en":"Sorry I'm out of breath – I've been running to catch the bus.","pl":"Przepraszam, że tak dyszę – biegłem na autobus.","note":"wyjaśnienie obecnego stanu"},{"en":"You look exhausted. Have you been working night shifts again?","pl":"Wyglądasz na wykończonego. Znowu pracowałeś na nocne zmiany?","note":"pytanie o przyczynę tego, co widać"},{"en":"The kitchen smells of garlic – Paweł has been cooking.","pl":"W kuchni pachnie czosnkiem – Paweł gotował.","note":"po polsku czas przeszły, po angielsku Present Perfect Continuous"}],"pitfalls":[{"wrong":"Why are you all wet? – I'm walking in the rain.","right":"Why are you all wet? – I've been walking in the rain.","why":"skutek widać teraz, a czynność właśnie się skończyła → Present Perfect Continuous; Present Continuous znaczyłby, że idziesz w tej chwili"}],"slides":[]},{"ref":"24.4","page":110,"title":"Present Perfect Simple a Continuous – różnice","rule":"Simple: **rezultat**, czynność **zakończona**, **liczba** powtórzeń, sytuacja **stała**. Continuous: **czas trwania** i sama czynność, czynność **niezakończona**, powtórzenia **bez liczby**, sytuacja **tymczasowa** (tabela na slajdzie II/2 17). Czasowniki stanu (know, be, have = mieć, believe) występują tylko w Simple.","examples":[{"en":"I've written three pages of my essay.","pl":"Napisałem trzy strony eseju.","note":"rezultat, liczba → Simple"},{"en":"I've been writing my essay all morning.","pl":"Cały ranek piszę esej.","note":"czas trwania → Continuous"},{"en":"We've painted the bedroom – come and have a look.","pl":"Pomalowaliśmy sypialnię – chodź zobaczyć.","note":"gotowy efekt → Simple"},{"en":"We've been painting the bedroom, so the whole flat smells of paint.","pl":"Malowaliśmy sypialnię, więc w całym mieszkaniu czuć farbę.","note":"sama czynność i jej ślad → Continuous"}],"pitfalls":[{"wrong":"I've been charging your power bank, so you can take it now.","right":"I've charged your power bank, so you can take it now.","why":"czynność zakończona, liczy się rezultat (powerbank jest naładowany) → Simple; Continuous mówi o samej czynności i nie gwarantuje, że się skończyła"}],"slides":[{"pres":"II-2","slide":17}]}],"uses":[{"tense":"Present Perfect Continuous","no":null,"use":"focus on duration","usePl":"nacisk na czas trwania","example":"We've been queuing for the canteen for twenty minutes.","ref":"24.1","slide":{"pres":"II-2","slide":17}},{"tense":"Present Perfect","no":null,"use":"focus on result","usePl":"nacisk na rezultat","example":"I've finished the translation – you can check it now.","ref":"24.4","slide":{"pres":"II-2","slide":17}},{"tense":"Present Perfect Continuous","no":null,"use":"repeated actions (no number of times given)","usePl":"powtarzana czynność bez podanej liczby razy","example":"Kuba has been texting me all evening.","ref":"24.1","slide":{"pres":"II-2","slide":17}},{"tense":"Present Perfect","no":null,"use":"repeated actions (we know how many times)","usePl":"powtarzana czynność, znamy liczbę razy","example":"Kuba has texted me six times this evening.","ref":"24.1","slide":{"pres":"II-2","slide":17}},{"tense":"Present Perfect Continuous","no":null,"use":"temporary situation","usePl":"sytuacja tymczasowa","example":"Since the library closed for renovation, we've been studying in the café downstairs.","ref":"24.2","slide":{"pres":"II-2","slide":17}},{"tense":"Present Perfect","no":null,"use":"permanent situation","usePl":"sytuacja stała","example":"Our phonetics lecturer has taught at this university for over twenty years.","ref":"24.2","slide":{"pres":"II-2","slide":17}},{"tense":"Present Perfect Continuous","no":null,"use":"action not finished","usePl":"czynność niezakończona","example":"I've been learning to drive since July, and I still can't park.","ref":"24.1","slide":{"pres":"II-2","slide":17}},{"tense":"Present Perfect","no":null,"use":"action finished","usePl":"czynność zakończona","example":"I've packed my suitcase, so we can leave whenever you're ready.","ref":"24.1","slide":{"pres":"II-2","slide":17}},{"tense":"Present Perfect Continuous","no":null,"use":"present result: explaining a present situation","usePl":"wyjaśnienie obecnego stanu niedawną czynnością","example":"The kitchen floor is wet – have you been washing it?","ref":"24.3","slide":null}],"quiz":[{"id":"u24-01","type":"gap","prompt":"I ___ (paint) the kitchen since breakfast, and I've only done one wall so far.","answers":["have been painting","'ve been painting"],"explain":"Nacisk na czas trwania czynności, która jeszcze się nie skończyła (dopiero jedna ściana) → Present Perfect Continuous.","ref":"24.1"},{"id":"u24-02","type":"choice","prompt":"I ___ a summary of the article – it's in our shared folder now.","options":["have been writing","have written","am writing"],"answer":1,"explain":"Czynność zakończona, liczy się rezultat (gotowe streszczenie w folderze) → Present Perfect Simple. Continuous sugerowałby, że wciąż piszesz.","ref":"24.4"},{"id":"u24-03","type":"choice","prompt":"Agata ___ me the same question all week – she must be really worried about the exam.","options":["has asked","has been asking","is asking"],"answer":1,"explain":"Czynność powtarzana bez podanej liczby razy, przez cały okres do teraz (all week) → Present Perfect Continuous.","ref":"24.1"},{"id":"u24-04","type":"gap","prompt":"I ___ (ring) the bell three times so far, but nobody has answered.","answers":["have rung","'ve rung"],"explain":"Podana liczba powtórzeń (three times) → Present Perfect Simple; Continuous nie łączy się z liczbą razy.","ref":"24.1"},{"id":"u24-05","type":"use","prompt":"Filip has been cycling to work since the bridge closed for repairs.","options":["czynność zakończona (action finished) – Present Perfect Simple","sytuacja tymczasowa (temporary situation) – Present Perfect Continuous","sytuacja stała (permanent situation) – Present Perfect Simple","powtarzana czynność, znamy liczbę razy (repeated actions, we know how many times) – Present Perfect Simple"],"answer":1,"explain":"Sytuacja potrwa tylko do końca remontu mostu → tymczasowa → Present Perfect Continuous.","ref":"24.2"},{"id":"u24-06","type":"use","prompt":"The Wójciks have run this guesthouse in Mielno for three generations.","options":["nacisk na czas trwania (focus on duration) – Present Perfect Continuous","sytuacja tymczasowa (temporary situation) – Present Perfect Continuous","sytuacja stała (permanent situation) – Present Perfect Simple","powtarzana czynność, znamy liczbę razy (repeated actions, we know how many times) – Present Perfect Simple"],"answer":2,"explain":"Sytuacja trwała, od pokoleń → Present Perfect Simple. „Three generations” to czas trwania, a nie liczba powtórzeń.","ref":"24.4"},{"id":"u24-07","type":"gap","prompt":"Kasia ___ (wait) for the bus for half an hour, and it still hasn't come.","answers":["has been waiting","'s been waiting","has waited","'s waited"],"explain":"Czynność trwa od pół godziny do teraz → Present Perfect Continuous (najbardziej naturalny), Simple też jest poprawny. Present Continuous (is waiting) nie wyraża, od kiedy coś trwa.","ref":"24.2"},{"id":"u24-08","type":"choice","prompt":"I ___ your book – I'll give it back to you on Monday, when I've finished it.","options":["have read","have been reading","read"],"answer":1,"explain":"Czynność niezakończona (oddam, gdy skończę) → Present Perfect Continuous; I've read = przeczytałem do końca.","ref":"24.1"},{"id":"u24-09","type":"gap","prompt":"Wiktoria ___ (read) all seven Harry Potter books, and now she's rereading them in English.","answers":["has read","'s read"],"explain":"Czynność zakończona i policzona (all seven) → Present Perfect Simple; Continuous nie łączy się z liczbą.","ref":"24.4"},{"id":"u24-10","type":"choice","prompt":"Why are your hands so dirty? – I ___ my bike all afternoon.","options":["have fixed","have been fixing","fixed","am fixing"],"answer":1,"explain":"Brudne ręce to ślad czynności, która trwała do teraz (all afternoon) → Present Perfect Continuous. Simple (have fixed) mówiłby o rezultacie i nie łączy się z all afternoon.","ref":"24.3"},{"id":"u24-11","type":"choice","prompt":"Your eyes are all red. ___?","options":["Have you cried","Have you been crying","Do you cry"],"answer":1,"explain":"Widzimy skutek (czerwone oczy) niedawnej czynności i pytamy o nią → Present Perfect Continuous.","ref":"24.3"},{"id":"u24-12","type":"fix","prompt":"Our neighbour has been complaining about the noise three times this week, so we'd better turn the music down.","wrong":"has been complaining","fixes":["has complained"],"answers":["Our neighbour has complained about the noise three times this week, so we'd better turn the music down."],"explain":"Podana liczba razy (three times) → Present Perfect Simple, nie Continuous.","ref":"24.1"}],"translations":[{"id":"u24-t01","pl":"Czekam tu od godziny.","answers":["I've been waiting here for an hour.","I have been waiting here for an hour."],"keys":["have been waiting","for an hour"],"explain":"„Czekam od…” – czynność trwa od przeszłości do teraz → Present Perfect Continuous + for, nie Present Simple ani Present Continuous.","ref":"24.1"},{"id":"u24-t02","pl":"Od rana pada śnieg.","answers":["It's been snowing since this morning.","It has been snowing since the morning."],"keys":["been snowing","since"],"explain":"Po polsku czas teraźniejszy, ale opad trwa od rana do teraz → Present Perfect Continuous + since (punkt w czasie).","ref":"24.1"},{"id":"u24-t03","pl":"Dlaczego masz brudne ręce? – Naprawiałem rower.","answers":["Why are your hands dirty? – I've been fixing my bike.","Why are your hands so dirty? – I've been repairing my bike.","Why have you got dirty hands? – I've been fixing my bike."],"keys":["have been"],"explain":"Polski czas przeszły („naprawiałem”), ale wyjaśniamy obecny stan (brudne ręce) czynnością, która przed chwilą trwała → Present Perfect Continuous.","ref":"24.3"},{"id":"u24-t04","pl":"Ostatnio dużo biegam.","answers":["I've been running a lot lately.","I've been running a lot recently.","Lately I've been running a lot."],"keys":["have been running"],"explain":"Nowy, być może tymczasowy zwyczaj z lately/recently → Present Perfect Continuous, nie Present Simple.","ref":"24.2"},{"id":"u24-t05","pl":"Przeczytałam dziś trzy rozdziały.","answers":["I've read three chapters today.","Today I've read three chapters."],"keys":["have read","three chapters"],"explain":"Podana liczba (trzy rozdziały) i niezakończony okres (dziś) → Present Perfect Simple, nie Continuous.","ref":"24.4"},{"id":"u24-t06","pl":"Od kiedy pracujesz w tej kawiarni?","answers":["How long have you been working at this café?","How long have you worked at this café?","How long have you been working in this café?"],"keys":["how long","have you"],"explain":"Pytanie o czas trwania sytuacji do teraz → How long + Present Perfect (Continuous); z work oba czasy są poprawne. Błąd: Since when do you work…?","ref":"24.2"}],"pairs":[{"id":"pps-vs-ppc","title":"Present Perfect Simple czy Continuous?","a":{"name":"Present Perfect Simple","when":"rezultat, czynność zakończona, liczba powtórzeń (three times), sytuacja stała; czasowniki stanu (know, be, have = mieć)","example":"I've cleaned the bathroom – it's spotless."},"b":{"name":"Present Perfect Continuous","when":"czas trwania i sama czynność, czynność niezakończona, powtórzenia bez liczby (all morning), sytuacja tymczasowa, wyjaśnienie obecnego stanu","example":"I've been cleaning all afternoon – I'm exhausted."},"tip":"Jest liczba albo gotowy efekt → Simple; jest „jak długo”, czynność wciąż trwa albo zostawiła ślad → Continuous.","refs":["24.1","24.2","24.3","24.4"],"quiz":["u24-01","u24-02","u24-03","u24-04","u24-05","u24-06","u24-08","u24-09","u24-10","u24-11","u24-12"]}],"signals":[{"word":"all day / all morning / all week","tenses":["Present Perfect Continuous"],"example":"I've been revising all day.","note":"Czasowniki stanu mimo to w Simple (I've been at home all day). Gdy podajemy rezultat lub liczbę – Simple: I've revised three units.","ref":"24.1"},{"word":"twice / three times (liczba razy)","tenses":["Present Perfect"],"example":"Maks has failed his driving test twice.","note":"Liczba powtórzeń → Present Perfect Simple; nie łączymy jej z Continuous (nie: has been failing twice).","ref":"24.1"}]},"25":{"unit":"25","title":"State verbs","titlePl":"Czasowniki stanu","module":5,"presentations":[{"id":"II-1","slides":[18,18]},{"id":"II-2","slides":[19,19]}],"summary":["Czasowniki stanu opisują istnienie, posiadanie, uczucia, myślenie, wrażenie i cechy (cost, weigh, mean) – zwykle nie mają formy ciągłej, nawet gdy mówimy o „teraz”: I don't understand, a nie I'm not understanding.","Wiele z nich ma drugie, „czynnościowe” znaczenie, w którym continuous jest możliwy: **think** (uważać → rozważać), **have** (mieć → jeść, przeżywać), **see** (widzieć, rozumieć → spotykać się), **taste/smell** (smakować, pachnieć → próbować, wąchać), **be** (być → zachowywać się).","Zmysły działające mimowolnie: I can hear, I can smell – bez continuous; celowo: look at, watch, listen to.","**hurt** i **feel** (samopoczucie) – simple i continuous bez różnicy znaczenia.","Czasowniki performatywne (I promise, I apologise, I suggest) – w teraźniejszości tylko Present Simple, bo samo wypowiedzenie jest czynnością."],"sections":[{"ref":"25.1","page":112,"title":"Czasowniki stanu (believe, have, like…)","rule":"Czasowniki stanu opisują stan, a nie czynność, dlatego rzadko występują w formach ciągłych. Należą do nich m.in. czasowniki istnienia i posiadania (exist, consist of, contain, belong to, own), uczuć i pragnień (love, hate, prefer, want, need), myślenia (know, believe, understand, realise, remember), wrażenia (seem, appear, resemble) oraz inne (cost, depend, deserve, matter, fit). Zostają w **Present Simple** także wtedy, gdy mówimy o tej chwili (slajd II/1 18, użycie 12).","examples":[{"en":"This flat belongs to my uncle, so we pay a very low rent.","pl":"To mieszkanie należy do mojego wujka, więc płacimy bardzo niski czynsz.","note":"posiadanie"},{"en":"Do you realise how late it is?","pl":"Zdajesz sobie sprawę, która jest godzina?","note":"myślenie"},{"en":"The course book costs 150 złoty – that seems a lot.","pl":"Podręcznik kosztuje 150 złotych – to chyba sporo.","note":"cost, seem – cecha i wrażenie"},{"en":"You really resemble your father.","pl":"Jesteś naprawdę podobny do ojca.","note":"podobieństwo"}],"pitfalls":[{"wrong":"I'm not believing a word he says.","right":"I don't believe a word he says.","why":"believe to czasownik myślenia (stan) – Present Simple"},{"wrong":"The exam is consisting of three parts.","right":"The exam consists of three parts.","why":"consist of opisuje budowę, czyli stan, nie czynność"},{"wrong":"Are you knowing where the dean's office is?","right":"Do you know where the dean's office is?","why":"know nie występuje w formie ciągłej"}],"slides":[{"pres":"II-1","slide":18},{"pres":"II-2","slide":19}]},{"ref":"25.2","page":112,"title":"Czasowniki stanu w formie ciągłej","rule":"Wiele czasowników stanu może wystąpić w continuous, ale wtedy zmienia się znaczenie (czynność zamiast stanu) albo podkreślamy coś tymczasowego. Najważniejsze pary: **think** (uważać / rozważać), **have** (posiadać / jeść, przeżywać), **be** (być jakimś / zachowywać się tak teraz), **see** (widzieć, rozumieć / spotykać się), **mean** (znaczyć / zamierzać), **appear** (wydawać się / występować), **weigh** (ważyć X kg / ważyć coś na wadze), **expect** (sądzić / spodziewać się kogoś lub czegoś). Konstrukcje typu I'm loving it to potoczna ekspresja – na kolokwium ich unikaj.","examples":[{"en":"I think the new timetable is a disaster.","pl":"Uważam, że nowy plan zajęć to katastrofa.","note":"think = uważać → Present Simple"},{"en":"I'm thinking about dropping one of my optional courses.","pl":"Zastanawiam się, czy nie zrezygnować z jednego z fakultetów.","note":"think = rozważać → Present Continuous"},{"en":"Marek is being very helpful today – he even made coffee for everyone.","pl":"Marek jest dziś wyjątkowo pomocny – zrobił nawet wszystkim kawę.","note":"be + being = zachowanie w danym czasie"},{"en":"I'm having a few problems with my new laptop.","pl":"Mam trochę problemów z nowym laptopem.","note":"have = doświadczać, przeżywać → Present Continuous"}],"pitfalls":[{"wrong":"I'm thinking you're right.","right":"I think you're right.","why":"think w znaczeniu opinii (uważam) to stan – Present Simple"},{"wrong":"My brother is having a beard now.","right":"My brother has a beard now. / My brother has got a beard now.","why":"have = posiadać to stan – bez continuous, nawet z now"},{"wrong":"The professor is appearing to be in a bad mood.","right":"The professor appears to be in a bad mood.","why":"appear = wydawać się (stan); continuous tylko w znaczeniu „występować” na scenie"}],"slides":[{"pres":"II-2","slide":19}]},{"ref":"25.3","page":113,"title":"Czasowniki zmysłów (see, hear, smell, taste, feel)","rule":"Czasowniki percepcji (see, hear, notice, smell, taste) zwykle nie mają formy ciągłej: mimowolny odbiór wyrażamy Present Simple albo **can/could** + czasownik (I can hear music). Celową czynność wyrażają **look at, watch, listen to**, a przy smell i taste – continuous w znaczeniu „wąchać, próbować”; bez dopełnienia (The soup smells great) zawsze simple. **I'm seeing** = spotykam się, mam wizytę u kogoś. **hurt** i **feel** (samopoczucie) mają w simple i continuous to samo znaczenie.","examples":[{"en":"I can smell burning – did you leave the oven on?","pl":"Czuję spaleniznę – zostawiłeś włączony piekarnik?","note":"mimowolnie: can + smell"},{"en":"This cheese tastes a bit like walnuts.","pl":"Ten ser smakuje trochę jak orzechy włoskie.","note":"bez dopełnienia (= smakować) → Present Simple"},{"en":"Why are you smelling the towels? – I'm checking which ones are clean.","pl":"Czemu wąchasz ręczniki? – Sprawdzam, które są czyste.","note":"celowe wąchanie → Present Continuous"},{"en":"I feel a bit dizzy. / I'm feeling a bit dizzy.","pl":"Trochę kręci mi się w głowie.","note":"feel (samopoczucie) – obie formy, to samo znaczenie"}],"pitfalls":[{"wrong":"I'm hearing someone at the door.","right":"I can hear someone at the door.","why":"mimowolny odbiór zmysłowy → can + hear, nie continuous"},{"wrong":"This perfume is smelling of roses.","right":"This perfume smells of roses.","why":"smell bez dopełnienia (= pachnieć) → tylko Present Simple"}],"slides":[{"pres":"II-2","slide":19}]},{"ref":"25.4","page":113,"title":"Czasowniki performatywne (promise, apologise, thank…)","rule":"Czasowniki performatywne same wykonują czynność, gdy mówimy je w 1. osobie w czasie teraźniejszym – powiedzenie I promise jest obietnicą. Wtedy używamy wyłącznie **Present Simple**: I apologise, I agree, I suggest, I insist, I recommend. Gdy mówimy o przeszłości albo o planach, forma ciągła jest możliwa: She was apologising to the dean when I came in. / I'm suggesting it at tomorrow's meeting.","examples":[{"en":"I apologise – I didn't mean to interrupt you.","pl":"Przepraszam, nie chciałem ci przerywać.","note":"przeprosiny → Present Simple"},{"en":"I suggest we meet in the library at five.","pl":"Proponuję, żebyśmy spotkali się w bibliotece o piątej.","note":"propozycja"},{"en":"I agree – the deadline is far too tight.","pl":"Zgadzam się – termin jest zdecydowanie za krótki.","note":"wyrażenie zgody"},{"en":"I'm recommending you for the Erasmus scholarship at tomorrow's meeting.","pl":"Na jutrzejszym zebraniu zarekomenduję cię do stypendium Erasmusa.","note":"plan na przyszłość, a nie samo polecenie → continuous możliwy"}],"pitfalls":[{"wrong":"I'm apologising for the mess in the kitchen.","right":"I apologise for the mess in the kitchen.","why":"przeprosiny wykonujemy samym wypowiedzeniem → Present Simple"},{"wrong":"We're congratulating you on your excellent results.","right":"We congratulate you on your excellent results.","why":"czasownik performatywny w 1. osobie, w teraźniejszości → Present Simple"}],"slides":[{"pres":"II-2","slide":19}]}],"uses":[{"tense":"Present Continuous","no":null,"use":"state verbs with a change of meaning (think of, have, see, be + being)","usePl":"czasowniki stanu w znaczeniu czynności: rozważać, jeść / przeżywać, spotykać się, zachowywać się","example":"I'm seeing my old flatmate for coffee later.","ref":"25.2","slide":null},{"tense":"Present Continuous","no":null,"use":"deliberate use of the senses (taste, smell)","usePl":"celowe użycie zmysłu: próbować, wąchać","example":"I'm tasting different olive oils for a food blog review.","ref":"25.3","slide":null},{"tense":"Present Simple","no":null,"use":"involuntary perception (can see, can hear)","usePl":"mimowolny odbiór zmysłami – Present Simple albo can + see / hear / smell","example":"I can see the sea from my window.","ref":"25.3","slide":null},{"tense":"Present Simple","no":null,"use":"performative verbs (I promise, I apologise, I suggest)","usePl":"czasowniki performatywne – samo wypowiedzenie wykonuje czynność","example":"I accept your offer with great pleasure.","ref":"25.4","slide":null}],"quiz":[{"id":"u25-01","type":"choice","prompt":"Sorry, I ___ what you mean – could you give me an example?","options":["don't understand","am not understanding"],"answer":0,"explain":"understand to czasownik stanu – Present Simple nawet o tej chwili (slajd II/1 18, użycie 12).","ref":"25.1"},{"id":"u25-02","type":"gap","prompt":"Please don't throw that box away – it ___ (contain) all my notes from my first year.","answers":["contains"],"explain":"contain opisuje stan (co jest w środku), nie czynność → Present Simple.","ref":"25.1"},{"id":"u25-03","type":"gap","prompt":"'Do you enjoy working at the café?' 'It ___ (depend) on who I'm working with.'","answers":["depends"],"explain":"depend to czasownik stanu – Present Simple, nie is depending.","ref":"25.1"},{"id":"u25-04","type":"gap","prompt":"I ___ (think) of doing a master's degree abroad, but I haven't decided yet.","answers":["am thinking","'m thinking","have been thinking","'ve been thinking"],"explain":"think of/about = rozważać, zastanawiać się – czynność w toku → continuous.","ref":"25.2"},{"id":"u25-05","type":"choice","prompt":"What ___ of the new canteen menu? Is it any better?","options":["are you thinking","do you think"],"answer":1,"explain":"Pytanie o opinię (think = uważać) → Present Simple: What do you think of…?","ref":"25.2"},{"id":"u25-06","type":"gap","prompt":"Greetings from Lisbon – right now we ___ (have) a fantastic time on the beach!","answers":["are having","'re having"],"explain":"have a good time = dobrze się bawić – przeżycie, które trwa → Present Continuous.","ref":"25.2"},{"id":"u25-07","type":"choice","prompt":"My grandparents ___ a lovely old house near Darłowo now – they moved there in May.","options":["have","are having"],"answer":0,"explain":"have = posiadać to stan – nawet z now zostaje Present Simple.","ref":"25.2"},{"id":"u25-08","type":"choice","prompt":"Kuba is normally very generous, but he ___ really mean about splitting the bill tonight.","options":["is","is being"],"answer":1,"explain":"be + being = zachowywać się w danej chwili; zwykle jest hojny, a dziś zachowuje się skąpo → is being. Samo is mean opisywałoby cechę charakteru (jest skąpy), co przeczy normally very generous.","ref":"25.2"},{"id":"u25-09","type":"fix","prompt":"I'm being really tired today – I only slept for four hours.","wrong":"I'm being","fixes":["I'm","I am"],"answers":["I'm really tired today – I only slept for four hours.","I am really tired today – I only slept for four hours."],"explain":"Zmęczenie to stan, nie zachowanie – be + being tylko o zachowaniu (rude, silly, generous).","ref":"25.2"},{"id":"u25-10","type":"choice","prompt":"I can't have lunch with you on Friday – I ___ my thesis supervisor at 1.30.","options":["see","am seeing"],"answer":1,"explain":"see = spotykać się z kimś (umówione spotkanie) – znaczenie czynności, więc Present Continuous.","ref":"25.3"},{"id":"u25-11","type":"choice","prompt":"Oh, I ___ – you want the file as a PDF, not as a Word document.","options":["see","am seeing"],"answer":0,"explain":"see = rozumieć – stan → Present Simple: I see.","ref":"25.1"},{"id":"u25-12","type":"gap","prompt":"'What are you doing?' 'I ___ (taste) the soup to check if it needs more pepper.'","answers":["am tasting","'m tasting"],"explain":"taste = próbować (celowo) – czynność w toku → Present Continuous.","ref":"25.3"},{"id":"u25-13","type":"choice","prompt":"Mmm, this pierogi filling ___ amazing! What did you put in it?","options":["tastes","is tasting"],"answer":0,"explain":"taste + przymiotnik = smakować (bez dopełnienia) – stan → Present Simple.","ref":"25.3"},{"id":"u25-14","type":"choice","prompt":"___ the people in the next flat arguing? They've been shouting for an hour.","options":["Are you hearing","Can you hear"],"answer":1,"explain":"Mimowolny odbiór zmysłowy → can + hear, nie continuous.","ref":"25.3"},{"id":"u25-15","type":"choice","prompt":"'Why are you limping?' 'My knee ___ after yesterday's match.'","options":["hurts","is hurting","obie formy są poprawne"],"answer":2,"explain":"hurt (podobnie jak feel o samopoczuciu) może być w simple i continuous bez zmiany znaczenia.","ref":"25.3"},{"id":"u25-16","type":"gap","prompt":"No, put your wallet away – I ___ (insist)! This one's on me.","answers":["insist"],"explain":"Czasownik performatywny w 1. osobie: samo powiedzenie I insist jest naleganiem → Present Simple.","ref":"25.4"},{"id":"u25-17","type":"use","prompt":"Sorry, I don't remember your surname.","options":["nawyki, rutyna (użycie 1)","sytuacje stałe (użycie 2)","czasowniki stanu (użycie 12)"],"answer":2,"explain":"remember to czasownik stanu (myślenie) – Present Simple także o tej chwili.","ref":"25.1"},{"id":"u25-18","type":"fix","prompt":"I'm hearing a brilliant audiobook on my way to uni these days.","wrong":"I'm hearing","fixes":["I'm listening to","I am listening to","I listen to"],"answers":["I'm listening to a brilliant audiobook on my way to uni these days.","I am listening to a brilliant audiobook on my way to uni these days.","I listen to a brilliant audiobook on my way to uni these days."],"explain":"Celowe słuchanie to listen to (tu najlepiej I'm listening to – tymczasowo, these days; możliwe też I listen to); hear = słyszeć mimowolnie i nie występuje w continuous.","ref":"25.3"}],"translations":[{"id":"u25-t01","pl":"Rozumiem, co masz na myśli, ale się z tobą nie zgadzam.","answers":["I understand what you mean, but I don't agree with you.","I understand what you mean, but I disagree with you."],"keys":["understand what you mean|see what you mean"],"explain":"understand i agree to czasowniki stanu – Present Simple, nie I'm understanding / I'm not agreeing. Możliwe też I see what you mean.","ref":"25.1"},{"id":"u25-t02","pl":"Zastanawiam się nad przeprowadzką do Gdańska.","answers":["I'm thinking of moving to Gdańsk.","I'm thinking about moving to Gdańsk."],"keys":["am thinking","moving"],"explain":"think of/about = rozważać → Present Continuous; I think = uważam (stan).","ref":"25.2"},{"id":"u25-t03","pl":"Ten laptop należy do mojej współlokatorki.","answers":["This laptop belongs to my flatmate."],"keys":["belongs to"],"explain":"belong to to czasownik posiadania – tylko Present Simple, nigdy is belonging.","ref":"25.1"},{"id":"u25-t04","pl":"Zwykle jest bardzo miły, ale dziś zachowuje się okropnie.","answers":["He's usually very nice, but today he's being awful.","He's usually very nice, but he's being horrible today."],"keys":["being|behaving"],"explain":"be + being = zachowywać się tak w danym czasie (tymczasowo). Możliwe też he's behaving terribly.","ref":"25.2"},{"id":"u25-t05","pl":"Słyszysz tę muzykę? Ktoś na dole ma imprezę.","answers":["Can you hear that music? Someone downstairs is having a party.","Can you hear that music? Somebody downstairs is having a party."],"keys":["can you hear","having a party"],"explain":"Mimowolny odbiór dźwięku → can + hear; have a party to czynność → Present Continuous.","ref":"25.3"},{"id":"u25-t06","pl":"Obiecuję, że oddam ci notatki jutro.","answers":["I promise I'll give you your notes back tomorrow.","I promise I'll give your notes back tomorrow.","I promise to give you your notes back tomorrow."],"keys":["i promise"],"explain":"promise to czasownik performatywny – samo powiedzenie jest obietnicą, więc Present Simple, nie I'm promising.","ref":"25.4"},{"id":"u25-t07","pl":"Ta zupa pachnie czosnkiem.","answers":["This soup smells of garlic.","This soup smells like garlic."],"keys":["smells"],"explain":"smell bez dopełnienia (= pachnieć) → Present Simple, nigdy is smelling.","ref":"25.3"},{"id":"u25-t08","pl":"Spotykam się z kimś z mojego roku.","answers":["I'm seeing someone from my year.","I'm seeing somebody from my year."],"keys":["am seeing|am going out"],"explain":"see = spotykać się z kimś (romantycznie) – znaczenie czynności, więc continuous; I see someone = widzę kogoś. Możliwe też I'm going out with someone.","ref":"25.3"}],"pairs":[{"id":"state-verbs","title":"Czasowniki stanu: Present Simple czy Continuous?","a":{"name":"Present Simple – znaczenie stanu","when":"opinia (think = uważać), posiadanie (have = mieć), rozumienie i mimowolny odbiór zmysłami (see = rozumieć, widzieć), cecha smaku lub zapachu (taste, smell + przymiotnik), stała cecha charakteru (be)","example":"I think the plan is risky. / They have a summer house. / I see your point. / This wine tastes sweet. / Wiktor is very shy."},"b":{"name":"Present Continuous – znaczenie czynności","when":"rozważanie (think of/about), jedzenie, przeżywanie i czynności z have (have lunch, have fun), umówione spotkanie (see = spotykać się), celowe próbowanie lub wąchanie (taste, smell), tymczasowe zachowanie (be + being)","example":"I'm thinking of changing jobs. / We're having breakfast. / I'm seeing the dentist on Monday. / I'm tasting the wine before the guests arrive. / Wiktor is being very rude tonight."},"tip":"Przetłumacz czasownik na polski: uważam, mam, rozumiem, smakuje, jest (z natury) → Present Simple; rozważam, jem, spotykam się, próbuję, zachowuje się → Present Continuous jest możliwy.","refs":["25.1","25.2","25.3"],"quiz":["u25-04","u25-05","u25-06","u25-07","u25-08","u25-09","u25-10","u25-11","u25-12","u25-13"]}],"signals":[{"word":"now / right now / at the moment (z czasownikami stanu)","tenses":["Present Simple"],"example":"Right now I don't need any help, thanks.","note":"przy know, need, want, understand, believe okolicznik „teraz” nie zmienia czasu – zostaje Present Simple.","ref":"25.1"},{"word":"today / tonight / this week (o zachowaniu)","tenses":["Present Continuous"],"example":"Why are you being so quiet today?","note":"be + being tylko o zachowaniu (rude, silly, quiet, careful), nie o stanie: nie I'm being tired.","ref":"25.2"}]},"26":{"unit":"26","title":"Predictions","titlePl":"Przewidywania","module":6,"presentations":[{"id":"II-4","slides":[3,14]}],"summary":["**will** + bezokolicznik: przewidywanie z opinii, intuicji lub doświadczenia (często po I think / I'm sure / I hope) oraz przyszłe fakty.","**be going to**: przewidywanie na podstawie dowodu, który widać lub znamy teraz; często coś zaraz nastąpi.","**will be -ing** = w danym momencie przyszłości będę w trakcie; **will have + III forma** = przed danym momentem będzie zrobione (by then, by the time); **will have been -ing** = jak długo coś będzie trwało do danego momentu.","Te trzy formy wyrażają też **dedukcję o teraźniejszości**: She'll be teaching now. He'll have left by now. They'll have been working for hours.","Pozycja przysłówków: **will definitely** pass, **definitely won't** pass. Przeczenie przy think/believe/expect/suppose na początku: **I don't think he'll come** (ale: I hope he won't…)."],"sections":[{"ref":"26.1","page":120,"title":"Future Simple: przewidywania z opinii i doświadczenia","rule":"**will/won't + bezokolicznik** to przewidywanie oparte na opinii, ocenie lub intuicji, a także na doświadczeniu (podobne rzeczy już się zdarzały). Ta sama forma opisuje **przyszłe fakty**, które na pewno nastąpią (wiek, daty, pory roku). Często po I think / I suppose / I hope / I imagine / I'm sure i z definitely, certainly, probably, possibly.","examples":[{"en":"I think the new cycle lanes will make the city centre much quieter.","pl":"Myślę, że nowe ścieżki rowerowe sprawią, że centrum będzie dużo cichsze.","note":"opinia, wstęp I think"},{"en":"Don't lend Marek your notes – you won't see them again before the exam.","pl":"Nie pożyczaj Markowi notatek – nie zobaczysz ich już przed egzaminem.","note":"przewidywanie z doświadczenia (Marek zawsze tak robi)"},{"en":"Olek will be twenty-six in January, so he'll lose his student rail discount.","pl":"Olek w styczniu skończy dwadzieścia sześć lat, więc straci studencką zniżkę na kolej.","note":"przyszły fakt i jego skutek"}],"pitfalls":[{"wrong":"I'm sure you pass the exam.","right":"I'm sure you'll pass the exam.","why":"po polsku „na pewno zdasz” brzmi jak czas teraźniejszy, ale przewidywanie po angielsku wymaga will"}],"slides":[{"pres":"II-4","slide":3},{"pres":"II-4","slide":4}]},{"ref":"26.2","page":120,"title":"be going to: przewidywanie na podstawie dowodu","rule":"**be going to + bezokolicznik**, gdy przewidywanie opiera się na tym, co widzimy lub wiemy **teraz** (dowód w teraźniejszości). Często dotyczy bliskiej przyszłości i bywa ostrzeżeniem (Careful… / Watch out…). Gdy dowód podajemy jako własną opinię (I think…), możliwe jest też will – różnica bywa wtedy niewielka.","examples":[{"en":"The car's making a horrible noise – it's going to break down before we reach Kołobrzeg.","pl":"Samochód wydaje okropne dźwięki – zepsuje się, zanim dojedziemy do Kołobrzegu.","note":"dowód słyszalny teraz"},{"en":"Careful – that shelf is going to collapse under all those dictionaries.","pl":"Uważaj – ta półka zaraz się zarwie pod tymi wszystkimi słownikami.","note":"ostrzeżenie, bliska przyszłość"},{"en":"Ania has skipped half the seminars, so she's going to fail the module.","pl":"Ania opuściła połowę seminariów, więc obleje ten przedmiot.","note":"dowód = fakty, które znamy teraz"}],"pitfalls":[{"wrong":"Look at the sky – it rains in a minute.","right":"Look at the sky – it's going to rain in a minute.","why":"Present Simple nie wyraża przewidywań; dowód widoczny teraz → be going to"}],"slides":[{"pres":"II-4","slide":5}]},{"ref":"26.3","page":120,"title":"Future Continuous: czynność w toku w przyszłości i dedukcje","rule":"**will/won't be + -ing** – czynność tymczasowa **w toku** w danym momencie lub okresie przyszłości (this time next week, at ten tomorrow): „będę w trakcie”. Taka czynność bywa tłem, które coś umożliwia. Tą formą (a także will + bezokolicznik, np. That'll be the courier) wyrażamy też **dedukcję o teraźniejszości**: She'll be teaching now = pewnie teraz uczy. Zwykle nie w stronie biernej i nie z czasownikiem be (nie: will be being).","examples":[{"en":"This time tomorrow I'll be sitting my phonetics exam, so keep your fingers crossed.","pl":"Jutro o tej porze będę zdawać egzamin z fonetyki, więc trzymaj kciuki.","note":"czynność w toku w konkretnym momencie przyszłości"},{"en":"I'll be driving past the library anyway, so I can return your books.","pl":"I tak będę przejeżdżać obok biblioteki, więc mogę oddać twoje książki.","note":"czynność w toku umożliwia inną"},{"en":"It's half past ten, so Igor will be working at the café now – try him after six.","pl":"Jest wpół do jedenastej, więc Igor pewnie pracuje teraz w kawiarni – zadzwoń do niego po szóstej.","note":"dedukcja o teraźniejszości"},{"en":"Someone's at the door. – That'll be the courier with my new laptop.","pl":"Ktoś puka. – To pewnie kurier z moim nowym laptopem.","note":"dedukcja z will + be"}],"pitfalls":[{"wrong":"At ten tomorrow I'll write my essay, so don't call me.","right":"At ten tomorrow I'll be writing my essay, so don't call me.","why":"czynność w toku o danej godzinie → Future Continuous; I'll write znaczy raczej „o dziesiątej zacznę pisać”"},{"wrong":"On Saturday afternoon I'll be being at my cousin's wedding.","right":"On Saturday afternoon I'll be at my cousin's wedding.","why":"be nie występuje w Future Continuous – wystarczy will be"},{"wrong":"Our flat will be being painted all next week.","right":"The decorators will be painting our flat all next week.","why":"Future Continuous zwykle nie w stronie biernej – przejdź na stronę czynną"}],"slides":[{"pres":"II-4","slide":6},{"pres":"II-4","slide":7}]},{"ref":"26.4","page":121,"title":"Future Perfect Simple i Continuous","rule":"**will have + III forma** (Future Perfect) – czynność **zakończona przed** danym momentem w przyszłości; prawie zawsze z określeniem czasu: by then, by Friday, by 2030, by the time…, within the next week, soon. **will have been + -ing** (Future Perfect Continuous) – czynność wciąż trwa w danym momencie przyszłości, a liczy się, **jak długo** (for…). Z live, work, stay obie formy są poprawne. Obie służą też do **dedukcji o teraźniejszości** (He'll have left by now). Future Perfect Continuous prawie nigdy nie występuje w stronie biernej.","examples":[{"en":"By the time you land in Dublin, I'll have cleaned the whole flat.","pl":"Zanim wylądujesz w Dublinie, posprzątam całe mieszkanie.","note":"zakończone przed momentem w przyszłości"},{"en":"In June Zuzia will have been teaching at this school for ten years.","pl":"W czerwcu minie dziesięć lat, odkąd Zuzia uczy w tej szkole.","note":"czas trwania do momentu w przyszłości"},{"en":"It's gone ten, so the shops in the old town will have closed by now.","pl":"Jest po dziesiątej, więc sklepy na starówce na pewno są już zamknięte.","note":"dedukcja o teraźniejszości (Future Perfect)"},{"en":"They'll have been rehearsing since eight, so they'll be exhausted.","pl":"Próbują od ósmej, więc na pewno są wykończeni.","note":"dedukcja o teraźniejszości (Future Perfect Continuous)"}],"pitfalls":[{"wrong":"In May we'll be going out together for three years.","right":"In May we'll have been going out together for three years.","why":"czas trwania do momentu w przyszłości (for) → Future Perfect Continuous, nie Future Continuous"},{"wrong":"By the time we will get there, the film will have started.","right":"By the time we get there, the film will have started.","why":"po by the time Present Simple, nie will (zdanie czasowe, por. 28.1)"}],"slides":[{"pres":"II-4","slide":8},{"pres":"II-4","slide":9},{"pres":"II-4","slide":10},{"pres":"II-4","slide":11},{"pres":"II-4","slide":12}]},{"ref":"26.5","page":121,"title":"Przewidywania mocniejsze lub słabsze","rule":"Pewność przewidywania zmieniamy przysłówkami **definitely, certainly, probably, possibly**. Pozycja: w zdaniu twierdzącym **między will a bezokolicznikiem** (will definitely pass), w przeczeniu **przed won't** (definitely won't pass). Podobnie działają czasowniki wprowadzające: think, expect, hope, doubt, suppose, imagine, guarantee. Przy **think, believe, expect, suppose, imagine** przeczenie stawiamy na początku: I don't think he'll come. Wyjątek: **hope** – I hope he won't be late.","examples":[{"en":"Kuba will definitely pass – he's been revising for weeks.","pl":"Kuba na pewno zda – uczy się od tygodni.","note":"definitely między will a bezokolicznikiem"},{"en":"The 7.40 to Szczecin probably won't be on time – it never is.","pl":"Pociąg o 7.40 do Szczecina pewnie nie przyjedzie punktualnie – nigdy nie przyjeżdża.","note":"probably przed won't"},{"en":"I don't think the landlord will agree to lower the rent.","pl":"Myślę, że właściciel nie zgodzi się obniżyć czynszu.","note":"przeczenie przy think na początku zdania"},{"en":"I doubt we'll find a cheap room near campus in October.","pl":"Wątpię, żebyśmy w październiku znaleźli tani pokój blisko kampusu.","note":"doubt = słabe przewidywanie"}],"pitfalls":[{"wrong":"Marta won't probably come to the party.","right":"Marta probably won't come to the party.","why":"w przeczeniu probably/definitely stoi przed won't"},{"wrong":"I think Bartek won't like the film.","right":"I don't think Bartek will like the film.","why":"przy think/believe/expect/suppose przeczenie zwykle na początku; wersja z won't brzmi nienaturalnie"},{"wrong":"I don't hope it will rain at the weekend.","right":"I hope it won't rain at the weekend.","why":"hope nie przenosi przeczenia na początek (inaczej niż think, believe, expect, suppose): mówimy I hope it won't rain albo I hope it doesn't rain"}],"slides":[{"pres":"II-4","slide":4},{"pres":"II-4","slide":13}]}],"uses":[{"group":"Predictions (unit 26)","tense":"Future Simple (will)","no":1,"use":"predictions based on opinions/intuition/experience","usePl":"przewidywanie z opinii, intuicji, doświadczenia (I think / I hope / I suppose; definitely, probably)","example":"I think the exam will be easier than last year's.","ref":"26.1","slide":{"pres":"II-4","slide":4}},{"group":"Predictions (unit 26)","tense":"Future Simple (will)","no":1,"use":"future facts (example on the slide: I will be 21 on Sunday)","usePl":"przyszłe fakty, które na pewno nastąpią (wiek, daty)","example":"My little sister will be eighteen in December, so she'll finally be able to vote.","ref":"26.1","slide":{"pres":"II-4","slide":4}},{"group":"Predictions (unit 26)","tense":"be going to","no":2,"use":"predictions based on evidence","usePl":"przewidywanie na podstawie dowodu widocznego teraz","example":"My phone's on two per cent – it's going to die any minute.","ref":"26.2","slide":{"pres":"II-4","slide":5}},{"group":"Predictions (unit 26)","tense":"Future Continuous","no":3,"use":"temporary action in progress at a particular time in the future","usePl":"czynność w toku w danym momencie przyszłości","example":"At nine tomorrow I'll be sitting in the dentist's chair.","ref":"26.3","slide":{"pres":"II-4","slide":6}},{"group":"Predictions (unit 26)","tense":"Future Continuous","no":3,"use":"present deductions","usePl":"dedukcja o teraźniejszości: pewnie teraz coś robi","example":"Don't call Kasia now – she'll be driving to work.","ref":"26.3","slide":{"pres":"II-4","slide":7}},{"group":"Predictions (unit 26)","tense":"Future Perfect","no":4,"use":"actions which will be completed before a particular time in the future","usePl":"czynność zakończona przed momentem w przyszłości (by then, by 2030, by the time…)","example":"I'll have handed in all my essays by the end of January.","ref":"26.4","slide":{"pres":"II-4","slide":8}},{"group":"Predictions (unit 26)","tense":"Future Perfect","no":4,"use":"present deductions","usePl":"dedukcja o teraźniejszości: pewnie już się stało (by now)","example":"The match started at six, so it'll have finished by now.","ref":"26.4","slide":{"pres":"II-4","slide":9}},{"group":"Predictions (unit 26)","tense":"Future Perfect Continuous","no":5,"use":"action which will still be in progress at a point in the future (focus on duration)","usePl":"czas trwania do momentu w przyszłości (for…); z live/work/stay także Future Perfect (slajd II/4 11)","example":"By the end of the year Ola will have been learning Korean for three years.","ref":"26.4","slide":{"pres":"II-4","slide":10}},{"group":"Predictions (unit 26)","tense":"Future Perfect Continuous","no":5,"use":"present deductions","usePl":"dedukcja o teraźniejszości: pewnie robi to już od jakiegoś czasu","example":"The concert starts at eight, so the fans at the gate will have been queuing for hours by now.","ref":"26.4","slide":{"pres":"II-4","slide":12}},{"group":"Predictions (unit 26)","tense":"Future Simple (will)","no":null,"use":"predictions with verbs like THINK/BELIEVE/EXPECT/HOPE/SUPPOSE – negative at the beginning of the sentence","usePl":"przeczenie na początku: I don't think he will… zamiast I think he won't…; wyjątek: hope (I hope he won't…)","example":"I don't expect the dean will change her mind.","ref":"26.5","slide":{"pres":"II-4","slide":13}}],"quiz":[{"id":"u26-01","type":"choice","prompt":"Look at Bartek – he's gone completely white and he's swaying. He ___ faint!","options":["will","is going to","faints"],"answer":1,"explain":"Dowód widoczny teraz (zbladł, chwieje się) i coś zaraz nastąpi → be going to (slajd II/4 5). Will przy takim dowodzie pojawia się raczej w opinii ze wstępem: I think he'll faint.","ref":"26.2"},{"id":"u26-02","type":"gap","prompt":"You haven't seen the flat yet? Wait till you do – I'm sure you ___ (love) it.","answers":["will love","'ll love","are going to love","'re going to love"],"explain":"Przewidywanie oparte na opinii (I'm sure) → typowo will, możliwe też be going to; nie Present Simple, jak sugeruje polskie „na pewno ci się spodoba”.","ref":"26.1"},{"id":"u26-03","type":"choice","prompt":"Don't wait for me tonight – I ___ finish before nine.","options":["won't probably","probably won't","will not probably"],"answer":1,"explain":"W przeczeniu probably stoi przed won't (jak na slajdzie II/4 4: I definitely won't pass).","ref":"26.5"},{"id":"u26-04","type":"choice","prompt":"Don't ring me at eight tomorrow – I ___ my driving test then.","options":["will take","will be taking","will have taken"],"answer":1,"explain":"O ósmej czynność będzie w toku (jestem w trakcie egzaminu, więc nie odbiorę) → Future Continuous.","ref":"26.3"},{"id":"u26-05","type":"choice","prompt":"Wybierz bardziej naturalną wersję: ___ to the lecture – she's still in Gdańsk.","options":["I don't think Natalia will make it","I think Natalia won't make it"],"answer":0,"explain":"Przy think przeczenie zwykle stawiamy na początku zdania (slajd II/4 13); I think… won't jest możliwe, ale mniej naturalne.","ref":"26.5"},{"id":"u26-06","type":"choice","prompt":"It's Monday, ten o'clock. Don't bother knocking on Dr Wiśniewska's door – she ___ her translation seminar now.","options":["will teach","will be teaching","will have taught"],"answer":1,"explain":"Dedukcja o teraźniejszości: pewnie właśnie prowadzi zajęcia → will be + -ing (slajd II/4 7).","ref":"26.3"},{"id":"u26-07","type":"choice","prompt":"Kamil's flight left Gdańsk at six and it's almost nine now, so he ___ in Oslo by now.","options":["will land","will be landing","will have landed"],"answer":2,"explain":"Dedukcja: coś zapewne już się wydarzyło (by now) → will have + III forma (slajd II/4 9).","ref":"26.4"},{"id":"u26-08","type":"choice","prompt":"Next month my mum ___ at the same hospital for thirty years – they're throwing her a party.","options":["will work","will be working","will have worked"],"answer":2,"explain":"Okres trwający do momentu w przyszłości (next month… for thirty years) → Future Perfect; przy live/work/stay równie dobrze will have been working (slajd II/4 11).","ref":"26.4"},{"id":"u26-09","type":"choice","prompt":"It's 2 a.m. and Maciek's light is still on – he ___ for his statistics exam since dinner.","options":["will revise","will have been revising","will be revised"],"answer":1,"explain":"Dedukcja o teraźniejszości z naciskiem na czas trwania (since dinner) → will have been + -ing (slajd II/4 12).","ref":"26.4"},{"id":"u26-10","type":"gap","prompt":"At midnight the band will still be playing – by then they ___ (play) for five hours non-stop.","answers":["will have been playing","'ll have been playing"],"explain":"Czynność wciąż trwa w momencie przyszłym, liczy się, jak długo (for five hours) → Future Perfect Continuous.","ref":"26.4"},{"id":"u26-11","type":"gap","prompt":"Hurry up! By the time we get to the station, the last train to Słupsk ___ (leave).","answers":["will have left","'ll have left"],"explain":"By the time + moment w przyszłości: pociąg odjedzie wcześniej → Future Perfect (slajd II/4 8).","ref":"26.4"},{"id":"u26-12","type":"gap","prompt":"Look at those dark clouds over the pier – it ___ (pour) any minute.","answers":["is going to pour","'s going to pour"],"explain":"Przewidywanie na podstawie dowodu widocznego teraz, bliska przyszłość → be going to.","ref":"26.2"},{"id":"u26-13","type":"gap","prompt":"Slow down with the shopping – at this rate, we ___ (spend) our whole budget by Friday.","answers":["will have spent","'ll have spent","are going to have spent","'re going to have spent"],"explain":"By Friday = przed tym momentem rzecz będzie zakończona → Future Perfect.","ref":"26.4"},{"id":"u26-14","type":"gap","prompt":"Relax – you ___ (definitely / pass); you've done every past paper twice.","answers":["will definitely pass","'ll definitely pass","are definitely going to pass","'re definitely going to pass"],"explain":"W zdaniu twierdzącym definitely stoi między will a bezokolicznikiem (slajd II/4 4: I will definitely pass).","ref":"26.5"},{"id":"u26-15","type":"fix","prompt":"Don't worry, Igor will be definitely at the airport on time.","wrong":"will be definitely","fixes":["will definitely be"],"answers":["Don't worry, Igor will definitely be at the airport on time."],"explain":"Przysłówek pewności stoi między will a bezokolicznikiem – także gdy bezokolicznikiem jest be.","ref":"26.5"},{"id":"u26-16","type":"fix","prompt":"This time next Friday we'll be being in Prague, so we can't help with the move.","wrong":"we'll be being","fixes":["we'll be","we will be"],"answers":["This time next Friday we'll be in Prague, so we can't help with the move.","This time next Friday we will be in Prague, so we can't help with the move."],"explain":"Czasownik be nie występuje w Future Continuous – o stanie w przyszłości mówimy po prostu will be.","ref":"26.3"},{"id":"u26-17","type":"use","prompt":"Ring me after nine – by then I'll have finished the presentation.","options":["1. Future Simple – prediction based on opinion","3. Future Continuous – action in progress at a particular time in the future","4. Future Perfect – action completed before a particular time in the future","5. Future Perfect Continuous – duration of an action up to a point in the future"],"answer":2,"explain":"By then + will have + III forma: prezentacja będzie skończona przed tym momentem (slajd II/4 8).","ref":"26.4"},{"id":"u26-18","type":"use","prompt":"Why isn't Oliwia answering her phone? – She'll be revising in the library.","options":["3. Future Continuous – action in progress at a particular time in the future","3. Future Continuous – present deduction","2. be going to – prediction based on evidence"],"answer":1,"explain":"Mowa o tym, co Oliwia robi teraz, i to tylko przypuszczenie → dedukcja o teraźniejszości (slajd II/4 7).","ref":"26.3"}],"translations":[{"id":"u26-t01","pl":"Spójrz na tę kolejkę – nie zdążymy na początek filmu.","answers":["Look at that queue – we're not going to make it in time for the start of the film.","Look at that queue – we aren't going to be in time for the start of the film."],"keys":["going to"],"explain":"Przewidywanie na podstawie tego, co widać teraz (kolejka) → be going to.","ref":"26.2"},{"id":"u26-t02","pl":"Jutro o tej porze będę leciał do Londynu.","answers":["This time tomorrow I'll be flying to London."],"keys":["will be flying"],"explain":"„O tej porze” = czynność w toku w konkretnym momencie przyszłości → Future Continuous.","ref":"26.3"},{"id":"u26-t03","pl":"Do czerwca napiszę pracę licencjacką.","answers":["I'll have written my BA thesis by June.","By June I'll have finished my BA thesis."],"keys":["will have"],"explain":"„Do czerwca” = by June: praca będzie skończona przed tym momentem → Future Perfect.","ref":"26.4"},{"id":"u26-t04","pl":"W październiku minie pięć lat, odkąd uczę się hiszpańskiego.","answers":["In October I'll have been learning Spanish for five years.","By October I'll have been learning Spanish for five years."],"keys":["will have been learning|will have been studying"],"explain":"Polskie „minie pięć lat, odkąd…” to czas trwania do momentu w przyszłości → Future Perfect Continuous + for.","ref":"26.4"},{"id":"u26-t05","pl":"Jest już po siódmej, więc Ola na pewno wyszła już z pracy.","answers":["It's past seven, so Ola will have left work by now.","It's gone seven, so Ola will definitely have left work by now."],"keys":["have left"],"explain":"Dedukcja o teraźniejszości: pewnie już się stało → will have + III forma (możliwe też must have left).","ref":"26.4"},{"id":"u26-t06","pl":"Nie sądzę, żeby Marek zdał prawo jazdy za pierwszym razem.","answers":["I don't think Marek will pass his driving test the first time.","I don't think Marek will pass his driving test at the first attempt."],"keys":["do not think","will pass|going to pass|will manage to pass"],"explain":"Przeczenie przy think na początku, w drugiej części twierdzące will (slajd II/4 13).","ref":"26.5"},{"id":"u26-t07","pl":"Na pewno nie skończę tego eseju do jutra.","answers":["I definitely won't finish this essay by tomorrow.","I definitely won't have finished this essay by tomorrow."],"keys":["definitely will not|certainly will not|definitely not going to|certainly not going to"],"explain":"W przeczeniu definitely stoi przed won't (slajd II/4 4).","ref":"26.5"}],"pairs":[{"id":"will-vs-going-to","title":"will czy be going to? (przewidywania)","a":{"name":"Future Simple (will)","when":"przewidywanie z opinii, intuicji lub doświadczenia; przyszłe fakty; często po I think / I'm sure / I hope i z probably, definitely","example":"I think Pogoń will finish in the top three this season."},"b":{"name":"be going to","when":"przewidywanie na podstawie dowodu, który widzimy lub znamy teraz; często coś zaraz nastąpi (ostrzeżenie)","example":"Pogoń are two goals up with five minutes left – they're going to win."},"tip":"Zapytaj: skąd to wiem? Z głowy (opinia, doświadczenie) → will; z tego, co widzę teraz → be going to. Po I think często oba są możliwe.","refs":["26.1","26.2"],"quiz":["u26-01","u26-02","u26-12"]},{"id":"future-continuous-vs-future-perfect","title":"Future Continuous czy Future Perfect?","a":{"name":"Future Continuous","when":"w danym momencie przyszłości czynność będzie w toku (this time next week, at ten tomorrow); dedukcja: she'll be teaching now","example":"At six I'll be cooking dinner, so come round then and help me."},"b":{"name":"Future Perfect","when":"przed danym momentem czynność będzie zakończona (by six, by then, by the time…); dedukcja: he'll have left by now","example":"By six I'll have cooked dinner, so come round then and we'll eat."},"tip":"W trakcie (at, this time) → will be + -ing; już po (by, by the time) → will have + III forma.","refs":["26.3","26.4"],"quiz":["u26-04","u26-06","u26-07","u26-11","u26-17"]},{"id":"future-perfect-simple-vs-continuous","title":"Future Perfect Simple czy Continuous?","a":{"name":"Future Perfect","when":"wynik: co i ile będzie zrobione przed momentem w przyszłości","example":"By Friday I'll have read four of the six novels on the list."},"b":{"name":"Future Perfect Continuous","when":"czas trwania czynności do momentu w przyszłości (for…), czynność wciąż trwa","example":"By Friday I'll have been reading for the literature exam for a fortnight."},"tip":"Ile sztuk albo czy skończone → simple; od jak dawna (for) → continuous. Z live, work, stay obie formy są poprawne: In March I'll have worked / I'll have been working here for two years (slajd II/4 11).","refs":["26.4"],"quiz":["u26-08","u26-09","u26-10","u26-13"]}],"signals":[{"word":"by then","tenses":["Future Perfect"],"example":"The essay is due on Monday – by then I'll have rewritten it twice.","note":"by = najpóźniej do; z Future Continuous tylko wtedy, gdy mówimy, co będzie w toku w tym czasie (By then I'll be living in Gdańsk).","ref":"26.4"},{"word":"by the time","tenses":["Future Perfect"],"example":"By the time you wake up, I'll have left for the airport.","note":"w zdaniu z by the time Present Simple (by the time you wake up), nie will; Future Perfect stoi w zdaniu głównym.","ref":"26.4"},{"word":"by 2030","tenses":["Future Perfect","Future Perfect Continuous"],"example":"By 2030 my parents will have paid off their mortgage.","note":"by + rok lub data → zwykle Future Perfect; z for + okres → Future Perfect Continuous (By 2030 my dad will have been driving buses for thirty years).","ref":"26.4"},{"word":"this time next week","tenses":["Future Continuous"],"example":"This time next week we'll be hiking in the Tatras.","note":"czynność w toku w danym momencie przyszłości; z be i czasownikami stanu zostaje samo will be (This time next week I'll be in Zakopane).","ref":"26.3"},{"word":"soon","tenses":["Future Simple (will)","Future Perfect"],"example":"Give me ten minutes – I'll have finished soon.","note":"z will w zwykłych przewidywaniach (The rain will stop soon); z Future Perfect, gdy coś niedługo będzie zakończone.","ref":"26.4"},{"word":"I think / I hope / I suppose","tenses":["Future Simple (will)"],"example":"I suppose the canteen will be closed on Sunday.","note":"przy I think / I suppose przeczenie na początku (I don't think…); po I hope często Present Simple (I hope it doesn't rain) i nigdy I don't hope.","ref":"26.5"},{"word":"definitely / probably","tenses":["Future Simple (will)","be going to"],"example":"She'll probably call you tonight, but she definitely won't apologise.","note":"po will w zdaniu twierdzącym (will probably), przed won't w przeczeniu (probably won't); z be going to: is probably going to / probably isn't going to.","ref":"26.5"}]},"27":{"unit":"27","title":"Decisions, intentions and arrangements","titlePl":"Decyzje, zamiary i ustalenia","module":6,"presentations":[{"id":"II-4","slides":[15,23]},{"id":"II-1","slides":[15,15]}],"summary":["**will** – decyzja podjęta w chwili mówienia (oferta, reakcja) i determinacja (I will help you whether you want it or not); **Shall I/we…?** – pytanie o decyzję, propozycja.","**be going to** – zamiar, decyzja podjęta wcześniej; z go/come zamiast going to go/come mówimy **I'm going home. Are you coming?**","**Present Continuous** – ustalone plany (arrangements) z określeniem czasu: We're seeing the landlord on Friday. Nie dla pogody i innych zdarzeń poza kontrolą ludzi.","**Future Continuous** – zdarzenia wynikające z wcześniejszych ustaleń (I'll be working then – taktowna odmowa) i uprzejme pytania o plany (Will you be staying long?).","**be to + bezokolicznik** – oficjalne ustalenia i wiadomości, if-clauses (If we are to succeed…), formalne polecenia i zakazy (are not to be taken); **was to have + III forma** = plan, który się nie spełnił."],"sections":[{"ref":"27.1","page":124,"title":"Future Simple: decyzje spontaniczne i determinacja","rule":"**will/won't + bezokolicznik** – decyzja podjęta **w chwili mówienia** (oferty, reakcje na nową informację). Pytając o decyzję lub coś proponując, używamy **Shall I/we…?** Mocno akcentowane will/won't wzmacniają znaczenie i wyrażają **determinację**; nie skracamy ich wtedy do 'll (wyjątek: z akcentowanym przysłówkiem, np. He'll never…). Formalnie: will dla bardzo oficjalnych ustaleń, a **shall / shall not** z I i we dla determinacji w oficjalnym kontekście.","examples":[{"en":"The printer's jammed again? Hang on, I'll take a look.","pl":"Drukarka znowu się zacięła? Poczekaj, zaraz zobaczę.","note":"decyzja w chwili mówienia"},{"en":"Shall we split the bill, or shall I get this one?","pl":"Dzielimy rachunek, czy tym razem ja stawiam?","note":"shall – pytanie o decyzję, propozycja"},{"en":"I will finish this marathon, even if I have to crawl over the line.","pl":"Ukończę ten maraton, nawet jeśli będę musiał doczołgać się do mety.","note":"determinacja: akcentowane will, bez skrótu"},{"en":"As chair of this committee, I shall not tolerate personal attacks.","pl":"Jako przewodnicząca tej komisji nie będę tolerować osobistych ataków.","note":"shall not z I – determinacja w formalnym kontekście"}],"pitfalls":[{"wrong":"The phone's ringing. – OK, I answer it.","right":"The phone's ringing. – OK, I'll answer it.","why":"decyzja w chwili mówienia → will; polskie „odbiorę” nie daje tu Present Simple"},{"wrong":"Will I open the window?","right":"Shall I open the window?","why":"propozycja lub pytanie o decyzję z I/we → shall; Will I…? pyta o przewidywanie"}],"slides":[{"pres":"II-4","slide":16},{"pres":"II-4","slide":17}]},{"ref":"27.2","page":124,"title":"be going to: zamiary i plany","rule":"**be going to + bezokolicznik** – działanie, o którym **już zdecydowaliśmy** (plan, zamiar), w odróżnieniu od decyzji podjętej w chwili mówienia (will). Determinację podkreślamy akcentem na be albo not (I AM going to…, I'm NOT going to…). Z czasownikami **go i come** zwykle unikamy be going to: zamiast I'm going to go home / Are you going to come? mówimy **I'm going home / Are you coming?**","examples":[{"en":"I'm going to apply for an Erasmus semester in Lisbon – I've already filled in the form.","pl":"Zamierzam aplikować na semestr Erasmusa w Lizbonie – już wypełniłam formularz.","note":"decyzja podjęta wcześniej"},{"en":"We're not going to renew the contract for the flat – it's far too expensive.","pl":"Nie zamierzamy przedłużać umowy na mieszkanie – jest o wiele za drogie.","note":"zamiar w przeczeniu"},{"en":"I'm going to the gym after class. Are you coming?","pl":"Po zajęciach idę na siłownię. Idziesz ze mną?","note":"go/come: Present Continuous zamiast going to go / going to come"}],"pitfalls":[{"wrong":"I'm going to go to bed now – I'm exhausted.","right":"I'm going to bed now – I'm exhausted.","why":"z go/come unikamy going to go; wystarczy Present Continuous (slajd II/4 18)"},{"wrong":"– Why are you buying so much flour? – I'll bake a cake for Ewa's birthday.","right":"– Why are you buying so much flour? – I'm going to bake a cake for Ewa's birthday.","why":"zamiar istniał przed rozmową (stąd zakupy) → be going to, nie will"}],"slides":[{"pres":"II-4","slide":18}]},{"ref":"27.3","page":124,"title":"Present Continuous i be going to: ustalenia a zamiary","rule":"**Present Continuous** – wydarzenie przyszłe, które jest już **ustalone** w chwili mówienia (kupione bilety, umówiony termin, inni ludzie o tym wiedzą); zwykle z określeniem czasu. **be going to** akcentuje nasz zamiar – ustaleń może jeszcze nie być. Często obie formy są wymienne. Present Continuous służy też do planów bezosobowych (firmy, instytucje) i brzmi wtedy bardziej formalnie niż going to. Nie używamy go dla zdarzeń poza kontrolą ludzi, np. pogody (nie: It's raining on Saturday).","examples":[{"en":"We're flying to Lisbon on 3 February – the tickets are already booked.","pl":"Lecimy do Lizbony 3 lutego – bilety są już zarezerwowane.","note":"ustalenie (bilety) + określenie czasu"},{"en":"I'm seeing my supervisor at two to talk about my thesis.","pl":"O drugiej spotykam się z promotorem w sprawie pracy dyplomowej.","note":"umówione spotkanie; po polsku czas teraźniejszy"},{"en":"I'm going to look for a part-time job, but I haven't sent any applications yet.","pl":"Zamierzam poszukać pracy na pół etatu, ale nie wysłałem jeszcze żadnego CV.","note":"zamiar bez ustaleń → be going to"},{"en":"The faculty is introducing online enrolment from next semester.","pl":"Wydział od przyszłego semestru wprowadza zapisy online.","note":"plan bezosobowy (instytucja)"}],"pitfalls":[{"wrong":"I meet Ola for coffee tomorrow at five.","right":"I'm meeting Ola for coffee tomorrow at five.","why":"umówione spotkanie → Present Continuous; Present Simple tylko dla rozkładów i harmonogramów (28.1)"},{"wrong":"It's raining on Saturday, so the barbecue is off.","right":"It's going to rain on Saturday, so the barbecue is off.","why":"pogoda to nie ustalenie, tylko przewidywanie → be going to lub will"},{"wrong":"What do you do this weekend?","right":"What are you doing this weekend?","why":"pytanie o plany → Present Continuous; What do you do? pyta o zawód albo zwyczaje"}],"slides":[{"pres":"II-4","slide":19},{"pres":"II-1","slide":15}]},{"ref":"27.4","page":125,"title":"Future Continuous: skutek ustaleń i uprzejme pytania","rule":"**will/won't be + -ing** – zdarzenia, które są **wynikiem wcześniejszych ustaleń** albo częścią planu (grafik, remont, rozkład); traktujemy je jak sprawę załatwioną. Dlatego to taktowny sposób, by **odmówić zaproszenia** (I'll be working then – zamiast I'll work) i **uprzejmie zapytać o plany**: Will you be staying long? jest grzeczniejsze niż Are you staying long? Future Continuous dystansuje plan od mówiącego i przedstawia go jako mniej zmienny.","examples":[{"en":"The library will be closing at 3 p.m. on Friday because of a staff training day.","pl":"W piątek biblioteka będzie czynna tylko do 15 z powodu szkolenia pracowników.","note":"skutek wcześniejszej decyzji, komunikat"},{"en":"I'd love to come to the barbecue, but I'll be working at the hotel all weekend.","pl":"Chętnie przyszłabym na grilla, ale cały weekend pracuję w hotelu.","note":"taktowna odmowa; po polsku czas teraźniejszy"},{"en":"Will you be using the car tomorrow evening? I need to pick up my sister from the station.","pl":"Będziesz jutro wieczorem potrzebować samochodu? Muszę odebrać siostrę z dworca.","note":"uprzejme pytanie o plany przed prośbą"}],"pitfalls":[{"wrong":"Sorry, you can't borrow the car tomorrow – I'll use it myself.","right":"Sorry, you can't borrow the car tomorrow – I'll be using it myself.","why":"odmowa z powodu wcześniejszych ustaleń → Future Continuous (albo I'm using it); I'll use brzmi jak decyzja podjęta teraz"}],"slides":[{"pres":"II-4","slide":20}]},{"ref":"27.5","page":125,"title":"be to + bezokolicznik","rule":"**be to + bezokolicznik** – oficjalne, formalne ustalenia, typowe dla wiadomości (w nagłówkach be odpada: MINISTER TO VISIT…). W **if-clauses**: If we are to succeed… = jeśli mamy osiągnąć cel, najpierw musi się stać to, co w zdaniu głównym. **Formalne polecenia i zakazy**: You are (not) to…; instrukcje często w stronie biernej: are not to be taken. **was/were to** = przyszłość w przeszłości (było zaplanowane); **was/were to have + III forma** = plan się nie spełnił (więcej: Unit 29.2).","examples":[{"en":"The Minister of Education is to visit the university next Tuesday.","pl":"Minister edukacji ma odwiedzić uczelnię w przyszły wtorek.","note":"oficjalne ustalenie, styl wiadomości"},{"en":"If you are to get a place on the master's programme, you'll need an average of at least 4.5.","pl":"Jeśli chcesz dostać się na studia magisterskie, potrzebujesz średniej co najmniej 4,5.","note":"if-clause: warunek konieczny do osiągnięcia celu"},{"en":"Students are not to use mobile phones during the exam.","pl":"Studentom nie wolno używać telefonów podczas egzaminu.","note":"formalny zakaz"},{"en":"The new stadium was to have opened in May, but the builders went bankrupt.","pl":"Nowy stadion miał zostać otwarty w maju, ale wykonawca zbankrutował.","note":"was to have + III forma: plan niezrealizowany"}],"pitfalls":[{"wrong":"If the festival will survive, it needs more sponsors.","right":"If the festival is to survive, it needs more sponsors.","why":"if-clause z celem, od którego zależy zdanie główne → be to + bezokolicznik, nie will"},{"wrong":"Reference books are not to remove from the reading room.","right":"Reference books are not to be removed from the reading room.","why":"instrukcja o przedmiocie → be to + bezokolicznik bierny (to be removed)"}],"slides":[{"pres":"II-4","slide":21},{"pres":"II-4","slide":22}]}],"uses":[{"group":"Decisions, intentions and arrangements (unit 27)","tense":"Future Simple (will)","no":1,"use":"spontaneous decisions","usePl":"decyzja podjęta w chwili mówienia","example":"You're soaked! I'll make you a hot drink.","ref":"27.1","slide":{"pres":"II-4","slide":16}},{"group":"Decisions, intentions and arrangements (unit 27)","tense":"Future Simple (will)","no":1,"use":"determination (will/won't to strengthen the meaning)","usePl":"determinacja, mocne postanowienie (akcentowane will/won't)","example":"I won't lend him another złoty, whatever he says.","ref":"27.1","slide":{"pres":"II-4","slide":16}},{"group":"Decisions, intentions and arrangements (unit 27)","tense":"shall","no":2,"use":"to ask about decisions","usePl":"pytanie o decyzję, propozycja (Shall I/we…?)","example":"Shall we take the train or drive?","ref":"27.1","slide":{"pres":"II-4","slide":17}},{"group":"Decisions, intentions and arrangements (unit 27)","tense":"shall","no":2,"use":"with WE and I to express determination (esp. in formal contexts)","usePl":"determinacja z I/we w formalnym kontekście (shall not)","example":"We shall not give in to pressure from the investors.","ref":"27.1","slide":{"pres":"II-4","slide":17}},{"group":"Decisions, intentions and arrangements (unit 27)","tense":"be going to","no":3,"use":"planned decisions/intentions","usePl":"zamiar, decyzja podjęta wcześniej","example":"I'm going to ask my manager for a pay rise on Monday.","ref":"27.2","slide":{"pres":"II-4","slide":18}},{"group":"Decisions, intentions and arrangements (unit 27)","tense":"be going to","no":3,"use":"avoided with COME and GO","usePl":"zamiast going to go / going to come – Present Continuous: I'm going home. Are you coming?","example":"I'm going to the post office – do you need anything?","ref":"27.2","slide":{"pres":"II-4","slide":18}},{"group":"Decisions, intentions and arrangements (unit 27)","tense":"Present Continuous","no":4,"use":"fixed arrangements with a time expression","usePl":"ustalone plany z określeniem czasu (to samo co II/1 15, użycie 4: future arrangements)","example":"We're having a farewell party for Oksana on Saturday.","ref":"27.3","slide":{"pres":"II-4","slide":19}},{"group":"Decisions, intentions and arrangements (unit 27)","tense":"Future Continuous","no":5,"use":"events that are the result of a previous arrangement","usePl":"zdarzenia wynikające z wcześniejszych ustaleń; taktowna odmowa","example":"I can't make Friday – I'll be working a double shift.","ref":"27.4","slide":{"pres":"II-4","slide":20}},{"group":"Decisions, intentions and arrangements (unit 27)","tense":"Future Continuous","no":5,"use":"to ask about intentions (politely)","usePl":"uprzejme pytanie o czyjeś plany","example":"Will you be needing the projector after lunch?","ref":"27.4","slide":{"pres":"II-4","slide":20}},{"group":"Decisions, intentions and arrangements (unit 27)","tense":"be to + infinitive","no":6,"use":"official arrangements, often in news articles","usePl":"oficjalne ustalenia, styl wiadomości","example":"The mayor is to unveil the new monument on Friday.","ref":"27.5","slide":{"pres":"II-4","slide":21}},{"group":"Decisions, intentions and arrangements (unit 27)","tense":"be to + infinitive","no":6,"use":"was to / was to have met (future in the past)","usePl":"was to = było zaplanowane; was to have + III forma = plan się nie spełnił (Unit 29.2)","example":"The band was to have played in Koszalin, but the tour was cancelled.","ref":"29.2","slide":{"pres":"II-4","slide":21}},{"group":"Decisions, intentions and arrangements (unit 27)","tense":"be to + infinitive","no":6,"use":"IF-clauses","usePl":"if + be to: warunek konieczny do osiągnięcia celu","example":"If the team is to reach the final, it needs a new goalkeeper.","ref":"27.5","slide":{"pres":"II-4","slide":22}},{"group":"Decisions, intentions and arrangements (unit 27)","tense":"be to + infinitive","no":6,"use":"formal commands and instructions","usePl":"formalne polecenia i zakazy; instrukcje w stronie biernej (are not to be taken)","example":"Bags are not to be left unattended in the corridor.","ref":"27.5","slide":{"pres":"II-4","slide":22}}],"quiz":[{"id":"u27-01","type":"choice","prompt":"– We've run out of milk. – Have we? I ___ some on my way back from uni.","options":["'m going to get","'ll get","get"],"answer":1,"explain":"Reakcja na nową informację, decyzja podjęta w chwili mówienia → will (slajd II/4 16).","ref":"27.1"},{"id":"u27-02","type":"gap","prompt":"– This box weighs a ton. – Hang on, I ___ (give) you a hand.","answers":["'ll give","will give"],"explain":"Spontaniczna oferta pomocy, decyzja w chwili mówienia → will.","ref":"27.1"},{"id":"u27-03","type":"choice","prompt":"– Why have you bought five tins of paint? – I ___ my room at the weekend.","options":["'ll paint","'m going to paint","paint"],"answer":1,"explain":"Zamiar istniał wcześniej (stąd kupiona farba) → be going to; will oznaczałoby decyzję podjętą dopiero teraz.","ref":"27.2"},{"id":"u27-04","type":"gap","prompt":"I've made up my mind – after graduation I ___ (apply) for a translation course in Edinburgh.","answers":["'m going to apply","am going to apply"],"explain":"Decyzja zapadła wcześniej (I've made up my mind), ale nic nie jest jeszcze ustalone → be going to.","ref":"27.2"},{"id":"u27-05","type":"choice","prompt":"It's freezing in here. ___ I close the window?","options":["Will","Shall","Do"],"answer":1,"explain":"Propozycja, pytanie o decyzję z I/we → Shall I…? (slajd II/4 17).","ref":"27.1"},{"id":"u27-06","type":"choice","prompt":"Wybierz bardziej naturalną wersję: It's late, so ___ – see you tomorrow.","options":["I'm going home","I'm going to go home"],"answer":0,"explain":"Z go i come unikamy be going to; wystarczy Present Continuous: I'm going home (slajd II/4 18).","ref":"27.2"},{"id":"u27-07","type":"choice","prompt":"I can't help you move on Saturday – I ___ my thesis supervisor at ten. We arranged it last week.","options":["meet","'ll meet","'m meeting"],"answer":2,"explain":"Ustalone spotkanie z konkretną godziną → Present Continuous (slajd II/4 19; II/1 15, użycie 4).","ref":"27.3"},{"id":"u27-08","type":"gap","prompt":"We ___ (have) a farewell dinner for Oksana tomorrow at eight – the table's already booked.","answers":["'re having","are having","'re going to have","are going to have","'ll be having","will be having"],"explain":"Ustalenie (stolik zarezerwowany) + czas → typowo Present Continuous; możliwe też be going to lub Future Continuous, ale nie will ani Present Simple.","ref":"27.3"},{"id":"u27-09","type":"fix","prompt":"According to the forecast, it's raining all day on Saturday, so the barbecue is off.","wrong":"it's raining","fixes":["it's going to rain","it is going to rain","it will rain","it'll rain","it will be raining","it'll be raining"],"answers":["According to the forecast, it's going to rain all day on Saturday, so the barbecue is off.","According to the forecast, it is going to rain all day on Saturday, so the barbecue is off.","According to the forecast, it will rain all day on Saturday, so the barbecue is off.","According to the forecast, it'll rain all day on Saturday, so the barbecue is off.","According to the forecast, it will be raining all day on Saturday, so the barbecue is off.","According to the forecast, it'll be raining all day on Saturday, so the barbecue is off."],"explain":"Pogoda to przewidywanie, a nie ustalenie → be going to lub will (z all day także will be raining); Present Continuous tylko dla planów zależnych od ludzi.","ref":"27.3"},{"id":"u27-10","type":"choice","prompt":"I'd love to come to Kuba's birthday on Thursday, but I ___ at the hotel reception then – I'm on evening shifts all week.","options":["'ll work","'ll be working","'ll have worked"],"answer":1,"explain":"Zdarzenie wynikające z wcześniejszych ustaleń (grafik) i taktowna odmowa → Future Continuous; I'll work brzmi jak decyzja podjęta teraz (slajd II/4 20).","ref":"27.4"},{"id":"u27-11","type":"use","prompt":"Will you be staying at the hostel for the whole conference?","options":["4. Present Continuous – fixed arrangement","5. Future Continuous – result of a previous arrangement","5. Future Continuous – asking about intentions politely","6. be to + infinitive – official arrangement"],"answer":2,"explain":"Pytanie o czyjeś plany w Future Continuous jest grzeczniejsze i mniej bezpośrednie niż Are you staying…? (slajd II/4 20).","ref":"27.4"},{"id":"u27-12","type":"gap","prompt":"The university ___ (be to / open) a Korean studies department next October, a spokesperson announced.","answers":["is to open","'s to open"],"explain":"Oficjalne ustalenie podawane w wiadomościach → be to + bezokolicznik (slajd II/4 21).","ref":"27.5"},{"id":"u27-13","type":"gap","prompt":"If Koszalin ___ (be to / attract) more tourists, it needs a better rail connection with Berlin.","answers":["is to attract","'s to attract"],"explain":"if + be to: żeby osiągnąć cel z if, najpierw musi się stać to, co w zdaniu głównym (slajd II/4 22).","ref":"27.5"},{"id":"u27-14","type":"gap","prompt":"Exam papers ___ (be to / not / take) out of the room.","answers":["are not to be taken","aren't to be taken"],"explain":"Formalna instrukcja dotycząca przedmiotu → be not to + bezokolicznik bierny (to be taken), jak na slajdzie II/4 22.","ref":"27.5"},{"id":"u27-15","type":"choice","prompt":"NOTICE: Residents ___ their bikes in the corridors under any circumstances.","options":["are not to leave","are not leaving","are not to be left"],"answer":0,"explain":"Formalny zakaz skierowany do ludzi → be not to + bezokolicznik czynny; strona bierna pasowałaby tylko z podmiotem bikes.","ref":"27.5"},{"id":"u27-16","type":"choice","prompt":"Spotkanie się NIE odbyło. Wybierz formę, która sama to wyraża: The rector ___ the Erasmus delegation on Monday.","options":["was to meet","was to have met","is to meet"],"answer":1,"explain":"was to have + III forma = plan, który się nie spełnił; samo was to meet nie mówi, czy do spotkania doszło (slajd II/4 21).","ref":"29.2"},{"id":"u27-17","type":"fix","prompt":"– It's pouring outside. – Wait, I'm going to lend you my umbrella.","wrong":"I'm going to lend","fixes":["I'll lend","I will lend"],"answers":["– It's pouring outside. – Wait, I'll lend you my umbrella.","– It's pouring outside. – Wait, I will lend you my umbrella."],"explain":"Decyzja podjęta w chwili mówienia (reakcja na deszcz) → will, nie be going to.","ref":"27.1"},{"id":"u27-18","type":"use","prompt":"I WILL get my driving licence before the summer, whatever it takes.","options":["1. will – spontaneous decision","1. will – determination","2. shall – asking about decisions","3. be going to – planned intention"],"answer":1,"explain":"Akcentowane, nieskrócone will wzmacnia znaczenie i wyraża determinację (slajd II/4 16).","ref":"27.1"}],"translations":[{"id":"u27-t01","pl":"Nie martw się, pomogę ci z tym projektem.","answers":["Don't worry, I'll help you with this project.","Don't worry, I'll help you with the project."],"keys":["will help"],"explain":"Spontaniczna oferta, decyzja w chwili mówienia → will.","ref":"27.1"},{"id":"u27-t02","pl":"Jutro o dziewiątej spotykam się z promotorem.","answers":["I'm meeting my supervisor at nine tomorrow.","Tomorrow at nine I'm meeting my supervisor."],"keys":["am meeting|am seeing"],"explain":"Polski czas teraźniejszy o umówionym spotkaniu → Present Continuous, nie Present Simple.","ref":"27.3"},{"id":"u27-t03","pl":"Idziesz z nami do kina w piątek?","answers":["Are you coming to the cinema with us on Friday?"],"keys":["are you coming|are you going to the cinema"],"explain":"Pytanie o plan; z come wystarczy Present Continuous zamiast are you going to come (slajd II/4 18).","re
