ctions happening at the same time","usePl":"dwie czynności w przeszłości w tym samym momencie","example":"Just as the train pulled in, Maja spotted us on the platform.","ref":"21.1","slide":{"pres":"II-3","slide":4}},{"tense":"Past Simple","no":3,"use":"repeated actions in the past","usePl":"czynności powtarzane w przeszłości (także z liczbą razy)","example":"I called the landlord four times last week.","ref":"21.1","slide":{"pres":"II-3","slide":4}},{"tense":"Past Simple","no":4,"use":"a sequence of actions","usePl":"sekwencja czynności, jedna po drugiej","example":"She grabbed her keys, said goodbye and jumped on her bike.","ref":"21.1","slide":{"pres":"II-3","slide":4}},{"tense":"Past Simple","no":5,"use":"states in the past","usePl":"stany w przeszłości","example":"As a child, Oskar was terrified of dogs.","ref":"21.1","slide":{"pres":"II-3","slide":4}},{"tense":"Past Simple","no":null,"use":"one action resulting in another","usePl":"jedna czynność wywołuje drugą (skutek)","example":"When the bus broke down, we missed the first lecture.","ref":"21.1","slide":null},{"tense":"used to","no":null,"use":"actions in the past (repeated, no longer happening)","usePl":"powtarzane czynności z przeszłości, których już nie ma","example":"We used to cycle to the beach in Mielno every Sunday.","ref":"21.5","slide":{"pres":"II-3","slide":5}},{"tense":"used to","no":null,"use":"states in the past","usePl":"stany z przeszłości, które się zmieniły (tylko used to, nie would)","example":"This café used to be a bookshop.","ref":"21.5","slide":{"pres":"II-3","slide":5}},{"tense":"would","no":null,"use":"actions in the past (repeated, no longer happening)","usePl":"powtarzane czynności z przeszłości (nie stany), zwykle z podanym kontekstem","example":"On winter evenings Grandma would tell us stories about her childhood.","ref":"21.5","slide":{"pres":"II-3","slide":5}},{"tense":"Past Continuous","no":1,"use":"longer action in progress (while …) with a shorter action happening during it (no description on the slide)","usePl":"dłuższa czynność w toku (zwykle z while), w trakcie której zdarzyło się coś krótkiego w Past Simple; na slajdzie bez nazwy","example":"While I was queuing for coffee, someone walked off with my umbrella.","ref":"21.3","slide":{"pres":"II-3","slide":7}},{"tense":"Past Continuous","no":2,"use":"action in progress at a point of time","usePl":"czynność w toku w danym momencie przeszłości","example":"At ten last night we were still rehearsing for the show.","ref":"21.2","slide":{"pres":"II-3","slide":7}},{"tense":"Past Continuous","no":3,"use":"temporary situation","usePl":"sytuacja tymczasowa","example":"In my first year I was sharing a tiny room with two other students.","ref":"21.2","slide":{"pres":"II-3","slide":7}},{"tense":"Past Continuous","no":4,"use":"interrupted action","usePl":"czynność przerwana krótkim zdarzeniem","example":"Nina was taking notes when her laptop suddenly died.","ref":"21.3","slide":{"pres":"II-3","slide":7}},{"tense":"Past Continuous","no":5,"use":"gradual change in the past","usePl":"stopniowa zmiana w przeszłości","example":"The days were getting shorter and the town was slowly emptying of tourists.","ref":"21.2","slide":{"pres":"II-3","slide":7}},{"tense":"Past Continuous","no":6,"use":"two simultaneous actions extended in time","usePl":"dwie dłuższe czynności trwające równolegle","example":"While Bartek was washing up, his sister was drying the plates.","ref":"21.2","slide":{"pres":"II-3","slide":8}},{"tense":"Past Continuous","no":7,"use":"future arrangement in the past","usePl":"ustalenie na przyszłość z perspektywy przeszłości","example":"I said no to the night out because I was driving to Berlin the following day.","ref":"21.4","slide":{"pres":"II-3","slide":8}},{"tense":"Past Continuous","no":8,"use":"providing the background to a story","usePl":"tło opowiadania","example":"The wind was howling and rain was lashing against the windows when the doorbell rang.","ref":"21.2","slide":{"pres":"II-3","slide":8}},{"tense":"Past Continuous","no":9,"use":"polite, tentative requests","usePl":"uprzejme, ostrożne prośby (I was wondering if…)","example":"I was wondering if you could swap shifts with me on Saturday.","ref":"21.4","slide":{"pres":"II-3","slide":8}},{"tense":"Past Continuous","no":10,"use":"emphasising a very frequent action","usePl":"podkreślenie bardzo częstej, zwykle irytującej czynności (always)","example":"Our old neighbour was always complaining about the noise.","ref":"21.2","slide":{"pres":"II-3","slide":8}},{"tense":"Past Continuous","no":null,"use":"repeated actions over a temporary period","usePl":"czynność powtarzana w ograniczonym okresie (bez liczby razy)","example":"That month I was getting up at five every day to revise.","ref":"21.2","slide":null},{"tense":"Past Continuous","no":null,"use":"unfulfilled plans and expectations (plan, expect, hope)","usePl":"plany i oczekiwania, które się nie spełniły","example":"We were hoping to see the northern lights, but it was cloudy all week.","ref":"21.4","slide":null}],"quiz":[{"id":"u21-01","type":"choice","prompt":"I ___ my student ID on the bus yesterday, so I can't get into the library today.","options":["left","have left","was leaving"],"answer":0,"explain":"Podany zakończony czas (yesterday) → Past Simple, nawet jeśli skutek widać dziś. Present Perfect nie łączy się z yesterday.","ref":"21.1"},{"id":"u21-02","type":"gap","prompt":"Dominika ___ (call) the landlord six times last week, but he never picked up.","answers":["called"],"explain":"Czynność powtarzana z podaną liczbą razy w zamkniętym okresie → Past Simple (użycie 3). Past Continuous nie łączy się z liczbą razy.","ref":"21.1"},{"id":"u21-03","type":"gap","prompt":"When the alarm went off, Wiktor ___ (jump) out of bed, grabbed a towel and ran to the shower.","answers":["jumped"],"explain":"Sekwencja czynności jedna po drugiej → Past Simple (użycie 4). Had jumped znaczyłoby, że wyskoczył z łóżka, zanim zadzwonił budzik.","ref":"21.1"},{"id":"u21-04","type":"choice","prompt":"During the summer holidays Kinga ___ at a hotel reception in Kołobrzeg, so she only came home at weekends.","options":["was working","has worked","had been working"],"answer":0,"explain":"Tymczasowa sytuacja w zamkniętym okresie przeszłym → Past Continuous (użycie 3). Present Perfect nie pasuje do zakończonego okresu, a Past Perfect Continuous wymagałby późniejszego punktu odniesienia.","ref":"21.2"},{"id":"u21-05","type":"gap","prompt":"When the exam results appeared on the screen, Natalia ___ (laugh) with relief.","answers":["laughed"],"explain":"Dwie krótkie czynności w tym samym momencie, druga jest reakcją na pierwszą → Past Simple w obu częściach (użycie 2). Was laughing znaczyłoby, że śmiała się już wcześniej.","ref":"21.1"},{"id":"u21-06","type":"gap","prompt":"At half past eleven last night I ___ (revise) for my phonetics test, so I didn't hear your call.","answers":["was revising"],"explain":"Czynność w toku w konkretnym momencie przeszłości (at half past eleven) → Past Continuous (użycie 2).","ref":"21.2"},{"id":"u21-07","type":"gap","prompt":"When I reached the dean's office at nine, the queue ___ (get) longer by the minute.","answers":["was getting"],"explain":"Stopniowa zmiana trwająca w chwili mojego przyjścia (by the minute) → Past Continuous (użycie 5).","ref":"21.2"},{"id":"u21-08","type":"choice","prompt":"I was jogging along the seafront in Mielno ___ I twisted my ankle.","options":["while","when"],"answer":1,"explain":"Krótkie zdarzenie, które przerwało czynność w toku, wprowadzamy przez when, nie while; while stoi przy czynności w toku.","ref":"21.3"},{"id":"u21-09","type":"choice","prompt":"While we ___ for the tram in Szczecin, a tourist asked us the way to the castle.","options":["were waiting","had waited","have been waiting"],"answer":0,"explain":"while + dłuższa czynność w toku, w trakcie której zdarzyło się coś krótkiego (asked) → Past Continuous (użycie 1). Had waited znaczyłoby, że czekanie już się skończyło.","ref":"21.3"},{"id":"u21-10","type":"fix","prompt":"It was a freezing January night and it snowed heavily when we finally reached the mountain hut.","wrong":"it snowed heavily","fixes":["it was snowing heavily"],"answers":["It was a freezing January night and it was snowing heavily when we finally reached the mountain hut."],"explain":"Tło opowiadania – pogoda trwająca w chwili, gdy coś się wydarzyło → Past Continuous (użycie 8); samo zdarzenie (reached) zostaje w Past Simple.","ref":"21.2"},{"id":"u21-11","type":"choice","prompt":"While Szymon ___ the dishes, his sister was hoovering the living room.","options":["was washing","had been washing","has been washing"],"answer":0,"explain":"Dwie dłuższe czynności trwające równolegle → Past Continuous w obu częściach (użycie 6). Past Perfect Continuous oznaczałby czynność wcześniejszą.","ref":"21.2"},{"id":"u21-12","type":"use","prompt":"Back in the dorm, my roommate was always leaving wet towels on the bathroom floor.","options":["temporary situation – sytuacja tymczasowa (Past Continuous, użycie 3)","emphasising a very frequent action – bardzo częsta, irytująca czynność (Past Continuous, użycie 10)","gradual change in the past – stopniowa zmiana (Past Continuous, użycie 5)"],"answer":1,"explain":"always + Past Continuous podkreśla bardzo częstą, irytującą czynność (użycie 10). W Past Simple (always left) byłby to neutralny nawyk.","ref":"21.2"},{"id":"u21-13","type":"choice","prompt":"I couldn't come to the karaoke night because I ___ my new job at seven the next morning.","options":["was starting","have started","had started"],"answer":0,"explain":"Ustalenie na przyszłość z perspektywy przeszłości (the next morning) → Past Continuous (użycie 7). Had started znaczyłoby, że praca już się wcześniej zaczęła.","ref":"21.4"},{"id":"u21-14","type":"use","prompt":"I was wondering if you could proofread my cover letter before Friday.","options":["action in progress at a point of time – czynność w toku w danym momencie (Past Continuous, użycie 2)","future arrangement in the past – ustalenie z perspektywy przeszłości (Past Continuous, użycie 7)","polite, tentative requests – uprzejma, ostrożna prośba (Past Continuous, użycie 9)"],"answer":2,"explain":"I was wondering if you could… to prośba dotycząca teraźniejszości; forma przeszła tylko zmiękcza ton (użycie 9).","ref":"21.4"},{"id":"u21-15","type":"choice","prompt":"There ___ a small cinema opposite our block of flats, but now it's a supermarket.","options":["used to be","would be","was being"],"answer":0,"explain":"Stan w przeszłości, który się zmienił → used to. Would opisuje tylko powtarzane czynności, nie stany.","ref":"21.5"},{"id":"u21-16","type":"fix","prompt":"My grandparents would have a small farm near Bobolice, but they sold it when I was ten.","wrong":"would have","fixes":["used to have","had"],"answers":["My grandparents used to have a small farm near Bobolice, but they sold it when I was ten.","My grandparents had a small farm near Bobolice, but they sold it when I was ten."],"explain":"Posiadanie to stan, a would opisuje tylko powtarzane czynności → used to have albo had.","ref":"21.5"},{"id":"u21-17","type":"choice","prompt":"Before moving to Koszalin, Filip ___ in Gdynia for five years.","options":["lived","used to live","would live"],"answer":0,"explain":"Podana długość okresu (for five years) → Past Simple. Used to i would nie łączą się z długością trwania ani z liczbą razy.","ref":"21.5"},{"id":"u21-18","type":"gap","prompt":"After two months in the dorm, Agata is finally getting used to ___ (share) a bathroom with eight people.","answers":["sharing"],"explain":"get used to = przyzwyczajać się; to jest tu przyimkiem, więc po nim forma -ing, nie bezokolicznik.","ref":"21.5"}],"translations":[{"id":"u21-t01","pl":"W zeszłym roku czytałam tę książkę trzy razy.","answers":["I read this book three times last year.","Last year I read this book three times."],"keys":["read","three times"],"explain":"Polski czas niedokonany (czytałam) nie oznacza Past Continuous: podana liczba razy → Past Simple.","ref":"21.1"},{"id":"u21-t02","pl":"Kiedy zadzwoniłeś, oglądałem mecz.","answers":["When you called, I was watching the match.","I was watching the match when you called.","When you rang, I was watching the game."],"keys":["was watching"],"explain":"Czynność w toku przerwana telefonem → Past Continuous; samo zdarzenie (zadzwoniłeś) w Past Simple.","ref":"21.3"},{"id":"u21-t03","pl":"Zastanawiałem się, czy mógłbyś pożyczyć mi notatki z wykładu.","answers":["I was wondering if you could lend me your lecture notes.","I was wondering whether you could lend me your notes from the lecture."],"keys":["was wondering","could"],"explain":"Uprzejma, ostrożna prośba → I was wondering if/whether you could…; forma przeszła tylko zmiękcza ton.","ref":"21.4"},{"id":"u21-t04","pl":"Mieszkałem w Gdańsku przez pięć lat, a potem przeprowadziłem się do Koszalina.","answers":["I lived in Gdańsk for five years and then moved to Koszalin.","I lived in Gdańsk for five years, and then I moved to Koszalin."],"keys":["lived","for five years","moved"],"explain":"Stan w przeszłości z podaną długością → Past Simple; used to ani Past Continuous nie łączą się z for five years.","ref":"21.5"},{"id":"u21-t05","pl":"Kiedyś grałem w zespole, ale rzuciłem to na studiach.","answers":["I used to play in a band, but I gave it up at university.","I used to play in a band, but I gave it up when I was at university."],"keys":["used to play","gave"],"explain":"„Kiedyś” + czynność, której już nie ma → used to; jednorazowe zdarzenie (rzuciłem) w Past Simple.","ref":"21.5"},{"id":"u21-t06","pl":"Nie mogłam zostać dłużej, bo następnego dnia rano leciałam do Londynu.","answers":["I couldn't stay longer because I was flying to London the next morning.","I couldn't stay any longer because I was flying to London the following morning."],"keys":["was flying"],"explain":"Ustalenie na przyszłość z perspektywy przeszłości → Past Continuous (future arrangement in the past), mimo że znaczenie jest przyszłe.","ref":"21.4"},{"id":"u21-t07","pl":"Przyzwyczaiłem się już do wstawania o szóstej.","answers":["I've already got used to getting up at six.","I've got used to getting up at six.","I'm used to getting up at six now."],"keys":["used to getting up"],"explain":"be/get used to + -ing = być/przyzwyczaić się; „przyzwyczaiłem się” → I've got used to albo I'm used to (stan teraz).","ref":"21.5"}],"pairs":[{"id":"past-simple-vs-past-continuous","title":"Past Simple czy Past Continuous?","a":{"name":"Past Simple","when":"zakończone zdarzenie, sekwencja czynności, liczba razy lub długość okresu (three times, for two years), stan w przeszłości, krótkie zdarzenie przerywające (when)","example":"The fire alarm went off, so we all left the building."},"b":{"name":"Past Continuous","when":"czynność w toku w danym momencie lub w chwili innego zdarzenia (while/when/as), tło opowiadania, sytuacja tymczasowa, stopniowa zmiana, plan z perspektywy przeszłości, uprzejma prośba, always + irytacja","example":"We were having a seminar when the fire alarm went off."},"tip":"Zapytaj: czy czynność trwała wokół innego momentu lub zdarzenia (Past Continuous), czy była zamkniętym zdarzeniem w opowieści (Past Simple)?","refs":["21.1","21.2","21.3"],"quiz":["u21-02","u21-05","u21-06","u21-08","u21-09","u21-10"]},{"id":"used-to-vs-would","title":"used to czy would (i be/get used to)?","a":{"name":"used to + bezokolicznik","when":"powtarzane czynności i stany z przeszłości, których już nie ma (be, have, live, like, know); przeczenie didn't use to","example":"Ewa used to have long hair, and she used to dye it pink."},"b":{"name":"would + bezokolicznik","when":"tylko powtarzane czynności w przeszłości (nie stany), zwykle po podaniu kontekstu (when we were kids, on Sundays) lub w opowieści zaczętej od used to","example":"When we were kids, Dad would take us sledging every Sunday."},"tip":"Stan → tylko used to; liczba razy lub długość okresu → Past Simple; be/get used to + -ing (I'm used to working nights) to inna struktura: „być/przyzwyczajać się”, może stać w każdym czasie.","refs":["21.5"],"quiz":["u21-15","u21-16","u21-17","u21-18"]}],"signals":[{"word":"while","tenses":["Past Continuous"],"example":"While I was making coffee, the power went off.","note":"while + dłuższa czynność w toku; zdarzenia przerywającego nie wprowadzamy przez while, tylko when. Nie mylić z during + rzeczownik.","ref":"21.3"},{"word":"when","tenses":["Past Simple","Past Continuous","Past Perfect"],"example":"When the lecture ended, we went for pizza.","note":"when + Past Simple to zwykle krótkie zdarzenie (przerywające albo wywołujące następne). Kolejność zależy od czasu w drugiej części: When I arrived, they left / had left (22.4).","ref":"21.3"},{"word":"as","tenses":["Past Continuous","Past Simple"],"example":"As I was leaving the library, it started to rain.","note":"as = w trakcie (jak while) z Past Continuous; (just) as = dokładnie w chwili, gdy – wtedy zwykle Past Simple: just as the bus pulled away.","ref":"21.3"},{"word":"ago","tenses":["Past Simple"],"example":"Wiktoria graduated two years ago.","note":"ago → Past Simple, nie Present Perfect. W mowie zależnej ago zmienia się na before (51.4).","ref":"21.1"},{"word":"at that time","tenses":["Past Continuous","Past Simple"],"example":"At that time I was working nights at a petrol station.","note":"Tymczasowa sytuacja w przeszłości → często Past Continuous; z czasownikami stanu Past Simple: At that time I didn't know anyone in Koszalin.","ref":"21.2"},{"word":"used to","tenses":["used to"],"example":"We used to go camping in Masuria every August.","note":"Powtarzane czynności i stany, których już nie ma. Nie z liczbą razy ani długością okresu (for five years → Past Simple); nie mylić z be/get used to + -ing.","ref":"21.5"},{"word":"would","tenses":["would"],"example":"On Sundays Dad would make pancakes for everyone.","note":"Tylko powtarzane czynności w przeszłości, nie stany; zwykle po podaniu kontekstu czasu (on Sundays, when we were kids).","ref":"21.5"},{"word":"always (+ Past Continuous)","tenses":["Past Continuous"],"example":"He was always turning up late to rehearsals.","note":"always/constantly/forever + Past Continuous = bardzo częsta, zwykle irytująca czynność; z Past Simple always to neutralny nawyk.","ref":"21.2"}]},"23":{"unit":"23","title":"Present perfect simple","titlePl":"Present Perfect Simple (i porównanie z Past Simple)","module":5,"presentations":[{"id":"II-2","slides":[2,14]}],"summary":["Present Perfect łączy przeszłość z teraźniejszością: sytuacja trwa do teraz (for, since), okres się nie skończył (today, this week, życie osoby, która żyje) albo skutek widać teraz.","Past Simple, gdy czas jest podany lub zamknięty (yesterday, ago, last…, in 2019), w pytaniach When…? i gdy sytuacja się skończyła (stan minął, osoba nie żyje).","Po since w zdaniu podrzędnym zwykle Past Simple (since I moved, since I met you), ale gdy stan trwa – Present Perfect (since I've known you, since I've been a teacher).","Po stopniu najwyższym, the first/second time i the only → Present Perfect, często z ever; po than I thought/expected → Past Simple.","already w zdaniach twierdzących, yet w pytaniach i przeczeniach, still przed haven't; „Znam ją od lat” = I've known her for years."],"sections":[{"ref":"23.1","page":106,"title":"Sytuacje i czynności trwające do teraz","rule":"Present Perfect Simple opisuje sytuację, która zaczęła się w przeszłości i **trwa do teraz** (często czasowniki stanu: be, have, know). Okres podajemy przez **for** + okres albo **since** + punkt w czasie. Gdy **since** wprowadza zdanie, zwykle stoi w nim Past Simple (since I moved), ale jeśli stan wciąż trwa – Present Perfect (since I've known you, since I've been a teacher; slajdy II/2 7–13). Po **It's ages/weeks since…** możliwy jest i Present Perfect, i Past Simple.","examples":[{"en":"Ola has had the same laptop for six years.","pl":"Ola ma ten sam laptop od sześciu lat.","note":"stan trwa do teraz; for + okres, po polsku czas teraźniejszy"},{"en":"Since Iza moved to Szczecin, we've only met twice.","pl":"Odkąd Iza przeprowadziła się do Szczecina, spotkałyśmy się tylko dwa razy.","note":"since + Past Simple (jednorazowe zdarzenie); zdanie z since może stać na początku albo na końcu (slajd II/2 6)"},{"en":"Since I've known Wiktor, he's never once been on time.","pl":"Odkąd znam Wiktora, ani razu nie przyszedł na czas.","note":"since + Present Perfect: stan (znajomość) trwa do teraz"},{"en":"It's months since I spoke to my cousin in Dublin. / It's months since I've spoken to my cousin in Dublin.","pl":"Od miesięcy nie rozmawiałem z kuzynem, który mieszka w Dublinie.","note":"It's months/ages since… – oba czasy poprawne"}],"pitfalls":[{"wrong":"I know Kasia since primary school.","right":"I've known Kasia since primary school.","why":"„znam od…” – stan trwa do teraz → Present Perfect, nie Present Simple"},{"wrong":"Since I have started university, I've made lots of new friends.","right":"Since I started university, I've made lots of new friends.","why":"rozpoczęcie studiów to jednorazowe zdarzenie – po since → Past Simple"},{"wrong":"I'm living in Koszalin for three years.","right":"I've lived in Koszalin for three years.","why":"okres od przeszłości do teraz → Present Perfect (Simple lub Continuous); Present Continuous + for mówi o teraźniejszości i przyszłości (I'm working in Kołobrzeg for the summer)"}],"slides":[{"pres":"II-2","slide":4},{"pres":"II-2","slide":6},{"pres":"II-2","slide":8},{"pres":"II-2","slide":10},{"pres":"II-2","slide":13}]},{"ref":"23.2","page":106,"title":"Niezakończony okres czasu","rule":"Present Perfect stosujemy też do czynności zakończonych, jeśli **okres**, w którym się wydarzyły, **jeszcze trwa** (today, this week, życie osoby, która żyje), więc mogą się powtórzyć. Stąd o żyjącej osobie **has won**, o zmarłej **won** (slajd II/2 4: Tokarczuk i Miłosz). W brytyjskim angielskim Present Perfect stoi też po **stopniu najwyższym**, **liczebnikach porządkowych** (the first, the second) i **the only**, często z **ever**.","examples":[{"en":"My cousin has run the Poznań Marathon three times.","pl":"Mój kuzyn trzy razy przebiegł maraton poznański.","note":"żyje i biega – może to powtórzyć"},{"en":"Chopin wrote over fifty mazurkas.","pl":"Chopin napisał ponad pięćdziesiąt mazurków.","note":"nie żyje – nic więcej nie napisze → Past Simple"},{"en":"I've had four cups of coffee this morning, and it isn't even eleven yet.","pl":"Wypiłem dziś rano cztery kawy, a nie ma jeszcze nawet jedenastej.","note":"this morning – poranek jeszcze trwa"},{"en":"This is the first time I've seen snow in October.","pl":"Pierwszy raz widzę śnieg w październiku.","note":"the first time + Present Perfect, choć po polsku czas teraźniejszy"}],"pitfalls":[{"wrong":"This is the first time I see the sea.","right":"This is the first time I've seen the sea.","why":"po This is the first/second time → Present Perfect, mimo polskiego „pierwszy raz widzę”"},{"wrong":"It's the best pizza I ate in my life.","right":"It's the best pizza I've ever eaten.","why":"po stopniu najwyższym w brytyjskim angielskim → Present Perfect (często + ever)"},{"wrong":"The Romans have built many roads in Britain.","right":"The Romans built many roads in Britain.","why":"starożytni Rzymianie już nic nie zbudują – okres zamknięty → Past Simple"}],"slides":[{"pres":"II-2","slide":4},{"pres":"II-2","slide":6}]},{"ref":"23.3","page":107,"title":"Przysłówki typowe dla Present Perfect","rule":"Z Present Perfect (zwłaszcza w znaczeniu z 23.2) często występują: **already, always, ever, never, often, recently, seldom, so far, still, up to now, yet**. **Already** stoi w zdaniach twierdzących, **yet** w przeczeniach i pytaniach (zwykle na końcu zdania), a **still** w przeczeniu przed haven't/hasn't. W amerykańskim angielskim z tymi przysłówkami często używa się Past Simple, ale podręcznik i slajdy trzymają się normy brytyjskiej.","examples":[{"en":"I've already sent the presentation to the whole group.","pl":"Już wysłałem prezentację całej grupie.","note":"already – zdanie twierdzące"},{"en":"Has Igor replied to your email yet?","pl":"Czy Igor już odpisał na twojego maila?","note":"yet w pytaniu = już"},{"en":"We still haven't got our results from the phonetics test.","pl":"Wciąż nie dostaliśmy wyników z testu z fonetyki.","note":"still przed haven't"},{"en":"So far we've done four units of the grammar book.","pl":"Na razie przerobiliśmy cztery unity z podręcznika do gramatyki.","note":"so far = do tej pory"}],"pitfalls":[{"wrong":"I've finished my essay yet.","right":"I've already finished my essay.","why":"yet tylko w pytaniach i przeczeniach; w zdaniu twierdzącym → already"},{"wrong":"I haven't still found a room for next year.","right":"I still haven't found a room for next year.","why":"w przeczeniu still stoi przed haven't/hasn't"}],"slides":[{"pres":"II-2","slide":6}]},{"ref":"23.4","page":107,"title":"Skutek w teraźniejszości","rule":"Present Perfect Simple opisuje zakończoną czynność, której **skutek** widać lub czuć teraz albo która jest teraz ważna. Często towarzyszą mu **just, recently, lately**. Gdy skutku już nie ma, a czynność jest po prostu faktem z przeszłości, używamy Past Simple (slajd II/2 4: He has had an accident / He had an accident).","examples":[{"en":"Oh no, I've left my student ID at home – I can't get into the library.","pl":"O nie, zostawiłem legitymację w domu – nie wejdę do biblioteki.","note":"skutek teraz: nie mam legitymacji"},{"en":"The lift has broken down again, so we'll have to take the stairs.","pl":"Winda znowu się zepsuła, więc musimy iść schodami.","note":"skutek teraz: winda nie działa"},{"en":"Ania has just got back from her Erasmus exchange in Valencia.","pl":"Ania właśnie wróciła z Erasmusa w Walencji.","note":"just = przed chwilą, bardzo niedawno"},{"en":"I lost my wallet once at a festival, but someone handed it in.","pl":"Raz zgubiłem portfel na festiwalu, ale ktoś go oddał.","note":"brak skutku teraz → Past Simple"}],"pitfalls":[{"wrong":"He has just left five minutes ago.","right":"He left five minutes ago.","why":"just (Present Perfect) i ago (Past Simple) się wykluczają: He has just left albo He left five minutes ago"}],"slides":[{"pres":"II-2","slide":4}]},{"ref":"23.5","page":107,"title":"Inne użycia: wiadomości, nowy temat, zdania czasowe","rule":"Present Perfect często **otwiera wiadomość** (w mediach) lub **nowy temat** rozmowy, a szczegóły – kiedy, gdzie, jak – podajemy potem w Past Simple. W zdaniach czasowych o przyszłości (po **when, after, as soon as, until**) możemy użyć Present Perfect zamiast will, żeby podkreślić zakończenie czynności (zob. 28.1).","examples":[{"en":"Heavy snow has closed the road between Koszalin and Słupsk. Several lorries got stuck there early this morning.","pl":"Intensywne opady śniegu zablokowały drogę Koszalin–Słupsk. Kilka ciężarówek utknęło tam wcześnie rano.","note":"wiadomość: Present Perfect, szczegóły: Past Simple"},{"en":"Have you heard? Bartek has got engaged! He proposed to Zuzia in Paris last weekend.","pl":"Słyszałeś? Bartek się zaręczył. Oświadczył się Zuzi w Paryżu w zeszły weekend.","note":"nowy temat: Present Perfect, potem Past Simple"},{"en":"I'll send you the notes as soon as I've typed them up.","pl":"Wyślę ci notatki, jak tylko przepiszę je na komputerze.","note":"zdanie czasowe o przyszłości: as soon as + Present Perfect"}],"pitfalls":[{"wrong":"I'll call you when I'll have finished.","right":"I'll call you when I've finished.","why":"w zdaniu czasowym o przyszłości nie ma will – Present Perfect (lub Present Simple)"}],"slides":[{"pres":"II-1","slide":18}]},{"ref":"23.6","page":107,"title":"Present Perfect a Past Simple – różnice","rule":"Present Perfect: sytuacja lub okres **niezakończone**, **skutek** teraz, czas **nieokreślony**. Past Simple: sytuacja lub okres **zakończone**, brak związku z teraźniejszością, **podany konkretny czas** (yesterday, ago, in 2019, last…) i pytania **When…?** (tabele na slajdach II/2 4 i 6). Gdy porównujemy z wcześniejszym przekonaniem lub oczekiwaniem (**than I thought/expected**, as I imagined), używamy Past Simple (albo Past Perfect), nie Present Perfect.","examples":[{"en":"Kuba has visited Prague several times. He first went there on a school trip in 2018.","pl":"Kuba był w Pradze kilka razy. Pierwszy raz pojechał tam na wycieczkę szkolną w 2018 roku.","note":"czas nieokreślony → Present Perfect; podany czas → Past Simple"},{"en":"When did you start learning English?","pl":"Kiedy zacząłeś uczyć się angielskiego?","note":"pytanie When…? → Past Simple"},{"en":"The flat turned out to be much smaller than I expected.","pl":"Mieszkanie okazało się dużo mniejsze, niż się spodziewałem.","note":"than I expected → Past Simple"}],"pitfalls":[{"wrong":"I've visited Kraków last summer.","right":"I visited Kraków last summer.","why":"podany zakończony czas (last summer) → Past Simple"},{"wrong":"The test was harder than I've expected.","right":"The test was harder than I expected.","why":"than I thought/expected → Past Simple (ewentualnie than I had expected)"},{"wrong":"When have you got back from Spain?","right":"When did you get back from Spain?","why":"pytanie o moment w przeszłości (When…?) → Past Simple"}],"slides":[{"pres":"II-2","slide":4},{"pres":"II-2","slide":6}]}],"uses":[{"tense":"Present Perfect","no":null,"use":"no time of the action given","usePl":"czas czynności nie jest podany (doświadczenie)","example":"I've been to Lisbon, so I can recommend a few places.","ref":"23.6","slide":{"pres":"II-2","slide":4}},{"tense":"Past Simple","no":null,"use":"the time of the action given","usePl":"czas czynności jest podany","example":"We went to Lisbon in the summer of 2023.","ref":"23.6","slide":{"pres":"II-2","slide":4}},{"tense":"Present Perfect","no":null,"use":"ongoing actions and situations that started in the past and continue up till now","usePl":"sytuacja trwa od przeszłości do teraz","example":"My parents have run a small shop in Sianów for twenty years.","ref":"23.1","slide":{"pres":"II-2","slide":4}},{"tense":"Past Simple","no":null,"use":"finished actions/states","usePl":"czynność lub stan zakończone (także z for)","example":"My grandad worked in the shipyard in Gdańsk for thirty years and then retired.","ref":"23.6","slide":{"pres":"II-2","slide":4}},{"tense":"Present Perfect","no":null,"use":"present result/relevance","usePl":"skutek lub znaczenie dla teraźniejszości","example":"Someone has eaten my yoghurt, so I've got nothing for breakfast.","ref":"23.4","slide":{"pres":"II-2","slide":4}},{"tense":"Past Simple","no":null,"use":"no present result","usePl":"brak skutku w teraźniejszości","example":"Kacper broke his arm skiing, but it healed quickly.","ref":"23.6","slide":{"pres":"II-2","slide":4}},{"tense":"Present Perfect","no":null,"use":"actions which can be repeated","usePl":"czynność może się powtórzyć (osoba żyje, okres trwa)","example":"Our university choir has won the national competition three times.","ref":"23.2","slide":{"pres":"II-2","slide":4}},{"tense":"Past Simple","no":null,"use":"actions which can't be repeated","usePl":"czynności nie da się powtórzyć (osoba nie żyje, okres się skończył)","example":"Maria Skłodowska-Curie won two Nobel Prizes.","ref":"23.2","slide":{"pres":"II-2","slide":4}},{"tense":"Present Perfect","no":null,"use":"this week/month/year/today","usePl":"today / this week itp., gdy okres jeszcze trwa","example":"I've had three lectures today, and there's one more at six.","ref":"23.2","slide":{"pres":"II-2","slide":4}},{"tense":"Past Simple","no":null,"use":"this week/month/year/today","usePl":"today / this week itp., gdy okres się skończył (albo zakończona część dnia, np. this morning po południu)","example":"(At 11 p.m.) I didn't get much done today – I'll start earlier tomorrow.","ref":"23.6","slide":{"pres":"II-2","slide":4}},{"tense":"Present Perfect","no":null,"use":"since / for / just / already / yet / still / recently / lately / ever","usePl":"okoliczniki typowe dla Present Perfect","example":"Have you finished your presentation yet? – No, I've only just started.","ref":"23.3","slide":{"pres":"II-2","slide":6}},{"tense":"Past Simple","no":null,"use":"ago / last week, etc.","usePl":"okoliczniki zakończonego czasu","example":"I handed in my essay two days ago.","ref":"23.6","slide":{"pres":"II-2","slide":6}},{"tense":"Present Perfect","no":null,"use":"superlatives/ordinal numbers","usePl":"po stopniu najwyższym i liczebnikach porządkowych (często + ever)","example":"This is the third time I've lost my umbrella this month.","ref":"23.2","slide":{"pres":"II-2","slide":6}},{"tense":"Past Simple","no":null,"use":"than I thought/expected","usePl":"porównanie z wcześniejszym przekonaniem lub oczekiwaniem","example":"The train journey to Kraków took longer than I thought.","ref":"23.6","slide":{"pres":"II-2","slide":6}},{"tense":"Present Perfect","no":null,"use":"news reports and introducing a new topic","usePl":"otwarcie wiadomości lub nowego tematu (szczegóły potem w Past Simple)","example":"Guess what? Zosia has got an internship in Dublin! She found out on Monday.","ref":"23.5","slide":null},{"tense":"Present Perfect","no":null,"use":"time clauses with future reference (when, after, as soon as)","usePl":"zdania czasowe o przyszłości – zamiast will, gdy liczy się zakończenie","example":"I'll text you when I've landed in Dublin.","ref":"23.5","slide":null}],"quiz":[{"id":"u23-01","type":"choice","prompt":"Have you ever been to Gdańsk? – Yes, I ___ there on a school trip in 2019.","options":["have been","went","have gone"],"answer":1,"explain":"Odpowiedź podaje konkretny czas (in 2019) → Past Simple. Pytanie z ever jest w Present Perfect, bo nie dotyczy konkretnego momentu.","ref":"23.6"},{"id":"u23-02","type":"gap","prompt":"The bakery on our street ___ (be) in the same building for over fifty years, and it's still the best place in town for doughnuts.","answers":["has been","'s been"],"explain":"Stan zaczął się w przeszłości i trwa do teraz (for + okres) → Present Perfect; po polsku czas teraźniejszy („jest od pięćdziesięciu lat”).","ref":"23.1"},{"id":"u23-03","type":"choice","prompt":"My grandparents ___ in Słupsk for forty years, but in 2015 they moved to Koszalin.","options":["have lived","lived","have been living"],"answer":1,"explain":"Mimo for + okres stan jest zakończony (już tam nie mieszkają) → Past Simple. Present Perfect znaczyłby, że wciąż tam mieszkają.","ref":"23.6"},{"id":"u23-04","type":"use","prompt":"Tomek had a bike accident, but he's completely fine now.","options":["skutek lub znaczenie dla teraźniejszości (present result/relevance) – Present Perfect","brak skutku w teraźniejszości (no present result) – Past Simple","podany czas czynności (the time of the action given) – Past Simple","czynność, której nie da się powtórzyć (actions which can't be repeated) – Past Simple"],"answer":1,"explain":"Wypadek był, ale nie ma skutku teraz (Tomek jest zdrowy) → Past Simple. Tomek has had an accident sugerowałoby, że skutki są ważne teraz.","ref":"23.6"},{"id":"u23-05","type":"gap","prompt":"Come and sit down – the match ___ (just / start), so you've only missed the first two minutes.","answers":["has just started","'s just started"],"explain":"Czynność sprzed chwili, ważna teraz (just; mecz trwa już dwie minuty) → Present Perfect; w brytyjskim angielskim just łączy się z Present Perfect. Is just starting znaczyłoby, że mecz dopiero się zaczyna i nic nie przegapiliśmy.","ref":"23.4"},{"id":"u23-06","type":"choice","prompt":"Wisława Szymborska ___ the Nobel Prize in Literature.","options":["has won","won"],"answer":1,"explain":"Szymborska nie żyje (zm. 2012), więc tej czynności nie da się powtórzyć → Past Simple, jak Miłosz na slajdzie II/2 4.","ref":"23.2"},{"id":"u23-07","type":"use","prompt":"Kamila has won the university chess tournament twice and hopes to win it again next year.","options":["sytuacja trwająca do teraz (ongoing actions and situations…) – Present Perfect","czynność, którą można powtórzyć (actions which can be repeated) – Present Perfect","stopień najwyższy lub liczebnik porządkowy (superlatives/ordinal numbers) – Present Perfect","okres jeszcze trwa (this week/month/year/today) – Present Perfect"],"answer":1,"explain":"Kamila wciąż gra i może wygrać znowu → czynność, którą można powtórzyć (Present Perfect). Gdyby skończyła karierę: Kamila won the tournament twice.","ref":"23.2"},{"id":"u23-08","type":"choice","prompt":"(At 3 p.m.) Sorry, I ___ your message this morning – my phone was off during the exam.","options":["haven't seen","didn't see","hadn't seen"],"answer":1,"explain":"Ranek już się skończył (jest 15:00), więc okres jest zamknięty → Past Simple. Gdyby wciąż był ranek, użylibyśmy Present Perfect.","ref":"23.6"},{"id":"u23-09","type":"gap","prompt":"Is Wojtek ill? I ___ (not see) him at uni this week, and it's already Thursday.","answers":["haven't seen","have not seen"],"explain":"Tydzień jeszcze trwa (jest czwartek), więc okres jest niezakończony → Present Perfect.","ref":"23.2"},{"id":"u23-10","type":"choice","prompt":"I took my driving test two weeks ago, but I ___ the results yet.","options":["didn't receive","haven't received","don't receive","hadn't received"],"answer":1,"explain":"ago → Past Simple (took), ale yet i czekanie trwające do teraz → Present Perfect (norma brytyjska).","ref":"23.3"},{"id":"u23-11","type":"choice","prompt":"This is the most stressful week I ___ – three exams and a presentation!","options":["ever had","have ever had","had ever","ever have"],"answer":1,"explain":"Po stopniu najwyższym (the most stressful…) w brytyjskim angielskim → Present Perfect, często z ever.","ref":"23.2"},{"id":"u23-12","type":"choice","prompt":"The grammar test was much easier than I ___.","options":["have expected","expected","have been expecting"],"answer":1,"explain":"Porównanie z wcześniejszym oczekiwaniem (than I expected/thought) → Past Simple (ewentualnie Past Perfect), nie Present Perfect.","ref":"23.6"},{"id":"u23-13","type":"gap","prompt":"This is the first time I ___ (eat) sushi – it's better than I thought!","answers":["have eaten","'ve eaten"],"explain":"Po This is the first time → Present Perfect, choć po polsku mówimy w czasie teraźniejszym („pierwszy raz jem”). Za to than I thought – Past Simple.","ref":"23.2"},{"id":"u23-14","type":"gap","prompt":"Since Natalia ___ (become) a paramedic, she has saved dozens of lives.","answers":["became"],"explain":"Zostanie ratowniczką to jednorazowe zdarzenie, więc w zdaniu z since → Past Simple (jak since I became a teacher, slajd II/2 13).","ref":"23.1"},{"id":"u23-15","type":"gap","prompt":"Since I ___ (know) Marcel, he has always been there for me.","answers":["have known","'ve known"],"explain":"Znajomość to stan, który trwa do teraz → since + Present Perfect (since I've known you, slajd II/2 10). O zdarzeniu powiedzielibyśmy: since I met him.","ref":"23.1"},{"id":"u23-16","type":"choice","prompt":"I'm in my second year now. Since I ___ a student, I've read more books than ever before.","options":["am","have been","had been"],"answer":1,"explain":"Bycie studentem to stan, który trwa → since + Present Perfect (since I've been a teacher, slajd II/2 13); o samym początku: since I became a student.","ref":"23.1"},{"id":"u23-17","type":"fix","prompt":"When have you started working at the café?","wrong":"have you started","fixes":["did you start"],"answers":["When did you start working at the café?"],"explain":"Pytanie When…? dotyczy konkretnego momentu w przeszłości → zawsze Past Simple.","ref":"23.6"},{"id":"u23-18","type":"fix","prompt":"I know Bartek since we were at secondary school.","wrong":"I know","fixes":["I have known","I've known"],"answers":["I have known Bartek since we were at secondary school.","I've known Bartek since we were at secondary school."],"explain":"„Znam od…” – stan trwa od przeszłości do teraz → Present Perfect (know to czasownik stanu, więc Simple, nie Continuous).","ref":"23.1"}],"translations":[{"id":"u23-t01","pl":"Znam ją od dzieciństwa.","answers":["I've known her since childhood.","I've known her since we were children.","I've known her since I was a child."],"keys":["have known","since"],"explain":"„Znam od…” – stan trwa do teraz → Present Perfect; know to czasownik stanu, więc nie Continuous.","ref":"23.1"},{"id":"u23-t02","pl":"Od kiedy się przeprowadziłem, nie widziałem go.","answers":["I haven't seen him since I moved.","Since I moved, I haven't seen him.","I haven't seen him since I moved house."],"keys":["since","moved","have not seen"],"explain":"Przeprowadzka to jednorazowe zdarzenie → since + Past Simple; w zdaniu głównym okres do teraz → Present Perfect (kolejność zdań dowolna, slajd II/2 6).","ref":"23.1"},{"id":"u23-t03","pl":"To pierwszy raz, kiedy jem pierogi z jagodami.","answers":["This is the first time I've eaten blueberry pierogi.","It's the first time I've eaten pierogi with blueberries.","This is the first time I've eaten pierogi with bilberries."],"keys":["first time","have eaten"],"explain":"Po This is the first time → Present Perfect, mimo polskiego czasu teraźniejszego („jem”).","ref":"23.2"},{"id":"u23-t04","pl":"To najlepszy wykład, na jakim kiedykolwiek byłem.","answers":["It's the best lecture I've ever been to.","That was the best lecture I've ever been to.","It's the best lecture I have ever attended."],"keys":["best","have ever"],"explain":"Po stopniu najwyższym + ever → Present Perfect; polski czas przeszły („byłem”) nie decyduje.","ref":"23.2"},{"id":"u23-t05","pl":"Od kiedy poznałam twoich rodziców, zawsze mi pomagają.","answers":["Since I met your parents, they've always helped me.","Your parents have always helped me since I met them."],"keys":["since i met","have always helped"],"explain":"Poznanie to zdarzenie → since + Past Simple (since I met, slajd II/2 8); pomaganie trwa do teraz → Present Perfect, choć po polsku jest czas teraźniejszy.","ref":"23.1"},{"id":"u23-t06","pl":"Odkąd znam Julię i Adama, zawsze byli punktualni.","answers":["Since I've known Julia and Adam, they've always been punctual.","Julia and Adam have always been punctual since I've known them."],"keys":["since i have known","have always been"],"explain":"Znajomość to stan, który trwa → since + Present Perfect (since I've known you, slajd II/2 10); w zdaniu głównym też Present Perfect, mimo polskiego „byli”.","ref":"23.1"},{"id":"u23-t07","pl":"Odkąd jestem na studiach, przeczytałem ponad sto książek.","answers":["Since I've been at university, I've read over a hundred books.","I've read more than a hundred books since I've been a student.","Since I started university, I've read over a hundred books."],"keys":["since","have read"],"explain":"Bycie studentem trwa → since I've been (jak since I've been a teacher, slajd II/2 13) albo zdarzenie: since I started/became. W zdaniu głównym Present Perfect.","ref":"23.1"},{"id":"u23-t08","pl":"Byłeś kiedyś w Gdańsku?","answers":["Have you ever been to Gdańsk?"],"keys":["have you ever been to"],"explain":"Pytanie o doświadczenie bez podanego czasu → Present Perfect + ever (been to = być gdzieś i wrócić). Polski czas przeszły („byłeś”) myli.","ref":"23.2"}],"pairs":[{"id":"pp-vs-ps","title":"Present Perfect czy Past Simple?","a":{"name":"Present Perfect","when":"okres trwa do teraz (for/since, today, this week, życie osoby, która żyje), skutek widać teraz, czas nie jest podany, po stopniu najwyższym i the first time; sygnały: just, already, yet, ever, never, so far","example":"I've lost my keys, so I can't get in."},"b":{"name":"Past Simple","when":"czas jest podany lub okres zamknięty (yesterday, ago, in 2019, last week), sytuacja się skończyła, brak skutku teraz, osoba nie żyje; pytania When…?; than I thought/expected","example":"I lost my keys at a festival in 2022, but I got them back."},"tip":"Zapytaj: czy okres, w którym to się stało, jeszcze trwa albo czy jest skutek teraz? Tak → Present Perfect; nie albo pada konkretny czas → Past Simple.","refs":["23.1","23.2","23.4","23.6"],"quiz":["u23-01","u23-03","u23-04","u23-05","u23-06","u23-07","u23-08","u23-09","u23-10","u23-11","u23-12","u23-17"]},{"id":"since-for-ago","title":"since, for czy ago?","a":{"name":"since / for (Present Perfect)","when":"jak długo coś trwa do teraz: since + punkt w czasie (since Monday, since 2023, since I moved), for + okres (for two weeks)","example":"I've known Igor since our first week at uni. / I've known Igor for two years."},"b":{"name":"ago (Past Simple)","when":"kiedy coś się stało: odliczamy wstecz od teraz, czynność jest zakończona","example":"I met Igor two years ago."},"tip":"since i for odpowiadają na pytanie „jak długo?”, ago na „kiedy?”. For z Past Simple tylko o zamkniętym okresie (I lived there for two years).","refs":["23.1","23.6"],"quiz":["u23-02","u23-03","u23-10","u23-14","u23-15","u23-16","u23-18"]}],"signals":[{"word":"since","tenses":["Present Perfect","Present Perfect Continuous"],"example":"I've lived in Koszalin since 2023.","note":"since + punkt w czasie. W zdaniu wprowadzonym przez since zwykle Past Simple (since I moved), ale gdy stan trwa – Present Perfect (since I've known you, since I've been a student).","ref":"23.1"},{"word":"for","tenses":["Present Perfect","Present Perfect Continuous"],"example":"We've been flatmates for two years.","note":"for + okres. Gdy okres się skończył – Past Simple (I lived in Gdynia for two years, then I moved). Present Continuous + for mówi o teraźniejszości i przyszłości (I'm working in Kołobrzeg for the summer).","ref":"23.1"},{"word":"just","tenses":["Present Perfect"],"example":"Sorry, Marta has just left.","note":"just = przed chwilą. Ale just now (= przed momentem) łączy się z Past Simple: I saw her just now. W amerykańskim angielskim just także z Past Simple.","ref":"23.4"},{"word":"already","tenses":["Present Perfect"],"example":"I've already paid for the tickets.","note":"Zwykle w zdaniach twierdzących, przed czasownikiem głównym (have already paid). W pytaniu wyraża zdziwienie: Have you finished already?","ref":"23.3"},{"word":"yet","tenses":["Present Perfect"],"example":"Has the lecturer published our grades yet?","note":"Tylko w pytaniach i przeczeniach, zwykle na końcu zdania. W zdaniu twierdzącym – already (nie: I've finished yet).","ref":"23.3"},{"word":"still","tenses":["Present Perfect"],"example":"I still haven't heard from the dean's office.","note":"Z Present Perfect w przeczeniu, przed haven't/hasn't (nie: I haven't still…). W twierdzeniach still zwykle z Present Simple/Continuous: I'm still waiting.","ref":"23.3"},{"word":"recently","tenses":["Present Perfect","Present Perfect Continuous"],"example":"Have you read any good books recently?","note":"Może też iść z Past Simple, gdy chodzi o jedno konkretne zdarzenie (= niedawno): I recently moved to Koszalin.","ref":"23.4"},{"word":"lately","tenses":["Present Perfect","Present Perfect Continuous"],"example":"I've been feeling really tired lately.","note":"Prawie zawsze z Present Perfect (Continuous); z Past Simple go nie łączymy.","ref":"23.4"},{"word":"ever","tenses":["Present Perfect"],"example":"Have you ever eaten żurek?","note":"Także po stopniu najwyższym i the first/the only: the best… I've ever… Gdy okres się skończył (osoba nie żyje) – Past Simple: Did your great-grandma ever travel abroad?","ref":"23.2"},{"word":"never","tenses":["Present Perfect"],"example":"I've never been to Scotland.","note":"Gdy okres życia lub sytuacji się skończył – Past Simple: My grandad never learnt to drive.","ref":"23.3"},{"word":"so far","tenses":["Present Perfect"],"example":"So far this semester I've only missed one class.","note":"Zawsze okres do teraz – nie łączymy z Past Simple.","ref":"23.3"},{"word":"how long","tenses":["Present Perfect","Present Perfect Continuous"],"example":"How long have you known Szymon?","note":"„Jak długo / od kiedy?” o czymś, co trwa – nie Present Simple (nie: How long do you know…?). O zamkniętym okresie – Past Simple: How long did you live in Gdynia?","ref":"23.1"},{"word":"ago","tenses":["Past Simple"],"example":"We moved into this flat three months ago.","note":"Nigdy z Present Perfect (nie: I've moved here three months ago). Ago liczymy wstecz od teraz.","ref":"23.6"},{"word":"last… (last week, last year, last Monday)","tenses":["Past Simple"],"example":"We had our first grammar test last Monday.","note":"Ale since last… i for the last… → Present Perfect: I haven't seen her since last week; I've lived here for the last two years.","ref":"23.6"},{"word":"yesterday","tenses":["Past Simple"],"example":"I bought a new phone yesterday.","note":"Nie łączymy z Present Perfect. Ale since yesterday → Present Perfect: I've had a headache since yesterday.","ref":"23.6"},{"word":"in 2019 (konkretna data)","tenses":["Past Simple"],"example":"Hanna started learning German in 2019.","note":"Podany moment w przeszłości → Past Simple; since 2019 → Present Perfect: She's lived in Berlin since 2019.","ref":"23.6"},{"word":"when (pytanie o czas)","tenses":["Past Simple"],"example":"When did you get back from Berlin?","note":"Pytanie When…? o moment w przeszłości – zawsze Past Simple (nie: When have you got back?). W zdaniu czasowym o przyszłości when + Present Perfect jest możliwe: Call me when you've finished.","ref":"23.6"},{"word":"today / this week","tenses":["Present Perfect","Past Simple"],"example":"We've had two tests this week, and there's one more on Friday. / (On Friday evening) We had three tests this week.","note":"Present Perfect, gdy okres jeszcze trwa; Past Simple, gdy uważamy go za zakończony albo mówimy o zakończonej części (this morning powiedziane po południu).","ref":"23.2"}]},"24":{"unit":"24","title":"Present perfect continuous","titlePl":"Present Perfect Continuous (i porównanie z Present Perfect Simple)","module":5,"presentations":[{"id":"II-2","slides":[15,18]}],"summary":["Present Perfect Continuous (have/has been + -ing): czynność zaczęła się w przeszłości i trwa do teraz albo właśnie się skończyła; nacisk na czas trwania (for, since, how long, all day).","Powtarzana czynność bez liczby → Continuous (all morning); z liczbą razy → Simple (three times).","Continuous – sytuacja tymczasowa lub nowa (lately, recently); Simple – stała. Z live, work, study, teach możliwe są oba czasy.","Continuous – czynność niezakończona albo wyjaśnienie obecnego stanu (Why are your hands dirty? – I've been…); Simple – czynność zakończona, liczy się rezultat.","Czasowniki stanu (know, be, have = mieć) i strona bierna – zwykle tylko Simple. „Czekam od godziny” = I've been waiting for an hour (nie I'm waiting)."],"sections":[{"ref":"24.1","page":110,"title":"Czynności trwające do teraz lub dopiero zakończone","rule":"Present Perfect Continuous (**have/has been + -ing**), często z **for/since**, opisuje czynność, która zaczęła się w przeszłości i **trwa nadal** albo **właśnie się skończyła**. Akcent pada na **czas trwania**, więc nie podajemy liczby powtórzeń – z liczbą (three times) używamy Present Perfect Simple. Simple zwykle znaczy, że czynność jest zakończona, Continuous – że trwa. Continuous zwykle nie występuje w stronie biernej.","examples":[{"en":"Marek has been revising for his grammar test since eight o'clock.","pl":"Marek uczy się do kolokwium od ósmej.","note":"trwa do teraz; po polsku czas teraźniejszy"},{"en":"Bartek has been sending me memes all day.","pl":"Bartek cały dzień wysyła mi memy.","note":"powtarzane, bez liczby → Continuous"},{"en":"Bartek has sent me twelve memes today.","pl":"Bartek wysłał mi dziś dwanaście memów.","note":"podana liczba → Simple"},{"en":"I've been watching the series you recommended – I'm on episode five now.","pl":"Oglądam serial, który mi poleciłeś – jestem teraz na piątym odcinku.","note":"czynność niezakończona"}],"pitfalls":[{"wrong":"I've been drinking three coffees since breakfast.","right":"I've drunk three coffees since breakfast.","why":"podana liczba (three) → Present Perfect Simple, nie Continuous"},{"wrong":"I've been knowing Kuba for ten years.","right":"I've known Kuba for ten years.","why":"know to czasownik stanu – nie ma formy Continuous (zob. Unit 25)"},{"wrong":"The essays have been being marked all week.","right":"The lecturers have been marking the essays all week.","why":"Present Perfect Continuous zwykle nie występuje w stronie biernej – użyj strony czynnej"}],"slides":[{"pres":"II-2","slide":17}]},{"ref":"24.2","page":110,"title":"Sytuacje tymczasowe","rule":"Present Perfect Continuous sugeruje sytuację **tymczasową**, a z **lately/recently** – nową, która może się zmienić; Simple brzmi bardziej **trwale** (slajd II/2 17). Z czasownikami **live, work, study, teach** możliwe są oba czasy, prawie bez różnicy znaczenia (Simple – bardziej na stałe). Żeby powiedzieć, jak długo coś trwa od przeszłości, używamy Present Perfect (Continuous) + for, nie Present Continuous.","examples":[{"en":"I've been sleeping on my friend's sofa since I came back from Ireland.","pl":"Śpię na kanapie u kolegi, odkąd wróciłem z Irlandii.","note":"sytuacja tymczasowa"},{"en":"Lately Dominika has been taking the train to uni instead of driving.","pl":"Ostatnio Dominika jeździ na uczelnię pociągiem zamiast samochodem.","note":"lately – nowy, może tymczasowy zwyczaj"},{"en":"My parents have lived in the same block of flats in Koszalin for thirty years.","pl":"Moi rodzice od trzydziestu lat mieszkają w tym samym bloku w Koszalinie.","note":"sytuacja stała → Simple (przy live Continuous też jest możliwy)"}],"pitfalls":[{"wrong":"I'm going out with Kamil for two years.","right":"I've been going out with Kamil for two years.","why":"„chodzę z Kamilem od dwóch lat” – sytuacja trwa od przeszłości do teraz → Present Perfect Continuous, nie Present Continuous"},{"wrong":"Since when are you living in Koszalin?","right":"How long have you been living in Koszalin?","why":"pytanie „od kiedy / jak długo” o trwającą sytuację → How long + Present Perfect (Continuous)"}],"slides":[{"pres":"II-2","slide":17}]},{"ref":"24.3","page":110,"title":"Wyjaśnianie obecnego stanu (skutek)","rule":"Present Perfect Continuous **wyjaśnia obecny stan** (brudne ręce, zmęczenie, bałagan) czynnością, która trwała do niedawna. Liczy się sama czynność, nie jej rezultat, i zwykle nie dodajemy okolicznika czasu.","examples":[{"en":"Sorry I'm out of breath – I've been running to catch the bus.","pl":"Przepraszam, że tak dyszę – biegłem na autobus.","note":"wyjaśnienie obecnego stanu"},{"en":"You look exhausted. Have you been working night shifts again?","pl":"Wyglądasz na wykończonego. Znowu pracowałeś na nocne zmiany?","note":"pytanie o przyczynę tego, co widać"},{"en":"The kitchen smells of garlic – Paweł has been cooking.","pl":"W kuchni pachnie czosnkiem – Paweł gotował.","note":"po polsku czas przeszły, po angielsku Present Perfect Continuous"}],"pitfalls":[{"wrong":"Why are you all wet? – I'm walking in the rain.","right":"Why are you all wet? – I've been walking in the rain.","why":"skutek widać teraz, a czynność właśnie się skończyła → Present Perfect Continuous; Present Continuous znaczyłby, że idziesz w tej chwili"}],"slides":[]},{"ref":"24.4","page":110,"title":"Present Perfect Simple a Continuous – różnice","rule":"Simple: **rezultat**, czynność **zakończona**, **liczba** powtórzeń, sytuacja **stała**. Continuous: **czas trwania** i sama czynność, czynność **niezakończona**, powtórzenia **bez liczby**, sytuacja **tymczasowa** (tabela na slajdzie II/2 17). Czasowniki stanu (know, be, have = mieć, believe) występują tylko w Simple.","examples":[{"en":"I've written three pages of my essay.","pl":"Napisałem trzy strony eseju.","note":"rezultat, liczba → Simple"},{"en":"I've been writing my essay all morning.","pl":"Cały ranek piszę esej.","note":"czas trwania → Continuous"},{"en":"We've painted the bedroom – come and have a look.","pl":"Pomalowaliśmy sypialnię – chodź zobaczyć.","note":"gotowy efekt → Simple"},{"en":"We've been painting the bedroom, so the whole flat smells of paint.","pl":"Malowaliśmy sypialnię, więc w całym mieszkaniu czuć farbę.","note":"sama czynność i jej ślad → Continuous"}],"pitfalls":[{"wrong":"I've been charging your power bank, so you can take it now.","right":"I've charged your power bank, so you can take it now.","why":"czynność zakończona, liczy się rezultat (powerbank jest naładowany) → Simple; Continuous mówi o samej czynności i nie gwarantuje, że się skończyła"}],"slides":[{"pres":"II-2","slide":17}]}],"uses":[{"tense":"Present Perfect Continuous","no":null,"use":"focus on duration","usePl":"nacisk na czas trwania","example":"We've been queuing for the canteen for twenty minutes.","ref":"24.1","slide":{"pres":"II-2","slide":17}},{"tense":"Present Perfect","no":null,"use":"focus on result","usePl":"nacisk na rezultat","example":"I've finished the translation – you can check it now.","ref":"24.4","slide":{"pres":"II-2","slide":17}},{"tense":"Present Perfect Continuous","no":null,"use":"repeated actions (no number of times given)","usePl":"powtarzana czynność bez podanej liczby razy","example":"Kuba has been texting me all evening.","ref":"24.1","slide":{"pres":"II-2","slide":17}},{"tense":"Present Perfect","no":null,"use":"repeated actions (we know how many times)","usePl":"powtarzana czynność, znamy liczbę razy","example":"Kuba has texted me six times this evening.","ref":"24.1","slide":{"pres":"II-2","slide":17}},{"tense":"Present Perfect Continuous","no":null,"use":"temporary situation","usePl":"sytuacja tymczasowa","example":"Since the library closed for renovation, we've been studying in the café downstairs.","ref":"24.2","slide":{"pres":"II-2","slide":17}},{"tense":"Present Perfect","no":null,"use":"permanent situation","usePl":"sytuacja stała","example":"Our phonetics lecturer has taught at this university for over twenty years.","ref":"24.2","slide":{"pres":"II-2","slide":17}},{"tense":"Present Perfect Continuous","no":null,"use":"action not finished","usePl":"czynność niezakończona","example":"I've been learning to drive since July, and I still can't park.","ref":"24.1","slide":{"pres":"II-2","slide":17}},{"tense":"Present Perfect","no":null,"use":"action finished","usePl":"czynność zakończona","example":"I've packed my suitcase, so we can leave whenever you're ready.","ref":"24.1","slide":{"pres":"II-2","slide":17}},{"tense":"Present Perfect Continuous","no":null,"use":"present result: explaining a present situation","usePl":"wyjaśnienie obecnego stanu niedawną czynnością","example":"The kitchen floor is wet – have you been washing it?","ref":"24.3","slide":null}],"quiz":[{"id":"u24-01","type":"gap","prompt":"I ___ (paint) the kitchen since breakfast, and I've only done one wall so far.","answers":["have been painting","'ve been painting"],"explain":"Nacisk na czas trwania czynności, która jeszcze się nie skończyła (dopiero jedna ściana) → Present Perfect Continuous.","ref":"24.1"},{"id":"u24-02","type":"choice","prompt":"I ___ a summary of the article – it's in our shared folder now.","options":["have been writing","have written","am writing"],"answer":1,"explain":"Czynność zakończona, liczy się rezultat (gotowe streszczenie w folderze) → Present Perfect Simple. Continuous sugerowałby, że wciąż piszesz.","ref":"24.4"},{"id":"u24-03","type":"choice","prompt":"Agata ___ me the same question all week – she must be really worried about the exam.","options":["has asked","has been asking","is asking"],"answer":1,"explain":"Czynność powtarzana bez podanej liczby razy, przez cały okres do teraz (all week) → Present Perfect Continuous.","ref":"24.1"},{"id":"u24-04","type":"gap","prompt":"I ___ (ring) the bell three times so far, but nobody has answered.","answers":["have rung","'ve rung"],"explain":"Podana liczba powtórzeń (three times) → Present Perfect Simple; Continuous nie łączy się z liczbą razy.","ref":"24.1"},{"id":"u24-05","type":"use","prompt":"Filip has been cycling to work since the bridge closed for repairs.","options":["czynność zakończona (action finished) – Present Perfect Simple","sytuacja tymczasowa (temporary situation) – Present Perfect Continuous","sytuacja stała (permanent situation) – Present Perfect Simple","powtarzana czynność, znamy liczbę razy (repeated actions, we know how many times) – Present Perfect Simple"],"answer":1,"explain":"Sytuacja potrwa tylko do końca remontu mostu → tymczasowa → Present Perfect Continuous.","ref":"24.2"},{"id":"u24-06","type":"use","prompt":"The Wójciks have run this guesthouse in Mielno for three generations.","options":["nacisk na czas trwania (focus on duration) – Present Perfect Continuous","sytuacja tymczasowa (temporary situation) – Present Perfect Continuous","sytuacja stała (permanent situation) – Present Perfect Simple","powtarzana czynność, znamy liczbę razy (repeated actions, we know how many times) – Present Perfect Simple"],"answer":2,"explain":"Sytuacja trwała, od pokoleń → Present Perfect Simple. „Three generations” to czas trwania, a nie liczba powtórzeń.","ref":"24.4"},{"id":"u24-07","type":"gap","prompt":"Kasia ___ (wait) for the bus for half an hour, and it still hasn't come.","answers":["has been waiting","'s been waiting","has waited","'s waited"],"explain":"Czynność trwa od pół godziny do teraz → Present Perfect Continuous (najbardziej naturalny), Simple też jest poprawny. Present Continuous (is waiting) nie wyraża, od kiedy coś trwa.","ref":"24.2"},{"id":"u24-08","type":"choice","prompt":"I ___ your book – I'll give it back to you on Monday, when I've finished it.","options":["have read","have been reading","read"],"answer":1,"explain":"Czynność niezakończona (oddam, gdy skończę) → Present Perfect Continuous; I've read = przeczytałem do końca.","ref":"24.1"},{"id":"u24-09","type":"gap","prompt":"Wiktoria ___ (read) all seven Harry Potter books, and now she's rereading them in English.","answers":["has read","'s read"],"explain":"Czynność zakończona i policzona (all seven) → Present Perfect Simple; Continuous nie łączy się z liczbą.","ref":"24.4"},{"id":"u24-10","type":"choice","prompt":"Why are your hands so dirty? – I ___ my bike all afternoon.","options":["have fixed","have been fixing","fixed","am fixing"],"answer":1,"explain":"Brudne ręce to ślad czynności, która trwała do teraz (all afternoon) → Present Perfect Continuous. Simple (have fixed) mówiłby o rezultacie i nie łączy się z all afternoon.","ref":"24.3"},{"id":"u24-11","type":"choice","prompt":"Your eyes are all red. ___?","options":["Have you cried","Have you been crying","Do you cry"],"answer":1,"explain":"Widzimy skutek (czerwone oczy) niedawnej czynności i pytamy o nią → Present Perfect Continuous.","ref":"24.3"},{"id":"u24-12","type":"fix","prompt":"Our neighbour has been complaining about the noise three times this week, so we'd better turn the music down.","wrong":"has been complaining","fixes":["has complained"],"answers":["Our neighbour has complained about the noise three times this week, so we'd better turn the music down."],"explain":"Podana liczba razy (three times) → Present Perfect Simple, nie Continuous.","ref":"24.1"}],"translations":[{"id":"u24-t01","pl":"Czekam tu od godziny.","answers":["I've been waiting here for an hour.","I have been waiting here for an hour."],"keys":["have been waiting","for an hour"],"explain":"„Czekam od…” – czynność trwa od przeszłości do teraz → Present Perfect Continuous + for, nie Present Simple ani Present Continuous.","ref":"24.1"},{"id":"u24-t02","pl":"Od rana pada śnieg.","answers":["It's been snowing since this morning.","It has been snowing since the morning."],"keys":["been snowing","since"],"explain":"Po polsku czas teraźniejszy, ale opad trwa od rana do teraz → Present Perfect Continuous + since (punkt w czasie).","ref":"24.1"},{"id":"u24-t03","pl":"Dlaczego masz brudne ręce? – Naprawiałem rower.","answers":["Why are your hands dirty? – I've been fixing my bike.","Why are your hands so dirty? – I've been repairing my bike.","Why have you got dirty hands? – I've been fixing my bike."],"keys":["have been"],"explain":"Polski czas przeszły („naprawiałem”), ale wyjaśniamy obecny stan (brudne ręce) czynnością, która przed chwilą trwała → Present Perfect Continuous.","ref":"24.3"},{"id":"u24-t04","pl":"Ostatnio dużo biegam.","answers":["I've been running a lot lately.","I've been running a lot recently.","Lately I've been running a lot."],"keys":["have been running"],"explain":"Nowy, być może tymczasowy zwyczaj z lately/recently → Present Perfect Continuous, nie Present Simple.","ref":"24.2"},{"id":"u24-t05","pl":"Przeczytałam dziś trzy rozdziały.","answers":["I've read three chapters today.","Today I've read three chapters."],"keys":["have read","three chapters"],"explain":"Podana liczba (trzy rozdziały) i niezakończony okres (dziś) → Present Perfect Simple, nie Continuous.","ref":"24.4"},{"id":"u24-t06","pl":"Od kiedy pracujesz w tej kawiarni?","answers":["How long have you been working at this café?","How long have you worked at this café?","How long have you been working in this café?"],"keys":["how long","have you"],"explain":"Pytanie o czas trwania sytuacji do teraz → How long + Present Perfect (Continuous); z work oba czasy są poprawne. Błąd: Since when do you work…?","ref":"24.2"}],"pairs":[{"id":"pps-vs-ppc","title":"Present Perfect Simple czy Continuous?","a":{"name":"Present Perfect Simple","when":"rezultat, czynność zakończona, liczba powtórzeń (three times), sytuacja stała; czasowniki stanu (know, be, have = mieć)","example":"I've cleaned the bathroom – it's spotless."},"b":{"name":"Present Perfect Continuous","when":"czas trwania i sama czynność, czynność niezakończona, powtórzenia bez liczby (all morning), sytuacja tymczasowa, wyjaśnienie obecnego stanu","example":"I've been cleaning all afternoon – I'm exhausted."},"tip":"Jest liczba albo gotowy efekt → Simple; jest „jak długo”, czynność wciąż trwa albo zostawiła ślad → Continuous.","refs":["24.1","24.2","24.3","24.4"],"quiz":["u24-01","u24-02","u24-03","u24-04","u24-05","u24-06","u24-08","u24-09","u24-10","u24-11","u24-12"]}],"signals":[{"word":"all day / all morning / all week","tenses":["Present Perfect Continuous"],"example":"I've been revising all day.","note":"Czasowniki stanu mimo to w Simple (I've been at home all day). Gdy podajemy rezultat lub liczbę – Simple: I've revised three units.","ref":"24.1"},{"word":"twice / three times (liczba razy)","tenses":["Present Perfect"],"example":"Maks has failed his driving test twice.","note":"Liczba powtórzeń → Present Perfect Simple; nie łączymy jej z Continuous (nie: has been failing twice).","ref":"24.1"}]},"25":{"unit":"25","title":"State verbs","titlePl":"Czasowniki stanu","module":5,"presentations":[{"id":"II-1","slides":[18,18]},{"id":"II-2","slides":[19,19]}],"summary":["Czasowniki stanu opisują istnienie, posiadanie, uczucia, myślenie, wrażenie i cechy (cost, weigh, mean) – zwykle nie mają formy ciągłej, nawet gdy mówimy o „teraz”: I don't understand, a nie I'm not understanding.","Wiele z nich ma drugie, „czynnościowe” znaczenie, w którym continuous jest możliwy: **think** (uważać → rozważać), **have** (mieć → jeść, przeżywać), **see** (widzieć, rozumieć → spotykać się), **taste/smell** (smakować, pachnieć → próbować, wąchać), **be** (być → zachowywać się).","Zmysły działające mimowolnie: I can hear, I can smell – bez continuous; celowo: look at, watch, listen to.","**hurt** i **feel** (samopoczucie) – simple i continuous bez różnicy znaczenia.","Czasowniki performatywne (I promise, I apologise, I suggest) – w teraźniejszości tylko Present Simple, bo samo wypowiedzenie jest czynnością."],"sections":[{"ref":"25.1","page":112,"title":"Czasowniki stanu (believe, have, like…)","rule":"Czasowniki stanu opisują stan, a nie czynność, dlatego rzadko występują w formach ciągłych. Należą do nich m.in. czasowniki istnienia i posiadania (exist, consist of, contain, belong to, own), uczuć i pragnień (love, hate, prefer, want, need), myślenia (know, believe, understand, realise, remember), wrażenia (seem, appear, resemble) oraz inne (cost, depend, deserve, matter, fit). Zostają w **Present Simple** także wtedy, gdy mówimy o tej chwili (slajd II/1 18, użycie 12).","examples":[{"en":"This flat belongs to my uncle, so we pay a very low rent.","pl":"To mieszkanie należy do mojego wujka, więc płacimy bardzo niski czynsz.","note":"posiadanie"},{"en":"Do you realise how late it is?","pl":"Zdajesz sobie sprawę, która jest godzina?","note":"myślenie"},{"en":"The course book costs 150 złoty – that seems a lot.","pl":"Podręcznik kosztuje 150 złotych – to chyba sporo.","note":"cost, seem – cecha i wrażenie"},{"en":"You really resemble your father.","pl":"Jesteś naprawdę podobny do ojca.","note":"podobieństwo"}],"pitfalls":[{"wrong":"I'm not believing a word he says.","right":"I don't believe a word he says.","why":"believe to czasownik myślenia (stan) – Present Simple"},{"wrong":"The exam is consisting of three parts.","right":"The exam consists of three parts.","why":"consist of opisuje budowę, czyli stan, nie czynność"},{"wrong":"Are you knowing where the dean's office is?","right":"Do you know where the dean's office is?","why":"know nie występuje w formie ciągłej"}],"slides":[{"pres":"II-1","slide":18},{"pres":"II-2","slide":19}]},{"ref":"25.2","page":112,"title":"Czasowniki stanu w formie ciągłej","rule":"Wiele czasowników stanu może wystąpić w continuous, ale wtedy zmienia się znaczenie (czynność zamiast stanu) albo podkreślamy coś tymczasowego. Najważniejsze pary: **think** (uważać / rozważać), **have** (posiadać / jeść, przeżywać), **be** (być jakimś / zachowywać się tak teraz), **see** (widzieć, rozumieć / spotykać się), **mean** (znaczyć / zamierzać), **appear** (wydawać się / występować), **weigh** (ważyć X kg / ważyć coś na wadze), **expect** (sądzić / spodziewać się kogoś lub czegoś). Konstrukcje typu I'm loving it to potoczna ekspresja – na kolokwium ich unikaj.","examples":[{"en":"I think the new timetable is a disaster.","pl":"Uważam, że nowy plan zajęć to katastrofa.","note":"think = uważać → Present Simple"},{"en":"I'm thinking about dropping one of my optional courses.","pl":"Zastanawiam się, czy nie zrezygnować z jednego z fakultetów.","note":"think = rozważać → Present Continuous"},{"en":"Marek is being very helpful today – he even made coffee for everyone.","pl":"Marek jest dziś wyjątkowo pomocny – zrobił nawet wszystkim kawę.","note":"be + being = zachowanie w danym czasie"},{"en":"I'm having a few problems with my new laptop.","pl":"Mam trochę problemów z nowym laptopem.","note":"have = doświadczać, przeżywać → Present Continuous"}],"pitfalls":[{"wrong":"I'm thinking you're right.","right":"I think you're right.","why":"think w znaczeniu opinii (uważam) to stan – Present Simple"},{"wrong":"My brother is having a beard now.","right":"My brother has a beard now. / My brother has got a beard now.","why":"have = posiadać to stan – bez continuous, nawet z now"},{"wrong":"The professor is appearing to be in a bad mood.","right":"The professor appears to be in a bad mood.","why":"appear = wydawać się (stan); continuous tylko w znaczeniu „występować” na scenie"}],"slides":[{"pres":"II-2","slide":19}]},{"ref":"25.3","page":113,"title":"Czasowniki zmysłów (see, hear, smell, taste, feel)","rule":"Czasowniki percepcji (see, hear, notice, smell, taste) zwykle nie mają formy ciągłej: mimowolny odbiór wyrażamy Present Simple albo **can/could** + czasownik (I can hear music). Celową czynność wyrażają **look at, watch, listen to**, a przy smell i taste – continuous w znaczeniu „wąchać, próbować”; bez dopełnienia (The soup smells great) zawsze simple. **I'm seeing** = spotykam się, mam wizytę u kogoś. **hurt** i **feel** (samopoczucie) mają w simple i continuous to samo znaczenie.","examples":[{"en":"I can smell burning – did you leave the oven on?","pl":"Czuję spaleniznę – zostawiłeś włączony piekarnik?","note":"mimowolnie: can + smell"},{"en":"This cheese tastes a bit like walnuts.","pl":"Ten ser smakuje trochę jak orzechy włoskie.","note":"bez dopełnienia (= smakować) → Present Simple"},{"en":"Why are you smelling the towels? – I'm checking which ones are clean.","pl":"Czemu wąchasz ręczniki? – Sprawdzam, które są czyste.","note":"celowe wąchanie → Present Continuous"},{"en":"I feel a bit dizzy. / I'm feeling a bit dizzy.","pl":"Trochę kręci mi się w głowie.","note":"feel (samopoczucie) – obie formy, to samo znaczenie"}],"pitfalls":[{"wrong":"I'm hearing someone at the door.","right":"I can hear someone at the door.","why":"mimowolny odbiór zmysłowy → can + hear, nie continuous"},{"wrong":"This perfume is smelling of roses.","right":"This perfume smells of roses.","why":"smell bez dopełnienia (= pachnieć) → tylko Present Simple"}],"slides":[{"pres":"II-2","slide":19}]},{"ref":"25.4","page":113,"title":"Czasowniki performatywne (promise, apologise, thank…)","rule":"Czasowniki performatywne same wykonują czynność, gdy mówimy je w 1. osobie w czasie teraźniejszym – powiedzenie I promise jest obietnicą. Wtedy używamy wyłącznie **Present Simple**: I apologise, I agree, I suggest, I insist, I recommend. Gdy mówimy o przeszłości albo o planach, forma ciągła jest możliwa: She was apologising to the dean when I came in. / I'm suggesting it at tomorrow's meeting.","examples":[{"en":"I apologise – I didn't mean to interrupt you.","pl":"Przepraszam, nie chciałem ci przerywać.","note":"przeprosiny → Present Simple"},{"en":"I suggest we meet in the library at five.","pl":"Proponuję, żebyśmy spotkali się w bibliotece o piątej.","note":"propozycja"},{"en":"I agree – the deadline is far too tight.","pl":"Zgadzam się – termin jest zdecydowanie za krótki.","note":"wyrażenie zgody"},{"en":"I'm recommending you for the Erasmus scholarship at tomorrow's meeting.","pl":"Na jutrzejszym zebraniu zarekomenduję cię do stypendium Erasmusa.","note":"plan na przyszłość, a nie samo polecenie → continuous możliwy"}],"pitfalls":[{"wrong":"I'm apologising for the mess in the kitchen.","right":"I apologise for the mess in the kitchen.","why":"przeprosiny wykonujemy samym wypowiedzeniem → Present Simple"},{"wrong":"We're congratulating you on your excellent results.","right":"We congratulate you on your excellent results.","why":"czasownik performatywny w 1. osobie, w teraźniejszości → Present Simple"}],"slides":[{"pres":"II-2","slide":19}]}],"uses":[{"tense":"Present Continuous","no":null,"use":"state verbs with a change of meaning (think of, have, see, be + being)","usePl":"czasowniki stanu w znaczeniu czynności: rozważać, jeść / przeżywać, spotykać się, zachowywać się","example":"I'm seeing my old flatmate for coffee later.","ref":"25.2","slide":null},{"tense":"Present Continuous","no":null,"use":"deliberate use of the senses (taste, smell)","usePl":"celowe użycie zmysłu: próbować, wąchać","example":"I'm tasting different olive oils for a food blog review.","ref":"25.3","slide":null},{"tense":"Present Simple","no":null,"use":"involuntary perception (can see, can hear)","usePl":"mimowolny odbiór zmysłami – Present Simple albo can + see / hear / smell","example":"I can see the sea from my window.","ref":"25.3","slide":null},{"tense":"Present Simple","no":null,"use":"performative verbs (I promise, I apologise, I suggest)","usePl":"czasowniki performatywne – samo wypowiedzenie wykonuje czynność","example":"I accept your offer with great pleasure.","ref":"25.4","slide":null}],"quiz":[{"id":"u25-01","type":"choice","prompt":"Sorry, I ___ what you mean – could you give me an example?","options":["don't understand","am not understanding"],"answer":0,"explain":"understand to czasownik stanu – Present Simple nawet o tej chwili (slajd II/1 18, użycie 12).","ref":"25.1"},{"id":"u25-02","type":"gap","prompt":"Please don't throw that box away – it ___ (contain) all my notes from my first year.","answers":["contains"],"explain":"contain opisuje stan (co jest w środku), nie czynność → Present Simple.","ref":"25.1"},{"id":"u25-03","type":"gap","prompt":"'Do you enjoy working at the café?' 'It ___ (depend) on who I'm working with.'","answers":["depends"],"explain":"depend to czasownik stanu – Present Simple, nie is depending.","ref":"25.1"},{"id":"u25-04","type":"gap","prompt":"I ___ (think) of doing a master's degree abroad, but I haven't decided yet.","answers":["am thinking","'m thinking","have been thinking","'ve been thinking"],"explain":"think of/about = rozważać, zastanawiać się – czynność w toku → continuous.","ref":"25.2"},{"id":"u25-05","type":"choice","prompt":"What ___ of the new canteen menu? Is it any better?","options":["are you thinking","do you think"],"answer":1,"explain":"Pytanie o opinię (think = uważać) → Present Simple: What do you think of…?","ref":"25.2"},{"id":"u25-06","type":"gap","prompt":"Greetings from Lisbon – right now we ___ (have) a fantastic time on the beach!","answers":["are having","'re having"],"explain":"have a good time = dobrze się bawić – przeżycie, które trwa → Present Continuous.","ref":"25.2"},{"id":"u25-07","type":"choice","prompt":"My grandparents ___ a lovely old house near Darłowo now – they moved there in May.","options":["have","are having"],"answer":0,"explain":"have = posiadać to stan – nawet z now zostaje Present Simple.","ref":"25.2"},{"id":"u25-08","type":"choice","prompt":"Kuba is normally very generous, but he ___ really mean about splitting the bill tonight.","options":["is","is being"],"answer":1,"explain":"be + being = zachowywać się w danej chwili; zwykle jest hojny, a dziś zachowuje się skąpo → is being.","ref":"25.2"},{"id":"u25-09","type":"fix","prompt":"I'm being really tired today – I only slept for four hours.","wrong":"I'm being","fixes":["I'm","I am"],"answers":["I'm really tired today – I only slept for four hours.","I am really tired today – I only slept for four hours."],"explain":"Zmęczenie to stan, nie zachowanie – be + being tylko o zachowaniu (rude, silly, generous).","ref":"25.2"},{"id":"u25-10","type":"choice","prompt":"I can't have lunch with you on Friday – I ___ my thesis supervisor at 1.30.","options":["see","am seeing"],"answer":1,"explain":"see = spotykać się z kimś (umówione spotkanie) – znaczenie czynności, więc Present Continuous.","ref":"25.3"},{"id":"u25-11","type":"choice","prompt":"Oh, I ___ – you want the file as a PDF, not as a Word document.","options":["see","am seeing"],"answer":0,"explain":"see = rozumieć – stan → Present Simple: I see.","ref":"25.1"},{"id":"u25-12","type":"gap","prompt":"'What are you doing?' 'I ___ (taste) the soup to check if it needs more pepper.'","answers":["am tasting","'m tasting"],"explain":"taste = próbować (celowo) – czynność w toku → Present Continuous.","ref":"25.3"},{"id":"u25-13","type":"choice","prompt":"Mmm, this pierogi filling ___ amazing! What did you put in it?","options":["tastes","is tasting"],"answer":0,"explain":"taste + przymiotnik = smakować (bez dopełnienia) – stan → Present Simple.","ref":"25.3"},{"id":"u25-14","type":"choice","prompt":"___ the people in the next flat arguing? They've been shouting for an hour.","options":["Are you hearing","Can you hear"],"answer":1,"explain":"Mimowolny odbiór zmysłowy → can + hear, nie continuous.","ref":"25.3"},{"id":"u25-15","type":"choice","prompt":"'Why are you limping?' 'My knee ___ after yesterday's match.'","options":["hurts","is hurting","obie formy są poprawne"],"answer":2,"explain":"hurt (podobnie jak feel o samopoczuciu) może być w simple i continuous bez zmiany znaczenia.","ref":"25.3"},{"id":"u25-16","type":"gap","prompt":"No, put your wallet away – I ___ (insist)! This one's on me.","answers":["insist"],"explain":"Czasownik performatywny w 1. osobie: samo powiedzenie I insist jest naleganiem → Present Simple.","ref":"25.4"},{"id":"u25-17","type":"use","prompt":"Sorry, I don't remember your surname.","options":["nawyki, rutyna (użycie 1)","sytuacje stałe (użycie 2)","czasowniki stanu (użycie 12)"],"answer":2,"explain":"remember to czasownik stanu (myślenie)
