<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Plan nauki, notatki, slajdy i quizy do kolokwium z czasów (MyGrammarLab C1/C2, Module 5 i 6).">
<meta name="theme-color" content="#0e0e13">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23a993f5'/%3E%3Cpath d='M9 9.5A2.5 2.5 0 0111.5 7H23v15H11.5A2.5 2.5 0 009 24.5z' fill='none' stroke='%2316112a' stroke-width='2'/%3E%3C/svg%3E">
<title>Kolos z czasów</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one centred reading column (max 1120px) under a sticky glass bar; the book viewer docks right on wide screens, full screen on phones.
   Tokens: dark glass surfaces, one violet accent, Geist type. */
:root {
  --surface: #0e0e13;
  --surface-raised: #18181f;
  --surface-sunk: #121218;
  --glass: rgba(255, 255, 255, 0.06);
  --glass-line: rgba(255, 255, 255, 0.12);
  --line-strong: #747382;
  --ink: #ededf2;
  --ink-muted: #9d9caa;
  --accent: #a993f5;
  --on-accent: #16112a;
  --accent-soft: rgba(169, 147, 245, 0.18);
  --ok: #7ed6a5;
  --ok-soft: rgba(126, 214, 165, 0.14);
  --bad: #f4978e;
  --bad-soft: rgba(244, 151, 142, 0.14);
  --warn: #f0c674;
  --warn-soft: rgba(240, 198, 116, 0.14);
  --font: "Geist", "SF Pro Display", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", "SF Mono", ui-monospace, Consolas, monospace;
  --s1: 8px; --s2: 16px; --s3: 24px; --s4: 48px;
  --r1: 8px; --r2: 14px; --r3: 24px;
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
  --blur: 24px;
  --bar-h: 64px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--bar-h) + 16px); }
body {
  margin: 0;
  background: var(--surface);
  color: var(--ink);
  font: 400 16px/24px var(--font);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--surface);
}
.bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.bg span { position: absolute; border-radius: 50%; filter: blur(90px); background: var(--accent-soft); }
.bg span:nth-child(1) { width: 520px; height: 520px; top: -160px; right: -120px; }
.bg span:nth-child(2) { width: 420px; height: 420px; bottom: -180px; left: -140px; opacity: 0.7; }

a { color: var(--accent); text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
button { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); font-size: 0.875em; }
strong { font-weight: 600; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font-size: 32px; line-height: 38px; font-weight: 600; letter-spacing: -0.01em; }
h2 { font-size: 22px; line-height: 28px; font-weight: 600; }
h3 { font-size: 17px; line-height: 24px; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--ink-muted); }
.small { font-size: 14px; line-height: 20px; }
.label { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: rgba(14, 14, 19, 0.72);
  backdrop-filter: blur(var(--blur)) saturate(140%);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(140%);
  border-bottom: 1px solid var(--glass-line);
}
.top-in {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  display: flex; align-items: center; gap: var(--s2);
}
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--ink); white-space: nowrap; }
.brand b { font-weight: 600; font-size: 17px; letter-spacing: -0.01em; }
.brand .count { font-family: var(--mono); font-size: 13px; color: var(--ink-muted); }
.nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; justify-content: flex-end; }
.nav::-webkit-scrollbar { display: none; }
.nav a {
  color: var(--ink-muted); text-decoration: none; padding: 6px 12px; border-radius: var(--r1);
  font-size: 14px; line-height: 20px; white-space: nowrap;
}
.nav a:hover { color: var(--ink); background: var(--glass); }
.nav a[aria-current="page"] { color: var(--ink); background: var(--accent-soft); }
@media (max-width: 760px) {
  .top-in { flex-wrap: wrap; row-gap: 6px; padding-block: 8px; }
  .nav { flex-basis: 100%; justify-content: flex-start; margin-inline: -4px; }
}

/* ---------- page ---------- */
.page {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: var(--s3) var(--s4);
  display: grid; gap: var(--s3);
}
html.pv-open .page, html.pv-open .top-in, html.pv-open .foot-in { margin-right: min(48vw, 760px); margin-left: 0; }
@media (max-width: 999px) { html.pv-open .page, html.pv-open .top-in, html.pv-open .foot-in { margin-right: auto; margin-left: auto; } }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 14px; color: var(--ink-muted); }
.crumbs a { color: var(--ink-muted); }
.head { display: grid; gap: var(--s1); }
.head .lead { color: var(--ink-muted); max-width: 70ch; }

.glass {
  background: var(--glass); border: 1px solid var(--glass-line); box-shadow: var(--shadow);
  backdrop-filter: blur(var(--blur)) saturate(140%); -webkit-backdrop-filter: blur(var(--blur)) saturate(140%);
  border-radius: var(--r3); padding: var(--s3);
}
.card { background: var(--surface-raised); border-radius: var(--r2); padding: var(--s2); min-width: 0; }
.panel { display: grid; gap: var(--s2); min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: var(--s1); align-items: center; }
.between { justify-content: space-between; }
.grid2 { display: grid; gap: var(--s2); grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.grid3 { display: grid; gap: var(--s2); grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.grid4 { display: grid; gap: var(--s2); grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); }
.stack { display: grid; gap: var(--s1); min-width: 0; }
.sep { border: 0; border-top: 1px solid var(--glass-line); margin: 0; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 8px; justify-content: center;
  border: 1px solid var(--line-strong); background: transparent; color: var(--ink);
  border-radius: var(--r2); padding: 9px 16px; font-size: 15px; line-height: 20px; font-weight: 500;
  cursor: pointer; text-decoration: none; min-height: 40px;
}
.btn:hover { background: var(--glass); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; color: var(--ink-muted); }
.btn.ghost:hover { color: var(--ink); }
.btn.small { min-height: 32px; padding: 5px 12px; font-size: 14px; border-radius: var(--r1); }
.btn[disabled] { opacity: 0.45; cursor: default; }
.btn svg { width: 18px; height: 18px; flex: none; }
.chip svg, .tag svg { width: 14px; height: 14px; flex: none; }
a.tag { text-decoration: none; }
#app:focus { outline: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--glass-line);
  background: var(--surface-sunk); color: var(--ink); border-radius: var(--r1);
  padding: 2px 9px; font-size: 13px; line-height: 20px; cursor: pointer; text-decoration: none; white-space: nowrap;
}
.chip:hover { border-color: var(--accent); }
.chip .k { font-family: var(--mono); color: var(--ink-muted); font-size: 12px; }
.chip.key { border-style: dashed; }
.chip.static { cursor: default; }
.chip.static:hover { border-color: var(--glass-line); }
.tag { display: inline-block; background: var(--accent-soft); color: var(--ink); border-radius: var(--r1); padding: 1px 8px; font-size: 12px; line-height: 18px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
.tag.plain { background: var(--glass); color: var(--ink-muted); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.seg { display: inline-flex; background: var(--surface-sunk); border: 1px solid var(--glass-line); border-radius: var(--r2); padding: 3px; gap: 3px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: var(--ink-muted); padding: 6px 12px; border-radius: 10px; cursor: pointer; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
input[type="text"], input[type="number"], input[type="date"], input[type="search"], textarea, select {
  font: inherit; color: var(--ink); background: var(--surface-sunk);
  border: 1px solid var(--line-strong); border-radius: var(--r1); padding: 9px 12px; width: 100%; min-width: 0;
}
textarea { min-height: 84px; resize: vertical; line-height: 22px; }
input::placeholder, textarea::placeholder { color: #7c7b89; }
.check { display: inline-grid; place-items: center; width: 24px; height: 24px; flex: none; border-radius: 7px; border: 1.5px solid var(--line-strong); background: transparent; cursor: pointer; padding: 0; }
.check[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.check[aria-checked="true"] svg { stroke: var(--on-accent); }
.check svg { width: 16px; height: 16px; stroke: transparent; }
.bar { height: 6px; background: var(--glass); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

/* ---------- home ---------- */
.hero { display: grid; gap: var(--s2); }
.hero h1 { font-size: clamp(34px, 7vw, 48px); line-height: 1.08; letter-spacing: -0.02em; }
.countdown { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.countdown .n { font-family: var(--mono); font-size: 44px; line-height: 44px; font-weight: 500; letter-spacing: -0.02em; }
.tile { display: grid; gap: 6px; text-decoration: none; color: var(--ink); background: var(--surface-raised); border-radius: var(--r2); padding: var(--s2); border: 1px solid transparent; min-width: 0; }
.tile:hover { border-color: var(--glass-line); background: #1c1c24; }
.tile .t { font-weight: 600; }
.tile .code { font-family: var(--mono); font-size: 13px; color: var(--accent); }
.unit-tile .mini { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--glass-line); flex: none; }
.dot.s1 { background: var(--bad); } .dot.s2 { background: var(--warn); } .dot.s3 { background: var(--ok); }

/* ---------- tasks / plan ---------- */
.tasks { display: grid; gap: 2px; }
.task { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 10px 4px; border-top: 1px solid var(--glass-line); align-items: start; }
.task:first-child { border-top: 0; }
.task .body { display: grid; gap: 6px; min-width: 0; }
.task.done .ttl { color: var(--ink-muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.task .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.day { display: grid; gap: var(--s1); }
.day-h { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s1); flex-wrap: wrap; }
.day.today { outline: 2px solid var(--accent); outline-offset: -2px; }
.day.past { opacity: 0.8; }

/* ---------- notes ---------- */
.summary ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
[id^="sl-"], [id^="pair-"], [id^="diag-"], [id^="d-"], [id^="u-"] { scroll-margin-top: calc(var(--bar-h) + 24px); }
.hl { box-shadow: 0 0 0 2px var(--accent) !important; }
.sec { display: grid; gap: 12px; padding-block: var(--s2); border-top: 1px solid var(--glass-line); scroll-margin-top: calc(var(--bar-h) + 24px); }
.sec:first-child { border-top: 0; padding-top: 0; }
.sec-h { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.sec-h .ref { font-family: var(--mono); color: var(--accent); font-size: 15px; }
.rule { max-width: 72ch; }
.ex { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.ex li { display: grid; gap: 2px; padding-left: 14px; position: relative; }
.ex li::before { content: ""; position: absolute; left: 0; top: 10px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.ex .en { font-weight: 500; }
.ex .pl { color: var(--ink-muted); font-size: 14px; }
.pit { display: grid; gap: 4px; background: var(--surface-sunk); border-radius: var(--r1); padding: 10px 12px; }
.pit .w { color: var(--bad); text-decoration: line-through; text-decoration-color: rgba(244,151,142,.6); }
.pit .r { color: var(--ok); }
.pit .why { color: var(--ink-muted); font-size: 14px; }
.mark { font-family: var(--mono); font-weight: 600; margin-right: 6px; }

/* ---------- slides ---------- */
.embed { position: relative; width: 100%; padding-top: 56.25%; border-radius: var(--r2); overflow: hidden; background: #000; }
.embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.slide { background: #f6f4ee; color: #1b1a22; border-radius: var(--r2); padding: var(--s3); min-height: 240px; display: grid; align-content: start; gap: 10px; }
.slide .sn { font-family: var(--mono); font-size: 12px; color: #6a6878; letter-spacing: 0.06em; }
.slide table { border-collapse: collapse; width: 100%; font-size: 14px; line-height: 20px; }
.slide th, .slide td { border: 1px solid #cfccd8; padding: 6px 8px; text-align: left; vertical-align: top; }
.slide th { background: #ebe7f7; }
.slide ul, .slide ol { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.slide .tw { overflow-x: auto; }
.slide strong { color: #4b2fb3; }
.slide-list { display: grid; gap: var(--s1); }
.slide-list .slide { min-height: 0; }

/* ---------- quiz ---------- */
.qcard { display: grid; gap: var(--s2); }
.qtop { display: flex; justify-content: space-between; gap: var(--s1); align-items: center; flex-wrap: wrap; }
.prompt { font-size: 19px; line-height: 28px; font-weight: 500; max-width: 60ch; }
.blank { display: inline-block; min-width: 72px; border-bottom: 2px solid var(--accent); margin-inline: 2px; }
.prompt .verb { color: var(--ink-muted); font-weight: 400; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line-strong); background: var(--surface-sunk); border-radius: var(--r2); padding: 12px 14px; cursor: pointer; font-size: 16px; line-height: 22px; }
.opt:hover { border-color: var(--accent); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.fb { border-radius: var(--r2); padding: 12px 14px; display: grid; gap: 6px; }
.fb.ok { background: var(--ok-soft); }
.fb.bad { background: var(--bad-soft); }
.fb .st { font-weight: 600; }
.fb.ok .st { color: var(--ok); }
.fb.bad .st { color: var(--bad); }
.keys { display: flex; flex-wrap: wrap; gap: 6px; }
.timer { font-family: var(--mono); font-size: 15px; }
.score-big { font-family: var(--mono); font-size: 56px; line-height: 56px; font-weight: 500; letter-spacing: -0.02em; }
.review-item { display: grid; gap: 4px; padding-block: 10px; border-top: 1px solid var(--glass-line); }

/* story */
.story { font-size: 17px; line-height: 34px; max-width: 70ch; }
.story input { width: auto; min-width: 9ch; display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 16px; line-height: 22px; vertical-align: baseline; }
.story input.right { border-color: var(--ok); background: var(--ok-soft); }
.story input.wrong { border-color: var(--bad); background: var(--bad-soft); }
.story .gn { font-family: var(--mono); font-size: 11px; color: var(--ink-muted); vertical-align: super; margin-right: 2px; }

/* cheat sheet */
.use { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 4px 12px; padding-block: 10px; border-top: 1px solid var(--glass-line); }
.use:first-of-type { border-top: 0; }
.use .no { font-family: var(--mono); color: var(--accent); font-size: 14px; padding-top: 2px; }
.use .ex-en { font-style: italic; }
.pair { display: grid; gap: var(--s2); }
.pair .sides { display: grid; gap: var(--s2); grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.filter { display: flex; gap: var(--s1); flex-wrap: wrap; align-items: center; }
.filter input[type="search"] { max-width: 360px; }
.numgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
.numgrid button { aspect-ratio: 1; border-radius: var(--r1); border: 1px solid var(--line-strong); background: var(--surface-sunk); cursor: pointer; font-family: var(--mono); }
.numgrid button[aria-pressed="true"] { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }

/* ---------- PDF viewer ---------- */
.viewer {
  position: fixed; z-index: 40; inset: 0; background: var(--surface);
  display: grid; grid-template-rows: auto 1fr;
  padding-top: env(safe-area-inset-top, 0px);
}
@media (min-width: 1000px) {
  .viewer { inset: 0 0 0 auto; width: min(48vw, 760px); border-left: 1px solid var(--glass-line); box-shadow: var(--shadow); }
}
.vbar {
  display: flex; gap: var(--s1); align-items: center; flex-wrap: wrap; justify-content: space-between;
  padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--glass-line); background: var(--surface-raised);
}
.vbar .grp { display: flex; gap: 6px; align-items: center; }
.vbar input { width: 72px; padding: 5px 8px; text-align: center; }
.vbody { overflow: auto; padding: 12px; display: grid; justify-items: center; align-content: start; gap: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); }
.vbody canvas { background: #fff; border-radius: 6px; max-width: none; }
.vmsg { color: var(--ink-muted); text-align: center; max-width: 46ch; padding: var(--s3); }

/* dialog + toast */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(5, 5, 8, 0.6); display: grid; place-items: center; padding: 16px; }
.modal .box { max-width: 460px; width: 100%; display: grid; gap: var(--s2); }
.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: max(20px, calc(env(safe-area-inset-bottom, 0px) + 12px)); background: var(--surface-raised); border: 1px solid var(--glass-line); color: var(--ink); padding: 10px 16px; border-radius: var(--r2); box-shadow: var(--shadow); font-size: 14px; max-width: calc(100vw - 32px); }

/* footer */
.foot { border-top: 1px solid var(--glass-line); margin-top: var(--s3); }
.foot-in { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: var(--s3) max(var(--s3), env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; font-size: 13px; line-height: 19px; color: var(--ink-muted); }

@media (max-width: 560px) {
  .glass { padding: var(--s2); border-radius: 20px; }
  h1 { font-size: 27px; line-height: 33px; }
  .prompt { font-size: 18px; line-height: 26px; }
  .slide { padding: var(--s2); }
}
@media (prefers-reduced-motion: no-preference) {
  .opt, .btn, .chip, .tile { transition: background-color .15s, border-color .15s, color .15s; }
}

/* irregular verbs */
.irr-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1.2fr); gap: 2px 12px; padding-block: 8px; border-top: 1px solid var(--glass-line); align-items: baseline; overflow-wrap: anywhere; }
.irr-row:first-child { border-top: 0; }
@media (max-width: 560px) { .irr-row { grid-template-columns: repeat(3, minmax(0, 1fr)); } .irr-row .pl { grid-column: 1 / -1; } }

/* timelines */
.tlbox { min-height: 80px; }
.tl { display: block; width: 100%; height: auto; overflow: visible; }

nt reporting verbs","50.4":"Reporting verbs (+ clause)","50.5":"Reporting verbs + infinitive","50.6":"Reporting verbs + -ing form","51.1":"No backshift","51.2":"Obligatory backshift","51.3":"Optional backshift","51.4":"Changes and additions with adverbs","51.5":"Modal verbs","51.6":"Reporting with nouns","52.1":"Reported questions"},"section_pages":{"50.1":[222],"50.2":[222],"50.3":[222],"50.4":[223],"50.5":[223],"50.6":[223],"51.1":[226],"51.2":[226],"51.3":[226],"51.4":[227],"51.5":[227],"51.6":[227],"52.1":[230]},"exercises":{"pages":[224,225,228,229],"items":{"224":"Unit 50: ex. 1, 2","225":"Unit 50: ex. 3, 4","228":"Unit 51: ex. 1, 2","229":"Unit 51: ex. 3, 4"}},"exercise_types":{"224":{"1":"ułóż podane wyrazy w zdania w mowie zależnej, zaczynając od podkreślonego słowa","2":"przekaż wypowiedzi w mowie zależnej, dobierając czasownik z ramki (5 zbędnych)"},"225":{"3":"w streszczeniu przemówienia wybierz właściwy czasownik relacjonujący i wpisz po jednym słowie w luki A–H","4":"znajdź i popraw zdania z błędami gramatycznymi lub interpunkcyjnymi (8 z 10); poprawne odhacz"},"228":{"1":"wybierz poprawne formy w dialogu relacjonującym czyjąś mowę; jeśli obie pasują – zaznacz obie","2":"przekaż nagrania z poczty głosowej w mowie zależnej, zmieniając czasy, zaimki i okoliczniki"},"229":{"3":"przepisz zdania w mowie zależnej, decydując, czy zmienić czas oraz okoliczniki czasu i miejsca","4":"jeden czasownik z nawiasu zamień na rzeczownik relacjonujący, drugim uzupełnij zdanie"}},"key":[400,401],"in_class":"–"}},"content":{"19":{"unit":"19","title":"Auxiliaries and have got","titlePl":"Czasowniki posiłkowe i have got","module":5,"presentations":[{"id":"II-1","slides":[7,12]}],"summary":["**be, have, do** bywają posiłkowe (tworzą czasy ciągłe i perfect, stronę bierną oraz pytania i przeczenia w Present i Past Simple) albo główne – wtedy mają własne znaczenie: być, mieć, robić.","Czasowniki modalne (can, must, should) nie łączą się z do: Must we…?, a nie Do we must…?","Skróty: **'s** = is albo has, **'d** = had albo would – rozstrzyga następna forma czasownika; was się nie skraca.","**have got** = potoczne „mam” (posiadanie, relacje, choroby, obowiązek have got to) – tylko w czasie teraźniejszym; pytanie Have you got…?, przeczenie I haven't got…","W przeszłości i przyszłości tylko **had / will have**; czynności (have lunch, have a shower) i forma ciągła – tylko have."],"sections":[{"ref":"19.1","page":90,"title":"Do czego służą czasowniki posiłkowe","rule":"**be** + -ing tworzy formy ciągłe, **be** + III forma – stronę bierną, **have** + III forma – czasy perfect. **do/does/did** tworzy pytania i przeczenia w Present Simple i Past Simple; z czasownikami modalnymi do nie występuje. W nagłówkach prasowych i bardzo nieformalnych notatkach posiłkowy (czasem także podmiot) bywa pomijany.","examples":[{"en":"Ola is writing her essay in the library.","pl":"Ola pisze esej w bibliotece.","note":"be + -ing → Present Continuous"},{"en":"Have you handed in your essay yet?","pl":"Oddałeś już esej?","note":"have + III forma → Present Perfect"},{"en":"The kitchens in our halls are cleaned every Friday.","pl":"Kuchnie w naszym akademiku są sprzątane w każdy piątek.","note":"be + III forma → strona bierna"},{"en":"Didn't you get my message?","pl":"Nie dostałeś mojej wiadomości?","note":"did + bezokolicznik → pytanie przeczące w Past Simple"}],"pitfalls":[{"wrong":"Do you must leave so early?","right":"Must you leave so early? / Do you have to leave so early?","why":"czasowniki modalne nie łączą się z do – pytanie tworzymy inwersją albo używamy have to"},{"wrong":"Where you live now?","right":"Where do you live now?","why":"pytanie w Present Simple wymaga posiłkowego do/does"},{"wrong":"She doesn't likes early lectures.","right":"She doesn't like early lectures.","why":"po does/doesn't bezokolicznik bez -s – końcówkę niesie posiłkowy"}],"slides":[{"pres":"II-1","slide":8},{"pres":"II-1","slide":9}]},{"ref":"19.2","page":90,"title":"Formy ściągnięte (skróty) z czasownikami posiłkowymi","rule":"Skróty ('m, 're, 's, 've, 'd, 'll, n't) są normalne w mowie i nieformalnym piśmie, a w bardzo formalnym tekście ich unikamy. **'s** = is albo has, **'d** = had albo would – rozpoznajesz po tym, co następuje (-ing, III forma, bezokolicznik); uwaga na stronę bierną (It's made in Poland = is) i had better (You'd better go = had). **was** nie ma formy skróconej, a w stylu formalnym nie skracamy posiłkowego po dwóch podmiotach. W mowie możliwe są podwójne skróty z modalnymi: shouldn't've.","examples":[{"en":"She's applied for an Erasmus grant.","pl":"Złożyła wniosek o stypendium Erasmusa.","note":"'s + III forma = has"},{"en":"She's applying for an Erasmus grant.","pl":"Składa wniosek o stypendium Erasmusa.","note":"'s + -ing = is"},{"en":"I'd never been abroad before I went on Erasmus.","pl":"Zanim wyjechałem na Erasmusa, nigdy nie byłem za granicą.","note":"'d + III forma = had"},{"en":"I'd move to Gdańsk if I found a job there.","pl":"Przeprowadziłbym się do Gdańska, gdybym znalazł tam pracę.","note":"'d + bezokolicznik = would"}],"pitfalls":[{"wrong":"Applicants who haven't submitted the form by 30 June won't be considered.","right":"Applicants who have not submitted the form by 30 June will not be considered.","why":"w bardzo formalnym tekście (np. regulamin rekrutacji, pismo urzędowe) nie używamy skrótów"},{"wrong":"He's at home all day yesterday.","right":"He was at home all day yesterday.","why":"was się nie skraca – he's to zawsze he is albo he has"}],"slides":[]},{"ref":"19.3","page":90,"title":"be, have i do jako czasowniki główne","rule":"Jako czasowniki główne: **be** = być, istnieć, znajdować się, a w continuous – zachowywać się (He's being rude); **do** = robić, wykonywać zadanie; **have** = mieć (posiadanie, relacje, choroby, przeżycia) albo wykonywać czynność (have lunch, have a shower, have a party). W znaczeniu czynności have może być w continuous, w znaczeniu stanu – nie. Jako główne tworzą pytania i przeczenia z do jak każdy inny czasownik: Did you do…?, I don't have… W brytyjskim angielskim spotkasz też formy bez do (Has he any…?, I haven't the faintest idea) – brzmią formalnie albo idiomatycznie.","examples":[{"en":"Do you do any sport at uni?","pl":"Uprawiasz jakiś sport na studiach?","note":"pierwsze do – posiłkowy, drugie – główny (robić, uprawiać)"},{"en":"We're having a barbecue by the lake on Sunday.","pl":"W niedzielę robimy grilla nad jeziorem.","note":"have = czynność → możliwy continuous"},{"en":"My grandad has diabetes.","pl":"Mój dziadek ma cukrzycę.","note":"have = choroba, stan → bez continuous"},{"en":"Kuba is being really stubborn today.","pl":"Kuba strasznie się dziś upiera.","note":"be w continuous = zachowywać się"}],"pitfalls":[{"wrong":"We're having a big garden behind the house.","right":"We have a big garden behind the house. / We've got a big garden behind the house.","why":"have w znaczeniu posiadania to stan – bez formy ciągłej"},{"wrong":"Did you your homework?","right":"Did you do your homework?","why":"do jako czasownik główny trzeba powtórzyć po posiłkowym did"},{"wrong":"I'm doing a party on Saturday.","right":"I'm having a party on Saturday.","why":"„robić imprezę / grilla” to po angielsku have a party / have a barbecue, nie do"}],"slides":[{"pres":"II-1","slide":8},{"pres":"II-1","slide":9},{"pres":"II-1","slide":11}]},{"ref":"19.4","page":91,"title":"have got","rule":"**have got** to potoczna, głównie brytyjska alternatywa dla have w czasie teraźniejszym: posiadanie, relacje, choroby i obowiązek (have got to); w formalnym piśmie częściej samo have. Pytanie i przeczenie bez do: Have you got…? / I haven't got… (albo Do you have…? / I don't have…), nigdy Do you have got…? Nie używamy have got w przeszłości i przyszłości (had, will have), w formie ciągłej, w krótkich odpowiedziach (Yes, I have), w question tags (…, haven't you?) ani po used to. Uwaga: has just got = właśnie dostał (Present Perfect od get), a had got to Past Perfect od get.","examples":[{"en":"Have you got a spare pen? – Sorry, I haven't.","pl":"Masz zapasowy długopis? – Niestety nie.","note":"pytanie bez do; krótka odpowiedź bez got"},{"en":"Marta has got a nasty cough, so she's staying in bed.","pl":"Marta ma paskudny kaszel, więc leży w łóżku.","note":"choroba"},{"en":"We've got to be at the station by seven.","pl":"Musimy być na dworcu przed siódmą.","note":"obowiązek: have got to"},{"en":"My parents had a tiny flat in Słupsk when I was born.","pl":"Kiedy się urodziłem, rodzice mieli maleńkie mieszkanie w Słupsku.","note":"przeszłość: had, nie had got"}],"pitfalls":[{"wrong":"I had got a lot of free time during the holidays.","right":"I had a lot of free time during the holidays.","why":"have got nie ma formy przeszłej – posiadanie w przeszłości to had"},{"wrong":"I don't have got any cash on me.","right":"I haven't got any cash on me. / I don't have any cash on me.","why":"do łączy się tylko z samym have; have got tworzy przeczenie przez haven't got"},{"wrong":"My grandparents used to have got an old Fiat 126p.","right":"My grandparents used to have an old Fiat 126p.","why":"po used to tylko have"}],"slides":[{"pres":"II-1","slide":11}]}],"uses":[{"tense":"be / have / do","no":null,"use":"main verb","usePl":"czasownik główny – ma własne znaczenie: być / znajdować się, mieć, robić","example":"We're in the library – come and join us.","ref":"19.3","slide":{"pres":"II-1","slide":9}},{"tense":"be / have / do","no":null,"use":"auxiliary verb","usePl":"czasownik posiłkowy – tworzy czasy ciągłe i perfect, stronę bierną, pytania i przeczenia","example":"Has anyone seen my USB stick?","ref":"19.1","slide":{"pres":"II-1","slide":9}},{"tense":"be / have / do","no":null,"use":"contractions: 's = is/has, 'd = had/would","usePl":"skróty: 's = is albo has, 'd = had albo would – rozstrzyga następna forma czasownika","example":"She's moved out. (= has) / She's moving out. (= is)","ref":"19.2","slide":null},{"tense":"be / have / do","no":null,"use":"omitting auxiliaries in headlines and informal notes","usePl":"pomijanie posiłkowych w nagłówkach i krótkich notatkach","example":"Missing student found safe in Gdynia (= A missing student has been found…)","ref":"19.1","slide":null},{"tense":"have / have got","no":null,"use":"possession","usePl":"posiadanie","example":"I've got an old laptop, but it still works fine.","ref":"19.4","slide":{"pres":"II-1","slide":11}},{"tense":"have / have got","no":null,"use":"relationships","usePl":"relacje, rodzina","example":"Bartek has three cousins in Ireland.","ref":"19.4","slide":{"pres":"II-1","slide":11}},{"tense":"have / have got","no":null,"use":"illnesses","usePl":"choroby i dolegliwości","example":"I've got a sore throat and a slight temperature.","ref":"19.4","slide":{"pres":"II-1","slide":11}},{"tense":"have / have got","no":null,"use":"obligation","usePl":"obowiązek: have (got) to = musieć","example":"Students have got to wear lab coats in the chemistry lab.","ref":"19.4","slide":{"pres":"II-1","slide":11}},{"tense":"have / have got","no":null,"use":"We don't use have got in past or future tenses","usePl":"w przeszłości i przyszłości tylko have: had, will have (nie had got, will have got)","example":"In my first year I had a room in the halls; next year I'll have my own flat.","ref":"19.4","slide":{"pres":"II-1","slide":11}},{"tense":"have / have got","no":null,"use":"actions: have lunch, have a shower, have a party","usePl":"czynności (jeść, brać prysznic, urządzać imprezę) – tylko have, możliwy continuous","example":"Sorry, I can't talk – I'm having lunch with my supervisor.","ref":"19.3","slide":null},{"tense":"have / have got","no":null,"use":"experiences: have a dream, have a problem","usePl":"przeżycia: sny, kłopoty, trudności","example":"I often have weird dreams before exams.","ref":"19.3","slide":null}],"quiz":[{"id":"u19-01","type":"choice","prompt":"___ you got a few minutes? I need to ask you something about the project.","options":["Do","Have","Are"],"answer":1,"explain":"W have got pytanie tworzymy przez inwersję: Have you got…? Do łączy się tylko z samym have (Do you have…?).","ref":"19.4"},{"id":"u19-02","type":"choice","prompt":"When I was in my first year, I ___ a part-time job at a petrol station.","options":["had","had got","have got"],"answer":0,"explain":"have got nie występuje w czasie przeszłym – posiadanie w przeszłości wyrażamy przez had.","ref":"19.4"},{"id":"u19-03","type":"choice","prompt":"'Have you got a valid student card?' 'Yes, I ___.'","options":["have","have got","got"],"answer":0,"explain":"W krótkiej odpowiedzi nie powtarzamy got: Yes, I have / No, I haven't.","ref":"19.4"},{"id":"u19-04","type":"choice","prompt":"Your brother's got a motorbike, ___?","options":["hasn't he","hasn't he got","isn't he"],"answer":0,"explain":"W question tag po have got powtarzamy samo have: …, hasn't he? (bez got). 's to tu has (has got), nie is, więc nie isn't he.","ref":"19.4"},{"id":"u19-05","type":"choice","prompt":"Kasia told me she'd already sent the email. → 'd = ___","options":["had","would"],"answer":0,"explain":"'d przed III formą (sent) to had – tu Past Perfect; 'd przed bezokolicznikiem oznaczałoby would.","ref":"19.2"},{"id":"u19-06","type":"choice","prompt":"___ bring our own laptops to the exam, or will there be computers in the room?","options":["Do we must","Must we","Are we must"],"answer":1,"explain":"Czasowniki modalne tworzą pytanie przez inwersję, bez do: Must we…? (albo Do we have to…?).","ref":"19.1"},{"id":"u19-07","type":"choice","prompt":"Stop it, Igor – you ___ ridiculous! You're not usually like this.","options":["are","are being"],"answer":1,"explain":"be jako czasownik główny w continuous znaczy „zachowywać się” – chodzi o chwilowe zachowanie, nie o stałą cechę (not usually like this).","ref":"19.3"},{"id":"u19-08","type":"choice","prompt":"Kamil ___ a terrible cold, so he's staying at home today.","options":["has got","is having","had got"],"answer":0,"explain":"Choroba to stan: have (got) bez formy ciągłej; had got to Past Perfect od get i tu nie pasuje.","ref":"19.4"},{"id":"u19-09","type":"gap","prompt":"My parents ___ (not / have got) a dishwasher, so I always do the washing-up by hand when I'm at home.","answers":["haven't got","have not got"],"explain":"Przeczenie w have got: haven't got (ewentualnie don't have, ale nigdy don't have got).","ref":"19.4"},{"id":"u19-10","type":"gap","prompt":"I'm sure that next year you ___ (have) more free time than now.","answers":["will have","'ll have","are going to have","'re going to have"],"explain":"Przyszłe posiadanie wyrażamy przez will have (albo be going to have) – have got nie ma formy przyszłej.","ref":"19.4"},{"id":"u19-11","type":"gap","prompt":"'What ___ (you / do) at the weekend?' 'Not much – I just stayed in and watched films.'","answers":["did you do"],"explain":"did to posiłkowy (pytanie w Past Simple), do – czasownik główny „robić”; potrzebne są oba.","ref":"19.3"},{"id":"u19-12","type":"gap","prompt":"___ (she / have) a car when she lived in Gdańsk?","answers":["did she have"],"explain":"Przeszłość → pytanie z did + have; have got nie ma formy przeszłej, więc nie Had she got…?","ref":"19.4"},{"id":"u19-13","type":"gap","prompt":"Can I call you back in ten minutes? We ___ (have) dinner.","answers":["are having","'re having"],"explain":"have w znaczeniu czynności (jeść obiad) może być w continuous; czynność trwa teraz.","ref":"19.3"},{"id":"u19-14","type":"gap","prompt":"Ola's ___ (finish) her thesis, so now she can finally relax.","answers":["finished"],"explain":"'s + III forma z dopełnieniem (finished her thesis) to has – Present Perfect; so now she can relax pokazuje, że praca jest już skończona.","ref":"19.2"},{"id":"u19-15","type":"fix","prompt":"Do you have got a charger for this phone?","wrong":"Do you have got","fixes":["Have you got","Do you have"],"answers":["Have you got a charger for this phone?","Do you have a charger for this phone?"],"explain":"do nie łączy się z have got: albo Have you got…?, albo Do you have…?","ref":"19.4"},{"id":"u19-16","type":"fix","prompt":"I'm having a younger sister who studies in Toruń.","wrong":"I'm having","fixes":["I have","I've got","I have got"],"answers":["I have a younger sister who studies in Toruń.","I've got a younger sister who studies in Toruń.","I have got a younger sister who studies in Toruń."],"explain":"have w znaczeniu relacji (mam siostrę) to stan – bez formy ciągłej.","ref":"19.3"},{"id":"u19-17","type":"use","prompt":"My flatmates ARE in Berlin this weekend.","options":["czasownik główny (main verb)","czasownik posiłkowy (auxiliary verb)"],"answer":0,"explain":"are znaczy tu „są, przebywają” i nie tworzy czasu z innym czasownikiem – to czasownik główny.","ref":"19.3"},{"id":"u19-18","type":"use","prompt":"Sorry, I can't come out tonight – I've got to work on my thesis.","options":["posiadanie (possession)","relacje (relationships)","choroby (illnesses)","obowiązek (obligation)"],"answer":3,"explain":"have got to = musieć – wyraża obowiązek, nie posiadanie.","ref":"19.4"}],"translations":[{"id":"u19-t01","pl":"Mam starszego brata, który pracuje w Oslo.","answers":["I've got an older brother who works in Oslo.","I have an older brother who works in Oslo."],"keys":["have","works"],"explain":"Relacje → have albo have got, bez formy ciągłej (nie I'm having); stała praca → Present Simple.","ref":"19.4"},{"id":"u19-t02","pl":"W zeszłym roku mieliśmy samochód, ale go sprzedaliśmy.","answers":["We had a car last year, but we sold it.","Last year we had a car, but we sold it."],"keys":["had a car","sold"],"explain":"Posiadanie w przeszłości → had, nie had got.","ref":"19.4"},{"id":"u19-t03","pl":"Kiedy byłam mała, nie miałam własnego pokoju.","answers":["When I was little, I didn't have my own room.","I didn't have my own room when I was little.","When I was a child, I didn't have my own room."],"keys":["did not have"],"explain":"Przeczenie w przeszłości: didn't have – nie hadn't got.","ref":"19.4"},{"id":"u19-t04","pl":"Muszę skończyć ten esej do piątku.","answers":["I've got to finish this essay by Friday.","I have to finish this essay by Friday."],"keys":["finish","by friday"],"explain":"Obowiązek: have (got) to; must też jest poprawne. Termin „do piątku” to by Friday, nie until Friday.","ref":"19.4"},{"id":"u19-t05","pl":"Poczekaj chwilę, dzieci jeszcze jedzą śniadanie.","answers":["Wait a moment – the kids are still having breakfast.","Hang on, the children are still having breakfast.","Just a moment – the children are still eating breakfast."],"keys":["are still","breakfast"],"explain":"have w znaczeniu czynności (jeść śniadanie) – tylko have, w continuous; nigdy have got breakfast. Możliwe też are still eating breakfast.","ref":"19.3"},{"id":"u19-t06","pl":"Jutro będę miał więcej czasu.","answers":["I'll have more time tomorrow.","Tomorrow I'll have more time."],"keys":["will have more time"],"explain":"Przyszłość → will have; have got nie ma formy przyszłej.","ref":"19.4"}],"pairs":[{"id":"have-vs-have-got","title":"have czy have got?","a":{"name":"have","when":"wszystkie czasy i formy (had, will have, used to have, to have); czynności (have lunch, have a shower, have a party) – także w continuous; pytania i przeczenia z do (Do you have…? / I don't have…), krótka odpowiedź Yes, I do; styl formalny","example":"We used to have a cat, and next year we'll have a dog."},"b":{"name":"have got","when":"tylko czas teraźniejszy: posiadanie, relacje, choroby, obowiązek (have got to); styl potoczny, głównie brytyjski; pytanie i przeczenie bez do (Have you got…? / I haven't got…), krótka odpowiedź Yes, I have","example":"Have you got a bike? – Yes, I have."},"tip":"Przeszłość, przyszłość, czynność, forma ciągła albo used to → tylko have; got dokładasz wyłącznie do teraźniejszego „mam”.","refs":["19.3","19.4"],"quiz":["u19-01","u19-02","u19-03","u19-04","u19-08","u19-09","u19-10","u19-12","u19-13","u19-15","u19-16"]}],"signals":[{"word":"yesterday / last year / when I was a child","tenses":["Past Simple"],"example":"When I was a child, we had a dog called Reksio.","note":"posiadanie w przeszłości to had, nie had got; had got istnieje tylko jako Past Perfect od get (= had obtained).","ref":"19.4"},{"word":"tomorrow / next year / in two years","tenses":["Future Simple (will)"],"example":"In two years I'll have a degree and, hopefully, a proper job.","note":"posiadanie w przyszłości to will have, nie will have got. Ale I've got an exam tomorrow jest poprawne – to teraźniejsze have got o czymś, co już jest w planie.","ref":"19.4"}]},"20":{"unit":"20","title":"Present simple or continuous?","titlePl":"Present Simple czy Present Continuous?","module":5,"presentations":[{"id":"II-1","slides":[13,19]}],"summary":["**Present Simple** – to, co stałe, regularne i ogólne: nawyki, stałe sytuacje, fakty, rozkłady jazdy, instrukcje; także szybkie akcje w relacji sportowej, nagłówki, dowcipy i streszczenia fabuły.","**Present Continuous** – to, co w toku albo tymczasowe: teraz, w tym okresie, ustalone plany na przyszłość, stopniowe zmiany (It's getting…), tło w opowieści.","**always** + Present Simple = zwykły nawyk; **always** + Present Continuous = coś dzieje się „ciągle”, zwykle z irytacją.","Po **when, as soon as, until, before, after** w zdaniu o przyszłości – Present Simple, nie will (Let me know when you arrive).","Czasowniki stanu (know, like, understand…) zostają w Present Simple, nawet gdy mowa o tej chwili – szczegóły w Unit 25."],"sections":[{"ref":"20.1","page":94,"title":"Sytuacje stałe i tymczasowe","rule":"**Present Simple** opisuje sytuacje stałe, fakty, prawdy ogólne i opinie. **Present Continuous** – sytuacje tymczasowe i czynności w toku teraz albo „w okolicach” teraz (now, at the moment, currently, still), które prawdopodobnie jeszcze potrwają. Czasowniki live, work, study, stay dajemy w continuous, gdy sytuacja jest tymczasowa. Po **Here comes / There goes** zawsze Present Simple i czasownik przed podmiotem (z zaimkiem bez inwersji: Here it comes).","examples":[{"en":"Natalia comes from Zakopane, but she's living in Koszalin while she's at university.","pl":"Natalia pochodzi z Zakopanego, ale na czas studiów mieszka w Koszalinie.","note":"stałe pochodzenie (Present Simple) i tymczasowe mieszkanie (Present Continuous)"},{"en":"Sound travels faster in water than in air.","pl":"Dźwięk rozchodzi się szybciej w wodzie niż w powietrzu.","note":"fakt naukowy"},{"en":"Can I ring you back? I'm queuing at the dean's office.","pl":"Mogę oddzwonić? Stoję w kolejce w dziekanacie.","note":"czynność w chwili mówienia"},{"en":"Look, here comes the rain – let's go inside.","pl":"Patrz, nadciąga deszcz – chodźmy do środka.","note":"here comes + rzeczownik: Present Simple z inwersją"}],"pitfalls":[{"wrong":"I'm coming from Szczecin.","right":"I come from Szczecin.","why":"pochodzenie to stała sytuacja → Present Simple; I'm coming from Szczecin = właśnie stamtąd jadę"},{"wrong":"Look, here is coming the tram!","right":"Look, here comes the tram!","why":"here comes / there goes – zawsze Present Simple, czasownik przed podmiotem"},{"wrong":"This month I stay at a friend's place because my flat is being renovated.","right":"This month I'm staying at a friend's place because my flat is being renovated.","why":"sytuacja tymczasowa → Present Continuous"}],"slides":[{"pres":"II-1","slide":15},{"pres":"II-1","slide":17}]},{"ref":"20.2","page":94,"title":"Czynności regularne i powtarzające się","rule":"**Present Simple** – czynności regularne, nawyki i rutyna, zwykle z przysłówkami częstotliwości (usually, every day, twice a week). **Present Continuous** – czynności powtarzane w tymczasowym okresie albo częściej, niż można by się spodziewać, czynność, która regularnie jest w toku o danej porze, oraz z **always / constantly / forever** – bardzo częsta czynność, zwykle z nutą irytacji. Ta ostatnia konstrukcja brzmi bardziej emocjonalnie niż Present Simple z always.","examples":[{"en":"I usually cycle to campus, even in November.","pl":"Zwykle jeżdżę na uczelnię rowerem, nawet w listopadzie.","note":"nawyk → Present Simple"},{"en":"I'm cycling to campus this week because the bus drivers are on strike.","pl":"W tym tygodniu jeżdżę na uczelnię rowerem, bo kierowcy autobusów strajkują.","note":"powtarzanie w tymczasowym okresie → Present Continuous"},{"en":"At six on Friday evenings I'm usually sitting on a bus to Szczecinek.","pl":"W piątki o szóstej wieczorem zwykle siedzę już w autobusie do Szczecinka.","note":"czynność regularnie w toku o danej porze → Present Continuous"},{"en":"My flatmate is constantly using my shampoo without asking.","pl":"Mój współlokator ciągle używa mojego szamponu bez pytania.","note":"constantly + Present Continuous = ciągle, z irytacją"}],"pitfalls":[{"wrong":"Every spring the river is flooding the fields near our village.","right":"Every spring the river floods the fields near our village.","why":"coś, co dzieje się regularnie (every spring) → Present Simple"},{"wrong":"I'm usually getting up at 6.30 on weekdays.","right":"I usually get up at 6.30 on weekdays.","why":"stała rutyna → Present Simple"}],"slides":[{"pres":"II-1","slide":15},{"pres":"II-1","slide":17}]},{"ref":"20.3","page":95,"title":"Serie czynności: instrukcje, wskazówki, relacje sportowe","rule":"Instrukcje i wskazówki często podajemy w **Present Simple** z bezosobowym you – brzmi to łagodniej niż tryb rozkazujący. W relacji sportowej **Present Simple** opisuje szybkie akcje, które kończą się, zanim komentator skończy zdanie, a **Present Continuous** – dłuższe akcje, które trwają w czasie mówienia.","examples":[{"en":"You go past the library, take the first left, and the canteen is on your right.","pl":"Mijasz bibliotekę, skręcasz w pierwszą w lewo i stołówka jest po prawej.","note":"wskazówki z bezosobowym you"},{"en":"First you scan your student card, then you choose 'print' on the screen.","pl":"Najpierw skanujesz legitymację, potem wybierasz na ekranie „drukuj”.","note":"instrukcja krok po kroku"},{"en":"Kowalski crosses, Nowak heads it – and it's in!","pl":"Kowalski dośrodkowuje, Nowak główkuje – i gol!","note":"relacja sportowa: szybkie akcje → Present Simple"},{"en":"The rain is getting heavier and some fans are leaving the stadium.","pl":"Deszcz przybiera na sile, a część kibiców opuszcza stadion.","note":"relacja: tło i dłuższe akcje w toku → Present Continuous"}],"pitfalls":[{"wrong":"Wiśniewski is taking the free kick, the ball is flying over the wall – goal!","right":"Wiśniewski takes the free kick, the ball flies over the wall – goal!","why":"krótkie, szybkie akcje w relacji sportowej → Present Simple"}],"slides":[{"pres":"II-1","slide":17}]},{"ref":"20.4","page":95,"title":"Opisy zdjęć, fabuły, anegdoty i nagłówki","rule":"Opisując zdjęcie albo obraz, używamy **Present Continuous**. W anegdotach, dowcipach i streszczeniach fabuły Present Continuous buduje tło, a **Present Simple** opisuje kolejne zdarzenia – opowieść staje się żywa i bezpośrednia. Nagłówki prasowe używają Present Simple także o zdarzeniach, które już się wydarzyły.","examples":[{"en":"In this photo my grandparents are dancing at their wedding in 1975.","pl":"Na tym zdjęciu moi dziadkowie tańczą na swoim weselu w 1975 roku.","note":"opis zdjęcia → Present Continuous"},{"en":"So I'm standing at the bus stop in the pouring rain, and a car drives straight through a puddle.","pl":"No więc stoję na przystanku w ulewie, a tu samochód wjeżdża prosto w kałużę.","note":"anegdota: tło → Present Continuous, zdarzenie → Present Simple"},{"en":"In the novel, a young doctor moves to a village where nobody trusts her.","pl":"W powieści młoda lekarka przeprowadza się na wieś, gdzie nikt jej nie ufa.","note":"streszczenie fabuły → Present Simple"},{"en":"Koszalin student wins national debating title","pl":"Student z Koszalina wygrywa krajowy konkurs debat","note":"nagłówek: Present Simple także o zdarzeniu przeszłym"}],"pitfalls":[{"wrong":"In this photo my sister smiles at the camera.","right":"In this photo my sister is smiling at the camera.","why":"to, co widać na zdjęciu, opisujemy jak czynność w toku → Present Continuous"}],"slides":[{"pres":"II-1","slide":15},{"pres":"II-1","slide":17},{"pres":"II-1","slide":18}]},{"ref":"20.5","page":95,"title":"Inne użycia: zmiany, trendy, styl formalny, przyszłość","rule":"**Present Continuous** opisuje zmiany w toku i trendy (get, become, increase, rise) – także w tekstach akademickich. **Present Simple** pojawia się w formalnych formułach w mowie i piśmie (I note that…, I look forward to…, I enclose…). O przyszłości: Present Continuous – ustalone plany (Unit 27.3), Present Simple – rozkłady oraz zdania czasowe po when, as soon as, until, before, after (Unit 28.1).","examples":[{"en":"It's getting dark so early now – it's only half past four.","pl":"Teraz tak wcześnie robi się ciemno – jest dopiero wpół do piątej.","note":"stopniowa zmiana → Present Continuous"},{"en":"I'm meeting my supervisor on Thursday at 10.","pl":"W czwartek o 10 spotykam się z promotorem.","note":"ustalony plan → Present Continuous (Unit 27.3)"},{"en":"The bus to Mielno leaves at 10.40 p.m., so we can stay a bit longer.","pl":"Autobus do Mielna odjeżdża o 22.40, więc możemy zostać trochę dłużej.","note":"rozkład jazdy → Present Simple (Unit 28.1)"},{"en":"I'll text you as soon as I get my results.","pl":"Napiszę do ciebie, jak tylko dostanę wyniki.","note":"zdanie czasowe o przyszłości → Present Simple (Unit 28.1)"}],"pitfalls":[{"wrong":"Text me when you will get to the station.","right":"Text me when you get to the station.","why":"po when, as soon as, until, before, after w zdaniu o przyszłości – Present Simple, nie will"},{"wrong":"Prices get higher and higher these days.","right":"Prices are getting higher and higher these days.","why":"zmiana w toku, trend → Present Continuous"},{"wrong":"What do you do this Saturday evening?","right":"What are you doing this Saturday evening?","why":"pytanie o plan na konkretny termin → Present Continuous"}],"slides":[{"pres":"II-1","slide":15},{"pres":"II-1","slide":17},{"pres":"II-1","slide":18}]}],"uses":[{"tense":"Present Continuous","no":1,"use":"action at the time of speaking","usePl":"czynność w chwili mówienia","example":"Shh, the lecturer is explaining the test format.","ref":"20.1","slide":{"pres":"II-1","slide":15}},{"tense":"Present Continuous","no":2,"use":"temporary situation","usePl":"sytuacja tymczasowa","example":"I'm sharing a room with an Erasmus student from Spain this semester.","ref":"20.1","slide":{"pres":"II-1","slide":15}},{"tense":"Present Continuous","no":3,"use":"regular action around a point of time","usePl":"czynność, która regularnie jest w toku o określonej porze","example":"At midnight on Saturdays I'm usually still working behind the bar.","ref":"20.2","slide":{"pres":"II-1","slide":15}},{"tense":"Present Continuous","no":4,"use":"future arrangements","usePl":"ustalone plany na przyszłość","example":"We're flying to Dublin on Friday – the tickets are booked.","ref":"27.3","slide":{"pres":"II-1","slide":15}},{"tense":"Present Continuous","no":5,"use":"emphasising a very frequent action","usePl":"podkreślanie bardzo częstej, często irytującej czynności (always, constantly, forever)","example":"You're always leaving your wet towels on the bathroom floor!","ref":"20.2","slide":{"pres":"II-1","slide":15}},{"tense":"Present Continuous","no":6,"use":"setting the scene, telling a plot","usePl":"budowanie tła w opowieści lub streszczeniu fabuły (zdarzenia w Present Simple)","example":"It's Friday night, everyone's dancing, and suddenly the lights go out.","ref":"20.4","slide":{"pres":"II-1","slide":15}},{"tense":"Present Continuous","no":7,"use":"gradual change","usePl":"stopniowa zmiana, trend","example":"The sea level is rising faster than scientists expected.","ref":"20.5","slide":{"pres":"II-1","slide":15}},{"tense":"Present Continuous","no":null,"use":"repeated actions in a temporary period","usePl":"czynność powtarzana w ograniczonym, tymczasowym okresie","example":"I'm working weekends at the cinema until Christmas.","ref":"20.2","slide":null},{"tense":"Present Continuous","no":null,"use":"describing pictures and photos","usePl":"opis zdjęcia lub obrazu","example":"In this photo we're standing on the pier in Sopot.","ref":"20.4","slide":null},{"tense":"Present Continuous","no":null,"use":"sports commentary – longer actions in progress","usePl":"relacja sportowa: dłuższa akcja, która trwa w czasie mówienia","example":"The Polish crew are slowly catching up with the Germans.","ref":"20.3","slide":null},{"tense":"Present Simple","no":1,"use":"habits/routines","usePl":"nawyki, rutyna","example":"I usually have a coffee in the canteen after my first class.","ref":"20.2","slide":{"pres":"II-1","slide":17}},{"tense":"Present Simple","no":2,"use":"permanent situations","usePl":"sytuacje stałe","example":"My parents run a small bakery in Białogard.","ref":"20.1","slide":{"pres":"II-1","slide":17}},{"tense":"Present Simple","no":3,"use":"instructions","usePl":"instrukcje i wskazówki (często z bezosobowym you)","example":"You open the app, scan the QR code, and the locker opens.","ref":"20.3","slide":{"pres":"II-1","slide":17}},{"tense":"Present Simple","no":4,"use":"public timetables/schedules","usePl":"rozkłady jazdy, harmonogramy – także o przyszłości","example":"Our flight to Edinburgh leaves at 6.40 tomorrow morning.","ref":"28.1","slide":{"pres":"II-1","slide":17}},{"tense":"Present Simple","no":5,"use":"scientific facts","usePl":"fakty naukowe","example":"The Baltic Sea contains much less salt than the Atlantic.","ref":"20.1","slide":{"pres":"II-1","slide":17}},{"tense":"Present Simple","no":6,"use":"sports commentary – rapid actions","usePl":"relacja sportowa: szybkie, krótkie akcje","example":"Nowak beats two defenders, shoots – and scores!","ref":"20.3","slide":{"pres":"II-1","slide":17}},{"tense":"Present Simple","no":7,"use":"newspaper headlines","usePl":"nagłówki prasowe (także o zdarzeniach przeszłych)","example":"Storm cuts power to 20,000 homes in Pomerania","ref":"20.4","slide":{"pres":"II-1","slide":17}},{"tense":"Present Simple","no":8,"use":"reporting verbs","usePl":"czasowniki relacjonujące (tell, say, hear) – przekazywanie świeżych wiadomości","example":"Ola tells me you've passed your driving test – congratulations!","ref":"51.1","slide":{"pres":"II-1","slide":18}},{"tense":"Present Simple","no":9,"use":"future time clauses","usePl":"zdania czasowe o przyszłości po when, as soon as, until, before, after – bez will","example":"Don't leave until the rain stops.","ref":"28.1","slide":{"pres":"II-1","slide":18}},{"tense":"Present Simple","no":10,"use":"jokes","usePl":"dowcipy","example":"So a lecturer, a student and a cat get stuck in a lift…","ref":"20.4","slide":{"pres":"II-1","slide":18}},{"tense":"Present Simple","no":11,"use":"fictional plots","usePl":"streszczenia fabuły książek, filmów, seriali","example":"In the film, two strangers meet on a night train and fall in love.","ref":"20.4","slide":{"pres":"II-1","slide":18}},{"tense":"Present Simple","no":12,"use":"stative verbs","usePl":"czasowniki stanu (know, like, understand…) – także o tym, co jest teraz","example":"I don't understand this question at all.","ref":"25.1","slide":{"pres":"II-1","slide":18}},{"tense":"Present Simple","no":null,"use":"general truths and opinions","usePl":"prawdy ogólne i opinie","example":"Most Poles celebrate Christmas Eve with a big family dinner.","ref":"20.1","slide":null},{"tense":"Present Simple","no":null,"use":"here comes / there goes","usePl":"here comes / there goes – ktoś lub coś właśnie nadchodzi albo odchodzi (inwersja)","example":"Here comes the pizza – finally!","ref":"20.1","slide":null},{"tense":"Present Simple","no":null,"use":"formal statements (I note that…, I enclose…)","usePl":"formuły w oficjalnej mowie i korespondencji","example":"I enclose my CV and a copy of my diploma.","ref":"20.5","slide":null}],"quiz":[{"id":"u20-01","type":"choice","prompt":"Can you turn the music down? Marta ___ for her statistics exam in the next room.","options":["revises","is revising"],"answer":1,"explain":"Czynność trwa teraz, w chwili mówienia (stąd prośba o ściszenie muzyki) → Present Continuous, użycie 1.","ref":"20.1"},{"id":"u20-02","type":"gap","prompt":"My brother normally lives in Gdynia, but this semester he ___ (stay) with us in Koszalin.","answers":["is staying","'s staying","has been staying","'s been staying"],"explain":"Normalnie mieszka w Gdyni, u nas jest tylko w tym semestrze – sytuacja tymczasowa → Present Continuous, użycie 2 (Present Perfect Continuous też jest możliwy).","ref":"20.1"},{"id":"u20-03","type":"choice","prompt":"Whenever I ring my sister at 10 on Sunday mornings, she ___ – she never gets up before noon at weekends.","options":["sleeps","is sleeping"],"answer":1,"explain":"O stałej porze siostra jest w trakcie spania, gdy dzwonię → Present Continuous, użycie 3. Present Simple znaczyłby, że zasypia w chwili telefonu.","ref":"20.2"},{"id":"u20-04","type":"choice","prompt":"Sorry, I can't help you move house on Saturday – I ___ lunch with my grandparents. We arranged it weeks ago.","options":["have","am having","will have"],"answer":1,"explain":"Spotkanie jest już ustalone (arranged weeks ago) → Present Continuous, użycie 4. Present Simple tylko dla rozkładów, a will nie wyraża ustaleń.","ref":"27.3"},{"id":"u20-05","type":"use","prompt":"Igor is always borrowing my notes and never giving them back!","options":["czynność w chwili mówienia (użycie 1)","sytuacja tymczasowa (użycie 2)","podkreślanie bardzo częstej, irytującej czynności (użycie 5)","stopniowa zmiana (użycie 7)"],"answer":2,"explain":"always + Present Continuous podkreśla, że coś dzieje się bardzo często, zwykle z nutą irytacji.","ref":"20.2"},{"id":"u20-06","type":"choice","prompt":"So last night I'm walking home through the park, it ___ heavily, and suddenly this huge dog jumps out of the bushes…","options":["rains","is raining"],"answer":1,"explain":"W anegdocie tło (pogoda, to, co już trwa) dajemy w Present Continuous, a kolejne zdarzenia (jumps) w Present Simple – użycie 6.","ref":"20.4"},{"id":"u20-07","type":"gap","prompt":"These days my Spanish ___ (get) better and better – I can finally watch series without subtitles.","answers":["is getting","'s getting","has been getting","'s been getting"],"explain":"better and better – stopniowa zmiana, która wciąż trwa (these days) → Present Continuous, użycie 7 (Present Perfect Continuous też jest możliwy).","ref":"20.5"},{"id":"u20-08","type":"fix","prompt":"I'm never eating breakfast on weekdays – I just grab a coffee on my way to the first lecture.","wrong":"I'm never eating","fixes":["I never eat"],"answers":["I never eat breakfast on weekdays – I just grab a coffee on my way to the first lecture."],"explain":"Stały nawyk (never, on weekdays) → Present Simple, użycie 1.","ref":"20.2"},{"id":"u20-09","type":"gap","prompt":"My father ___ (work) as a paramedic in Szczecin. It's his dream job and he'd never change it.","answers":["works"],"explain":"Stała praca, z której nie zamierza rezygnować → sytuacja stała, Present Simple, użycie 2.","ref":"20.1"},{"id":"u20-10","type":"choice","prompt":"To get to the computer lab, you ___ the lift to the second floor and turn left at the vending machines.","options":["take","are taking"],"answer":0,"explain":"Wskazówki i instrukcje z bezosobowym you → Present Simple, użycie 3.","ref":"20.3"},{"id":"u20-11","type":"gap","prompt":"According to the timetable, the last train to Kołobrzeg ___ (leave) at 22.47 on weekdays.","answers":["leaves"],"explain":"Rozkład jazdy (according to the timetable) → Present Simple, użycie 4.","ref":"28.1"},{"id":"u20-12","type":"fix","prompt":"Light is taking about eight minutes to travel from the Sun to the Earth.","wrong":"is taking","fixes":["takes"],"answers":["Light takes about eight minutes to travel from the Sun to the Earth."],"explain":"Fakt naukowy, zawsze prawdziwy → Present Simple, użycie 5.","ref":"20.1"},{"id":"u20-13","type":"choice","prompt":"…and Kowalczyk ___ the ball into the top corner! It's 2–1 to Poland!","options":["fires","is firing"],"answer":0,"explain":"W relacji sportowej szybka akcja, która kończy się, zanim komentator skończy zdanie → Present Simple, użycie 6.","ref":"20.3"},{"id":"u20-14","type":"use","prompt":"Koszalin cyclist breaks national record","options":["fakty naukowe (użycie 5)","relacja sportowa – szybkie akcje (użycie 6)","nagłówki prasowe (użycie 7)","fabuła utworu (użycie 11)"],"answer":2,"explain":"Nagłówki prasowe używają Present Simple, także o zdarzeniach, które już się wydarzyły – nawet gdy temat jest sportowy.","ref":"20.4"},{"id":"u20-15","type":"choice","prompt":"Ania ___ me you're moving to Poznań – is that true?","options":["tells","is telling"],"answer":0,"explain":"Czasowniki relacjonujące (tell, say, hear) w Present Simple, gdy przekazujemy świeżą wiadomość – użycie 8.","ref":"51.1"},{"id":"u20-16","type":"gap","prompt":"I'll lend you my notes when I ___ (get) back from the library.","answers":["get","'ve got","have got"],"explain":"Po when w zdaniu o przyszłości – Present Simple (ewentualnie Present Perfect), nigdy will – użycie 9.","ref":"28.1"},{"id":"u20-17","type":"choice","prompt":"A man ___ into a pet shop and asks for a parrot that speaks three languages…","options":["walks","is walking"],"answer":0,"explain":"W dowcipie kolejne zdarzenia (wchodzi, pyta) opowiadamy w Present Simple – użycie 10; Present Continuous tylko dla tła (A man is walking down the street when…).","ref":"20.4"},{"id":"u20-18","type":"gap","prompt":"In the first episode, Zofia ___ (discover) a letter hidden in her grandmother's piano and decides to find out who wrote it.","answers":["discovers"],"explain":"Streszczenie fabuły → Present Simple, tak jak decides w tym samym zdaniu – użycie 11.","ref":"20.4"}],"translations":[{"id":"u20-t01","pl":"Ciągle gubisz klucze!","answers":["You're always losing your keys!","You're constantly losing your keys!","You're forever losing your keys!"],"keys":["you are","losing"],"explain":"Irytująca, bardzo częsta czynność → always + Present Continuous (użycie 5). Zamiast always można użyć constantly albo forever.","ref":"20.2"},{"id":"u20-t02","pl":"Pociąg do Gdańska odjeżdża jutro o 6.15, więc musimy wstać o piątej.","answers":["The train to Gdańsk leaves at 6.15 tomorrow, so we have to get up at five.","The train to Gdańsk leaves at 6.15 tomorrow, so we've got to get up at five."],"keys":["leaves|departs"],"explain":"Rozkład jazdy → Present Simple, choć chodzi o jutro (nie will leave). Zamiast leaves można użyć departs.","ref":"28.1"},{"id":"u20-t03","pl":"Zadzwonię do ciebie, jak skończę.","answers":["I'll call you when I finish.","I'll ring you when I finish.","I'll call you when I've finished."],"keys":["will","when i finish|when i have finished"],"explain":"W zdaniu głównym will, ale po when – Present Simple (nie when I will finish). Możliwe też when I've finished.","ref":"28.1"},{"id":"u20-t04","pl":"W tym semestrze mieszkam u cioci w Słupsku.","answers":["This semester I'm living with my aunt in Słupsk.","I'm living with my aunt in Słupsk this semester."],"keys":["i am"],"explain":"Sytuacja tymczasowa (tylko w tym semestrze) → Present Continuous; możliwe też I'm staying with my aunt.","ref":"20.1"},{"id":"u20-t05","pl":"Coraz trudniej znaleźć tanie mieszkanie w Koszalinie.","answers":["It's getting harder and harder to find a cheap flat in Koszalin.","It's getting more and more difficult to find a cheap flat in Koszalin."],"keys":["getting"],"explain":"Stopniowa zmiana → Present Continuous z get + stopień wyższy (użycie 7).","ref":"20.5"},{"id":"u20-t06","pl":"O, idzie Kuba! Zapytajmy go.","answers":["Oh, here comes Kuba! Let's ask him.","Look, here comes Kuba! Let's ask him."],"keys":["here comes kuba"],"explain":"Here comes + rzeczownik: Present Simple z inwersją, nigdy is coming.","ref":"20.1"},{"id":"u20-t07","pl":"Kasia mówi, że zmieniasz kierunek studiów.","answers":["Kasia tells me you're changing courses.","Kasia says you're changing courses."],"keys":["are changing"],"explain":"Czasownik relacjonujący w Present Simple (tells me, says – użycie 8), a zmiana jest w toku albo już postanowiona → Present Continuous.","ref":"51.1"},{"id":"u20-t08","pl":"Na tym zdjęciu siedzimy z babcią na ławce w parku.","answers":["In this photo my grandma and I are sitting on a bench in the park.","In this picture I'm sitting on a park bench with my grandma."],"keys":["sitting"],"explain":"Opis zdjęcia → Present Continuous: to, co widać na zdjęciu, opisujemy jak czynność w toku.","ref":"20.4"}],"pairs":[{"id":"ps-vs-pc","title":"Present Simple czy Present Continuous?","a":{"name":"Present Simple","when":"stałe sytuacje, nawyki i rutyna, fakty i prawdy ogólne, rozkłady jazdy, instrukcje, szybkie akcje w relacji sportowej, nagłówki, dowcipy i fabuły, zdania czasowe o przyszłości (when I finish), czasowniki stanu","example":"Oksana teaches Ukrainian at a language school."},"b":{"name":"Present Continuous","when":"czynność w chwili mówienia i sytuacje tymczasowe, czynność w toku o stałej porze, ustalone plany na przyszłość, stopniowe zmiany (It's getting…), always = ciągle (z irytacją), tło w opowieści, opis zdjęcia","example":"Oksana is teaching Ukrainian at a summer camp this month."},"tip":"Zapytaj: stałe, regularne, ogólne – czy w toku, na jakiś czas, w trakcie zmiany? Pierwsze → Present Simple, drugie → Present Continuous.","refs":["20.1","20.2","20.3","20.4","20.5"],"quiz":["u20-01","u20-02","u20-03","u20-04","u20-06","u20-07","u20-08","u20-10","u20-13","u20-15","u20-17"]}],"signals":[{"word":"now / right now / at the moment","tenses":["Present Continuous"],"example":"Ola can't talk at the moment – she's driving.","note":"z czasownikami stanu nadal Present Simple: At the moment I don't need anything.","ref":"20.1"},{"word":"currently / this week / this semester / these days","tenses":["Present Continuous"],"example":"I'm currently doing an internship at a law firm.","note":"these days w znaczeniu „w dzisiejszych czasach” często z Present Simple: These days hardly anyone sends letters.","ref":"20.1"},{"word":"usually / often / every day / on Mondays / twice a week","tenses":["Present Simple"],"example":"We have phonetics twice a week.","note":"z usually możliwy też Present Continuous, gdy mówimy, co zwykle jest w toku o danej porze: At eight I'm usually still sleeping.","ref":"20.2"},{"word":"always","tenses":["Present Simple","Present Continuous"],"example":"He always sits in the front row. / He's always interrupting the lecturer.","note":"always + Present Simple = zwykły nawyk; always + Present Continuous = coś dzieje się „ciągle”, zwykle z irytacją (podobnie constantly, forever, continually).","ref":"20.2"},{"word":"when / as soon as / until / before / after (o przyszłości)","tenses":["Present Simple"],"example":"We'll order the pizza as soon as everyone arrives.","note":"w zdaniu czasowym bez will; ale gdy when zaczyna pytanie albo zdanie dopełnieniowe, will jest poprawne: I don't know when she'll be back.","ref":"28.1"},{"word":"tonight / tomorrow / on Friday / next week (ustalony plan)","tenses":["Present Continuous"],"example":"We're having a farewell party for Paulo on Friday.","note":"rozkład jazdy i oficjalny harmonogram → Present Simple: The coach leaves at 7 tomorrow.","ref":"27.3"},{"word":"here comes / there goes","tenses":["Present Simple"],"example":"Here comes the lecturer – quick, put your phones away.","note":"z rzeczownikiem inwersja (Here comes the bus), z zaimkiem bez inwersji (Here it comes, There she goes); nigdy Present Continuous.","ref":"20.1"},{"word":"more and more / get + stopień wyższy","tenses":["Present Continuous"],"example":"Online shopping is becoming more and more popular among older people.","note":"zmiana w toku → Present Continuous, nie Present Simple.","ref":"20.5"}]},"21":{"unit":"21","title":"Past simple and continuous; used to and would","titlePl":"Past Simple i Past Continuous; used to i would","module":5,"presentations":[{"id":"II-3","slides":[2,10]}],"summary":["Past Simple: czynności i stany zakończone w przeszłości – pojedyncze, powtarzane (także z liczbą razy), w sekwencji; często z ago, last…, yesterday, in 2020.","Past Continuous (was/were + -ing): czynność w toku w danym momencie, tło opowiadania, sytuacja tymczasowa, stopniowa zmiana, dwie równoległe czynności.","Czynność przerwana: Past Continuous (when/while/as) + krótkie zdarzenie w Past Simple; zdarzenie przerywające wprowadza when, nie while.","Inne użycia Past Continuous: plan z perspektywy przeszłości (I was flying the next day), uprzejma prośba (I was wondering if…), always + Past Continuous – irytujący nawyk.","used to = powtarzane czynności i stany, których już nie ma; would = tylko powtarzane czynności; z liczbą razy lub długością okresu → Past Simple; be/get used to + -ing = być/przyzwyczajać się."],"sections":[{"ref":"21.1","page":98,"title":"Czynności i stany zakończone (Past Simple)","rule":"**Past Simple** opisuje czynności i stany zakończone w przeszłości; gdy kontekst jest jasny, nie trzeba powtarzać określenia czasu. Używamy go też do czynności powtarzanych (także z liczbą razy), do sekwencji czynności, do dwóch krótkich czynności w tym samym momencie lub takich, z których jedna wywołuje drugą, oraz do stanów w przeszłości. Typowe określenia: **ago, last week, yesterday, the other day**, spójniki **when, (just) as, after**.","examples":[{"en":"Zuzanna moved to Koszalin three years ago.","pl":"Zuzanna przeprowadziła się do Koszalina trzy lata temu.","note":"zakończona czynność z określeniem czasu (użycie 1)"},{"en":"I rang the doorbell five times, but nobody answered.","pl":"Zadzwoniłam do drzwi pięć razy, ale nikt nie otworzył.","note":"czynność powtarzana, podana liczba razy (użycie 3)"},{"en":"Kacper locked the door, switched off the lights and ran to the bus stop.","pl":"Kacper zamknął drzwi, zgasił światło i pobiegł na przystanek.","note":"sekwencja czynności (użycie 4)"},{"en":"When the lecturer walked in, everyone stopped talking.","pl":"Kiedy wykładowca wszedł, wszyscy przestali rozmawiać.","note":"dwie krótkie czynności niemal w tym samym momencie, druga jest reakcją na pierwszą (użycie 2)"}],"pitfalls":[{"wrong":"I have seen him at the gym two days ago.","right":"I saw him at the gym two days ago.","why":"ago i inne zamknięte określenia czasu (yesterday, last week, in 2023) → Past Simple, nie Present Perfect"},{"wrong":"When I was ten, I had got a hamster called Pestka.","right":"When I was ten, I had a hamster called Pestka.","why":"have got nie występuje w czasie przeszłym (slajd II/1 11); posiadanie w przeszłości to had"}],"slides":[{"pres":"II-3","slide":4}]},{"ref":"21.2","page":98,"title":"Czynności w toku i sytuacje tymczasowe (Past Continuous)","rule":"**Past Continuous** (was/were + -ing) opisuje czynność w toku w danym momencie przeszłości: zaczęła się wcześniej i trwała dalej. Używamy go też do sytuacji tymczasowych, stopniowych zmian, tła dla wydarzeń w Past Simple i dwóch czynności trwających równolegle. Czynność powtarzana w ograniczonym okresie (bez liczby razy) też może być w Past Continuous, a z **always/constantly** podkreśla bardzo częstą, zwykle irytującą czynność.","examples":[{"en":"At eight o'clock last night I was still writing my essay.","pl":"Wczoraj o ósmej wieczorem wciąż pisałem wypracowanie.","note":"czynność w toku w danym momencie (użycie 2)"},{"en":"That semester Natalia was living with her aunt in Słupsk.","pl":"W tamtym semestrze Natalia mieszkała u ciotki w Słupsku.","note":"sytuacja tymczasowa (użycie 3)"},{"en":"The nights were getting colder, so we finally switched the heating on.","pl":"Noce robiły się coraz zimniejsze, więc w końcu włączyliśmy ogrzewanie.","note":"stopniowa zmiana (użycie 5)"},{"en":"My old flatmate was constantly singing in the shower at six in the morning.","pl":"Mój dawny współlokator ciągle śpiewał pod prysznicem o szóstej rano.","note":"bardzo częsta, irytująca czynność (użycie 10)"}],"pitfalls":[{"wrong":"At midnight I watched a film, so I didn't hear the phone.","right":"At midnight I was watching a film, so I didn't hear the phone.","why":"czynność w toku w konkretnym momencie przeszłości → Past Continuous"},{"wrong":"I was knowing the answer, but I was too shy to say it.","right":"I knew the answer, but I was too shy to say it.","why":"know to czasownik stanu – zwykle nie ma formy continuous (Unit 25)"},{"wrong":"Last year I was visiting my grandparents in Lublin four times.","right":"Last year I visited my grandparents in Lublin four times.","why":"podana liczba razy → Past Simple; Past Continuous tylko dla powtarzania w ograniczonym okresie bez liczenia (that winter I was visiting them every weekend)"}],"slides":[{"pres":"II-3","slide":7},{"pres":"II-3","slide":8}]},{"ref":"21.3","page":99,"title":"Czynność przerwana","rule":"Dłuższa czynność w toku (**Past Continuous**) zostaje przerwana przez krótkie zdarzenie (**Past Simple**). Część z Past Continuous może wprowadzić **when, while** lub **as**, a zdarzenie przerywające tylko **when** (nie while); kolejność zdań jest dowolna. Jeśli czynność w tle skończyła się tuż przed zdarzeniem, wybieramy Past Perfect Continuous (22.1).","examples":[{"en":"I was cycling through the park when it started to hail.","pl":"Jechałem rowerem przez park, kiedy zaczął padać grad.","note":"czynność przerwana (użycie 4)"},{"en":"While Igor was ironing his shirt, the fuse blew.","pl":"Kiedy Igor prasował koszulę, przepalił się bezpiecznik.","note":"while + dłuższa czynność w toku, krótkie zdarzenie w Past Simple (użycie 1)"},{"en":"Somebody knocked on the door as we were sitting down to dinner.","pl":"Ktoś zapukał do drzwi, gdy siadaliśmy do kolacji.","note":"as + czynność w toku; zdarzenie może stać na początku zdania"}],"pitfalls":[{"wrong":"I was waiting for the bus while I saw Ewa.","right":"I was waiting for the bus when I saw Ewa.","why":"zdarzenie przerywające (Past Simple) wprowadza when, nie while; while stoi przy czynności w toku"},{"wrong":"When the phone rang, I had a shower.","right":"When the phone rang, I was having a shower.","why":"„brałem prysznic, kiedy zadzwonił telefon” to czynność przerwana → Past Continuous; Past Simple znaczyłby, że prysznic był reakcją na telefon"},{"wrong":"During I was revising, my flatmate started playing the drums.","right":"While I was revising, my flatmate started playing the drums.","why":"during + rzeczownik (during the lecture), while + zdanie z podmiotem i czasownikiem"}],"slides":[{"pres":"II-3","slide":7}]},{"ref":"21.4","page":99,"title":"Inne użycia Past Continuous: plany z przeszłości i uprzejme prośby","rule":"**Past Continuous** opisuje plany i ustalenia z perspektywy przeszłości (future arrangement in the past) – nie zawsze wiemy, czy do nich doszło. Z **plan, expect, hope** często mówi o planach, które się nie spełniły (więcej: Unit 29). Z **wonder** i **think** zmiękcza prośby, propozycje i pytania: I was wondering if you could… brzmi ostrożniej i grzeczniej niż Can you…?","examples":[{"en":"Ada left the pub early because she was driving her grandparents to the airport the next morning.","pl":"Ada wcześnie wyszła z pubu, bo następnego ranka wiozła dziadków na lotnisko.","note":"ustalenie z perspektywy przeszłości (użycie 7)"},{"en":"We were expecting a quiet weekend, but my cousins turned up unannounced.","pl":"Spodziewaliśmy się spokojnego weekendu, ale niespodziewanie zjawili się moi kuzyni.","note":"oczekiwanie, które się nie spełniło (expect)"},{"en":"I was wondering if you could lend me your notes from Monday's lecture.","pl":"Czy mógłbyś pożyczyć mi notatki z poniedziałkowego wykładu? (dosł. Zastanawiałem się, czy…)","note":"uprzejma, ostrożna prośba (użycie 9)"},{"en":"Were you thinking of applying for Erasmus next year?","pl":"Myślałeś może o tym, żeby w przyszłym roku wyjechać na Erasmusa?","note":"ostrożne, uprzejme pytanie (think)"}],"pitfalls":[{"wrong":"Kasia missed the party because she flies to Rome the next morning.","right":"Kasia missed the party because she was flying to Rome the next morning.","why":"plan z perspektywy przeszłości (the next morning) → Past Continuous, nie czas teraźniejszy"}],"slides":[{"pres":"II-3","slide":8}]},{"ref":"21.5","page":99,"title":"used to i would","rule":"**used to** i **would** + bezokolicznik opisują powtarzające się czynności z przeszłości, których już nie ma (albo zdarzają się rzadziej); przy would zwykle podajemy kontekst przeszły (in those days, when we were kids), a opowieść często zaczyna się od used to i toczy dalej z would. Stany, które się zmieniły (be, have, live, like, know), opisuje tylko **used to**, nie would. Z długością okresu (for five years) i liczbą razy używamy Past Simple, nie used to. Przeczenie i pytanie: **didn't use to, did you use to**; nie mylić z **be/get used to + -ing** (być/przyzwyczajać się).","examples":[{"en":"When we lived in Białogard, my dad used to drive us to school every morning.","pl":"Kiedy mieszkaliśmy w Białogardzie, tata codziennie rano woził nas do szkoły.","note":"powtarzana czynność, której już nie ma"},{"en":"There used to be a cinema opposite the station, but it closed years ago.","pl":"Naprzeciwko dworca było kiedyś kino, ale zamknięto je lata temu.","note":"stan w przeszłości → tylko used to"},{"en":"In the summer holidays my grandad would wake us up at five and take us fishing.","pl":"W wakacje dziadek budził nas o piątej i zabierał na ryby.","note":"would = typowe, powtarzane zachowanie; kontekst przeszły podany (in the summer holidays)"},{"en":"I didn't use to like olives, but now I eat them all the time.","pl":"Kiedyś nie lubiłem oliwek, a teraz ciągle je jem.","note":"przeczenie: didn't use to; like to stan, więc nie would"}],"pitfalls":[{"wrong":"My parents would have a small shop in Kołobrzeg.","right":"My parents used
